openapi: 3.1.0
info:
  title: Notifikasi persetujuan melalui API notifikasi umum SSO
  version: 1.0.0
  description: |
    Kontrak consumer Core untuk bagian API notifikasi umum yang dipakainya. SSO mengantrekan
    email melalui SMTP yang sudah ada; respons success berarti diterima antrean, bukan bukti
    email sampai ke penerima. Sumber diverifikasi pada sso origin/main d4772c7:
    SendDynamicNotificationRequest, DynamicNotificationApiController, DynamicNotificationDispatcher,
    dan ClientActionUrlGuard. Host action.url harus persis terdaftar di launch URL atau redirect URI;
    localhost hanya diterima dalam lingkungan local/testing SSO. Idempotency key per client
    bertahan 24 jam di cache. Core menyimpan penerimaan sukses tanpa batas pada work item.
    Hak persetujuan dan eksekusi bisnis tetap diperiksa Core setelah pengguna login.
paths:
  /api/v1/notifications/send:
    post:
      operationId: sendDynamicNotification
      security: [{ clientId: [], clientSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, subject, content]
              properties:
                idempotency_key: { type: string, maxLength: 100 }
                recipient:
                  type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email, maxLength: 255 }
                    name: { type: [string, 'null'], maxLength: 255 }
                subject: { type: string, maxLength: 200 }
                category: { type: [string, 'null'], maxLength: 50 }
                event_type: { type: [string, 'null'], maxLength: 100 }
                content:
                  type: object
                  properties:
                    header_title: { type: [string, 'null'], maxLength: 150 }
                    headline: { type: [string, 'null'], maxLength: 255 }
                    highlight_box:
                      type: [object, 'null']
                      properties:
                        description: { type: [string, 'null'], maxLength: 2000 }
                        fields:
                          type: array
                          maxItems: 20
                          items:
                            type: object
                            required: [label, value]
                            properties:
                              label: { type: string, maxLength: 100 }
                              value: { type: string, maxLength: 500 }
                    action:
                      type: [object, 'null']
                      required: [label, url]
                      properties:
                        label: { type: string, maxLength: 80 }
                        url: { type: string, format: uri, maxLength: 2000 }
      responses:
        '200': { description: Notifikasi diterima antrean atau idempotency key sudah diproses }
        '401': { description: Kredensial client tidak sah }
        '404': { description: Aplikasi client tidak terdaftar }
        '422': { description: Isian tidak sah atau host tautan tidak terdaftar }
        '429': { description: Batas pengiriman notifikasi tercapai }
        '500': { description: Notifikasi belum dapat diantrekan; pemanggil dapat mencoba lagi }
components:
  securitySchemes:
    clientId: { type: apiKey, in: header, name: X-Client-ID }
    clientSecret: { type: apiKey, in: header, name: X-Client-Secret }
