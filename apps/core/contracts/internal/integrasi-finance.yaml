# Akar domain finance untuk sistem di luar CoreERP (token klien integrasi). Dirakit ke
# `contracts/terbit/integrasi-finance.yaml` oleh `contracts/bundle.py`, dan terbit tanpa login
# di portal `/docs`. Satu domain satu akar: integrasi domain lain (SDM, pengadaan, …) mendapat
# akarnya sendiri, supaya tiap pembaca hanya membaca yang ia pakai.
#
# Panduan di `info.description` ditulis untuk orang luar: tanpa riwayat keputusan internal
# (K-xx) dan tanpa jalur kode.
#
# Daftar nilai yang dipilih pembaca, misalnya `posting_type`, mendapat judul bagian dan model
# sendiri, dan judul tidak memakai backtick. `DocsPortalTest` memeriksa keduanya; alasannya ada di
# aturan 11 gerbang kontrak, skill `coreerp-architecture`.
x-portal:
  judul: Integrasi · Finance
  publik: true
  urutan: 10
openapi: 3.1.0
info:
  title: CoreERP — Integrasi finance
  version: 1.0.0
  description: |
    Panduan dan referensi untuk tim aplikasi finance yang membukukan jurnal dari CoreERP: **feed
    posting finance** beserta data induk untuk tabel penerjemahnya. Panduan di bawah menjelaskan
    cara memakainya dari awal; referensi tiap endpoint ada sesudahnya. Integrasi domain lain
    punya halamannya sendiri — pilih di atas halaman ini.

    ## Gambaran

    ```text
    Modul aset CoreERP            CoreERP                         Aplikasi finance Anda
    ──────────────────            ─────────────────────           ─────────────────────
    penerimaan, penyusutan, ──▶   posting berstatus pending  ──▶  pull atau push
    pelepasan, nilai aset,        status akhir: posted /     ◀──  ack: posted atau
    reklasifikasi                 rejected                        rejected
    ```

    - **Posting** adalah satu dokumen sumber, misalnya satu penerimaan aset, dengan jurnal yang
      sudah seimbang: baris akun, debit atau kredit, dan dimensi keuangan per baris.
    - CoreERP tidak membukukan apa pun di aplikasi finance. Anda yang membukukan, lalu melapor
      balik lewat **ack** — nomor voucher bila dibukukan, atau kode alasan bila ditolak.
    - Setiap posting punya `posting_id` yang tidak pernah berubah. Posting yang sama bisa sampai
      lebih dari sekali; menerimanya lagi **tidak boleh** menghasilkan jurnal kedua. Simpan dengan
      `UNIQUE(posting_id)`.

    ## Langkah 1 — Minta klien integrasi

    Admin tenant CoreERP membuatnya di **Identity & access › Klien integrasi**, lalu menyerahkan
    tokennya kepada Anda:

    | Setelan | Isi |
    | --- | --- |
    | Mode pengiriman | **Pull** — sistem Anda memanggil CoreERP. **Push** — CoreERP memanggil URL HTTPS Anda. |
    | Scope | `finance-postings.read`, `finance-postings.ack`, `vendors.read`, `operating-units.read` |
    | Prefix jenis posting | Misalnya `asset.`: klien hanya melihat posting modul aset |
    | Allowlist IP | Opsional, bila alamat server Anda tetap |

    Token berbentuk `<client_id>.<secret>` dan ditampilkan **sekali** saat dibuat. Kirim di setiap
    permintaan:

    ```http
    Authorization: Bearer <client_id>.<secret>
    Accept: application/json
    ```

    Token menentukan tenant. Jangan mengirim id tenant sendiri; kalau dikirim, diabaikan.

    ## Langkah 2 — Alamat

    Semua endpoint berada di bawah `https://<alamat>/api/internal/v1`, dengan `<alamat>` sama
    dengan alamat yang dipakai pengguna tenant itu untuk masuk ke CoreERP — alamat tenant di
    layanan SaaS, atau domain server CoreERP di tempat pelanggan.

    Salinan **sandbox** menjawab `503` untuk seluruh endpoint di halaman ini, supaya server uji
    tidak pernah menyajikan posting ke aplikasi finance produksi.

    ## Langkah 3 — Isi tabel penerjemah

    Posting membawa kode CoreERP. Petakan ke kode di aplikasi finance Anda sebelum membukukan:

    | Yang dipetakan | Di posting | Sumbernya |
    | --- | --- | --- |
    | Entitas legal | `legal_entity.id` dan `legal_entity.code` | `GET /legal-entities`, scope `legal-entities.read` |
    | Akun | `journal_lines[].account.external_id` | ID akun di aplikasi finance Anda sendiri: admin tenant mengimpor ekspor daftar akun Anda (CSV `external_id,code,name,type,active`) |
    | Business unit dan department | `journal_lines[].financial_dimensions[].value_code` | `GET /operating-units` |
    | Vendor | `vendor.id` dan `vendor.number` | `GET /vendors` |

    Untuk dropdown perusahaan, ambil `GET /legal-entities`: daftar lengkap entitas legal aktif
    milik tenant token, urut nama, tanpa pagination. Tampilkan `name` dan `code`, simpan `id`,
    lalu gunakan id itu sebagai filter `legal_entity` pada vendor atau posting. Entitas baru
    muncul walaupun feed-nya belum aktif. Admin memberi scope `legal-entities.read` secara
    eksplisit; token yang sudah ada tidak otomatis mendapat scope baru. Daftar ini tidak
    mengatur database tujuan: pemetaan entitas ke database finance tetap disimpan di sisi Anda.

    Sinkronkan secara berkala: simpan `updated_at` terbesar dari sinkron terakhir, kirim sebagai
    `updated_since` berikutnya, dan simpan dengan upsert berdasarkan `id`. Batasnya inklusif, jadi
    baris di batas bisa datang dua kali. `GET /vendors` dibaca per halaman lewat `cursor`.

    ## Langkah 4 — Pull dan bukukan (mode pull)

    Jalankan terjadwal, misalnya setiap satu sampai lima menit:

    1. `GET /finance-postings?limit=100` — posting yang belum di-ack, urut tanggal akuntansi.
    2. Untuk tiap posting, **sesuai urutan**:
       - Bila `posting_id` sudah tersimpan, jangan bukukan lagi; kirim ulang ack-nya saja.
       - Terjemahkan akun, dimensi, vendor, dan entitas legal. Kode yang tidak dikenal berarti
         posting **ditolak** — jangan pernah memakai akun atau vendor cadangan.
       - `posting_type` yang belum dikenal aplikasi Anda juga ditolak, dengan kode `INVALID`.
         Daftarnya ada di bagian **Jenis posting** di bawah.
       - Bukukan dari `journal_lines`, dengan `posting_date` sebagai tanggal jurnal.
       - Kirim ack (langkah 5).
    3. Ulangi selama `meta.has_more` bernilai `true`.

    Posting yang belum di-ack disajikan lagi pada pull berikutnya. Bila proses Anda berhenti
    di tengah, tidak ada posting yang hilang.

    ## Langkah 5 — Ack

    ```http
    POST /finance-postings/AST-ACQ-01J9Z3/ack

    {"status": "posted", "external_reference": "JV-2026-0001"}
    ```

    ```http
    POST /finance-postings/AST-ACQ-01J9Z3/ack

    {"status": "rejected", "reason_code": "PERIOD_CLOSED", "reason": "Periode September sudah ditutup"}
    ```

    | Jawaban | Arti |
    | --- | --- |
    | `200` | Ack tercatat, atau ack yang sama sudah tercatat sebelumnya — aman diulang |
    | `404` | `posting_id` tidak dikenal, atau jenisnya di luar prefix klien Anda |
    | `409` | Bertentangan dengan status yang tercatat, misalnya nomor voucher berbeda |
    | `422` | Isi ack tidak lengkap |

    - Ack ulang dijawab `200` dengan ack yang tercatat pertama kali. `posted` dianggap sama bila
      `external_reference`-nya sama setelah spasi di awal dan akhir dibuang. `rejected` dianggap
      sama bila `reason_code`-nya sama; `reason` yang berbeda tetap dijawab `200`, dan teks yang
      tersimpan **tidak** diganti.
    - Posting dicari sebelum body diperiksa: `posting_id` yang tidak dikenal dijawab `404`
      walaupun body-nya juga salah.
    - Ack boleh dikirim klien lain di tenant yang sama, asal punya scope `finance-postings.ack`
      dan prefix jenisnya mencakup posting itu.

    | Kode penolakan | Pakai bila |
    | --- | --- |
    | `PERIOD_CLOSED` | Periode `posting_date` sudah ditutup |
    | `UNKNOWN_ACCOUNT` | `external_id` akun tidak dikenal |
    | `UNKNOWN_DIMENSION` | Kode atau nilai dimensi tidak dikenal |
    | `UNKNOWN_VENDOR` | Vendor tidak dikenal |
    | `UNKNOWN_LEGAL_ENTITY` | Entitas legal tidak dikenal |
    | `INVALID` | Alasan lain, termasuk `posting_type` yang belum dikenal |

    Posting yang ditolak tidak dikirim ulang dan tanggalnya tidak digeser. Pengguna CoreERP
    memperbaikinya dengan posting koreksi di periode yang masih terbuka.

    ## Mode push

    Bila klien Anda memakai mode push, CoreERP mengirim setiap posting `pending` sebagai
    `POST` ke URL HTTPS Anda, satu posting per kiriman, dengan header `Content-Type:
    application/json` dan `Accept: application/json`. Urutannya sama dengan pull, dan kiriman
    ulang bisa terjadi — tetap jaga `UNIQUE(posting_id)`. Bentuk lengkapnya ada di bagian
    **Webhooks** (`financePosting`).

    Body push berisi **nilai** JSON yang sama dengan satu posting pada `GET /finance-postings`,
    tetapi byte-nya tidak sama: push menulis `/` dan karakter non-ASCII seperti `·` apa adanya,
    sedangkan pull menulisnya sebagai escape. Jangan membandingkan keduanya sebagai teks.

    Verifikasi signature sebelum memproses. `X-CoreERP-Event-Signature` adalah HMAC-SHA256
    heksadesimal huruf kecil atas `<X-CoreERP-Event-Timestamp>.<raw body>`, dengan signing
    secret klien — ditampilkan sekali saat klien dibuat — sebagai key. Hitung atas raw body
    **persis seperti yang diterima**, sebelum di-parse; body yang di-parse lalu dikodekan ulang
    tidak menghasilkan byte yang sama:

    ```php
    $timestamp = $_SERVER['HTTP_X_COREERP_EVENT_TIMESTAMP'] ?? '';
    $signature = $_SERVER['HTTP_X_COREERP_EVENT_SIGNATURE'] ?? '';
    $body = file_get_contents('php://input');

    $expected = hash_hmac('sha256', $timestamp.'.'.$body, $signingSecret);
    if (! hash_equals($expected, $signature) || abs(time() - (int) $timestamp) > 300) {
        http_response_code(401);
        exit;
    }
    ```

    Untuk menguji kode verifikasi Anda: signing secret `rahasia-uji`, timestamp `1790614204`,
    dan raw body `{"posting_id":"AST-ACQ-0001"}` menghasilkan signature
    `c63f1fa7160d6ec490501632bbecebaad1703ad834154f6a5c6ec8463b4e32ee`.

    CoreERP menunggu sambungan paling lama 3 detik dan jawaban paling lama 10 detik. Waktu yang
    habis diperlakukan seperti tidak menjawab.

    | Jawaban Anda | Yang dilakukan CoreERP |
    | --- | --- |
    | `2xx` apa pun (termasuk `202` dan `204`) dengan body ack yang sah | Terkirim, ack diterapkan, posting selesai |
    | `2xx` apa pun tanpa body ack yang sah | Dianggap terkirim; posting tetap `pending` sampai Anda meng-ack lewat API. Body yang bukan ack sah, misalnya `posted` tanpa `external_reference`, diabaikan tanpa pemberitahuan |
    | `408`, `429`, `5xx`, atau tidak menjawab | Dikirim ulang dengan jeda 1, 2, 4, 8, 16, 32, lalu 60 menit, sampai 24 jam sejak percobaan pertama; sesudahnya ditandai gagal kirim |
    | `4xx` lain atau `3xx` | Ditandai gagal kirim, tidak dikirim ulang, dan muncul di layar pantau CoreERP. Redirect tidak diikuti. |

    Selama satu posting menunggu jeda kirim ulang, posting sesudahnya tidak dikirim ke klien Anda.
    Posting yang sudah ditandai gagal kirim tidak menahan antrean.

    ## Jenis posting (posting_type)

    Setiap posting membawa `posting_type` berbentuk `<modul>.<peristiwa>`: modul yang menerbitkan
    posting dan peristiwa yang membuatnya terbit. Daftar lengkapnya:

    | `posting_type` | Terbit saat | Tersedia |
    | --- | --- | --- |
    | `asset.acquisition` | Penerimaan aset diselesaikan | Sudah |
    | `asset.acquisition_adjustment` | Nilai perolehan dikoreksi | Sudah |
    | `asset.opening_balance` | Saldo awal aset lama saat mulai memakai feed | Sudah |
    | `asset.depreciation` | Proses "Post penyusutan" satu periode | Sudah |
    | `asset.depreciation_reversal` | Penyusutan satu periode dibalik | Sudah |
    | `asset.disposal_sale` | Penjualan aset diposting | Sudah |
    | `asset.disposal_scrap` | Pemusnahan aset diposting | Sudah |
    | `asset.write_down` | Penurunan nilai aset diposting | Sudah |
    | `asset.appreciation` | Kenaikan nilai aset diposting | Sudah |
    | `asset.reclassification` | Reklasifikasi aset antar group aset diposting | Sudah |

    **Tersedia** menyebut apakah modul penerbitnya sudah menerbitkan jenis itu. Jenis bertanda
    *Belum* tidak pernah muncul di `GET /finance-postings` sampai modulnya menerbitkannya.

    `asset.acquisition` berisi satu posting per penerimaan aset, dengan `posting_id`
    `AST-ACQ-<id penerimaan>`. Barisnya per group aset dan unit organisasi: debit harga
    perolehan, debit PPN Masukan bila ada PPN, dan kredit sebesar keduanya ke lawannya — Hutang
    Usaha pada `direct_payable`, akun perantara pada `clearing`, atau akun lawan hibah untuk aset
    hibah (tanpa `vendor`). Pada `direct_payable`, posting inilah hutangnya: buat faktur hutang
    dari posting ini tanpa jurnal kedua.

    `asset.acquisition_adjustment` mengoreksi nilai perolehan satu aset sebelum aset itu disusutkan,
    dengan `adjusts_posting_id` menunjuk jurnal perolehannya (`AST-ACQ-…` atau `AST-OPB-…`) dan
    `posting_id` `AST-ADJ-<id aset>-<nomor urut koreksi>`. Tanggalnya hari koreksi dilakukan, bukan
    tanggal jurnal asalnya. Barisnya satu pasang untuk selisihnya: harga perolehan dan akun lawan jurnal
    asal — Hutang Usaha atau akun perantara menurut `settlement_mode` jurnal asal (selalu sama dengan
    jurnal asalnya, walaupun setelan entitas sudah berganti), akun lawan hibah, atau akun penyeimbang saldo
    awal. Nilai naik mendebit harga perolehan; nilai turun membalik arahnya. Tidak ada PPN. Pada
    `direct_payable` posting ini membawa `vendor` jurnal asal: nilai naik berarti tagihan tambahan, nilai
    turun berarti nota kredit atas faktur yang sama. Rincian di `details.assets` membawa
    `acquisition_value_before`, `acquisition_value_after`, dan `adjustment_amount` bertanda; alasan
    koreksinya di `details.reason` dan `source_document.description`. Jurnal perolehan yang dicatat
    manual tidak pernah dikoreksi lewat feed.

    `asset.opening_balance` berisi saldo awal aset lama saat mulai memakai feed, satu posting per
    dokumen saldo awal, dengan `posting_id` `AST-OPB-<id dokumen>`. `posting_date`-nya selalu
    tanggal cutover entitas legal, dan `document_date` tanggal perolehan asli aset. Barisnya per
    group aset dan unit organisasi: debit harga perolehan, kredit akumulasi penyusutan sampai
    cutover, dan kredit akun penyeimbang saldo awal sebesar nilai bukunya. Tidak ada `vendor`
    maupun PPN. Rincian per aset di `details.assets` membawa `acquisition_value`,
    `accumulated_depreciation`, dan `net_book_value`.

    `asset.depreciation` berisi penyusutan satu periode satu buku satu entitas legal, dari proses
    "Post penyusutan" di modul aset, dengan `posting_id`
    `AST-DEP-<entitas legal>-<buku>-<YYYYMMDD>-<nomor urut proses>`. `posting_date` dan
    `document_date`-nya tanggal akhir periode. Barisnya: debit beban penyusutan per group aset dan
    department (business unit + department), lalu kredit akumulasi penyusutan per group aset dan
    business unit. Penyusutan yang difinalkan sesudah proses pertama terbit sebagai posting
    berikutnya untuk periode yang sama, dengan nomor urut berikutnya. Totalnya selalu sama dengan
    penyusutan di register aset; rincian per aset di `details.assets` membawa `depreciation_amount`.

    `asset.depreciation_reversal` membalik porsi satu aset dari sebuah posting `asset.depreciation`,
    dengan `reverses_posting_id` menunjuk posting itu dan `posting_id` `AST-DRV-<id pembalikan>`.
    Tanggalnya tanggal periode yang dibalik, sama dengan posting asalnya, dan akun serta dimensinya
    kebalikan baris aset itu. Bila periode itu sudah tutup di aplikasi Anda, tolak lewat ack; koreksinya
    dibuat manual di periode yang masih terbuka. Penyusutan yang dibalik sebelum di-post tidak pernah
    terbit, jadi tidak ada pembaliknya.

    `asset.disposal_sale` dan `asset.disposal_scrap` mengeluarkan satu aset dari buku saat penjualan
    atau pemusnahannya diposting, dengan `posting_id` `AST-DSP-<id aset>` — satu aset hanya dilepas
    sekali. `posting_date` dan `document_date`-nya tanggal dokumen pelepasan. Barisnya membalik saldo
    buku aset itu: debit akumulasi penyusutan, debit akumulasi penurunan nilai bila ada, kredit harga
    perolehan, dan kredit kenaikan nilai bila ada. Penjualan menambah debit akun hasil penjualan aset
    sebesar nilai jualnya (tanpa `vendor` dan tanpa PPN; tagihan ke pembelinya dibuat di aplikasi Anda).
    Selisih hasil penjualan dengan nilai buku menjadi kredit laba pelepasan atau debit rugi pelepasan,
    per business unit dan department; pemusnahan tidak membawa hasil, jadi seluruh nilai bukunya menjadi
    rugi. Rincian di `details.assets` membawa `acquisition_value`, `accumulated_depreciation`,
    `write_down_amount`, `appreciation_amount`, `net_book_value`, `proceeds`, dan `gain_loss` bertanda.

    `asset.write_down` dan `asset.appreciation` menurunkan atau menaikkan nilai buku aset (penurunan
    nilai dan revaluasi), satu posting per dokumen penyesuaian nilai, dengan `posting_id`
    `AST-WDN-<id dokumen>` atau `AST-APR-<id dokumen>`, bertanggal dokumen itu. Barisnya per group aset
    dan unit organisasi. Penurunan nilai: debit beban penurunan nilai (business unit dan department),
    kredit akumulasi penurunan nilai. Kenaikan nilai: debit akun kenaikan nilai aset, kredit akun
    lawannya, lazimnya surplus revaluasi. Rincian per aset di `details.assets` membawa
    `adjustment_amount`, `net_book_value_before`, dan `net_book_value_after`; alasannya di
    `details.reason` dan `source_document.description`. Saat aset itu kelak dilepas, kedua saldo ini
    ikut dibalik oleh `asset.disposal_sale` atau `asset.disposal_scrap`.

    `asset.reclassification` memindah saldo aset dari akun group aset lama ke akun group aset baru:
    saat aset pindah group, atau saat sebagian nilainya dipecah ke aset baru di group lain. Satu posting
    per dokumen reklasifikasi, dengan `posting_id` `AST-RCL-<id dokumen>`, bertanggal dokumen itu.
    Barisnya berpasangan per akun: debit harga perolehan group baru dan kredit harga perolehan group lama;
    debit akumulasi penyusutan group lama dan kredit akumulasi penyusutan group baru; begitu pula
    akumulasi penurunan nilai (seperti akumulasi penyusutan) dan kenaikan nilai (seperti harga
    perolehan) bila ada. Tidak ada akun laba rugi, dan nilai buku asetnya tidak berubah. Pemecahan aset
    di dalam satu group tidak menerbitkan posting, karena akunnya sama. Rincian per aset di
    `details.assets` membawa `asset_code`, `new_asset_code` (aset baru pecahan, `null` untuk pindah
    group), `from_group`, `to_group`, `book`, dan nilai yang dipindah: `acquisition_value`,
    `accumulated_depreciation`, `write_down_amount`, `appreciation_amount`.

    Menyaring di `GET /finance-postings`:

    | Parameter | Hasil |
    | --- | --- |
    | Tanpa `posting_type` | Semua jenis yang diizinkan untuk klien Anda — cara yang dianjurkan |
    | `posting_type=asset.depreciation` | Hanya penyusutan |
    | `posting_type=asset.*` | Semua jenis dari modul aset |

    Daftar ini terbuka: jenis baru dapat ditambahkan tanpa versi kontrak baru.

    - Klien yang dibatasi prefix, misalnya `asset.`, baru menerima jenis dari modul lain setelah
      admin tenant menambahkan prefix-nya (misalnya `cashier.`) di pengaturan klien integrasi.
    - Klien tanpa prefix menerima semua jenis, termasuk jenis baru dari modul mana pun.
    - Jenis yang belum dikenal aplikasi Anda ditolak lewat ack dengan kode `INVALID`, tidak
      diabaikan.

    ## Aturan data

    - **Nilai uang** adalah string desimal dengan jumlah desimal persis `currency.decimals`,
      misalnya `"500000000.00"`. Jangan membacanya sebagai float dan jangan membulatkan ulang;
      presisi kolom di aplikasi Anda harus sama atau lebih halus.
    - **Tanggal**: `posting_date` (tanggal jurnal) dan `document_date` hanya tanggal.
      `occurred_at` dan `published_at` lengkap dengan offset zona waktu; simpan apa adanya.
    - **`details`** hanya informasi untuk pelacakan, misalnya rincian per aset. Jangan menjurnal
      dari sana.
    - **Urutan field tidak dijamin.** Kunci di dalam posting tidak terkirim dalam urutan skema
      dan bisa berubah tanpa versi baru. Baca menurut nama kunci, jangan menurut posisi atau teks.
    - **Koreksi** membawa `adjusts_posting_id`, dan **pembalikan** membawa `reverses_posting_id`,
      yaitu `posting_id` posting yang dikoreksi atau dibalik.

    ## Kesalahan umum

    | Status | Arti |
    | --- | --- |
    | `401` | Token salah, belum dikirim, atau sudah dicabut |
    | `403` | Alamat asal di luar allowlist (diperiksa lebih dulu), atau scope klien kurang |
    | `422` | Parameter tidak sah; `errors` menyebut field-nya. Teks pesannya tidak dijamin tetap |
    | `429` | Rate limit terlampaui |
    | `503` | Salinan sandbox, yang tidak menyajikan data ke sistem luar |

    **Rate limit** 120 permintaan per menit per klien integrasi, dihitung per `client_id`, bukan
    per alamat IP. Satu jatah dipakai bersama oleh pull, ack, dan `GET /vendors`. Setiap jawaban
    membawa `X-RateLimit-Limit` dan `X-RateLimit-Remaining`; jawaban `429` juga membawa
    `Retry-After` dalam detik.

    ## Versi kontrak

    Setiap posting membawa `contract_version: 1`. Bentuk versi 1 tidak berubah. Perubahan yang
    memengaruhi pembaca terbit sebagai versi baru dan diumumkan lebih dulu.

servers:
  - url: https://{alamat}/api/internal/v1
    description: Alamat tenant CoreERP di layanan SaaS, atau domain server CoreERP di tempat pelanggan.
    variables:
      alamat:
        default: alamat-tenant.contoh
        description: Host yang dipakai pengguna tenant itu untuk masuk ke CoreERP.

security:
  - integrationClient: []

tags:
  - name: Finance feed
    description: Posting yang harus dibukukan aplikasi finance, dan ack hasilnya.
  - name: Directory
    description: Data induk untuk tabel penerjemah — entitas legal, vendor, dan unit organisasi yang menjadi nilai dimensi.

