type: object
additionalProperties: false
required: [line_no, account, debit, credit, description, financial_dimensions]
description: Tepat satu dari `debit` dan `credit` bernilai lebih dari nol.
properties:
  line_no: { type: integer, minimum: 1 }
  account:
    type: object
    additionalProperties: false
    required: [external_id, code, name]
    description: Akun di aplikasi finance, disalin saat terbit. Pembaca mencocokkan lewat `external_id`.
    properties:
      external_id: { type: string, maxLength: 64 }
      code: { type: string, maxLength: 50 }
      name: { type: string, maxLength: 200 }
  debit: { $ref: '#/components/schemas/Money' }
  credit: { $ref: '#/components/schemas/Money' }
  description: { type: [string, 'null'], maxLength: 255 }
  financial_dimensions:
    type: array
    items: { $ref: '#/components/schemas/FinancialDimension' }
