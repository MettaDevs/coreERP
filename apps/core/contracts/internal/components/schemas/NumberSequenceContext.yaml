type: object
description: |
  Scope organisasi permintaan. Keduanya opsional pada tingkat schema karena
  sequence ber-scope tenant tidak memerlukannya, tetapi sequence dengan reset
  fiskal wajib menyertakan `legal_entity_id` — kalender fiskal milik legal entity
  dan tidak pernah milik operating unit.
properties:
