get:
  tags: [Directory]
  operationId: internal.members.index
  summary: Cari anggota tenant yang aktif
  description: |
    Terbatas pada app `human-resources`; app lain menerima 403. Hasil dibatasi
    20 baris dan tidak mendukung pagination — ini pencarian pemilih, bukan export.
  parameters:
    - name: q
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
      description: Awalan kata pada nama atau email, urutan kata bebas dan tidak peka huruf besar-kecil. Tanda kutip mencari frasa berurutan dalam satu field.
  responses:
    '200':
      description: Daftar anggota aktif.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Member' }
    '401': { $ref: '#/components/responses/Unauthenticated' }
    '403': { $ref: '#/components/responses/Forbidden' }
    '422': { $ref: '#/components/responses/ValidationError' }
    '429': { $ref: '#/components/responses/RateLimited' }
