get:
  tags: [Finance feed]
  operationId: internal.finance-postings.evidence.download
  summary: Unduh satu bukti Penerimaan yang dirujuk posting
  security:
    - integrationClient: []
  description: |
    Scope finance-postings.read. Pemeriksaan tenant, prefix, posting pending/posted, receipt
    dan parent sama dengan endpoint daftar. Lampiran harus aktif dan milik receipt tersebut.
    File diambil dari disk lokal atau S3 konfigurasi CoreERP, maksimum 25 MiB.
    Hash dan panjang diverifikasi sebelum dikirim. Berkas rusak tidak dikirim.
    Cache-Control private, no-store; Content-Disposition attachment. Consumer boleh menyediakan
    preview gambar/PDF dengan pemeriksaan izin pengguna sendiri.
  parameters:
    - { name: posting_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' } }
    - { name: receipt, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }
    - { name: attachment, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' } }
  responses:
    '200':
      description: Isi berkas
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    '401': { description: Token tidak sah }
    '403': { description: Scope atau IP tidak diizinkan }
    '404': { description: 'Posting, parent atau lampiran tidak tersedia' }
    '413': { description: Berkas lebih dari 25 MiB }
    '429': { description: Batas permintaan tercapai }
    '503': { description: Lingkungan atau berkas tidak dapat dilayani }
