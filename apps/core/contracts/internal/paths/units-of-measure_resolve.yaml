post:
  tags: [Directory]
  operationId: internal.units-of-measure.resolve
  summary: Resolusi sekumpulan ID satuan
  description: |
    Dipakai app untuk memvalidasi satuan yang disimpannya masih sah. Bersifat
    semua-atau-tidak: satu ID yang tidak ditemukan atau tidak aktif menggagalkan
    seluruh permintaan dengan 422, bukan mengembalikan sebagian hasil.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [unit_ids]
          properties:
            unit_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: ulid }
  responses:
    '200':
      description: Seluruh satuan ditemukan dan aktif.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/UnitOfMeasure' }
    '401': { $ref: '#/components/responses/Unauthenticated' }
    '403': { $ref: '#/components/responses/Forbidden' }
    '422': { $ref: '#/components/responses/ValidationError' }
    '429': { $ref: '#/components/responses/RateLimited' }
