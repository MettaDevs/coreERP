post:
  tags: [Number sequence]
  operationId: internal.number-sequence-reservations.cancel
  summary: Batalkan nomor yang dipesan
  description: |
    Mengembalikan nomor ke pool sehingga tidak ada lompatan pada sequence
    berkelanjutan. Reservation yang sudah `cancelled` mengembalikan hasil yang sama.
    Reservation yang sudah dikonfirmasi tidak dapat dibatalkan.
  parameters:
    - $ref: '#/components/parameters/ReservationId'
  requestBody:
    required: false
    content:
      application/json:
        schema: { $ref: '#/components/schemas/NumberSequenceContext' }
  responses:
    '200':
      description: Reservation dibatalkan.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Reservation' }
    '401': { $ref: '#/components/responses/Unauthenticated' }
    '403': { $ref: '#/components/responses/Forbidden' }
    '422':
      description: Reservation sudah dikonfirmasi dan tidak dapat dibatalkan.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    '429': { $ref: '#/components/responses/RateLimited' }
