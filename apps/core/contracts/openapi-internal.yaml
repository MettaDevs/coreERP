openapi: 3.1.0
info:
  title: CoreERP Control Plane internal API
  version: 1.0.0
  description: |
    Permukaan **app-ke-Core**: seluruh route dengan prefix `/internal/v1`, dipanggil
    aplikasi bisnis memakai service credential, bukan session browser.

    File ini **ditulis tangan dan merupakan sumber kebenaran**. Ia sengaja terpisah
    dari `openapi.json`, yang di-generate Scramble dan hanya mencakup surface browser
    Control Plane (`/api/v1`, session cookie). Generator tidak pernah memindai prefix
    ini, sehingga dua belas endpoint di bawah tidak berkontrak sama sekali sampai
    file ini dibuat. Jangan pindahkan isinya ke output generator.

    Aturan yang mengikat file ini ada pada **Contract decision gate** di
    `.agents/skills/coreerp-architecture/SKILL.md`. Menambah route pada
    `routes/api.php` tanpa menambahkannya di sini adalah perubahan yang belum selesai.

    Batas yang berlaku di seluruh endpoint:

    - `tenant_id` **tidak pernah** diterima dari URL, query, atau body. Ia berasal dari
      header kredensial yang diverifikasi `AuthenticateAppService`.
    - App hanya menerima referensi opaque milik Core. Tidak ada akses database lintas
      module, tidak ada foreign key lintas database.
    - Seluruh response sukses memakai envelope `data`.

servers:
  - url: /api/internal/v1
    description: |
      Relatif terhadap host Control Plane. Prefix `/api` ditambahkan Laravel melalui
      `withRouting(api: ...)`, sedangkan `internal/v1` berasal dari grup di
      `routes/api.php` — jadi path lengkapnya `/api/internal/v1/...`, bukan
      `/internal/v1/...`.

security:
  - appId: []
    serviceToken: []
    tenantHeader: []

tags:
  - name: Directory
    description: Data referensi Core yang boleh dibaca app. Hanya baca.
  - name: Human Resources
    description: Sinkronisasi workforce. Terbatas pada app `human-resources`.
  - name: Number sequence
    description: Penerbitan nomor dokumen. Counter dimiliki Core, tidak pernah app.
  - name: Workflow
    description: Pengajuan workflow. Keputusannya kembali sebagai event, bukan response.
  - name: Pusat admin
    description: |
      Perintah dari konsol operator vendor. Satu-satunya tag di berkas ini yang pemanggilnya
      bukan app module, dan karena itu satu-satunya yang tidak memakai kredensial app.

paths:
  /members:
    get:
      tags: [Directory]
      operationId: internal.members.index
      summary: Cari anggota tenant yang aktif
      description: |
        Terbatas pada app `human-resources`; app lain menerima 403. Hasil dibatasi
        20 baris dan tidak mendukung pagination — ini pencarian pemilih, bukan export.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Cocokkan sebagian nama atau email, tidak peka huruf besar-kecil.
      responses:
        '200':
          description: Daftar anggota aktif.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /members/{membership}:
    get:
      tags: [Directory]
      operationId: internal.members.show
      summary: Ambil satu anggota tenant
      description: Terbatas pada app `human-resources`. Anggota non-aktif dianggap tidak ada.
      parameters:
        - name: membership
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: Anggota ditemukan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /operating-units:
    get:
      tags: [Directory]
      operationId: internal.operating-units.index
      summary: Daftar operating unit aktif
      description: |
        Terbatas pada app `human-resources`. Hanya organisasi dengan klasifikasi
        `operating_unit` dan status aktif. Legal entity tidak dikembalikan di sini.
      responses:
        '200':
          description: Daftar operating unit, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: ulid }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /fiscal-periods:
    get:
      tags: [Directory]
      operationId: internal.fiscal-periods.resolve
      summary: Tahun buku dan periode yang memuat satu tanggal
      description: |
        Untuk app yang perhitungannya bergantung pada batas tahun buku, misalnya
        penyusutan aset dengan dasar tahun fiskal. Kalender melekat pada legal entity,
        jadi app cukup menyebut legal entity dan tanggal yang ditanyakan.

        Fakta kalender tetap dimiliki Core. App tidak boleh menyalin bulan awal tahun
        buku ke databasenya sendiri, karena salinan itu akan menyimpang saat tenant
        mengubah kalendernya.
      parameters:
        - name: legal_entity_id
          in: query
          required: true
          schema: { type: string, format: ulid }
        - name: date
          in: query
          required: true
          description: Tanggal yang dicari periodenya, format `YYYY-MM-DD`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Kalender, tahun buku, dan periode yang memuat tanggal tersebut.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [calendar, year, period]
                    properties:
                      calendar:
                        type: object
                        required: [id, code, name]
                        properties:
                          id: { type: string, format: ulid }
                          code: { type: string }
                          name: { type: string }
                      year:
                        type: object
                        required: [id, name, starts_on, ends_on]
                        properties:
                          id: { type: string, format: ulid }
                          name: { type: string }
                          starts_on: { type: string, format: date }
                          ends_on: { type: string, format: date }
                      period:
                        type: object
                        required: [id, ordinal, name, starts_on, ends_on]
                        properties:
                          id: { type: string, format: ulid }
                          ordinal: { type: integer }
                          name: { type: string }
                          starts_on: { type: string, format: date }
                          ends_on: { type: string, format: date }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Legal entity belum punya kalender tahun buku, atau tanggal belum tercakup periodenya.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /units-of-measure:
    get:
      tags: [Directory]
      operationId: internal.units-of-measure.index
      summary: Daftar satuan aktif tenant
      description: Terbuka untuk semua app yang punya credential aktif dan entitlement `ready`.
      responses:
        '200':
          description: Daftar satuan, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UnitOfMeasure' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /units-of-measure/resolve:
    post:
      tags: [Directory]
      operationId: internal.units-of-measure.resolve
      summary: Resolusi sekumpulan ID satuan
      description: |
        Dipakai app untuk memvalidasi satuan yang disimpannya masih sah. Bersifat
        semua-atau-tidak: satu ID yang tidak ditemukan atau tidak aktif menggagalkan
        seluruh permintaan dengan 422, bukan mengembalikan sebagian hasil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_ids]
              properties:
                unit_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: ulid }
      responses:
        '200':
          description: Seluruh satuan ditemukan dan aktif.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UnitOfMeasure' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /units-of-measure/convert:
    post:
      tags: [Directory]
      operationId: internal.units-of-measure.convert
      summary: Konversi nilai antar satuan
      description: |
        Kedua satuan harus aktif dan berada dalam kelas yang sama. Konversi khusus
        produk (misalnya box-ke-pcs) bukan milik endpoint ini; itu milik PIM/Inventory
        ketika module tersebut memiliki produk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_unit_id, to_unit_id, value]
              properties:
                from_unit_id: { type: string, format: ulid }
                to_unit_id:
                  type: string
                  format: ulid
                  description: Harus berbeda dari `from_unit_id`.
                value:
                  type: string
                  description: Dikirim sebagai string agar presisi desimal tidak hilang.
      responses:
        '200':
          description: Hasil konversi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [value, unit_id]
                    properties:
                      value: { type: string }
                      unit_id: { type: string, format: ulid }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Satuan tidak aktif, beda kelas, atau aturan konversi belum dikonfigurasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /human-resources/position-assignments:
    post:
      tags: [Human Resources]
      operationId: internal.hr.position-assignments.store
      summary: Sinkronkan perubahan penugasan posisi
      description: |
        Terbatas pada app `human-resources`.

        Ini **perintah REST, bukan event**. Ia menyatakan keadaan penugasan saat ini
        dan Core memakainya untuk memateralisasi role otomatis; ia bukan fakta masa
        lalu yang disiarkan. Jangan mencarinya di `asyncapi.yaml`.

        Efeknya idempoten terhadap `assignment_id`: `active: true` membuat atau
        mempertahankan role assignment otomatis untuk setiap rule posisi yang cocok,
        `active: false` mencabutnya. Assignment manual tidak pernah tersentuh.

        Rule role otomatis hanya boleh memakai data policy yang membutuhkan operating
        unit dan tidak membutuhkan legal entity; kombinasi lain ditolak 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id, position_id, operating_unit_id, assignment_id, active]
              properties:
                membership_id:
                  type: string
                  format: ulid
                  description: Harus anggota aktif pada tenant yang sama.
                position_id: { type: string, format: ulid }
                operating_unit_id:
                  type: string
                  format: ulid
                  description: Menjadi scope data policy pada role otomatis yang dibuat.
                assignment_id:
                  type: string
                  format: ulid
                  description: Identitas penugasan milik HR; dipakai sebagai kunci pencabutan.
                active:
                  type: boolean
                  description: '`false` mencabut role otomatis yang berasal dari penugasan ini.'
      responses:
        '204':
          description: Sinkronisasi diterima. Tidak ada body.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Anggota tidak tersedia, atau rule role otomatis memakai kebijakan data
            yang tidak sah untuk penugasan posisi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /number-sequences/{reference}/issue:
    post:
      tags: [Number sequence]
      operationId: internal.number-sequences.issue
      summary: Terbitkan satu nomor dokumen
      description: |
        Hanya untuk sequence **non-continuous**. Sequence berkelanjutan wajib memakai
        `reserve` lalu `confirm`, karena hanya jalur itu yang menjamin tidak ada lompatan
        nomor; memanggil `issue` padanya menghasilkan 422.

        Pengulangan dengan `idempotency_key` yang sama pada app dan sequence yang sama
        mengembalikan nomor yang sama, bukan nomor kedua.
      parameters:
        - $ref: '#/components/parameters/SequenceReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NumberSequenceContext'
                - type: object
                  required: [idempotency_key]
                  properties:
                    idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
                    manual_value:
                      type: [string, 'null']
                      maxLength: 255
                      description: |
                        Hanya sah bila sequence mengizinkan nilai manual. Sequence
                        berkelanjutan tidak pernah mengizinkannya.
      responses:
        '200':
          description: Nomor diterbitkan, atau pemutaran ulang idempotency key yang sama.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/IssuedNumber' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Sequence berkelanjutan, sequence tidak aktif untuk scope yang dikirim,
            atau field tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /number-sequences/{reference}/reserve:
    post:
      tags: [Number sequence]
      operationId: internal.number-sequences.reserve
      summary: Pesan nomor untuk sequence berkelanjutan
      description: |
        Hanya untuk sequence **continuous**; sequence non-continuous menghasilkan 422.

        Reservation menahan nomor sampai `confirm` atau `cancel`. Nomor yang dibatalkan
        kembali ke pool dan dapat dipakai transaksi lain, sehingga reservation yang sudah
        dibatalkan tidak pernah diputar ulang oleh idempotency key yang sama.
      parameters:
        - $ref: '#/components/parameters/SequenceReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NumberSequenceContext'
                - type: object
                  required: [idempotency_key]
                  properties:
                    idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
      responses:
        '201':
          description: Nomor dipesan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Sequence tidak memakai reservation, atau field tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /number-sequence-reservations/{reservation}/confirm:
    post:
      tags: [Number sequence]
      operationId: internal.number-sequence-reservations.confirm
      summary: Konfirmasi nomor yang dipesan
      description: |
        Dipanggil setelah dokumen app benar-benar tersimpan. Reservation yang sudah
        `confirmed` mengembalikan hasil yang sama tanpa efek tambahan.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NumberSequenceContext' }
      responses:
        '200':
          description: Reservation dikonfirmasi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Reservation sudah dibatalkan atau tidak dalam status yang dapat dikonfirmasi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /number-sequence-reservations/{reservation}/cancel:
    post:
      tags: [Number sequence]
      operationId: internal.number-sequence-reservations.cancel
      summary: Batalkan nomor yang dipesan
      description: |
        Mengembalikan nomor ke pool sehingga tidak ada lompatan pada sequence
        berkelanjutan. Reservation yang sudah `cancelled` mengembalikan hasil yang sama.
        Reservation yang sudah dikonfirmasi tidak dapat dibatalkan.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NumberSequenceContext' }
      responses:
        '200':
          description: Reservation dibatalkan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Reservation sudah dikonfirmasi dan tidak dapat dibatalkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workflow-instances:
    post:
      tags: [Workflow]
      operationId: internal.workflow-instances.store
      summary: Ajukan dokumen ke workflow Core
      description: |
        App mengajukan dokumennya; Core menjalankan konfigurasi workflow milik tenant.

        Keputusannya **tidak** dikembalikan pada response ini. Ia tiba kemudian sebagai
        event `core.workflow.decision.v2` ke endpoint webhook app — lihat
        `contracts/asyncapi.yaml`. Response ini hanya menyatakan pengajuan diterima.

        `workflow_type` harus terdaftar untuk app pemanggil; jenis milik app lain
        menghasilkan 404, bukan 403, agar keberadaan workflow app lain tidak bocor.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/IdempotencyKey' }
          description: |
            Wajib. Pengulangan dengan kunci yang sama mengembalikan instance yang sama
            dengan status 200 dan header `Idempotent-Replayed: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [workflow_type, source_document_type, source_document_id, initiator_membership_id, decision_context]
              properties:
                workflow_type:
                  type: string
                  maxLength: 120
                  description: Kode `workflow_types` milik app pemanggil.
                source_document_type:
                  type: string
                  maxLength: 120
                  description: Jenis dokumen milik app, mis. `dekomisioning-aset`.
                source_document_id: { type: string, format: ulid }
                legal_entity_id:
                  type: [string, 'null']
                  format: ulid
                  description: |
                    Wajib bila jenis workflow ber-scope `legal_entity`; dikosongkan bila
                    ber-scope `tenant`.
                initiator_membership_id:
                  type: string
                  format: ulid
                  description: Harus anggota aktif pada tenant yang sama.
                decision_context:
                  type: object
                  description: |
                    Konteks keputusan. Field wajibnya ditentukan
                    `decision_context_schema` pada jenis workflow, bukan oleh file ini.
                    Nilainya dikembalikan apa adanya pada event keputusan.
      responses:
        '201':
          description: Workflow instance dibuat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkflowInstance' }
        '200':
          description: Pemutaran ulang idempotency key yang sama.
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkflowInstance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Jenis workflow tidak terdaftar untuk app ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Belum ada konfigurasi workflow aktif dan terbit untuk dokumen ini, atau
            permintaan dengan kunci yang sama sedang diproses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Pengaju tidak valid, atau `decision_context` kurang field wajib.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tenants:
    post:
      tags: [Pusat admin]
      operationId: internal.tenants.store
      summary: Lahirkan tenant beserta admin pertamanya
      description: |
        **Pemanggilnya pusat admin, bukan app module.** Satu-satunya endpoint di berkas ini
        yang tidak memakai kredensial app, dan satu-satunya yang bekerja pada tenant yang
        belum ada — jadi tiga header kredensial itu memang tidak dapat dipakai di sini.
        Penjaganya token bersama pada `Authorization: Bearer`; alasannya di
        `App\Http\Middleware\ControlPlaneOnly`.

        Di belakangnya berjalan `App\Actions\Onboarding\RegisterBusiness` — aksi yang sama
        persis yang dipakai layar pendaftaran mandiri, bukan salinannya. Yang lahir karena
        itu bukan hanya baris `tenants`: client, environment produksi, keanggotaan owner,
        role Owner beserta seluruh duty app yang dibeli, entitlement, satuan bawaan, dan
        pemasangan tiap module yang ada di edisi ini.

        Kata sandi sementara **dibuat Core**, tidak pernah dikirim pemanggil, dan dipulangkan
        **sekali** di balasan ini. Ia tidak dapat dibaca lagi setelahnya; yang tersimpan hanya
        hash-nya. Pemiliknya wajib menggantinya saat masuk pertama — sampai itu terjadi, satu
        satunya halaman yang dapat dicapainya adalah layar ganti kata sandi.

        Nama fieldnya bahasa Indonesia karena pembaca dan penulisnya operator, bukan app.

        Balasannya sengaja **tanpa envelope `data`** — berbeda dari seluruh endpoint lain di
        berkas ini. Aturan envelope itu milik permukaan app-ke-Core; yang ini perintah
        vendor-ke-vendor dengan satu pemanggil yang diketahui namanya.
      security:
        - controlPlaneToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, admin_name, admin_email, app_ids]
              properties:
                legal_name:
                  type: string
                  maxLength: 255
                  description: |
                    Nama pelanggan — perusahaan atau grupnya. Menjadi nama tenant dan dasar
                    slug-nya, dan slug itulah yang muncul sebagai label pertama pada alamat
                    lingkungannya.

                    **Bukan** nama badan hukum tertentu: satu tenant boleh memuat beberapa badan
                    hukum sekaligus, dan masing-masing didaftarkan di dalam ERP sebagai organisasi
                    berjenis legal entity, lengkap dengan kode perusahaan dan kode negaranya.
                first_environment:
                  type: string
                  enum: [production, demo, none]
                  default: production
                  description: |
                    Jenis tempat kerja pertama tenant ini.

                    Bawaannya `production`, dan itu yang dipakai pendaftaran mandiri: orang yang
                    mendaftar sendiri memang datang untuk bekerja. Operator yang melahirkan tenant
                    bagi calon pelanggan biasanya memilih `demo` — produksi yang terlanjur lahir
                    adalah tempat kerja kosong yang tidak pernah dipakai siapa pun sekaligus alamat
                    yang sudah terpakai.

                    `none` melahirkan tenant tanpa satu pun lingkungan. Entitlement-nya tetap
                    tercatat, jadi lingkungan yang dibuat kemudian memasang module yang sama persis.
                first_environment_expires_at:
                  type: string
                  format: date
                  description: |
                    Tanggal berakhir, **wajib bila `first_environment` bernilai `demo`** dan
                    diabaikan selainnya. Demo tanpa tanggal berakhir tinggal selamanya, dan tidak
                    ada yang menyadarinya sampai disknya penuh.
                admin_name:
                  type: string
                  maxLength: 255
                  description: Nama orang yang menjadi owner pertama tenant ini.
                admin_email:
                  type: string
                  format: email
                  maxLength: 255
                  description: |
                    Dirapikan menjadi huruf kecil sebelum diperiksa, lalu wajib belum terdaftar.
                    Email yang sudah punya akun ditolak 422 — sampai "satu orang banyak tenant"
                    dikerjakan, tidak ada jalur menambahkan orang yang sudah punya akun ke tenant
                    kedua.
                app_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                  description: |
                    App yang dibeli pelanggan. Tiap id wajib ada di katalog dengan status
                    `available`; app yang belum tersedia ditolak 422. Prerequisite transitifnya
                    ikut ditambahkan sendiri oleh graph dependency.
      responses:
        '201':
          description: Tenant lahir. `temporary_password` hanya muncul di sini, sekali.
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, environment_id, email, temporary_password]
                properties:
                  tenant_id: { type: string, format: ulid }
                  environment_id:
                    type: string
                    format: ulid
                    description: Environment `production` pertama tenant ini.
                  email: { type: string, format: email }
                  temporary_password:
                    type: string
                    description: Dibuat Core, tidak dapat dibaca lagi setelah balasan ini.
        '401':
          description: |
            Token pusat admin salah, tidak dikirim, atau pemasangan ini memang tidak menyetel
            token sama sekali — dan yang terakhir juga 401, bukan terbuka.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Email sudah terdaftar, app tidak tersedia, atau field wajib kurang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /environments/{environment}/provision:
    post:
      tags: [Pusat admin]
      operationId: internal.environments.provision
      summary: Siapkan database sebuah lingkungan, lalu pasang module yang dibeli tenantnya
      description: |
        **Pemanggilnya pusat admin, bukan app module** — penjaganya token bersama yang sama
        dengan `/tenants`.

        Di belakangnya berjalan `environment:provision`, dan urutannya menentukan: database
        dibuat, seluruh migration Core dijalankan ke dalamnya, `database_name` dicatat,
        **lalu** tiap module yang dibeli tenantnya dipasang beserta data awalnya. Statusnya
        naik ke `active` sesudah semuanya — lingkungan yang setengah terisi harus menjadi
        tempat yang tidak dapat dimasuki, bukan tempat yang dimasuki lalu ternyata separuh.

        **Sinkron, dan itu keputusan.** Ia menjalankan migration sungguhan dan dapat memakan
        puluhan detik; pemanggil wajib memberi tenggat yang jauh lebih longgar daripada
        endpoint lain di berkas ini. Sambungan yang putus tidak membatalkan apa pun di sisi
        Core — perintahnya berjalan sampai selesai.

        **Aman diulang.** Nama database dihitung dari baris yang sama, "database sudah ada"
        diperlakukan berhasil, dan migration yang sudah teraplikasi dilewati sendiri. Panggilan
        kedua yang datang selagi yang pertama masih berjalan ditolak oleh kunci operasinya,
        bukan dilayani sebagai penyiapan kedua di atas yang pertama.

        Balasannya tanpa envelope `data`, dengan alasan yang sama seperti `/tenants`.
      security:
        - controlPlaneToken: []
      parameters:
        - name: environment
          in: path
          required: true
          schema: { type: string, format: ulid }
          description: Id baris `environments` yang disiapkan.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_by:
                  type: integer
                  description: |
                    Id user yang menekan tombolnya. Tercatat pada `environment_operations` supaya
                    kolom "Oleh" di layar riwayat menyebut orangnya. Dihilangkan bila id-nya tidak
                    ada sebagai user di sini — kolomnya berkunci asing, dan id yang tidak ada akan
                    menjatuhkan penyiapannya demi sebuah nama. Kosong berarti riwayatnya berbunyi
                    "Sistem", persis seperti perintah yang diketik di terminal.
      responses:
        '200':
          description: Lingkungan disiapkan dan aktif.
          content:
            application/json:
              schema:
                type: object
                required: [status, database, modules]
                properties:
                  status:
                    type: string
                    description: Status barisnya sesudah penyiapan; `active` bila berhasil.
                  database:
                    type: string
                    nullable: true
                    description: Nama database yang kini dipakai lingkungan ini.
                  modules:
                    type: array
                    description: |
                      Dibaca dari database lingkungan itu, bukan disimpulkan dari entitlement
                      tenantnya. Kosong bila tenantnya tidak membeli satu pun module yang ada
                      di edisi ini — atau bila daftarnya tidak terbaca, yang sengaja tidak
                      menggagalkan penyiapan yang sudah berhasil.
                    items:
                      type: object
                      required: [id, version, status, seeded]
                      properties:
                        id: { type: string }
                        version: { type: string }
                        status:
                          type: string
                          enum: [installed, disabled, uninstalled]
                        seeded:
                          type: boolean
                          description: Data awal module ini sudah pernah diisi.
                  output:
                    type: string
                    description: Keluaran mentah perintahnya, untuk ditempel ke laporan.
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Lingkungan itu tidak ada di registry, atau sudah dihapus lunak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Statusnya bukan `provisioning` maupun `degraded`. Menyiapkan ulang lingkungan yang
            sudah hidup akan menimpa isinya, jadi ia ditolak — dan ini keadaan yang dapat
            berubah sendiri sebelum orangnya menekan tombol, bukan permintaan yang salah bentuk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Penyiapannya berjalan dan gagal. Lingkungannya turun ke `degraded`, dan `message`
            memuat alasan yang tercatat di `environment_operations` — bukan keluaran perintahnya,
            karena yang tercatat itulah yang masih dapat dibaca besok.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /fleet:
    get:
      tags: [Pusat admin]
      operationId: internal.fleet.index
      summary: Keadaan seluruh armada dalam satu jawaban
      description: |
        Versi tiap lingkungan dibandingkan terhadap versi image yang sedang berjalan, beserta
        operasi terakhirnya. **Pemanggilnya pusat admin**, dan penjaganya token bersama yang sama
        dengan endpoint pusat admin lainnya.

        Satu panggilan, bukan satu per lingkungan, karena yang dibaca layar adalah
        **perbandingannya** — dan versi image adalah pengetahuan Core, diturunkan dari isi folder
        migration yang tidak ada di container konsol.

        **Ia tidak membuka satu pun database lingkungan.** Seluruh isinya dibaca dari tabel sisi
        pusat: `environments` menyimpan sidik skema tiap lingkungan, `environment_operations`
        menyimpan riwayatnya. Daftar module per lingkungan memang menuntut database lingkungannya,
        dan karena itu ia tinggal di layar rincian satu lingkungan — bukan di sini.
      security:
        - controlPlaneToken: []
      responses:
        '200':
          description: Keadaan armada.
          content:
            application/json:
              schema:
                type: object
                required: [platform_fingerprint, counts, environments]
                properties:
                  platform_fingerprint:
                    type: string
                    description: |
                      Nama berkas migration terakhir di dalam image yang sedang berjalan. Inilah
                      "boleh naik ke mana", dan ia dikirim sekali di kepala jawaban karena
                      jawabannya cuma satu untuk seluruh armada.
                  counts:
                    type: object
                    description: Hitungan per keadaan, untuk kepala halaman.
                    properties:
                      current: { type: integer }
                      behind: { type: integer }
                      failed: { type: integer }
                      unknown: { type: integer }
                  environments:
                    type: array
                    items:
                      type: object
                      required: [id, tenant, name, slug, kind, status, database, fingerprint, state, last_operation]
                      properties:
                        id: { type: string, format: ulid }
                        tenant: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        kind:
                          type: string
                          enum: [production, sandbox, demo]
                        status: { type: string }
                        database:
                          type: string
                          nullable: true
                          description: Kosong berarti lingkungan ini tinggal di database pusat.
                        fingerprint:
                          type: string
                          nullable: true
                          description: |
                            Sidik skema lingkungan itu. Untuk lingkungan tanpa database sendiri,
                            yang dikirim sidik database pusat — karena di sanalah ia tinggal.
                        state:
                          type: string
                          enum: [current, behind, failed, unknown]
                          description: |
                            Satu kata yang dapat dijadikan lencana. `unknown` mencakup dua keadaan
                            yang keduanya bukan "tertinggal": sedang dikerjakan, dan belum pernah
                            punya skema sama sekali.
                        last_operation:
                          type: object
                          nullable: true
                          properties:
                            kind: { type: string }
                            status:
                              type: string
                              enum: [running, succeeded, failed]
                            step: { type: string, nullable: true }
                            reason: { type: string, nullable: true }
                            started_at: { type: string, nullable: true }
                            finished_at: { type: string, nullable: true }
                            requested_by:
                              type: string
                              nullable: true
                              description: Kosong berarti penjadwal, bukan manusia.
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /environments/upgrade:
    post:
      tags: [Pusat admin]
      operationId: internal.fleet.upgrade
      summary: Antrekan pembaruan untuk setiap lingkungan yang tertinggal
      description: |
        Mengantrekan satu job per lingkungan yang **perlu** diperbarui, lalu memulangkan 202
        seketika. Yang sudah mutakhir dilewati: mengantrekan semuanya tiap kali tombolnya ditekan
        berarti dua ratus job yang tidak melakukan apa pun, dan "berapa yang sedang berjalan"
        berhenti terbaca karena angkanya selalu penuh.

        **Kemajuannya dipantau dari daftar operasi, bukan dari balasan ini.** Balasan ini sudah
        ditutup jauh sebelum job pertama selesai. Business Central menyatakan aturan yang sama
        sebagai aturan, dan `GET /fleet` yang menjawabnya.

        Sasarannya dihitung **saat eksekusi**, jadi lingkungan yang lahir semenit sesudah ini
        dipanggil ikut pada panggilan berikutnya tanpa didaftarkan ke mana pun.
      security:
        - controlPlaneToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: |
                    Antrekan juga yang sidiknya sudah sama dengan image. Ada untuk satu keadaan
                    nyata: migration yang isinya diubah tanpa mengubah nama berkasnya — sidiknya
                    tidak bergerak, databasenya tertinggal.
                requested_by:
                  type: integer
                  description: |
                    Id user yang menekan tombolnya, dicatat pada `environment_operations`.
                    Dihilangkan bila id-nya tidak ada sebagai user di sini.
      responses:
        '202':
          description: Job sudah diantrekan. Kosong berarti tidak ada yang perlu diperbarui.
          content:
            application/json:
              schema:
                type: object
                required: [queued, queued_count]
                properties:
                  queued:
                    type: array
                    items: { type: string, format: ulid }
                  queued_count: { type: integer }
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /environments/{environment}/upgrade:
    post:
      tags: [Pusat admin]
      operationId: internal.environments.upgrade
      summary: Antrekan pembaruan untuk satu lingkungan
      description: |
        Sama dengan `POST /environments/upgrade`, dibatasi ke satu baris. Lingkungan yang statusnya
        tidak boleh diperbarui — sedang disiapkan, sedang disalin, sudah diarsipkan — dilewati
        tanpa job, dan `queued_count` nol yang menyebutnya.
      security:
        - controlPlaneToken: []
      parameters:
        - name: environment
          in: path
          required: true
          schema: { type: string, format: ulid }
          description: Id baris `environments` yang diperbarui.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
                requested_by: { type: integer }
      responses:
        '202':
          description: Job sudah diantrekan, atau tidak ada yang perlu dikerjakan.
          content:
            application/json:
              schema:
                type: object
                required: [queued, queued_count]
                properties:
                  queued:
                    type: array
                    items: { type: string, format: ulid }
                  queued_count: { type: integer }
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Lingkungan itu tidak ada di registry, atau sudah diarsipkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    controlPlaneToken:
      type: http
      scheme: bearer
      description: |
        Token bersama yang dipegang pusat admin dan Core (`COREERP_CONTROL_PLANE_TOKEN`).
        Ia menyatakan **proses mana** yang memanggil, bukan operator mana — jejak audit per
        orang tetap harus datang dari sisi konsol. Kosong di sisi Core berarti pemasangan itu
        menolak setiap perintah pusat admin.
    appId:
      type: apiKey
      in: header
      name: X-CoreERP-App-Id
      description: Identitas app pemanggil, mis. `human-resources`.
    serviceToken:
      type: apiKey
      in: header
      name: X-CoreERP-Service-Token
      description: |
        Service credential berbentuk `<credential_id>.<secret>`. Token lama tanpa
        `credential_id` masih diterima tetapi memaksa pemindaian bcrypt per credential;
        terbitkan ulang.
    tenantHeader:
      type: apiKey
      in: header
      name: X-CoreERP-Tenant-Id
      description: |
        Tenant yang menjadi konteks request. Credential yang terikat tenant hanya sah
        untuk tenant itu. Nilai ini adalah **satu-satunya** sumber `tenant_id`; body dan
        query tidak pernah dipercaya.

  parameters:
    SequenceReference:
      name: reference
      in: path
      required: true
      schema: { type: string }
      description: Kode reference number sequence yang dideklarasikan manifest app.
    ReservationId:
      name: reservation
      in: path
      required: true
      schema: { type: string, format: ulid }

  schemas:
    Member:
      type: object
      required: [membership_id, name, email]
      properties:
        membership_id: { type: string, format: ulid }
        name: { type: string }
        email: { type: string, format: email }

    UnitOfMeasure:
      type: object
      required: [id, code, name, symbol, decimal_places]
      properties:
        id: { type: string, format: ulid }
        code: { type: string }
        name: { type: string }
        symbol: { type: [string, 'null'] }
        decimal_places: { type: integer }

    NumberSequenceContext:
      type: object
      description: |
        Scope organisasi permintaan. Keduanya opsional pada tingkat schema karena
        sequence ber-scope tenant tidak memerlukannya, tetapi sequence dengan reset
        fiskal wajib menyertakan `legal_entity_id` — kalender fiskal milik legal entity
        dan tidak pernah milik operating unit.
      properties:
        legal_entity_id: { type: [string, 'null'], format: ulid }
        org_unit_id: { type: [string, 'null'], format: ulid }

    IdempotencyKey:
      type: string
      maxLength: 160
      pattern: '^[A-Za-z0-9._:-]+$'

    IssuedNumber:
      type: object
      required: [id, number, status]
      properties:
        id: { type: string, format: ulid }
        number:
          type: string
          description: Nilai terformat sesuai segmen format sequence.
        status: { const: issued }

    Reservation:
      type: object
      required: [id, number, status, expires_at]
      properties:
        id: { type: string, format: ulid }
        number: { type: string }
        status:
          enum: [reserved, reconciliation_pending, confirmed, cancelled]
        expires_at: { type: [string, 'null'], format: date-time }

    WorkflowInstance:
      type: object
      required: [id, status, source_document_type, source_document_id]
      properties:
        id: { type: string, format: ulid }
        status: { type: string }
        source_document_type: { type: string }
        source_document_id: { type: string, format: ulid }

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Pesan untuk operator app. Tidak pernah memuat data tenant lain.

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Unauthenticated:
      description: Header kredensial atau konteks tenant tidak lengkap.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Credential tidak sah untuk app/tenant ini, entitlement tidak aktif, placement
        belum `ready`, atau endpoint terbatas pada app lain. Keempatnya sengaja tidak
        dibedakan agar pemanggil tidak dapat memetakan keadaan tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ada dalam scope tenant ini.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Field request tidak valid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    RateLimited:
      description: |
        Batas dilampaui. Kuota di-key per pasangan app dan tenant (default 600 request
        per menit, `coreerp.internal_api_rate_limit`), sehingga satu app yang berisik
        tidak dapat menghabiskan kuota app lain.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
