# Berkas hasil `python contracts/bundle.py` dari `contracts/internal/`.
# Jangan diedit tangan: suntingan di sini hilang pada perakitan berikutnya, dan CI menolaknya.
openapi: 3.1.0
info:
  title: CoreERP Control Plane internal API
  version: 1.0.0
  description: |
    Permukaan **app-ke-Core**: seluruh route dengan prefix `/internal/v1`, dipanggil
    aplikasi bisnis dan sistem luar memakai kredensial layanan, bukan session browser.

    Berkas ini **hasil perakitan** dari sumber tulisan tangan di `contracts/internal/`: satu
    berkas per path dan per komponen, dan satu akar per pembaca. Sunting sumbernya, lalu jalankan
    `python contracts/bundle.py` dari `apps/core`; CI menolak berkas hasil yang tidak sama dengan
    sumbernya. Selain berkas gabungan ini, perakit juga menulis satu spesifikasi per pembaca di
    `contracts/terbit/`: satu per domain integrasi (misalnya `integrasi-finance`, terbit di portal
    `/docs`), ditambah `app` dan `pusat-admin`.

    Kontrak ini sengaja terpisah dari `openapi.json`, yang di-generate Scramble dan hanya
    mencakup surface browser Control Plane (`/api/v1`, session cookie). Generator tidak pernah
    memindai prefix ini. Jangan pindahkan isinya ke output generator: kontrak yang dibuat dari
    kode ikut berubah diam-diam saat kodenya berubah.

    Aturan yang mengikat kontrak ini ada pada **Contract decision gate** di
    `.agents/skills/coreerp-architecture/SKILL.md`. Menambah route pada
    `routes/api.php` tanpa menambahkannya di sini adalah perubahan yang belum selesai.

    Tiga jenis pemanggil, masing-masing dengan kredensialnya sendiri:

    - **App module** (`appId` + `serviceToken` + `tenantHeader`), diverifikasi
      `AuthenticateAppService`.
    - **Klien integrasi** (`integrationClient`): sistem di luar CoreERP, misalnya aplikasi
      finance pelanggan yang membaca feed posting. Token `Bearer <client_id>.<secret>` milik satu
      tenant, dengan scope sempit, diverifikasi `AuthenticateIntegrationClient`. Endpoint yang
      menerimanya menyebutnya di `security` beserta scope yang dibutuhkan. Di salinan sandbox
      seluruh endpoint klien integrasi menjawab 503.
    - **Pusat admin** (`controlPlaneToken`): perintah dari konsol operator vendor.

    Batas yang berlaku di seluruh endpoint:

    - `tenant_id` **tidak pernah** diterima dari URL, query, atau body. Ia berasal dari
      header kredensial yang diverifikasi `AuthenticateAppService`, atau dari klien integrasi
      pemilik token.
    - App hanya menerima referensi opaque milik Core. Tidak ada akses database lintas
      module, tidak ada foreign key lintas database.
    - Seluruh response sukses memakai envelope `data`.
servers:
- url: /api/internal/v1
  description: |
    Relatif terhadap host Control Plane. Prefix `/api` ditambahkan Laravel melalui
    `withRouting(api: ...)`, sedangkan `internal/v1` berasal dari grup di
    `routes/api.php` — jadi path lengkapnya `/api/internal/v1/...`, bukan
    `/internal/v1/...`.
security:
- appId: []
  serviceToken: []
  tenantHeader: []
tags:
- name: Directory
  description: Data referensi Core yang boleh dibaca app. Hanya baca.
- name: Human Resources
  description: Sinkronisasi workforce. Terbatas pada app `human-resources`.
- name: Number sequence
  description: Penerbitan nomor dokumen. Counter dimiliki Core, tidak pernah app.
- name: Workflow
  description: Pengajuan workflow. Keputusannya kembali sebagai event, bukan response.
- name: Finance feed
  description: |
    Feed posting finance untuk aplikasi finance pelanggan (docs/todo/feed-posting-finance).
    Hanya klien integrasi; module di dalam CoreERP menerbitkan posting lewat kontrak in-process.
- name: Pusat admin
  description: |
    Perintah dari konsol operator vendor. Satu-satunya tag di berkas ini yang pemanggilnya
    bukan app module, dan karena itu satu-satunya yang tidak memakai kredensial app.
paths:
  /finance-postings:
    get:
      tags:
      - Finance feed
      operationId: internal.finance-postings.index
      summary: Posting finance yang siap dibukukan (mode pull)
      security:
      - integrationClient: []
      description: |
        Scope `finance-postings.read`. Satu endpoint untuk semua jenis posting, dipersempit oleh
        prefix jenis milik klien (`posting_type_prefixes`) sebelum parameter apa pun diterapkan.

        Hanya posting `pending`, urut `posting_date`, lalu jam terbit, lalu id. Posting disajikan
        ulang pada **setiap** pull sampai di-ack lewat `POST /finance-postings/{posting_id}/ack`,
        jadi tidak ada cursor: posting yang sudah di-ack keluar dari daftar dengan sendirinya, dan
        posting yang terbit di tengah pull muncul pada pull berikutnya di tempat urutannya.

        Pembaca wajib menyimpan dengan `UNIQUE(posting_id)`: posting yang sama bisa diterima lebih
        dari sekali, dan menerimanya lagi tidak boleh menghasilkan jurnal kedua. Kode akun, dimensi,
        vendor, atau entitas legal yang tidak dikenal pembaca berarti posting ditolak lewat ack,
        tidak pernah dijurnal ke akun cadangan (K-18).
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
        description: Hanya `pending` yang disajikan. Disediakan supaya URL pembaca dapat menyebutnya.
      - name: posting_type
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          pattern: ^[a-z][a-z0-9_]*(\.[a-z0-9_]+)*(\.\*)?$
        example: asset.*
        description: |
          Saring menurut jenis posting. Kosongkan untuk menerima semua jenis yang diizinkan untuk
          klien Anda; itu cara yang dianjurkan.

          Isi dengan salah satu nilai di bawah, atau prefix yang diakhiri `.*` untuk semua jenis dari
          satu modul, misalnya `asset.*`:

          - `asset.acquisition` — penerimaan aset diselesaikan
          - `asset.acquisition_adjustment` — nilai perolehan dikoreksi
          - `asset.opening_balance` — saldo awal aset lama saat mulai memakai feed
          - `asset.depreciation` — proses "Post penyusutan" satu periode
          - `asset.depreciation_reversal` — penyusutan satu periode dibalik

          Status tiap jenis ada di model `PostingType` dan di bagian **Jenis posting** pada panduan.
      - name: legal_entity
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Kode perusahaan (`company_code`) atau id entitas legal.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Posting yang belum di-ack, dalam urutan pembukuan.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancePosting'
                  meta:
                    type: object
                    required:
                    - count
                    - has_more
                    properties:
                      count:
                        type: integer
                      has_more:
                        type: boolean
                        description: Masih ada posting `pending` sesudah halaman ini. Ack yang ini, lalu
                          pull lagi.
              examples:
                perolehan:
                  summary: Satu penerimaan ambulans, langsung ke hutang
                  value:
                    data:
                    - contract_version: 1
                      posting_id: AST-ACQ-01J9Z3Q7K2M4N6P8R0S2T4V6X8
                      posting_type: asset.acquisition
                      settlement_mode: direct_payable
                      legal_entity:
                        id: 01J9Z2AAAAAAAAAAAAAAAAAAAA
                        code: PT-METTA
                      currency:
                        code: IDR
                        decimals: 2
                      posting_date: '2026-09-28'
                      document_date: '2026-09-28'
                      occurred_at: '2026-09-28T23:50:00+07:00'
                      published_at: '2026-09-28T16:50:04+00:00'
                      source_document:
                        module: management-aset
                        type: penerimaan-aset
                        number: PNA-2026-09-0007
                        description: Penerimaan ambulans
                      vendor:
                        id: 01J9Z2BBBBBBBBBBBBBBBBBBBB
                        number: VND-000123
                        name: PT Karoseri Sehat
                      vendor_invoice_reference: null
                      journal_lines:
                      - line_no: 1
                        account:
                          external_id: '1452'
                          code: 1-2300
                          name: Aset Tetap - Kendaraan
                        debit: '500000000.00'
                        credit: '0.00'
                        description: KEND-0012 Ambulans
                        financial_dimensions:
                        - code: BUSINESS_UNIT
                          display_name: Business unit
                          value_code: KLN-A
                          value_display_name: Klinik Metta A
                          value_id: 01J9Z2CCCCCCCCCCCCCCCCCCCC
                      - line_no: 2
                        account:
                          external_id: '1501'
                          code: 1-1500
                          name: PPN Masukan
                        debit: '55000000.00'
                        credit: '0.00'
                        description: PPN KEND-0012
                        financial_dimensions:
                        - code: BUSINESS_UNIT
                          display_name: Business unit
                          value_code: KLN-A
                          value_display_name: Klinik Metta A
                          value_id: 01J9Z2CCCCCCCCCCCCCCCCCCCC
                      - line_no: 3
                        account:
                          external_id: '2110'
                          code: 2-1100
                          name: Hutang Usaha
                        debit: '0.00'
                        credit: '555000000.00'
                        description: PT Karoseri Sehat
                        financial_dimensions:
                        - code: BUSINESS_UNIT
                          display_name: Business unit
                          value_code: KLN-A
                          value_display_name: Klinik Metta A
                          value_id: 01J9Z2CCCCCCCCCCCCCCCCCCCC
                      totals:
                        debit: '555000000.00'
                        credit: '555000000.00'
                      reverses_posting_id: null
                      adjusts_posting_id: null
                      details:
                        assets:
                        - asset_code: KEND-0012
                          asset_group: KENDARAAN
                          book: KOMERSIAL
                          acquisition_value: '500000000.00'
                          tax_amount: '55000000.00'
                    meta:
                      count: 1
                      has_more: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /finance-postings/{posting_id}/ack:
    post:
      tags:
      - Finance feed
      operationId: internal.finance-postings.ack
      summary: Hasil pembukuan satu posting di aplikasi finance
      security:
      - integrationClient: []
      description: |
        Scope `finance-postings.ack`. `posted` membawa nomor voucher atau faktur di aplikasi
        finance; `rejected` membawa kode alasan dan penjelasannya. Keduanya status akhir.

        Idempoten: ack yang sama diulang (nomor voucher sama, atau kode alasan sama) menjawab 200
        tanpa perubahan. Ack yang bertentangan dengan status akhir, atau ack atas posting yang tidak
        pernah disajikan (ditahan atau manual), menjawab 409. Posting yang ditolak diperbaiki dengan
        posting koreksi di periode yang masih terbuka, tidak diberi tanggal ulang (K-17).

        Posting yang tidak ada, milik tenant lain, atau jenisnya di luar prefix klien menjawab 404.
      parameters:
      - name: posting_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePostingAck'
      responses:
        '200':
          description: Ack diterapkan, atau ack yang sama sudah tercatat.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ack bertentangan dengan status posting. `data` membawa status yang tercatat.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /vendors:
    get:
      tags:
      - Directory
      operationId: internal.vendors.index
      summary: Vendor per entitas legal, untuk tabel penerjemah sistem finance
      security:
      - integrationClient: []
      description: |
        Hanya klien integrasi dengan scope `vendors.read`. Module di dalam CoreERP membaca
        vendor lewat kontrak in-process, bukan lewat rute ini.

        Vendor adalah party di buku alamat yang memegang peran vendor pada satu entitas legal.
        Party yang sama bisa menjadi vendor di beberapa entitas legal, dengan `id` dan `number`
        berbeda di masing-masing. Posting finance menunjuk vendor lewat `id` dan membawa salinan
        `number` serta `name` pada saat terbit.

        Semua status dikembalikan, termasuk `inactive`: posting yang terbit sebelum vendor
        dinonaktifkan tetap menunjuk vendor itu. Dengan `updated_since`, hanya vendor yang
        berubah pada atau sesudah saat itu — vendornya sendiri atau nama party-nya.

        **Halaman dibaca lewat kursor.** Urutannya waktu perubahan lalu `id`. Kirim
        `meta.next_cursor` sebagai `cursor` bersama parameter lain yang sama sampai
        `next_cursor` bernilai `null`. Vendor yang berubah di tengah sinkron pindah ke belakang
        kursor, jadi bisa terbaca dua kali tetapi tidak pernah terlewat; simpan dengan upsert
        berdasarkan `id`.

        Pola sinkron yang disarankan sama dengan `/operating-units`: simpan `updated_at`
        terbesar dari sinkron terakhir, kirim sebagai `updated_since` berikutnya. Batasnya
        inklusif.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      - name: legal_entity
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Kode perusahaan (`company_code`) atau id entitas legal. Kode yang tidak dikenal menghasilkan
          daftar kosong.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: Nilai `meta.next_cursor` dari halaman sebelumnya. Kursor yang tidak dikenal menghasilkan
          422.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      responses:
        '200':
          description: Satu halaman vendor.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vendor'
                  meta:
                    type: object
                    required:
                    - next_cursor
                    properties:
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: '`null` berarti halaman terakhir.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /operating-units:
    get:
      tags:
      - Directory
      operationId: internal.operating-units.index
      summary: Daftar operating unit, beserta nomor dan tipenya
      security:
      - appId: []
        serviceToken: []
        tenantHeader: []
      - integrationClient: []
      description: |
        Dua pemanggil: app `human-resources` (app lain menerima 403), dan klien integrasi dengan
        scope `operating-units.read`. Hanya organisasi dengan klasifikasi `operating_unit`;
        legal entity tidak dikembalikan di sini.

        Tanpa `updated_since`: seluruh operating unit **aktif**. Dengan `updated_since`:
        **setiap** operating unit yang berubah pada atau sesudah saat itu, termasuk yang sudah
        dinonaktifkan (`status` bukan `active`), supaya pembaca yang menyinkronkan tabel
        penerjemahnya tahu unit mana yang berhenti dipakai.

        `number` adalah nomor unit, kode stabil yang dipakai sebagai nilai dimensi keuangan
        `BUSINESS_UNIT` dan `DEPARTMENT` pada feed posting finance. `null` berarti belum diisi.

        Pola sinkron yang disarankan: simpan `updated_at` terbesar dari sinkron terakhir, kirim
        sebagai `updated_since` pada sinkron berikutnya, dan simpan dengan upsert berdasarkan
        `id`. Batasnya inklusif, jadi baris di batas bisa terkirim dua kali. Sinkron penuh tanpa
        `updated_since` sesekali tetap dianjurkan sebagai jaring pengaman.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      responses:
        '200':
          description: Daftar operating unit, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingUnit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /members:
    get:
      tags:
      - Directory
      operationId: internal.members.index
      summary: Cari anggota tenant yang aktif
      description: |
        Terbatas pada app `human-resources`; app lain menerima 403. Hasil dibatasi
        20 baris dan tidak mendukung pagination — ini pencarian pemilih, bukan export.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Cocokkan sebagian nama atau email, tidak peka huruf besar-kecil.
      responses:
        '200':
          description: Daftar anggota aktif.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /members/{membership}:
    get:
      tags:
      - Directory
      operationId: internal.members.show
      summary: Ambil satu anggota tenant
      description: Terbatas pada app `human-resources`. Anggota non-aktif dianggap tidak ada.
      parameters:
      - name: membership
        in: path
        required: true
        schema:
          type: string
          format: ulid
      responses:
        '200':
          description: Anggota ditemukan.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /fiscal-periods:
    get:
      tags:
      - Directory
      operationId: internal.fiscal-periods.resolve
      summary: Tahun buku dan periode yang memuat satu tanggal
      description: |
        Untuk app yang perhitungannya bergantung pada batas tahun buku, misalnya
        penyusutan aset dengan dasar tahun fiskal. Kalender melekat pada legal entity,
        jadi app cukup menyebut legal entity dan tanggal yang ditanyakan.

        Fakta kalender tetap dimiliki Core. App tidak boleh menyalin bulan awal tahun
        buku ke databasenya sendiri, karena salinan itu akan menyimpang saat tenant
        mengubah kalendernya.
      parameters:
      - name: legal_entity_id
        in: query
        required: true
        schema:
          type: string
          format: ulid
      - name: date
        in: query
        required: true
        description: Tanggal yang dicari periodenya, format `YYYY-MM-DD`.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Kalender, tahun buku, dan periode yang memuat tanggal tersebut.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - calendar
                    - year
                    - period
                    properties:
                      calendar:
                        type: object
                        required:
                        - id
                        - code
                        - name
                        properties:
                          id:
                            type: string
                            format: ulid
                          code:
                            type: string
                          name:
                            type: string
                      year:
                        type: object
                        required:
                        - id
                        - name
                        - starts_on
                        - ends_on
                        properties:
                          id:
                            type: string
                            format: ulid
                          name:
                            type: string
                          starts_on:
                            type: string
                            format: date
                          ends_on:
                            type: string
                            format: date
                      period:
                        type: object
                        required:
                        - id
                        - ordinal
                        - name
                        - starts_on
                        - ends_on
                        properties:
                          id:
                            type: string
                            format: ulid
                          ordinal:
                            type: integer
                          name:
                            type: string
                          starts_on:
                            type: string
                            format: date
                          ends_on:
                            type: string
                            format: date
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Legal entity belum punya kalender tahun buku, atau tanggal belum tercakup periodenya.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /units-of-measure:
    get:
      tags:
      - Directory
      operationId: internal.units-of-measure.index
      summary: Daftar satuan aktif tenant
