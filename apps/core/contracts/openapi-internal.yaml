      responses:
        '200':
          description: Daftar satuan, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /units-of-measure/resolve:
    post:
      tags:
      - Directory
      operationId: internal.units-of-measure.resolve
      summary: Resolusi sekumpulan ID satuan
      description: |
        Dipakai app untuk memvalidasi satuan yang disimpannya masih sah. Bersifat
        semua-atau-tidak: satu ID yang tidak ditemukan atau tidak aktif menggagalkan
        seluruh permintaan dengan 422, bukan mengembalikan sebagian hasil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - unit_ids
              properties:
                unit_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    format: ulid
      responses:
        '200':
          description: Seluruh satuan ditemukan dan aktif.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnitOfMeasure'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /units-of-measure/convert:
    post:
      tags:
      - Directory
      operationId: internal.units-of-measure.convert
      summary: Konversi nilai antar satuan
      description: |
        Kedua satuan harus aktif dan berada dalam kelas yang sama. Konversi khusus
        produk (misalnya box-ke-pcs) bukan milik endpoint ini; itu milik PIM/Inventory
        ketika module tersebut memiliki produk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_unit_id
              - to_unit_id
              - value
              properties:
                from_unit_id:
                  type: string
                  format: ulid
                to_unit_id:
                  type: string
                  format: ulid
                  description: Harus berbeda dari `from_unit_id`.
                value:
                  type: string
                  description: Dikirim sebagai string agar presisi desimal tidak hilang.
      responses:
        '200':
          description: Hasil konversi.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - value
                    - unit_id
                    properties:
                      value:
                        type: string
                      unit_id:
                        type: string
                        format: ulid
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Satuan tidak aktif, beda kelas, atau aturan konversi belum dikonfigurasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /human-resources/position-assignments:
    post:
      tags:
      - Human Resources
      operationId: internal.hr.position-assignments.store
      summary: Sinkronkan perubahan penugasan posisi
      description: |
        Terbatas pada app `human-resources`.

        Ini **perintah REST, bukan event**. Ia menyatakan keadaan penugasan saat ini
        dan Core memakainya untuk memateralisasi role otomatis; ia bukan fakta masa
        lalu yang disiarkan. Jangan mencarinya di `asyncapi.yaml`.

        Efeknya idempoten terhadap `assignment_id`: `active: true` membuat atau
        mempertahankan role assignment otomatis untuk setiap rule posisi yang cocok,
        `active: false` mencabutnya. Assignment manual tidak pernah tersentuh.

        Rule role otomatis hanya boleh memakai data policy yang membutuhkan operating
        unit dan tidak membutuhkan legal entity; kombinasi lain ditolak 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - membership_id
              - position_id
              - operating_unit_id
              - assignment_id
              - active
              properties:
                membership_id:
                  type: string
                  format: ulid
                  description: Harus anggota aktif pada tenant yang sama.
                position_id:
                  type: string
                  format: ulid
                operating_unit_id:
                  type: string
                  format: ulid
                  description: Menjadi scope data policy pada role otomatis yang dibuat.
                assignment_id:
                  type: string
                  format: ulid
                  description: Identitas penugasan milik HR; dipakai sebagai kunci pencabutan.
                active:
                  type: boolean
                  description: '`false` mencabut role otomatis yang berasal dari penugasan ini.'
      responses:
        '204':
          description: Sinkronisasi diterima. Tidak ada body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Anggota tidak tersedia, atau rule role otomatis memakai kebijakan data
            yang tidak sah untuk penugasan posisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /number-sequences/{reference}/issue:
    post:
      tags:
      - Number sequence
      operationId: internal.number-sequences.issue
      summary: Terbitkan satu nomor dokumen
      description: |
        Hanya untuk sequence **non-continuous**. Sequence berkelanjutan wajib memakai
        `reserve` lalu `confirm`, karena hanya jalur itu yang menjamin tidak ada lompatan
        nomor; memanggil `issue` padanya menghasilkan 422.

        Pengulangan dengan `idempotency_key` yang sama pada app dan sequence yang sama
        mengembalikan nomor yang sama, bukan nomor kedua.
      parameters:
      - $ref: '#/components/parameters/SequenceReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/NumberSequenceContext'
              - type: object
                required:
                - idempotency_key
                properties:
                  idempotency_key:
                    $ref: '#/components/schemas/IdempotencyKey'
                  manual_value:
                    type:
                    - string
                    - 'null'
                    maxLength: 255
                    description: |
                      Hanya sah bila sequence mengizinkan nilai manual. Sequence
                      berkelanjutan tidak pernah mengizinkannya.
      responses:
        '200':
          description: Nomor diterbitkan, atau pemutaran ulang idempotency key yang sama.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/IssuedNumber'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Sequence berkelanjutan, sequence tidak aktif untuk scope yang dikirim,
            atau field tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /number-sequences/{reference}/reserve:
    post:
      tags:
      - Number sequence
      operationId: internal.number-sequences.reserve
      summary: Pesan nomor untuk sequence berkelanjutan
      description: |
        Hanya untuk sequence **continuous**; sequence non-continuous menghasilkan 422.

        Reservation menahan nomor sampai `confirm` atau `cancel`. Nomor yang dibatalkan
        kembali ke pool dan dapat dipakai transaksi lain, sehingga reservation yang sudah
        dibatalkan tidak pernah diputar ulang oleh idempotency key yang sama.
      parameters:
      - $ref: '#/components/parameters/SequenceReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/NumberSequenceContext'
              - type: object
                required:
                - idempotency_key
                properties:
                  idempotency_key:
                    $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '201':
          description: Nomor dipesan.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Sequence tidak memakai reservation, atau field tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /number-sequence-reservations/{reservation}/confirm:
    post:
      tags:
      - Number sequence
      operationId: internal.number-sequence-reservations.confirm
      summary: Konfirmasi nomor yang dipesan
      description: |
        Dipanggil setelah dokumen app benar-benar tersimpan. Reservation yang sudah
        `confirmed` mengembalikan hasil yang sama tanpa efek tambahan.
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberSequenceContext'
      responses:
        '200':
          description: Reservation dikonfirmasi.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Reservation sudah dibatalkan atau tidak dalam status yang dapat dikonfirmasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /number-sequence-reservations/{reservation}/cancel:
    post:
      tags:
      - Number sequence
      operationId: internal.number-sequence-reservations.cancel
      summary: Batalkan nomor yang dipesan
      description: |
        Mengembalikan nomor ke pool sehingga tidak ada lompatan pada sequence
        berkelanjutan. Reservation yang sudah `cancelled` mengembalikan hasil yang sama.
        Reservation yang sudah dikonfirmasi tidak dapat dibatalkan.
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberSequenceContext'
      responses:
        '200':
          description: Reservation dibatalkan.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Reservation sudah dikonfirmasi dan tidak dapat dibatalkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /workflow-instances:
    post:
      tags:
      - Workflow
      operationId: internal.workflow-instances.store
      summary: Ajukan dokumen ke workflow Core
      description: |
        App mengajukan dokumennya; Core menjalankan konfigurasi workflow milik tenant.

        Keputusannya **tidak** dikembalikan pada response ini. Ia tiba kemudian sebagai
        event `core.workflow.decision.v2` ke endpoint webhook app — lihat
        `contracts/asyncapi.yaml`. Response ini hanya menyatakan pengajuan diterima.

        `workflow_type` harus terdaftar untuk app pemanggil; jenis milik app lain
        menghasilkan 404, bukan 403, agar keberadaan workflow app lain tidak bocor.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
        description: |
          Wajib. Pengulangan dengan kunci yang sama mengembalikan instance yang sama
          dengan status 200 dan header `Idempotent-Replayed: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workflow_type
              - source_document_type
              - source_document_id
              - initiator_membership_id
              - decision_context
              properties:
                workflow_type:
                  type: string
                  maxLength: 120
                  description: Kode `workflow_types` milik app pemanggil.
                source_document_type:
                  type: string
                  maxLength: 120
                  description: Jenis dokumen milik app, mis. `dekomisioning-aset`.
                source_document_id:
                  type: string
                  format: ulid
                legal_entity_id:
                  type:
                  - string
                  - 'null'
                  format: ulid
                  description: |
                    Wajib bila jenis workflow ber-scope `legal_entity`; dikosongkan bila
                    ber-scope `tenant`.
                initiator_membership_id:
                  type: string
                  format: ulid
                  description: Harus anggota aktif pada tenant yang sama.
                decision_context:
                  type: object
                  description: |
                    Konteks keputusan. Field wajibnya ditentukan
                    `decision_context_schema` pada jenis workflow, bukan oleh file ini.
                    Nilainya dikembalikan apa adanya pada event keputusan.
      responses:
        '201':
          description: Workflow instance dibuat.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowInstance'
        '200':
          description: Pemutaran ulang idempotency key yang sama.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowInstance'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Jenis workflow tidak terdaftar untuk app ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Belum ada konfigurasi workflow aktif dan terbit untuk dokumen ini, atau
            permintaan dengan kunci yang sama sedang diproses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Pengaju tidak valid, atau `decision_context` kurang field wajib.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tenants:
    post:
      tags:
      - Pusat admin
      operationId: internal.tenants.store
      summary: Lahirkan tenant beserta admin pertamanya
      description: |
        **Pemanggilnya pusat admin, bukan app module.** Satu-satunya endpoint di berkas ini
        yang tidak memakai kredensial app, dan satu-satunya yang bekerja pada tenant yang
        belum ada — jadi tiga header kredensial itu memang tidak dapat dipakai di sini.
        Penjaganya token bersama pada `Authorization: Bearer`; alasannya di
        `App\Http\Middleware\ControlPlaneOnly`.

        Di belakangnya berjalan `App\Actions\Onboarding\RegisterBusiness` — aksi yang sama
        persis yang dipakai layar pendaftaran mandiri, bukan salinannya. Yang lahir karena
        itu bukan hanya baris `tenants`: client, environment produksi, keanggotaan owner,
        role Owner beserta seluruh duty app yang dibeli, entitlement, satuan bawaan, dan
        pemasangan tiap module yang ada di edisi ini.

        Kata sandi sementara **dibuat Core**, tidak pernah dikirim pemanggil, dan dipulangkan
        **sekali** di balasan ini. Ia tidak dapat dibaca lagi setelahnya; yang tersimpan hanya
        hash-nya. Pemiliknya wajib menggantinya saat masuk pertama — sampai itu terjadi, satu
        satunya halaman yang dapat dicapainya adalah layar ganti kata sandi.

        Nama fieldnya bahasa Indonesia karena pembaca dan penulisnya operator, bukan app.

        Balasannya sengaja **tanpa envelope `data`** — berbeda dari seluruh endpoint lain di
        berkas ini. Aturan envelope itu milik permukaan app-ke-Core; yang ini perintah
        vendor-ke-vendor dengan satu pemanggil yang diketahui namanya.
      security:
      - controlPlaneToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - legal_name
              - admin_name
              - admin_email
              - app_ids
              properties:
                legal_name:
                  type: string
                  maxLength: 255
                  description: |
                    Nama pelanggan — perusahaan atau grupnya. Menjadi nama tenant dan dasar
                    slug-nya, dan slug itulah yang muncul sebagai label pertama pada alamat
                    lingkungannya.

                    **Bukan** nama badan hukum tertentu: satu tenant boleh memuat beberapa badan
                    hukum sekaligus, dan masing-masing didaftarkan di dalam ERP sebagai organisasi
                    berjenis legal entity, lengkap dengan kode perusahaan dan kode negaranya.
                first_environment:
                  type: string
                  enum:
                  - production
                  - demo
                  - none
                  default: production
                  description: |
                    Jenis tempat kerja pertama tenant ini.

                    Bawaannya `production`, dan itu yang dipakai pendaftaran mandiri: orang yang
                    mendaftar sendiri memang datang untuk bekerja. Operator yang melahirkan tenant
                    bagi calon pelanggan biasanya memilih `demo` — produksi yang terlanjur lahir
                    adalah tempat kerja kosong yang tidak pernah dipakai siapa pun sekaligus alamat
                    yang sudah terpakai.

                    `none` melahirkan tenant tanpa satu pun lingkungan. Entitlement-nya tetap
                    tercatat, jadi lingkungan yang dibuat kemudian memasang module yang sama persis.
                first_environment_expires_at:
                  type: string
                  format: date
                  description: |
                    Tanggal berakhir, **wajib bila `first_environment` bernilai `demo`** dan
                    diabaikan selainnya. Demo tanpa tanggal berakhir tinggal selamanya, dan tidak
                    ada yang menyadarinya sampai disknya penuh.
                first_environment_hosting:
                  type: string
                  enum:
                  - provider
                  - client_server
                  default: provider
                  description: |
                    Tempat lingkungan pertama berjalan.

                    `provider` — di server kami, persis seperti sebelum field ini ada.

                    `client_server` — produksi tenant ini dipasang di server milik klien lewat satu
                    perintah pasang dari admin.erp. **Hanya sah bersama `first_environment`
                    `production`** (atau tanpa `first_environment`, yang berarti produksi); selainnya
                    ditolak 422 pada field ini. Lingkungannya lahir dengan `hosting = client_server`
                    dan status `provisioning` — belum berjalan sampai perintah pasangnya dijalankan —
                    tanpa database di server ini, dan tanpa satu pun module terpasang di sini.
                    Entitlement app-nya tetap tercatat; dari situlah edisi paketnya diturunkan.

                    Core di server ini tidak pernah merutekan, menyiapkan, menyalin, memperbarui,
                    atau memasang module ke lingkungan seperti itu: alamatnya dijawab 404, dan
                    perintah atas lingkungan itu ditolak 409.
                admin_name:
                  type: string
                  maxLength: 255
                  description: Nama orang yang menjadi owner pertama tenant ini.
                admin_email:
                  type: string
                  format: email
                  maxLength: 255
                  description: |
                    Dirapikan menjadi huruf kecil sebelum diperiksa, lalu wajib belum terdaftar.
                    Email yang sudah punya akun ditolak 422 — sampai "satu orang banyak tenant"
                    dikerjakan, tidak ada jalur menambahkan orang yang sudah punya akun ke tenant
                    kedua.
                app_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                  description: |
                    App yang dibeli pelanggan. Tiap id wajib ada di katalog dengan status
                    `available`; app yang belum tersedia ditolak 422. Prerequisite transitifnya
                    ikut ditambahkan sendiri oleh graph dependency.
      responses:
        '201':
          description: Tenant lahir. `temporary_password` hanya muncul di sini, sekali.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenant_id
                - environment_id
                - email
                - temporary_password
                properties:
                  tenant_id:
                    type: string
                    format: ulid
                  environment_id:
                    type: string
                    format: ulid
                    description: Environment `production` pertama tenant ini.
                  email:
                    type: string
                    format: email
                  temporary_password:
                    type: string
                    description: Dibuat Core, tidak dapat dibaca lagi setelah balasan ini.
        '401':
          description: |
            Token pusat admin salah, tidak dikirim, atau pemasangan ini memang tidak menyetel
            token sama sekali — dan yang terakhir juga 401, bukan terbuka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Email sudah terdaftar, app tidak tersedia, field wajib kurang, atau
            `first_environment_hosting` `client_server` bersama jenis selain produksi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tenants/{tenant}/entitlements:
    get:
      tags:
      - Pusat admin
      operationId: internal.tenants.entitlements.show
      summary: App yang sedang berhak dipakai sebuah tenant
      description: |
        Dibaca pusat admin saat menerbitkan **lisensi situs versi 2**: daftar `apps` di lisensi
        disalin dari jawaban ini. `tenant_app_entitlements` milik Core, jadi pusat admin bertanya
        ke sini alih-alih menyimpan salinannya sendiri — salinan yang menyimpang pada hari pertama
        seseorang menambah app lewat Core. Rencananya di `docs/todo/lisensi-mengunci`.

        **Sedang berhak** berarti ketiganya sekaligus: `status` `active`, `starts_at` kosong atau
        tidak di masa depan, dan `ends_at` kosong atau di masa depan. Status saja tidak cukup: hak
        yang berakhir kemarin masih berstatus `active` sampai ada yang mengubahnya.

        `tenant` di URL tidak melanggar aturan "`tenant_id` tidak pernah dari URL" di kepala berkas
        ini: aturan itu milik permukaan app-ke-Core, dan pemanggil ini pusat admin yang memang
        bekerja pada banyak tenant. Balasannya tanpa envelope `data`, dengan alasan yang sama
        seperti `/tenants`.

        **Kegagalan endpoint ini tidak boleh menggagalkan laporan agen** di sisi pusat admin:
        laporan tetap diterima dan penerbitan lisensi dicoba lagi setelah jeda.
      security:
      - controlPlaneToken: []
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: ulid
        description: Id baris `tenants`.
      responses:
        '200':
          description: Hak app tenant itu saat ini. Daftar kosong sah — tenant yang hanya memakai Core.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenant_id
                - apps
                properties:
                  tenant_id:
                    type: string
                    format: ulid
                  apps:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      pattern: ^[a-z0-9][a-z0-9-]*$
                    description: |
                      Id app, unik dan terurut naik. Bentuknya sama dengan yang diterima pembaca
                      lisensi di Core; id lain membuat lisensi yang memuatnya ditolak seluruhnya.
              example:
                tenant_id: 01j9zq3v6n8m2k4h7g5f3d1c0b
                apps:
                - human-resources
                - management-aset
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant itu tidak ada di Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /environments/{environment}/provision:
    post:
      tags:
      - Pusat admin
      operationId: internal.environments.provision
      summary: Siapkan database sebuah lingkungan, lalu pasang module yang dibeli tenantnya
      description: |
        **Pemanggilnya pusat admin, bukan app module** — penjaganya token bersama yang sama
        dengan `/tenants`.

        Di belakangnya berjalan `environment:provision`, dan urutannya menentukan: database
        dibuat, seluruh migration Core dijalankan ke dalamnya, `database_name` dicatat,
        **lalu** tiap module yang dibeli tenantnya dipasang beserta data awalnya. Statusnya
        naik ke `active` sesudah semuanya — lingkungan yang setengah terisi harus menjadi
        tempat yang tidak dapat dimasuki, bukan tempat yang dimasuki lalu ternyata separuh.

        **Sinkron, dan itu keputusan.** Ia menjalankan migration sungguhan dan dapat memakan
        puluhan detik; pemanggil wajib memberi tenggat yang jauh lebih longgar daripada
        endpoint lain di berkas ini. Sambungan yang putus tidak membatalkan apa pun di sisi
        Core — perintahnya berjalan sampai selesai.

        **Aman diulang.** Nama database dihitung dari baris yang sama, "database sudah ada"
        diperlakukan berhasil, dan migration yang sudah teraplikasi dilewati sendiri. Panggilan
        kedua yang datang selagi yang pertama masih berjalan ditolak oleh kunci operasinya,
        bukan dilayani sebagai penyiapan kedua di atas yang pertama.

        Balasannya tanpa envelope `data`, dengan alasan yang sama seperti `/tenants`.
      security:
      - controlPlaneToken: []
      parameters:
      - name: environment
        in: path
        required: true
        schema:
          type: string
          format: ulid
        description: Id baris `environments` yang disiapkan.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_by:
                  type: integer
                  description: |
                    Id user yang menekan tombolnya. Tercatat pada `environment_operations` supaya
                    kolom "Oleh" di layar riwayat menyebut orangnya. Dihilangkan bila id-nya tidak
                    ada sebagai user di sini — kolomnya berkunci asing, dan id yang tidak ada akan
                    menjatuhkan penyiapannya demi sebuah nama. Kosong berarti riwayatnya berbunyi
                    "Sistem", persis seperti perintah yang diketik di terminal.
      responses:
        '200':
          description: Lingkungan disiapkan dan aktif.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - database
                - modules
                properties:
                  status:
                    type: string
                    description: Status barisnya sesudah penyiapan; `active` bila berhasil.
                  database:
                    type: string
                    nullable: true
                    description: Nama database yang kini dipakai lingkungan ini.
                  modules:
                    type: array
                    description: |
                      Dibaca dari database lingkungan itu, bukan disimpulkan dari entitlement
                      tenantnya. Kosong bila tenantnya tidak membeli satu pun module yang ada
                      di edisi ini — atau bila daftarnya tidak terbaca, yang sengaja tidak
                      menggagalkan penyiapan yang sudah berhasil.
                    items:
                      type: object
                      required:
                      - id
                      - version
                      - status
                      - seeded
                      properties:
                        id:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                          enum:
                          - installed
                          - disabled
                          - uninstalled
                        seeded:
                          type: boolean
                          description: Data awal module ini sudah pernah diisi.
                  output:
                    type: string
                    description: Keluaran mentah perintahnya, untuk ditempel ke laporan.
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Lingkungan itu tidak ada di registry, atau sudah dihapus lunak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Statusnya bukan `provisioning` maupun `degraded`. Menyiapkan ulang lingkungan yang
            sudah hidup akan menimpa isinya, jadi ia ditolak — dan ini keadaan yang dapat
            berubah sendiri sebelum orangnya menekan tombol, bukan permintaan yang salah bentuk.

            Atau lingkungan itu berjalan di server klien (`hosting = client_server`): database
            dan isinya ada di sana, bukan di server ini, dan penyiapannya dikerjakan perintah
            pasang. Ditolak apa pun statusnya — produksi server klien memang lahir `provisioning`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Penyiapannya berjalan dan gagal. Lingkungannya turun ke `degraded`, dan `message`
            memuat alasan yang tercatat di `environment_operations` — bukan keluaran perintahnya,
            karena yang tercatat itulah yang masih dapat dibaca besok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /fleet:
    get:
      tags:
      - Pusat admin
      operationId: internal.fleet.index
      summary: Keadaan seluruh armada dalam satu jawaban
      description: |
        Versi tiap lingkungan dibandingkan terhadap versi image yang sedang berjalan, beserta
        operasi terakhirnya. **Pemanggilnya pusat admin**, dan penjaganya token bersama yang sama
        dengan endpoint pusat admin lainnya.

        Satu panggilan, bukan satu per lingkungan, karena yang dibaca layar adalah
        **perbandingannya** — dan versi image adalah pengetahuan Core, diturunkan dari isi folder
        migration yang tidak ada di container konsol.

        **Ia tidak membuka satu pun database lingkungan.** Seluruh isinya dibaca dari tabel sisi
        pusat: `environments` menyimpan sidik skema tiap lingkungan, `environment_operations`
        menyimpan riwayatnya. Daftar module per lingkungan memang menuntut database lingkungannya,
        dan karena itu ia tinggal di layar rincian satu lingkungan — bukan di sini.

        **Lingkungan yang berjalan di server klien tidak ikut.** Armada ini adalah yang dijalankan
        server ini; server klien diperbarui agennya dengan paket edisinya sendiri, dan sidiknya
        tidak dapat dibandingkan dengan image di sini.
      security:
      - controlPlaneToken: []
      responses:
        '200':
          description: Keadaan armada.
          content:
            application/json:
              schema:
                type: object
                required:
                - platform_fingerprint
                - counts
                - environments
                properties:
                  platform_fingerprint:
                    type: string
                    description: |
                      Nama berkas migration terakhir di dalam image yang sedang berjalan. Inilah
                      "boleh naik ke mana", dan ia dikirim sekali di kepala jawaban karena
                      jawabannya cuma satu untuk seluruh armada.
                  counts:
                    type: object
                    description: Hitungan per keadaan, untuk kepala halaman.
                    properties:
                      current:
                        type: integer
                      behind:
                        type: integer
                      failed:
                        type: integer
                      unknown:
                        type: integer
                  environments:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - tenant
                      - name
                      - slug
                      - kind
                      - status
                      - database
                      - fingerprint
                      - state
                      - last_operation
                      properties:
                        id:
                          type: string
                          format: ulid
                        tenant:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        kind:
                          type: string
                          enum:
                          - production
                          - sandbox
                          - demo
                        status:
                          type: string
                        database:
                          type: string
                          nullable: true
                          description: Kosong berarti lingkungan ini tinggal di database pusat.
                        fingerprint:
                          type: string
                          nullable: true
                          description: |
                            Sidik skema lingkungan itu. Untuk lingkungan tanpa database sendiri,
                            yang dikirim sidik database pusat — karena di sanalah ia tinggal.
                        state:
                          type: string
                          enum:
                          - current
                          - behind
                          - failed
                          - unknown
                          description: |
                            Satu kata yang dapat dijadikan lencana. `unknown` mencakup dua keadaan
                            yang keduanya bukan "tertinggal": sedang dikerjakan, dan belum pernah
                            punya skema sama sekali.
                        last_operation:
                          type: object
                          nullable: true
                          properties:
                            kind:
                              type: string
                            status:
                              type: string
                              enum:
                              - running
                              - succeeded
                              - failed
                            step:
                              type: string
                              nullable: true
                            reason:
                              type: string
                              nullable: true
                            started_at:
                              type: string
                              nullable: true
                            finished_at:
                              type: string
                              nullable: true
                            requested_by:
                              type: string
                              nullable: true
                              description: Kosong berarti penjadwal, bukan manusia.
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /environments/upgrade:
    post:
      tags:
      - Pusat admin
      operationId: internal.fleet.upgrade
      summary: Antrekan pembaruan untuk setiap lingkungan yang tertinggal
      description: |
        Mengantrekan satu job per lingkungan yang **perlu** diperbarui, lalu memulangkan 202
        seketika. Yang sudah mutakhir dilewati: mengantrekan semuanya tiap kali tombolnya ditekan
        berarti dua ratus job yang tidak melakukan apa pun, dan "berapa yang sedang berjalan"
        berhenti terbaca karena angkanya selalu penuh.

        **Kemajuannya dipantau dari daftar operasi, bukan dari balasan ini.** Balasan ini sudah
        ditutup jauh sebelum job pertama selesai. Business Central menyatakan aturan yang sama
        sebagai aturan, dan `GET /fleet` yang menjawabnya.

        Sasarannya dihitung **saat eksekusi**, jadi lingkungan yang lahir semenit sesudah ini
        dipanggil ikut pada panggilan berikutnya tanpa didaftarkan ke mana pun.
      security:
      - controlPlaneToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: |
                    Antrekan juga yang sidiknya sudah sama dengan image. Ada untuk satu keadaan
                    nyata: migration yang isinya diubah tanpa mengubah nama berkasnya — sidiknya
                    tidak bergerak, databasenya tertinggal.
                requested_by:
                  type: integer
                  description: |
                    Id user yang menekan tombolnya, dicatat pada `environment_operations`.
                    Dihilangkan bila id-nya tidak ada sebagai user di sini.
      responses:
        '202':
          description: Job sudah diantrekan. Kosong berarti tidak ada yang perlu diperbarui.
          content:
            application/json:
              schema:
                type: object
                required:
                - queued
                - queued_count
                properties:
                  queued:
                    type: array
                    items:
                      type: string
                      format: ulid
                  queued_count:
                    type: integer
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /environments/{environment}/upgrade:
    post:
      tags:
      - Pusat admin
      operationId: internal.environments.upgrade
      summary: Antrekan pembaruan untuk satu lingkungan
      description: |
        Sama dengan `POST /environments/upgrade`, dibatasi ke satu baris. Lingkungan yang statusnya
        tidak boleh diperbarui — sedang disiapkan, sedang disalin, sudah diarsipkan — dilewati
        tanpa job, dan `queued_count` nol yang menyebutnya.

        Lingkungan yang berjalan di server klien tidak dilewati diam-diam melainkan ditolak 409:
        ia disebut dengan id-nya, dan jawaban kosong akan terbaca seperti pembaruan yang tidak
        perlu.
      security:
      - controlPlaneToken: []
      parameters:
      - name: environment
        in: path
        required: true
        schema:
          type: string
          format: ulid
        description: Id baris `environments` yang diperbarui.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                requested_by:
                  type: integer
      responses:
        '202':
          description: Job sudah diantrekan, atau tidak ada yang perlu dikerjakan.
          content:
            application/json:
              schema:
                type: object
                required:
                - queued
                - queued_count
                properties:
                  queued:
                    type: array
                    items:
                      type: string
                      format: ulid
                  queued_count:
                    type: integer
        '401':
          description: Token pusat admin salah, tidak dikirim, atau memang tidak disetel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Lingkungan itu tidak ada di registry, atau sudah diarsipkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Lingkungan itu berjalan di server klien. Pembaruannya dikerjakan agen di server itu,
            bukan rilis server ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
webhooks:
  financePosting:
    post:
      tags:
      - Finance feed
      operationId: webhook.finance-posting
      summary: Posting finance yang dikirim ke klien mode push
      description: |
        CoreERP mengirim setiap posting `pending` ke `push_url` klien integrasi mode push, dengan
        body yang sama persis dengan satu elemen `data` pada `GET /finance-postings`. Urutannya sama
        dengan urutan pull, per klien.

        **Signature.** `X-CoreERP-Event-Signature` adalah HMAC-SHA256 heksadesimal atas
        `<X-CoreERP-Event-Timestamp>.<raw body>`, dengan signing secret klien sebagai key. Pembaca
        wajib memverifikasinya dan menolak timestamp yang terlalu jauh dari jamnya sendiri.
        `X-CoreERP-Client-Id` menyebut klien, untuk pembaca yang melayani beberapa tenant.

        **Jawaban.** 2xx dihitung terkirim; bila body-nya `FinancePostingAck` yang sah, ack itu
        diterapkan seperti `POST /finance-postings/{posting_id}/ack`, dan bila tidak, posting tetap
        `pending` sampai di-ack lewat API. 408, 429, 5xx, atau tidak menjawab: dikirim ulang dengan
        jeda 1, 2, 4, … sampai 60 menit, selama `coreerp.finance_push_retry_hours` (bawaan 24 jam).
        4xx lain dan 3xx (redirect tidak diikuti): ditandai gagal kirim dan tampil di layar pantau,
        tempat pengguna dapat mengirimnya ulang setelah penyebabnya diperbaiki. Pembaca tetap wajib
        menjaga `UNIQUE(posting_id)`, karena kiriman ulang bisa terjadi.
      parameters:
      - name: X-CoreERP-Event-Timestamp
        in: header
        required: true
        description: Detik Unix saat dikirim.
        schema:
          type: string
      - name: X-CoreERP-Event-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: X-CoreERP-Client-Id
        in: header
        required: true
        schema:
          type: string
          format: ulid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePosting'
      responses:
        '200':
          description: Diterima. Body opsional; bila berupa ack yang sah, posting berstatus akhir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePostingAck'
components:
  securitySchemes:
    integrationClient:
      type: http
      scheme: bearer
      description: |
        Token klien integrasi berbentuk `<client_id>.<secret>`, diterbitkan admin tenant di
        Identity & access › Klien integrasi dan ditampilkan sekali. Token menentukan tenant;
        header tenant yang dikirim bersamanya diabaikan. Klien yang dicabut, alamat asal di luar
        allowlist, atau scope yang kurang ditolak. Rate limit per klien
        (`coreerp.integration_api_rate_limit`, bawaan 120 per menit).
    appId:
      type: apiKey
      in: header
      name: X-CoreERP-App-Id
      description: Identitas app pemanggil, mis. `human-resources`.
    serviceToken:
      type: apiKey
      in: header
      name: X-CoreERP-Service-Token
      description: |
        Service credential berbentuk `<credential_id>.<secret>`. Token lama tanpa
        `credential_id` masih diterima tetapi memaksa pemindaian bcrypt per credential;
        terbitkan ulang.
    tenantHeader:
      type: apiKey
      in: header
      name: X-CoreERP-Tenant-Id
      description: |
        Tenant yang menjadi konteks request. Credential yang terikat tenant hanya sah
        untuk tenant itu. Nilai ini adalah **satu-satunya** sumber `tenant_id`; body dan
        query tidak pernah dipercaya.
    controlPlaneToken:
      type: http
      scheme: bearer
      description: |
        Token bersama yang dipegang pusat admin dan Core (`COREERP_CONTROL_PLANE_TOKEN`).
        Ia menyatakan **proses mana** yang memanggil, bukan operator mana — jejak audit per
        orang tetap harus datang dari sisi konsol. Kosong di sisi Core berarti pemasangan itu
        menolak setiap perintah pusat admin.
  parameters:
    ReservationId:
      name: reservation
      in: path
      required: true
      schema:
        type: string
        format: ulid
    SequenceReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
      description: Kode reference number sequence yang dideklarasikan manifest app.
  responses:
    Forbidden:
      description: |
        Credential tidak sah untuk app/tenant ini, entitlement tidak aktif, placement
        belum `ready`, atau endpoint terbatas pada app lain. Keempatnya sengaja tidak
        dibedakan agar pemanggil tidak dapat memetakan keadaan tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ada dalam scope tenant ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OutboundRefused:
      description: |
        Salinan non-produksi (sandbox atau demo) tidak menyajikan data ke sistem luar. Tanpa
        penolakan ini, salinan produksi akan menyajikan posting yang dibukukan finance produksi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        Batas dilampaui. Kuota di-key per pasangan app dan tenant (default 600 request
        per menit, `coreerp.internal_api_rate_limit`), sehingga satu app yang berisik
        tidak dapat menghabiskan kuota app lain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Header kredensial atau konteks tenant tidak lengkap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Field request tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Pesan untuk operator app. Tidak pernah memuat data tenant lain.
    FinancePosting:
      type: object
      additionalProperties: false
      required:
      - contract_version
      - posting_id
      - posting_type
      - settlement_mode
      - legal_entity
      - currency
      - posting_date
      - document_date
      - occurred_at
      - published_at
      - source_document
      - vendor
      - vendor_invoice_reference
      - journal_lines
      - totals
      - reverses_posting_id
      - adjusts_posting_id
      - details
      description: |
        Satu dokumen sumber dengan jurnal yang seimbang. Bentuk yang sama dipakai mode pull dan
        mode push (`webhooks.financePosting`).
      properties:
        contract_version:
          type: integer
          enum:
          - 1
        posting_id:
          type: string
          maxLength: 120
          description: Tetap untuk satu dokumen sumber. Pembaca wajib menjaga `UNIQUE(posting_id)`.
        posting_type:
          $ref: '#/components/schemas/PostingType'
        settlement_mode:
          type:
          - string
          - 'null'
          enum:
          - direct_payable
          - clearing
          - null
          description: Kebijakan jurnal perolehan (K-10). Koreksi selalu membawa mode posting aslinya.
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        currency:
          type: object
          additionalProperties: false
          required:
          - code
          - decimals
          properties:
            code:
              type: string
              pattern: ^[A-Z]{3}$
            decimals:
              type: integer
              minimum: 0
              maximum: 4
              description: Jumlah desimal setiap nilai uang di posting ini.
        posting_date:
          type: string
          format: date
          description: Tanggal akuntansi, dari dokumen.
        document_date:
          type: string
          format: date
        occurred_at:
          type: string
          format: date-time
          description: Jam kejadian dengan offset zona waktu (K-21).
        published_at:
          type: string
          format: date-time
          description: Jam posting terbit di CoreERP, dengan offset.
        source_document:
          type: object
          additionalProperties: false
          required:
          - module
          - type
          - number
          - description
          properties:
            module:
              type: string
            type:
              type: string
            number:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        vendor:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - id
          - number
          - name
          description: Vendor disalin saat terbit; sinkronkan tabel penerjemahnya dari `/vendors`.
          properties:
            id:
              type: string
              format: ulid
            number:
              type: string
              maxLength: 40
            name:
              type: string
        vendor_invoice_reference:
          type:
          - string
          - 'null'
          maxLength: 80
        journal_lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'
        totals:
          type: object
          additionalProperties: false
          required:
          - debit
          - credit
          description: Selalu sama; jurnal yang tidak seimbang tidak pernah terbit.
          properties:
            debit:
              $ref: '#/components/schemas/Money'
            credit:
              $ref: '#/components/schemas/Money'
        reverses_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dibalik posting ini.'
        adjusts_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dikoreksi posting ini.'
        details:
          type: object
          description: Informasi untuk pelacakan dan laporan, misalnya rincian per aset. Pembaca tidak
            boleh menjurnal dari sini.
    FinancePostingAck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - posted
          - rejected
        external_reference:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Wajib untuk `posted`. Nomor voucher atau faktur di aplikasi finance.
        reason_code:
          type:
          - string
          - 'null'
          enum:
          - PERIOD_CLOSED
          - UNKNOWN_ACCOUNT
          - UNKNOWN_DIMENSION
          - UNKNOWN_VENDOR
          - UNKNOWN_LEGAL_ENTITY
          - INVALID
          - null
          description: Wajib untuk `rejected`.
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Wajib untuk `rejected`.
    FinancePostingAckResult:
      type: object
      additionalProperties: false
      required:
      - posting_id
      - status
      - external_reference
      - reason_code
      - reason
      - acknowledged_at
      properties:
        posting_id:
          type: string
        status:
          type: string
          enum:
          - held
          - pending
          - posted
          - rejected
          - manual
        external_reference:
          type:
          - string
          - 'null'
        reason_code:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
    FinancialDimension:
      type: object
      additionalProperties: false
      required:
      - code
      - display_name
      - value_code
      - value_display_name
      - value_id
      description: |
        Sejajar dengan `dimensionSetLines` Business Central (K-07). Akun neraca membawa
        `BUSINESS_UNIT`; akun laba rugi membawa `BUSINESS_UNIT` dan `DEPARTMENT` (K-09). Nilai
        disalin pada saat terbit. Kode dimensi yang tidak dikenal pembaca berarti posting ditolak
        dengan `UNKNOWN_DIMENSION`.
      properties:
        code:
          type: string
          description: '`BUSINESS_UNIT` atau `DEPARTMENT`.'
        display_name:
          type: string
        value_code:
          type: string
          maxLength: 30
          description: Nomor operating unit (lihat `/operating-units`).
        value_display_name:
          type: string
        value_id:
          type: string
          format: ulid
          description: Id operating unit.
    IdempotencyKey:
      type: string
      maxLength: 160
      pattern: ^[A-Za-z0-9._:-]+$
    IssuedNumber:
      type: object
      required:
      - id
      - number
      - status
      properties:
        id:
          type: string
          format: ulid
        number:
          type: string
          description: Nilai terformat sesuai segmen format sequence.
        status:
          const: issued
    JournalLine:
      type: object
      additionalProperties: false
      required:
      - line_no
      - account
      - debit
      - credit
      - description
      - financial_dimensions
      description: Tepat satu dari `debit` dan `credit` bernilai lebih dari nol.
      properties:
        line_no:
          type: integer
          minimum: 1
        account:
          type: object
          additionalProperties: false
          required:
          - external_id
          - code
          - name
          description: Akun di aplikasi finance, disalin saat terbit. Pembaca mencocokkan lewat `external_id`.
          properties:
            external_id:
              type: string
              maxLength: 64
            code:
              type: string
              maxLength: 50
            name:
              type: string
              maxLength: 200
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
          maxLength: 255
        financial_dimensions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDimension'
    Member:
      type: object
      required:
      - membership_id
      - name
      - email
      properties:
        membership_id:
          type: string
          format: ulid
        name:
          type: string
        email:
          type: string
          format: email
    Money:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)?$
      description: |
        Nilai uang sebagai string desimal tanpa tanda dan tanpa pemisah ribuan, dengan jumlah
        desimal **persis** `currency.decimals` (`"500000000.00"` untuk 2, `"500000000"` untuk 0).
        Tidak pernah float (K-20).
    NumberSequenceContext:
      type: object
      description: |
        Scope organisasi permintaan. Keduanya opsional pada tingkat schema karena
        sequence ber-scope tenant tidak memerlukannya, tetapi sequence dengan reset
        fiskal wajib menyertakan `legal_entity_id` — kalender fiskal milik legal entity
        dan tidak pernah milik operating unit.
      properties:
        legal_entity_id:
          type:
          - string
          - 'null'
          format: ulid
        org_unit_id:
          type:
          - string
          - 'null'
          format: ulid
    OperatingUnit:
      type: object
      required:
      - id
      - name
      - type
      - number
      - status
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        name:
          type: string
        type:
          type:
          - string
          - 'null'
          description: |
            Tipe operating unit dari setelan `coreerp.operating_unit_types`, misalnya
            `business_unit` atau `department`. Daftar tipe dapat bertambah; pembaca harus
            menerima nilai yang belum dikenalnya.
        number:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^[A-Z0-9]+(-[A-Z0-9]+)*$
          description: |
            Nomor unit, unik per tenant. Boleh diganti; posting yang sudah terbit menyimpan
            nomor pada saat terbit.
        status:
          type: string
          description: '`active` atau status nonaktif lain.'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Waktu perubahan terakhir, dari nama maupun nomor dan tipe.
    PostingType:
      type: string
      maxLength: 80
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      description: |
        Jenis posting, berbentuk `<modul>.<peristiwa>`: modul yang menerbitkan posting dan peristiwa
        yang membuatnya terbit.

        | Nilai | Terbit saat | Tersedia |
        | --- | --- | --- |
        | `asset.acquisition` | Penerimaan aset diselesaikan | Belum |
        | `asset.acquisition_adjustment` | Nilai perolehan dikoreksi | Belum |
        | `asset.opening_balance` | Saldo awal aset lama saat mulai memakai feed | Belum |
        | `asset.depreciation` | Proses "Post penyusutan" satu periode | Belum |
        | `asset.depreciation_reversal` | Penyusutan satu periode dibalik | Belum |

        **Tersedia** menyebut apakah modul penerbitnya sudah menerbitkan jenis itu. Selama semuanya
        masih *Belum*, feed tidak berisi posting apa pun.

        Daftar ini terbuka: jenis baru dapat ditambahkan, misalnya dari modul lain, tanpa versi kontrak
        baru. Jenis yang belum dikenal aplikasi Anda ditolak lewat ack dengan kode `INVALID`, tidak
        diabaikan.
      examples:
      - asset.acquisition
      - asset.acquisition_adjustment
      - asset.opening_balance
      - asset.depreciation
      - asset.depreciation_reversal
    Reservation:
      type: object
      required:
      - id
      - number
      - status
      - expires_at
      properties:
        id:
          type: string
          format: ulid
        number:
          type: string
        status:
          enum:
          - reserved
          - reconciliation_pending
          - confirmed
          - cancelled
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    UnitOfMeasure:
      type: object
      required:
      - id
      - code
      - name
      - symbol
      - decimal_places
      properties:
        id:
          type: string
          format: ulid
        code:
          type: string
        name:
          type: string
        symbol:
          type:
          - string
          - 'null'
        decimal_places:
          type: integer
    ValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Vendor:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - name
      - party_type
      - tax_number
      - status
      - legal_entity
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        number:
          type: string
          maxLength: 40
          description: |
            Nomor vendor, unik per entitas legal dan tidak pernah berubah. Diterbitkan urutan
            nomor Core (bawaan `VND-000001`) atau diketik manual saat memindahkan pemasok lama.
        name:
          type: string
          maxLength: 200
          description: Nama party saat ini.
        party_type:
          type: string
          enum:
          - organization
          - person
        tax_number:
          type:
          - string
          - 'null'
          maxLength: 32
          description: NPWP, bila diisi.
        status:
          type: string
          enum:
          - active
          - inactive
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        updated_at:
          type: string
          format: date-time
          description: Waktu perubahan terakhir, dari vendor maupun nama party-nya.
    WorkflowInstance:
      type: object
      required:
      - id
      - status
      - source_document_type
      - source_document_id
      properties:
        id:
          type: string
          format: ulid
        status:
          type: string
        source_document_type:
          type: string
        source_document_id:
          type: string
          format: ulid
