  /finance-postings/{posting_id}/ack:
    post:
      tags:
      - Finance feed
      operationId: internal.finance-postings.ack
      summary: Hasil pembukuan satu posting di aplikasi finance
      security:
      - integrationClient: []
      description: |
        Scope `finance-postings.ack`. `posted` membawa nomor voucher atau faktur di aplikasi
        finance; `rejected` membawa kode alasan dan penjelasannya. Keduanya status akhir.

        Idempoten: ack yang sama diulang (nomor voucher sama, atau kode alasan sama) menjawab 200
        tanpa perubahan. Ack yang bertentangan dengan status akhir, atau ack atas posting yang tidak
        pernah disajikan (ditahan atau manual), menjawab 409. Posting yang ditolak diperbaiki dengan
        posting koreksi di periode yang masih terbuka, tidak diberi tanggal ulang (K-17).

        Posting yang tidak ada, milik tenant lain, atau jenisnya di luar prefix klien menjawab 404.
      parameters:
      - name: posting_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePostingAck'
      responses:
        '200':
          description: Ack diterapkan, atau ack yang sama sudah tercatat.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ack bertentangan dengan status posting. `data` membawa status yang tercatat.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /vendors:
    get:
      tags:
      - Directory
      operationId: internal.vendors.index
      summary: Vendor per entitas legal, untuk tabel penerjemah sistem finance
      security:
      - integrationClient: []
      description: |
        Hanya klien integrasi dengan scope `vendors.read`. Module di dalam CoreERP membaca
        vendor lewat kontrak in-process, bukan lewat rute ini.

        Vendor adalah party di buku alamat yang memegang peran vendor pada satu entitas legal.
        Party yang sama bisa menjadi vendor di beberapa entitas legal, dengan `id` dan `number`
        berbeda di masing-masing. Posting finance menunjuk vendor lewat `id` dan membawa salinan
        `number` serta `name` pada saat terbit.

        Semua status dikembalikan, termasuk `inactive`: posting yang terbit sebelum vendor
        dinonaktifkan tetap menunjuk vendor itu. Dengan `updated_since`, hanya vendor yang
        berubah pada atau sesudah saat itu — vendornya sendiri atau nama party-nya.

        **Halaman dibaca lewat kursor.** Urutannya waktu perubahan lalu `id`. Kirim
        `meta.next_cursor` sebagai `cursor` bersama parameter lain yang sama sampai
        `next_cursor` bernilai `null`. Vendor yang berubah di tengah sinkron pindah ke belakang
        kursor, jadi bisa terbaca dua kali tetapi tidak pernah terlewat; simpan dengan upsert
        berdasarkan `id`.

        Pola sinkron yang disarankan sama dengan `/operating-units`: simpan `updated_at`
        terbesar dari sinkron terakhir, kirim sebagai `updated_since` berikutnya. Batasnya
        inklusif.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      - name: legal_entity
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Kode perusahaan (`company_code`) atau id entitas legal. Kode yang tidak dikenal menghasilkan
          daftar kosong.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: Nilai `meta.next_cursor` dari halaman sebelumnya. Kursor yang tidak dikenal menghasilkan
          422.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      responses:
        '200':
          description: Satu halaman vendor.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vendor'
                  meta:
                    type: object
                    required:
                    - next_cursor
                    properties:
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: '`null` berarti halaman terakhir.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /operating-units:
    get:
      tags:
      - Directory
      operationId: internal.operating-units.index
      summary: Daftar operating unit, beserta nomor dan tipenya
      security:
      - integrationClient: []
      description: |
        Dua pemanggil: app `human-resources` (app lain menerima 403), dan klien integrasi dengan
        scope `operating-units.read`. Hanya organisasi dengan klasifikasi `operating_unit`;
        legal entity tidak dikembalikan di sini.

        Tanpa `updated_since`: seluruh operating unit **aktif**. Dengan `updated_since`:
        **setiap** operating unit yang berubah pada atau sesudah saat itu, termasuk yang sudah
        dinonaktifkan (`status` bukan `active`), supaya pembaca yang menyinkronkan tabel
        penerjemahnya tahu unit mana yang berhenti dipakai.

        `number` adalah nomor unit, kode stabil yang dipakai sebagai nilai dimensi keuangan
        `BUSINESS_UNIT` dan `DEPARTMENT` pada feed posting finance. `null` berarti belum diisi.

        Pola sinkron yang disarankan: simpan `updated_at` terbesar dari sinkron terakhir, kirim
        sebagai `updated_since` pada sinkron berikutnya, dan simpan dengan upsert berdasarkan
        `id`. Batasnya inklusif, jadi baris di batas bisa terkirim dua kali. Sinkron penuh tanpa
        `updated_since` sesekali tetap dianjurkan sebagai jaring pengaman.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      responses:
        '200':
          description: Daftar operating unit, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingUnit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
webhooks:
  financePosting:
    post:
      tags:
      - Finance feed
      operationId: webhook.finance-posting
      summary: Posting finance yang dikirim ke klien mode push
      description: |
        CoreERP mengirim setiap posting `pending` ke `push_url` klien integrasi mode push, dengan
        body yang sama persis dengan satu elemen `data` pada `GET /finance-postings`. Urutannya sama
        dengan urutan pull, per klien.

        **Signature.** `X-CoreERP-Event-Signature` adalah HMAC-SHA256 heksadesimal atas
        `<X-CoreERP-Event-Timestamp>.<raw body>`, dengan signing secret klien sebagai key. Pembaca
        wajib memverifikasinya dan menolak timestamp yang terlalu jauh dari jamnya sendiri.
        `X-CoreERP-Client-Id` menyebut klien, untuk pembaca yang melayani beberapa tenant.

        **Jawaban.** 2xx dihitung terkirim; bila body-nya `FinancePostingAck` yang sah, ack itu
        diterapkan seperti `POST /finance-postings/{posting_id}/ack`, dan bila tidak, posting tetap
        `pending` sampai di-ack lewat API. 408, 429, 5xx, atau tidak menjawab: dikirim ulang dengan
        jeda 1, 2, 4, … sampai 60 menit, selama `coreerp.finance_push_retry_hours` (bawaan 24 jam).
        4xx lain dan 3xx (redirect tidak diikuti): ditandai gagal kirim dan tampil di layar pantau.
        Pembaca tetap wajib menjaga `UNIQUE(posting_id)`, karena kiriman ulang bisa terjadi.
      parameters:
      - name: X-CoreERP-Event-Timestamp
        in: header
        required: true
        description: Detik Unix saat dikirim.
        schema:
          type: string
      - name: X-CoreERP-Event-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: X-CoreERP-Client-Id
        in: header
        required: true
        schema:
          type: string
          format: ulid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePosting'
      responses:
        '200':
          description: Diterima. Body opsional; bila berupa ack yang sah, posting berstatus akhir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePostingAck'
components:
  securitySchemes:
    integrationClient:
      type: http
      scheme: bearer
      description: |
        Token klien integrasi berbentuk `<client_id>.<secret>`, diterbitkan admin tenant di
        Identity & access › Klien integrasi dan ditampilkan sekali. Token menentukan tenant;
        header tenant yang dikirim bersamanya diabaikan. Klien yang dicabut, alamat asal di luar
        allowlist, atau scope yang kurang ditolak. Rate limit per klien
        (`coreerp.integration_api_rate_limit`, bawaan 120 per menit).
  responses:
    Forbidden:
      description: |
        Credential tidak sah untuk app/tenant ini, entitlement tidak aktif, placement
        belum `ready`, atau endpoint terbatas pada app lain. Keempatnya sengaja tidak
        dibedakan agar pemanggil tidak dapat memetakan keadaan tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ada dalam scope tenant ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OutboundRefused:
      description: |
        Salinan non-produksi (sandbox atau demo) tidak menyajikan data ke sistem luar. Tanpa
        penolakan ini, salinan produksi akan menyajikan posting yang dibukukan finance produksi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        Batas dilampaui. Kuota di-key per pasangan app dan tenant (default 600 request
        per menit, `coreerp.internal_api_rate_limit`), sehingga satu app yang berisik
        tidak dapat menghabiskan kuota app lain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Header kredensial atau konteks tenant tidak lengkap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Field request tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Pesan untuk operator app. Tidak pernah memuat data tenant lain.
    FinancePosting:
      type: object
      additionalProperties: false
      required:
      - contract_version
      - posting_id
      - posting_type
      - settlement_mode
      - legal_entity
      - currency
      - posting_date
      - document_date
      - occurred_at
      - published_at
      - source_document
      - vendor
      - vendor_invoice_reference
      - journal_lines
      - totals
      - reverses_posting_id
      - adjusts_posting_id
      - details
      description: |
        Satu dokumen sumber dengan jurnal yang seimbang. Bentuk yang sama dipakai mode pull dan
        mode push (`webhooks.financePosting`).
      properties:
        contract_version:
          type: integer
          enum:
          - 1
        posting_id:
          type: string
          maxLength: 120
          description: Tetap untuk satu dokumen sumber. Pembaca wajib menjaga `UNIQUE(posting_id)`.
        posting_type:
          $ref: '#/components/schemas/PostingType'
        settlement_mode:
          type:
          - string
          - 'null'
          enum:
          - direct_payable
          - clearing
          - null
          description: Kebijakan jurnal perolehan (K-10). Koreksi selalu membawa mode posting aslinya.
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        currency:
          type: object
          additionalProperties: false
          required:
          - code
          - decimals
          properties:
            code:
              type: string
              pattern: ^[A-Z]{3}$
            decimals:
              type: integer
              minimum: 0
              maximum: 4
              description: Jumlah desimal setiap nilai uang di posting ini.
        posting_date:
          type: string
          format: date
          description: Tanggal akuntansi, dari dokumen.
        document_date:
          type: string
          format: date
        occurred_at:
          type: string
          format: date-time
          description: Jam kejadian dengan offset zona waktu (K-21).
        published_at:
          type: string
          format: date-time
          description: Jam posting terbit di CoreERP, dengan offset.
        source_document:
          type: object
          additionalProperties: false
          required:
          - module
          - type
          - number
          - description
          properties:
            module:
              type: string
            type:
              type: string
            number:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        vendor:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - id
          - number
          - name
          description: Vendor disalin saat terbit; sinkronkan tabel penerjemahnya dari `/vendors`.
          properties:
            id:
              type: string
              format: ulid
            number:
              type: string
              maxLength: 40
            name:
              type: string
        vendor_invoice_reference:
          type:
          - string
          - 'null'
          maxLength: 80
        journal_lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'
        totals:
          type: object
          additionalProperties: false
          required:
          - debit
          - credit
          description: Selalu sama; jurnal yang tidak seimbang tidak pernah terbit.
          properties:
            debit:
              $ref: '#/components/schemas/Money'
            credit:
              $ref: '#/components/schemas/Money'
        reverses_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dibalik posting ini.'
        adjusts_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dikoreksi posting ini.'
        details:
          type: object
          description: Informasi untuk pelacakan dan laporan, misalnya rincian per aset. Pembaca tidak
            boleh menjurnal dari sini.
    FinancePostingAck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - posted
          - rejected
        external_reference:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Wajib untuk `posted`. Nomor voucher atau faktur di aplikasi finance.
        reason_code:
          type:
          - string
          - 'null'
          enum:
          - PERIOD_CLOSED
          - UNKNOWN_ACCOUNT
          - UNKNOWN_DIMENSION
          - UNKNOWN_VENDOR
          - UNKNOWN_LEGAL_ENTITY
          - INVALID
          - null
          description: Wajib untuk `rejected`.
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Wajib untuk `rejected`.
    FinancePostingAckResult:
      type: object
      additionalProperties: false
      required:
      - posting_id
      - status
      - external_reference
      - reason_code
      - reason
      - acknowledged_at
      properties:
        posting_id:
          type: string
        status:
          type: string
          enum:
          - held
          - pending
          - posted
          - rejected
          - manual
        external_reference:
          type:
          - string
          - 'null'
        reason_code:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
    FinancialDimension:
      type: object
      additionalProperties: false
      required:
      - code
      - display_name
      - value_code
      - value_display_name
      - value_id
      description: |
        Sejajar dengan `dimensionSetLines` Business Central (K-07). Akun neraca membawa
        `BUSINESS_UNIT`; akun laba rugi membawa `BUSINESS_UNIT` dan `DEPARTMENT` (K-09). Nilai
        disalin pada saat terbit. Kode dimensi yang tidak dikenal pembaca berarti posting ditolak
        dengan `UNKNOWN_DIMENSION`.
      properties:
        code:
          type: string
          description: '`BUSINESS_UNIT` atau `DEPARTMENT`.'
        display_name:
          type: string
        value_code:
          type: string
          maxLength: 30
          description: Nomor operating unit (lihat `/operating-units`).
        value_display_name:
          type: string
        value_id:
          type: string
          format: ulid
          description: Id operating unit.
    JournalLine:
      type: object
      additionalProperties: false
      required:
      - line_no
      - account
      - debit
      - credit
      - description
      - financial_dimensions
      description: Tepat satu dari `debit` dan `credit` bernilai lebih dari nol.
      properties:
        line_no:
          type: integer
          minimum: 1
        account:
          type: object
          additionalProperties: false
          required:
          - external_id
          - code
          - name
          description: Akun di aplikasi finance, disalin saat terbit. Pembaca mencocokkan lewat `external_id`.
          properties:
            external_id:
              type: string
              maxLength: 64
            code:
              type: string
              maxLength: 50
            name:
              type: string
              maxLength: 200
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
          maxLength: 255
        financial_dimensions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDimension'
    Money:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)?$
      description: |
        Nilai uang sebagai string desimal tanpa tanda dan tanpa pemisah ribuan, dengan jumlah
        desimal **persis** `currency.decimals` (`"500000000.00"` untuk 2, `"500000000"` untuk 0).
        Tidak pernah float (K-20).
    OperatingUnit:
      type: object
      required:
      - id
      - name
      - type
      - number
      - status
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        name:
          type: string
        type:
          type:
          - string
          - 'null'
          description: |
            Tipe operating unit dari setelan `coreerp.operating_unit_types`, misalnya
            `business_unit` atau `department`. Daftar tipe dapat bertambah; pembaca harus
            menerima nilai yang belum dikenalnya.
        number:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^[A-Z0-9]+(-[A-Z0-9]+)*$
          description: |
            Nomor unit, unik per tenant. Boleh diganti; posting yang sudah terbit menyimpan
            nomor pada saat terbit.
        status:
          type: string
          description: '`active` atau status nonaktif lain.'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Waktu perubahan terakhir, dari nama maupun nomor dan tipe.
    PostingType:
      type: string
      maxLength: 80
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      description: |
        Jenis posting, berbentuk `<modul>.<peristiwa>`: modul yang menerbitkan posting dan peristiwa
        yang membuatnya terbit.

        | Nilai | Terbit saat | Tersedia |
        | --- | --- | --- |
        | `asset.acquisition` | Penerimaan aset diselesaikan | Sudah |
        | `asset.acquisition_adjustment` | Nilai perolehan dikoreksi | Belum |
        | `asset.opening_balance` | Saldo awal aset lama saat mulai memakai feed | Sudah |
        | `asset.depreciation` | Proses "Post penyusutan" satu periode | Sudah |
        | `asset.depreciation_reversal` | Penyusutan satu periode dibalik | Sudah |

        **Tersedia** menyebut apakah modul penerbitnya sudah menerbitkan jenis itu. Jenis bertanda
        *Belum* tidak pernah muncul di feed sampai modulnya menerbitkannya.

        Daftar ini terbuka: jenis baru dapat ditambahkan, misalnya dari modul lain, tanpa versi kontrak
        baru. Jenis yang belum dikenal aplikasi Anda ditolak lewat ack dengan kode `INVALID`, tidak
        diabaikan.
      examples:
      - asset.acquisition
      - asset.acquisition_adjustment
      - asset.opening_balance
      - asset.depreciation
      - asset.depreciation_reversal
    ValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Vendor:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - name
      - party_type
      - tax_number
      - status
      - legal_entity
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        number:
          type: string
          maxLength: 40
          description: |
            Nomor vendor, unik per entitas legal dan tidak pernah berubah. Diterbitkan urutan
            nomor Core (bawaan `VND-000001`) atau diketik manual saat memindahkan pemasok lama.
        name:
          type: string
          maxLength: 200
          description: Nama party saat ini.
        party_type:
          type: string
          enum:
          - organization
          - person
        tax_number:
          type:
          - string
          - 'null'
          maxLength: 32
          description: NPWP, bila diisi.
        status:
          type: string
          enum:
          - active
          - inactive
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        updated_at:
          type: string
          format: date-time
          description: Waktu perubahan terakhir, dari vendor maupun nama party-nya.
