  /finance-postings/{posting_id}/ack:
    post:
      tags:
      - Finance feed
      operationId: internal.finance-postings.ack
      summary: Hasil pembukuan satu posting di aplikasi finance
      security:
      - integrationClient: []
      description: |
        Scope `finance-postings.ack`. `posted` membawa nomor voucher atau faktur di aplikasi
        finance; `rejected` membawa kode alasan dan penjelasannya. Keduanya status akhir.

        Idempoten: ack yang sama diulang menjawab 200 tanpa perubahan, dan `data` membawa ack yang
        tercatat pertama kali, termasuk `acknowledged_at`-nya. "Sama" berarti:

        - `posted` dengan `external_reference` yang sama. Spasi di awal dan akhir dibuang sebelum
          dibandingkan dan disimpan, jadi `"  JV-2026-0001  "` sama dengan `"JV-2026-0001"`.
        - `rejected` dengan `reason_code` yang sama. Teks `reason` **tidak** ikut dibandingkan: ack
          ulang dengan `reason` berbeda tetap dijawab 200, dan teks yang tersimpan tidak diganti.

        Ack yang bertentangan dengan status akhir (nomor voucher lain, kode alasan lain, atau status
        lain), atau ack atas posting yang tidak pernah disajikan (`held` atau `manual`), menjawab 409.
        Posting yang ditolak diperbaiki dengan posting koreksi di periode yang masih terbuka, tidak
        diberi tanggal ulang (K-17).

        Pada `rejected`, `external_reference` yang ikut dikirim diabaikan dan tidak disimpan.

        Ack tidak harus dikirim klien yang melakukan pull atau menerima push. Klien mana pun di tenant
        yang sama dengan scope `finance-postings.ack`, dan yang prefix jenisnya mencakup posting itu,
        boleh mengirimnya.

        **Urutan pemeriksaan.** Rate limit (`429`), token (`401`), allowlist IP dan scope (`403`),
        salinan sandbox (`503`), lalu posting dicari (`404`), baru body divalidasi (`422`). Posting
        yang tidak ada, milik tenant lain, atau jenisnya di luar prefix klien menjawab 404 walaupun
        body-nya juga tidak sah.

        Teks `message` pada `409` dan `422` hanya untuk dibaca orang dan tidak dijamin tetap. Baca
        `data.status` pada `409`, dan kunci `errors` pada `422`.
      parameters:
      - name: posting_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePostingAck'
      responses:
        '200':
          description: Ack diterapkan, atau ack yang sama sudah tercatat.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '401':
          $ref: '#/components/responses/IntegrationUnauthenticated'
        '403':
          $ref: '#/components/responses/IntegrationForbidden'
        '404':
          description: |
            Posting tidak ada, milik tenant lain, atau jenisnya di luar prefix klien. Ketiganya
            sengaja tidak dibedakan. Dijawab sebelum body divalidasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Posting tidak ditemukan.
        '409':
          description: Ack bertentangan dengan status posting. `data` membawa status yang tercatat.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - data
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/FinancePostingAckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/IntegrationRateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /vendors:
    get:
      tags:
      - Directory
      operationId: internal.vendors.index
      summary: Vendor per entitas legal, untuk tabel penerjemah sistem finance
      security:
      - integrationClient: []
      description: |
        Hanya klien integrasi dengan scope `vendors.read`. Module di dalam CoreERP membaca
        vendor lewat kontrak in-process, bukan lewat rute ini.

        Vendor adalah party di buku alamat yang memegang peran vendor pada satu entitas legal.
        Party yang sama bisa menjadi vendor di beberapa entitas legal, dengan `id` dan `number`
        berbeda di masing-masing. Posting finance menunjuk vendor lewat `id` dan membawa salinan
        `number` serta `name` pada saat terbit.

        Semua status dikembalikan, termasuk `inactive`: posting yang terbit sebelum vendor
        dinonaktifkan tetap menunjuk vendor itu. Dengan `updated_since`, hanya vendor yang
        berubah pada atau sesudah saat itu — vendornya sendiri atau nama party-nya.

        **Halaman dibaca lewat kursor.** Urutannya waktu perubahan lalu `id`. Kirim
        `meta.next_cursor` sebagai `cursor` bersama parameter lain yang sama sampai
        `next_cursor` bernilai `null`. Vendor yang berubah di tengah sinkron pindah ke belakang
        kursor, jadi bisa terbaca dua kali tetapi tidak pernah terlewat; simpan dengan upsert
        berdasarkan `id`.

        Pola sinkron yang disarankan sama dengan `/operating-units`: simpan `updated_at`
        terbesar dari sinkron terakhir, kirim sebagai `updated_since` berikutnya. Batasnya
        inklusif.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      - name: legal_entity
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Kode perusahaan (`company_code`) atau id entitas legal. Kode yang tidak dikenal menghasilkan
          daftar kosong.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: Nilai `meta.next_cursor` dari halaman sebelumnya. Kursor yang tidak dikenal menghasilkan
          422.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      responses:
        '200':
          description: Satu halaman vendor.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vendor'
                  meta:
                    type: object
                    required:
                    - next_cursor
                    properties:
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: '`null` berarti halaman terakhir.'
        '401':
          $ref: '#/components/responses/IntegrationUnauthenticated'
        '403':
          $ref: '#/components/responses/IntegrationForbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/IntegrationRateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
  /operating-units:
    get:
      tags:
      - Directory
      operationId: internal.operating-units.index
      summary: Daftar operating unit, beserta nomor dan tipenya
      security:
      - integrationClient: []
      description: |
        Dua pemanggil: app `human-resources` (app lain menerima 403), dan klien integrasi dengan
        scope `operating-units.read`. Hanya organisasi dengan klasifikasi `operating_unit`;
        legal entity tidak dikembalikan di sini.

        Tanpa `updated_since`: seluruh operating unit **aktif**. Dengan `updated_since`:
        **setiap** operating unit yang berubah pada atau sesudah saat itu, termasuk yang sudah
        dinonaktifkan (`status` bukan `active`), supaya pembaca yang menyinkronkan tabel
        penerjemahnya tahu unit mana yang berhenti dipakai.

        `number` adalah nomor unit, kode stabil yang dipakai sebagai nilai dimensi keuangan
        `BUSINESS_UNIT` dan `DEPARTMENT` pada feed posting finance. `null` berarti belum diisi.

        Pola sinkron yang disarankan: simpan `updated_at` terbesar dari sinkron terakhir, kirim
        sebagai `updated_since` pada sinkron berikutnya, dan simpan dengan upsert berdasarkan
        `id`. Batasnya inklusif, jadi baris di batas bisa terkirim dua kali. Sinkron penuh tanpa
        `updated_since` sesekali tetap dianjurkan sebagai jaring pengaman.
      parameters:
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Waktu dengan offset zona waktu, misalnya `2026-09-22T10:00:00+07:00`.
      responses:
        '200':
          description: Daftar operating unit, diurutkan menurut nama.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperatingUnit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/OutboundRefused'
webhooks:
  financePosting:
    post:
      tags:
      - Finance feed
      operationId: webhook.finance-posting
      summary: Posting finance yang dikirim ke klien mode push
      description: |
        CoreERP mengirim setiap posting `pending` ke `push_url` klien integrasi mode push sebagai
        `POST` dengan `Content-Type: application/json` dan `Accept: application/json`. Satu kiriman
        berisi satu posting.

        **Body.** Nilai JSON-nya sama dengan satu elemen `data` pada `GET /finance-postings`, tetapi
        byte-nya tidak: body push menulis `/` dan karakter non-ASCII (misalnya `·`) apa adanya,
        sedangkan pull menulisnya sebagai `\/` dan `\u00b7`. Urutan kunci di dalam posting juga tidak
        dijamin. Bandingkan push dan pull sebagai nilai JSON, bukan sebagai teks.

        **Signature.** `X-CoreERP-Event-Signature` adalah HMAC-SHA256 heksadesimal huruf kecil atas
        `<X-CoreERP-Event-Timestamp>.<raw body>`, dengan signing secret klien sebagai key. Hitung
        atas **raw body persis seperti yang diterima**, sebelum di-parse; body yang di-parse lalu
        dikodekan ulang menghasilkan byte lain dan signature yang tidak cocok. Pembaca wajib
        memverifikasinya dan menolak timestamp yang terlalu jauh dari jamnya sendiri.
        `X-CoreERP-Client-Id` menyebut klien, untuk pembaca yang melayani beberapa tenant.

        Contoh yang dapat diulang di bahasa apa pun: signing secret `rahasia-uji`, timestamp
        `1790614204`, dan raw body `{"posting_id":"AST-ACQ-0001"}` menghasilkan signature
        `c63f1fa7160d6ec490501632bbecebaad1703ad834154f6a5c6ec8463b4e32ee`.

        **Batas waktu.** Sambungan 3 detik, jawaban 10 detik. Waktu yang habis diperlakukan seperti
        tidak terjangkau, jadi dicoba lagi. Redirect tidak diikuti.

        **Tujuan.** `push_url` wajib `https://`. Di layanan SaaS, alamat yang menunjuk jaringan
        privat ditolak saat akan mengirim (alamatnya diperiksa ulang setiap kali), dan kiriman itu
        langsung ditandai gagal tanpa dicoba lagi. CoreERP di server pelanggan boleh mengirim ke
        jaringan privat.

        **Jawaban.**

        | Jawaban Anda | Yang dilakukan CoreERP |
        | --- | --- |
        | `2xx` apa pun (termasuk `201`, `202`, `204`) dengan body `FinancePostingAck` yang sah | Terkirim, dan ack diterapkan seperti `POST /finance-postings/{posting_id}/ack` atas nama klien ini |
        | `2xx` apa pun tanpa body, atau dengan body yang bukan ack sah (misalnya bukan JSON, atau `posted` tanpa `external_reference`) | Terkirim tanpa ack. Posting tetap `pending` sampai di-ack lewat API. Tidak ada kesalahan yang dilaporkan ke Anda |
        | `408`, `429`, `5xx`, sambungan gagal, atau waktu habis | Dicoba lagi dengan jeda 1, 2, 4, 8, 16, 32, lalu 60 menit setiap kali, sampai 24 jam sejak percobaan pertama. Sesudahnya ditandai gagal |
        | `3xx` dan `4xx` lain | Ditandai gagal kirim, tidak dicoba lagi, dan tampil di layar pantau CoreERP |

        **Urutan.** Urutan kirim per klien sama dengan urutan pull. Selama satu posting menunggu
        jeda percobaan ulang, posting sesudahnya tidak dikirim ke klien itu; klien lain tidak ikut
        tertahan. Posting yang sudah ditandai gagal tidak menahan antrean.

        Pembaca tetap wajib menjaga `UNIQUE(posting_id)`, karena kiriman ulang bisa terjadi.
      parameters:
      - name: X-CoreERP-Event-Timestamp
        in: header
        required: true
        description: Detik Unix saat dikirim, sebagai teks angka.
        schema:
          type: string
          pattern: ^[0-9]+$
          example: '1790614204'
      - name: X-CoreERP-Event-Signature
        in: header
        required: true
        description: HMAC-SHA256 heksadesimal huruf kecil atas `<timestamp>.<raw body>`.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: X-CoreERP-Client-Id
        in: header
        required: true
        schema:
          type: string
          format: ulid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancePosting'
      responses:
        2XX:
          description: |
            Terkirim. Kode 2xx apa pun dihitung sama, termasuk `204` tanpa body. Bila body-nya
            `FinancePostingAck` yang sah, posting berstatus akhir; body lain diabaikan tanpa pemberitahuan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancePostingAck'
        '408':
          description: Dicoba lagi dengan jeda yang sama seperti `5XX`.
        '429':
          description: Dicoba lagi dengan jeda yang sama seperti `5XX`.
        5XX:
          description: Dicoba lagi dengan jeda 1, 2, 4, 8, 16, 32, lalu 60 menit, sampai 24 jam sejak
            percobaan pertama.
        default:
          description: '`3xx` dan `4xx` lain: ditandai gagal kirim dan tidak dicoba lagi. Redirect tidak
            diikuti.'
components:
  securitySchemes:
    integrationClient:
      type: http
      scheme: bearer
      description: |
        Token klien integrasi berbentuk `<client_id>.<secret>`, diterbitkan admin tenant di
        Identity & access › Klien integrasi dan ditampilkan sekali. Token menentukan tenant;
        header tenant yang dikirim bersamanya diabaikan. Klien yang dicabut, alamat asal di luar
        allowlist, atau scope yang kurang ditolak. Rate limit per klien
        (`coreerp.integration_api_rate_limit`, bawaan 120 per menit).
  headers:
    RateLimitLimit:
      description: Jatah permintaan per menit untuk klien ini.
      schema:
        type: integer
        example: 120
    RateLimitRemaining:
      description: Sisa jatah pada menit berjalan. `0` pada jawaban `429`.
      schema:
        type: integer
        example: 119
    RetryAfter:
      description: Detik sampai jatah pulih. Tunggu selama itu sebelum mengirim permintaan berikutnya.
      schema:
        type: integer
        example: 60
  responses:
    Forbidden:
      description: |
        Credential tidak sah untuk app/tenant ini, entitlement tidak aktif, placement
        belum `ready`, atau endpoint terbatas pada app lain. Keempatnya sengaja tidak
        dibedakan agar pemanggil tidak dapat memetakan keadaan tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IntegrationForbidden:
      description: |
        Token sah, tetapi permintaan ditolak. Pemeriksaannya berurutan, dan yang pertama gagal yang
        menjawab:

        1. Alamat asal di luar allowlist IP klien.
        2. Scope yang dibutuhkan endpoint ini tidak dimiliki klien. `message` menyebut scope-nya.

        Allowlist diperiksa lebih dulu dari scope, dan keduanya lebih dulu dari penolakan salinan
        sandbox (`503`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            allowlist:
              summary: Alamat asal di luar allowlist
              value:
                message: Alamat asal permintaan tidak termasuk alamat yang diizinkan untuk klien integrasi
                  ini.
            scope:
              summary: Scope kurang (contoh pada pull)
              value:
                message: Klien integrasi ini tidak punya izin finance-postings.read.
    IntegrationRateLimited:
      description: |
        Rate limit terlampaui. Jatahnya 120 permintaan per menit **per klien integrasi**, dihitung dari
        `client_id` di depan token, bukan per alamat IP: klien lain dari alamat yang sama tidak ikut
        terbatas. Permintaan tanpa token dihitung per alamat IP.

        Satu jatah dipakai bersama oleh `GET /finance-postings`, `POST /finance-postings/{posting_id}/ack`,
        dan `GET /vendors`. Permintaan yang ditolak dengan `404` atau `422` tetap menghabiskan jatah.
        Rate limit diperiksa sebelum token, jadi jawaban `429` bisa datang lebih dulu dari `401`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.
    IntegrationUnauthenticated:
      description: |
        Token klien integrasi tidak dikirim, tidak berbentuk `<client_id>.<secret>`, secret-nya salah,
        atau kliennya sudah dicabut. Keempatnya dijawab dengan pesan yang sama dan sengaja tidak
        dibedakan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Token klien integrasi tidak sah atau sudah dicabut.
    OutboundRefused:
      description: |
        Salinan non-produksi (sandbox atau demo) tidak menyajikan data ke sistem luar. Tanpa
        penolakan ini, salinan produksi akan menyajikan posting yang dibukukan finance produksi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        Batas dilampaui. Kuota di-key per pasangan app dan tenant (default 600 request
        per menit, `coreerp.internal_api_rate_limit`), sehingga satu app yang berisik
        tidak dapat menghabiskan kuota app lain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Header kredensial atau konteks tenant tidak lengkap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Field request tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Pesan untuk operator app. Tidak pernah memuat data tenant lain.
    FinancePosting:
      type: object
      additionalProperties: false
      required:
      - contract_version
      - posting_id
      - posting_type
      - settlement_mode
      - legal_entity
      - currency
      - posting_date
      - document_date
      - occurred_at
      - published_at
      - source_document
      - vendor
      - vendor_invoice_reference
      - journal_lines
      - totals
      - reverses_posting_id
      - adjusts_posting_id
      - details
      description: |
        Satu dokumen sumber dengan jurnal yang seimbang. Bentuk yang sama dipakai mode pull dan
        mode push (`webhooks.financePosting`).

        Urutan kunci di dalam objek ini tidak dijamin dan tidak mengikuti urutan properti di bawah.
        Pull dan push membawa nilai yang sama, tetapi byte body push tidak sama dengan teks pull.
      properties:
        contract_version:
          type: integer
          enum:
          - 1
        posting_id:
          type: string
          maxLength: 120
          description: Tetap untuk satu dokumen sumber. Pembaca wajib menjaga `UNIQUE(posting_id)`.
        posting_type:
          $ref: '#/components/schemas/PostingType'
        settlement_mode:
          type:
          - string
          - 'null'
          enum:
          - direct_payable
          - clearing
          - null
          description: Kebijakan jurnal perolehan (K-10). Koreksi selalu membawa mode posting aslinya.
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        currency:
          type: object
          additionalProperties: false
          required:
          - code
          - decimals
          properties:
            code:
              type: string
              pattern: ^[A-Z]{3}$
            decimals:
              type: integer
              minimum: 0
              maximum: 4
              description: Jumlah desimal setiap nilai uang di posting ini.
        posting_date:
          type: string
          format: date
          description: Tanggal akuntansi, dari dokumen.
        document_date:
          type: string
          format: date
        occurred_at:
          type: string
          format: date-time
          description: Jam kejadian dengan offset zona waktu (K-21).
        published_at:
          type: string
          format: date-time
          description: Jam posting terbit di CoreERP, dengan offset.
        source_document:
          type: object
          additionalProperties: false
          required:
          - module
          - type
          - number
          - description
          properties:
            module:
              type: string
            type:
              type: string
            number:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        vendor:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - id
          - number
          - name
          description: Vendor disalin saat terbit; sinkronkan tabel penerjemahnya dari `/vendors`.
          properties:
            id:
              type: string
              format: ulid
            number:
              type: string
              maxLength: 40
            name:
              type: string
        vendor_invoice_reference:
          type:
          - string
          - 'null'
          maxLength: 80
        journal_lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'
        totals:
          type: object
          additionalProperties: false
          required:
          - debit
          - credit
          description: Selalu sama; jurnal yang tidak seimbang tidak pernah terbit.
          properties:
            debit:
              $ref: '#/components/schemas/Money'
            credit:
              $ref: '#/components/schemas/Money'
        reverses_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dibalik posting ini.'
        adjusts_posting_id:
          type:
          - string
          - 'null'
          description: '`posting_id` yang dikoreksi posting ini.'
        details:
          type: object
          description: Informasi untuk pelacakan dan laporan, misalnya rincian per aset. Pembaca tidak
            boleh menjurnal dari sini.
    FinancePostingAck:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - posted
          - rejected
        external_reference:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Wajib untuk `posted`. Nomor voucher atau faktur di aplikasi finance.
        reason_code:
          type:
          - string
          - 'null'
          enum:
          - PERIOD_CLOSED
          - UNKNOWN_ACCOUNT
          - UNKNOWN_DIMENSION
          - UNKNOWN_VENDOR
          - UNKNOWN_LEGAL_ENTITY
          - INVALID
          - null
          description: Wajib untuk `rejected`.
        reason:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Wajib untuk `rejected`.
    FinancePostingAckResult:
      type: object
      additionalProperties: false
      required:
      - posting_id
      - status
      - external_reference
      - reason_code
      - reason
      - acknowledged_at
      properties:
        posting_id:
          type: string
        status:
          type: string
          enum:
          - held
          - pending
          - posted
          - rejected
          - manual
        external_reference:
          type:
          - string
          - 'null'
        reason_code:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
    FinancialDimension:
      type: object
      additionalProperties: false
      required:
      - code
      - display_name
      - value_code
      - value_display_name
      - value_id
      description: |
        Sejajar dengan `dimensionSetLines` Business Central (K-07). Akun neraca membawa
        `BUSINESS_UNIT`; akun laba rugi membawa `BUSINESS_UNIT` dan `DEPARTMENT` (K-09). Nilai
        disalin pada saat terbit. Kode dimensi yang tidak dikenal pembaca berarti posting ditolak
        dengan `UNKNOWN_DIMENSION`.
      properties:
        code:
          type: string
          description: '`BUSINESS_UNIT` atau `DEPARTMENT`.'
        display_name:
          type: string
        value_code:
          type: string
          maxLength: 30
          description: Nomor operating unit (lihat `/operating-units`).
        value_display_name:
          type: string
        value_id:
          type: string
          format: ulid
          description: Id operating unit.
    JournalLine:
      type: object
      additionalProperties: false
      required:
      - line_no
      - account
      - debit
      - credit
      - description
      - financial_dimensions
      description: Tepat satu dari `debit` dan `credit` bernilai lebih dari nol.
      properties:
        line_no:
          type: integer
          minimum: 1
        account:
          type: object
          additionalProperties: false
          required:
          - external_id
          - code
          - name
          description: Akun di aplikasi finance, disalin saat terbit. Pembaca mencocokkan lewat `external_id`.
          properties:
            external_id:
              type: string
              maxLength: 64
            code:
              type: string
              maxLength: 50
            name:
              type: string
              maxLength: 200
        debit:
          $ref: '#/components/schemas/Money'
        credit:
          $ref: '#/components/schemas/Money'
        description:
          type:
          - string
          - 'null'
          maxLength: 255
        financial_dimensions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDimension'
    Money:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)?$
      description: |
        Nilai uang sebagai string desimal tanpa tanda dan tanpa pemisah ribuan, dengan jumlah
        desimal **persis** `currency.decimals` (`"500000000.00"` untuk 2, `"500000000"` untuk 0).
        Tidak pernah float (K-20).
    OperatingUnit:
      type: object
      required:
      - id
      - name
      - type
      - number
      - status
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        name:
          type: string
        type:
          type:
          - string
          - 'null'
          description: |
            Tipe operating unit dari setelan `coreerp.operating_unit_types`, misalnya
            `business_unit` atau `department`. Daftar tipe dapat bertambah; pembaca harus
            menerima nilai yang belum dikenalnya.
        number:
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^[A-Z0-9]+(-[A-Z0-9]+)*$
          description: |
            Nomor unit, unik per tenant. Boleh diganti; posting yang sudah terbit menyimpan
            nomor pada saat terbit.
        status:
          type: string
          description: '`active` atau status nonaktif lain.'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Waktu perubahan terakhir, dari nama maupun nomor dan tipe.
    PostingType:
      type: string
      maxLength: 80
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      description: |
        Jenis posting, berbentuk `<modul>.<peristiwa>`: modul yang menerbitkan posting dan peristiwa
        yang membuatnya terbit.

        | Nilai | Terbit saat | Tersedia |
        | --- | --- | --- |
        | `asset.acquisition` | Penerimaan aset diselesaikan | Sudah |
        | `asset.acquisition_adjustment` | Nilai perolehan dikoreksi | Sudah |
        | `asset.opening_balance` | Saldo awal aset lama saat mulai memakai feed | Sudah |
        | `asset.depreciation` | Proses "Post penyusutan" satu periode | Sudah |
        | `asset.depreciation_reversal` | Penyusutan satu periode dibalik | Sudah |
        | `asset.disposal_sale` | Penjualan aset diposting | Sudah |
        | `asset.disposal_scrap` | Pemusnahan aset diposting | Sudah |
        | `asset.write_down` | Penurunan nilai aset diposting | Sudah |
        | `asset.appreciation` | Kenaikan nilai aset diposting | Sudah |
        | `asset.reclassification` | Reklasifikasi aset antar group aset diposting | Sudah |

        **Tersedia** menyebut apakah modul penerbitnya sudah menerbitkan jenis itu. Jenis bertanda
        *Belum* tidak pernah muncul di feed sampai modulnya menerbitkannya.

        Daftar ini terbuka: jenis baru dapat ditambahkan, misalnya dari modul lain, tanpa versi kontrak
        baru. Jenis yang belum dikenal aplikasi Anda ditolak lewat ack dengan kode `INVALID`, tidak
        diabaikan.
      examples:
      - asset.acquisition
      - asset.acquisition_adjustment
      - asset.opening_balance
      - asset.depreciation
      - asset.depreciation_reversal
      - asset.disposal_sale
      - asset.disposal_scrap
      - asset.write_down
      - asset.appreciation
      - asset.reclassification
    ValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Vendor:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - name
      - party_type
      - tax_number
      - status
      - legal_entity
      - updated_at
      properties:
        id:
          type: string
          format: ulid
        number:
          type: string
          maxLength: 40
          description: |
            Nomor vendor, unik per entitas legal dan tidak pernah berubah. Diterbitkan urutan
            nomor Core (bawaan `VND-000001`) atau diketik manual saat memindahkan pemasok lama.
        name:
          type: string
          maxLength: 200
          description: Nama party saat ini.
        party_type:
          type: string
          enum:
          - organization
          - person
        tax_number:
          type:
          - string
          - 'null'
          maxLength: 32
          description: NPWP, bila diisi.
        status:
          type: string
          enum:
          - active
          - inactive
        legal_entity:
          type: object
          additionalProperties: false
          required:
          - id
          - code
          properties:
            id:
              type: string
              format: ulid
            code:
              type:
              - string
              - 'null'
              description: Kode perusahaan entitas legal.
        updated_at:
          type: string
          format: date-time
          description: Waktu perubahan terakhir, dari vendor maupun nama party-nya.
