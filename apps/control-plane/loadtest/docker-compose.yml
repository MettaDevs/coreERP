name: core-loadtest

x-api: &api
  build:
    context: ..
    dockerfile: Dockerfile
  image: coreerp-loadtest-api:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    pgbouncer:
      condition: service_started
  command: sh -c "php artisan config:cache && apache2-foreground"
  volumes:
    - ./apache-loadtest.conf:/etc/apache2/conf-enabled/zz-loadtest.conf:ro
  environment: &api-environment
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: base64:l1oHqTLOtVdmz0RRR7Yq1u7oPvHRxDTk1kL7RiEwv3E=
    APP_URL: http://lb
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    DB_CONNECTION: pgsql
    DB_HOST: pgbouncer
    DB_PORT: "6432"
    DB_DATABASE: core_erp
    DB_USERNAME: core_erp
    DB_PASSWORD: core_erp
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
    COREERP_DEPLOYMENT_PROFILE: pooled
    COREERP_DEPLOYMENT_PLACEMENT: pooled-primary
    COREERP_PROVIDER_EMAIL: provider@load.test
    COREERP_PROVIDER_PASSWORD: Loadtest-Provider-2026!
    COREERP_APP_CONTEXT_SIGNING_KEY: loadtest-context-signing-key-32b!!
    COREERP_REGISTRATION_RATE_LIMIT: "1000000"
    COREERP_TRUSTED_PROXIES: 172.16.0.0/12
    COREERP_PASSWORD_BREACH_CHECK: "false"

services:
  db:
    image: postgres:17.2-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: core_erp
      POSTGRES_USER: core_erp
      POSTGRES_PASSWORD: core_erp
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=384MB
      - -c
      - work_mem=8MB
      - -c
      - synchronous_commit=off
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_erp -d core_erp"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "15543:5432"

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: core_erp
      DB_PASSWORD: core_erp
      DB_NAME: core_erp
      POOL_MODE: session
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "128"
      RESERVE_POOL_SIZE: "16"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"

  init:
    image: coreerp-loadtest-api:local
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/loadtest/prepare.sh"]
    volumes:
      - ./prepare.sh:/loadtest/prepare.sh:ro
      - ${APP_MANIFEST_PATH}:/workspace/app.yaml:ro
    environment:
      <<: *api-environment
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: "5432"

  api1:
    <<: *api
  api2:
    <<: *api
  api3:
    <<: *api
  api4:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api1, api2, api3, api4]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18083:80"

  k6:
    image: grafana/k6:0.55.0
    profiles: [tools]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      BASE_URL: http://lb
      PROFILE: ${PROFILE:-registration}
      TENANTS: ${TENANTS:-100}
      VUS: ${VUS:-1000}
      LATENCY_VUS: ${LATENCY_VUS:-1}
      DURATION: ${DURATION:-90s}
      RUN_ID: ${RUN_ID:-local}

volumes:
  db-data:
