openapi: 3.1.0
info:
  title: CoreERP Management Asset API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: managementAssetHealth
      responses:
        '200':
          description: App is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/hello:
    get:
      operationId: managementAssetHello
      responses:
        '200':
          description: Management Asset hello response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, app]
          properties:
            status: { type: string, const: ok }
            app: { type: string, const: management-asset }
    HelloResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message, app, version]
          properties:
            message: { type: string }
            app: { type: string, const: management-asset }
            version: { type: string }
