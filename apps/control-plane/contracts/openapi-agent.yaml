openapi: 3.1.0
info:
  title: CoreERP admin.erp — API agen situs dan pendaftaran rilis
  version: 1.0.0
  description: |
    Dua permukaan yang dipanggil dari luar admin.erp, bukan dari peramban operator:

    - `/api/agent/v1/*` — dipanggil **agen** di server klien on-prem yang dikelola vendor.
    - `/api/releases/v1` — dipanggil **alur rilis** untuk mendaftarkan berkas rilis bertanda tangan.

    File ini **ditulis tangan dan merupakan sumber kebenaran**. Agen di `deploy/agent/` dibangun
    dari file ini, bukan dari kode PHP. Menambah route tanpa menambahkannya di sini adalah perubahan
    yang belum selesai; `contracts/check-contract-coverage.py` menolaknya di CI.

    Rancangannya di `docs/todo/on-prem-dikelola/README.md`.

    ## Tanda tangan permintaan agen

    Setiap endpoint agen **kecuali** `POST /enroll` wajib bertanda tangan. Bentuknya bagian kecil
    dari HTTP Message Signatures (RFC 9421), dan bagian yang tidak disebut di sini **tidak** didukung:

    | | |
    | --- | --- |
    | Algoritma | `rsa-v1_5-sha256` (RFC 9421 §3.3.2), kunci RSA milik situs |
    | Label | `sig1` — satu-satunya yang dibaca |
    | Komponen, urutan tetap | `"@method" "@path" "content-digest"` |
    | Parameter wajib | `created` (detik Unix), `keyid` (id situs), `alg` |
    | Batas selisih `created` | 300 detik terhadap jam admin.erp |

    Header yang dikirim:

    ```
    Content-Digest: sha-256=:<base64 SHA-256 isi permintaan>:
    Signature-Input: sig1=("@method" "@path" "content-digest");created=1726300000;keyid="01J...";alg="rsa-v1_5-sha256"
    Signature: sig1=:<base64 tanda tangan>:
    ```

    `Content-Digest` wajib ada juga untuk permintaan tanpa isi; nilainya SHA-256 dari string kosong.

    Signature base — baris dipisah `\n`, tanpa `\n` di akhir:

    ```
    "@method": POST
    "@path": /api/agent/v1/report
    "content-digest": sha-256=:47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=:
    "@signature-params": ("@method" "@path" "content-digest");created=1726300000;keyid="01J...";alg="rsa-v1_5-sha256"
    ```

    `@method` ditulis huruf besar. `@path` adalah path permintaan tanpa query. Nilai
    `@signature-params` sama persis dengan nilai anggota `sig1` di header `Signature-Input`.

    `@path` dipakai alih-alih `@target-uri` karena admin.erp berada di belakang proxy: alamat lengkap
    yang dilihat aplikasi bergantung pada setelan proxy yang dipercaya, sementara path tidak.

    Penolakan tanda tangan selalu `401` dengan `error` bernilai `signature_invalid`, tanpa menyebut
    bagian mana yang salah. Situs yang dicabut juga `401`.

servers:
  - url: /api
    description: Relatif terhadap host admin.erp.

tags:
  - name: agent
    description: Dipanggil agen di server klien.
  - name: releases
    description: Dipanggil alur rilis.

paths:
  /agent/v1/enroll:
    post:
      tags: [agent]
      operationId: enrollSite
      summary: Mendaftarkan agen dengan token pendaftaran online
      description: |
        Satu-satunya endpoint agen tanpa tanda tangan: kunci situs baru lahir di sini. Token hanya
        berlaku sekali dan hanya untuk kanal `online`; token offline diikat lewat file laporan pertama
        yang diunggah operator. Token yang sudah dipakai, kedaluwarsa, atau milik situs yang dicabut
        ditolak dengan jawaban yang sama.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, public_key, agent_version]
              properties:
                token:
                  type: string
                  minLength: 32
                public_key:
                  type: string
                  description: Kunci publik RSA situs dalam PEM (`-----BEGIN PUBLIC KEY-----`), minimal 2048 bit.
                agent_version:
                  type: string
                  maxLength: 40
      responses:
        '201':
          description: Terdaftar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolled'
        '401':
          $ref: '#/components/responses/EnrollmentRejected'
        '422':
          $ref: '#/components/responses/Invalid'

  /agent/v1/report:
    post:
      tags: [agent]
      operationId: reportSiteState
      summary: Melaporkan keadaan situs
      description: |
        Isinya daftar tertutup. Kunci di luar skema ditolak `422` — itu yang menegakkan "data yang boleh
        keluar dari server klien", bukan kebiasaan agen.
      security:
        - siteSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '200':
          description: Diterima.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [interval_seconds]
                properties:
                  interval_seconds:
                    type: integer
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '422':
          $ref: '#/components/responses/Invalid'

  /agent/v1/operations/claim:
    post:
      tags: [agent]
      operationId: claimOperation
      summary: Mengambil operasi berikutnya
      description: |
        Operasi `running` yang lease-nya habis ditandai `failed` lebih dulu, lalu yang `requested`
        diambil paling tua lebih dulu. `upgrade` hanya diberikan di dalam jendela pembaruan situs;
        operasi lain kapan saja. Satu situs hanya punya satu operasi `running`.
      security:
        - siteSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Satu operasi diserahkan dan lease-nya dipegang agen ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedOperation'
        '204':
          description: Tidak ada operasi yang boleh diambil sekarang.
        '401':
          $ref: '#/components/responses/SignatureInvalid'

  /agent/v1/operations/{operation}/steps:
    post:
      tags: [agent]
      operationId: reportOperationStep
      summary: Melaporkan langkah, atau hasil akhir, sebuah operasi
      description: |
        `status: running` mencatat langkah dan memperpanjang lease. `succeeded` dan `failed` menutup
        operasi; `failed` wajib membawa `failure_message`. Operasi milik situs lain, yang sudah
        ditutup, atau yang lease-nya habis dijawab `409` — agen harus berhenti mengerjakannya.
      security:
        - siteSignature: []
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, step]
              properties:
                status:
                  type: string
                  enum: [running, succeeded, failed]
                step:
                  type: string
                  maxLength: 120
                failure_message:
                  type: string
                  maxLength: 4000
      responses:
        '200':
          description: Dicatat.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [lease_until]
                properties:
                  lease_until:
                    type: [string, 'null']
                    format: date-time
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '409':
          description: Operasi ini tidak lagi dipegang agen ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Invalid'

  /agent/v1/releases/{edition}/{release}/files/{file}:
    get:
      tags: [agent]
      operationId: downloadReleaseFile
      summary: Mengambil satu berkas rilis
      description: |
        Isi berkas persis seperti yang didaftarkan alur rilis. Agen memverifikasi tanda tangannya
        sendiri dengan kunci publik rilis yang dipasang saat pendaftaran — **bukan** dengan kunci apa
        pun dari admin.erp. Hanya rilis dari edisi situs ini yang dapat diambil.
      security:
        - siteSignature: []
      parameters:
        - name: edition
          in: path
          required: true
          schema:
            type: string
        - name: release
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [manifest.json, compose.yaml, update.sh, SHA256SUMS, SHA256SUMS.sig]
      responses:
        '200':
          description: Isi berkas.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '404':
          description: Rilis atau berkas tidak ada untuk edisi situs ini.

  /agent/v1/key:
    post:
      tags: [agent]
      operationId: rotateSiteKey
      summary: Mengganti kunci situs
      description: Ditandatangani kunci **lama**. Sesudah jawaban `200`, hanya kunci baru yang diterima.
      security:
        - siteSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
      responses:
        '200':
          description: Kunci diganti.
        '401':
          $ref: '#/components/responses/SignatureInvalid'
        '422':
          $ref: '#/components/responses/Invalid'

  /releases/v1:
    post:
      tags: [releases]
      operationId: registerRelease
      summary: Mendaftarkan berkas rilis bertanda tangan
      description: |
        Dipanggil alur rilis. admin.erp memeriksa `SHA256SUMS.sig` dengan kunci publik rilis, lalu
        checksum setiap berkas, sebelum menyimpan apa pun. admin.erp **tidak** memegang kunci privat
        rilis. Pasangan edisi dan rilis unik: berkas identik dijawab `200`, berkas berbeda untuk
        pasangan yang sama `409`.
      security:
        - releaseToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, compose, update_script, checksums, signature]
              properties:
                manifest:
                  type: string
                  format: binary
                compose:
                  type: string
                  format: binary
                update_script:
                  type: string
                  format: binary
                checksums:
                  type: string
                  format: binary
                signature:
                  type: string
                  format: binary
      responses:
        '201':
          description: Terdaftar.
        '200':
          description: Sudah terdaftar dengan isi yang sama.
        '401':
          description: Token rilis salah atau tidak disetel.
        '409':
          description: Edisi dan rilis yang sama sudah terdaftar dengan isi berbeda.
        '422':
          $ref: '#/components/responses/Invalid'

components:
  securitySchemes:
    siteSignature:
      type: apiKey
      in: header
      name: Signature
      description: RFC 9421, bentuk yang dijelaskan di `info.description`.
    releaseToken:
      type: http
      scheme: bearer

  responses:
    SignatureInvalid:
      description: Tanda tangan tidak sah, `created` di luar batas, digest tidak cocok, atau situs dicabut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnrollmentRejected:
      description: Token pendaftaran tidak dapat dipakai.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Isi permintaan tidak sesuai skema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    Enrolled:
      type: object
      additionalProperties: false
      required: [site_id, tenant_id, tenant_name, interval_seconds, update_window, license_public_key]
      properties:
        site_id:
          type: string
        tenant_id:
          type: string
          description: |
            ULID tenant di admin.erp. Core di server klien melahirkan tenant-nya dengan id yang sama
            lewat `tenant:bootstrap-site`, supaya kedua sisi menyebut tenant yang sama tanpa tabel
            penerjemah.
        tenant_name:
          type: string
        interval_seconds:
          type: integer
        update_window:
          $ref: '#/components/schemas/UpdateWindow'
        license_public_key:
          type: [string, 'null']
          description: |
            Kunci publik lisensi dalam PEM. Kunci ini milik admin.erp — lisensi palsu hanya
            menyembunyikan peringatan, tidak membuka apa pun. Kunci publik **rilis** tidak pernah
            datang dari sini.

    UpdateWindow:
      type: [object, 'null']
      additionalProperties: false
      required: [start, end, timezone]
      properties:
        start:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        end:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        timezone:
          type: string

    ClaimedOperation:
      type: object
      additionalProperties: false
      required: [id, operation, parameters, lease_until]
      properties:
        id:
          type: string
        operation:
          type: string
          enum: [upgrade, backup, install_license, rotate_key, send_diagnostics]
        parameters:
          description: |
            `upgrade`: `{edition, release}`. `install_license`: `{license, signature}` — `license`
            string JSON persis yang ditandatangani, `signature` base64 RSA SHA-256 atasnya. Operasi
            lain: objek kosong.
          type: object
        lease_until:
          type: string
          format: date-time

    OfflineEnrollmentPackage:
      description: |
        `site.json` yang diunduh operator dari admin.erp untuk situs tanpa internet, dibawa ke server
        dengan flashdisk dan dibaca `coreerp-agent import-package`. Bukan jawaban HTTP agen; ditulis di
        sini karena ia janji antara admin.erp dan agen yang sama mengikatnya dengan endpoint di atas.
        Kunci publik **rilis** tidak pernah ada di dalamnya.
      type: object
      additionalProperties: false
      required: [site_id, tenant_id, tenant_name, admin_url, channel, enrollment_token, update_window, license_public_key, license]
      properties:
        site_id:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        admin_url:
          type: string
        channel:
          type: string
          enum: [offline]
        enrollment_token:
          type: string
          description: Sekali pakai, berlaku 30 hari. Diikat ke kunci situs lewat file laporan pertama.
        update_window:
          $ref: '#/components/schemas/UpdateWindow'
        license_public_key:
          type: [string, 'null']
        license:
          type: [object, 'null']
          additionalProperties: false
          required: [license, signature]
          properties:
            license:
              type: string
            signature:
              type: string

    OfflineReportFile:
      description: |
        File laporan yang ditulis `coreerp-agent write-report` di situs tanpa internet dan diunggah
        operator di rincian situs. `signature` adalah base64 RSA SHA-256 atas byte `content` yang
        sudah didekode, dengan kunci situs. File pertama situs yang belum terikat membawa `enrollment`;
        admin.erp memeriksa tanda tangannya dengan kunci yang dibawa file itu, lalu memakai tokennya —
        tanpa token, siapa pun dapat mengikat kunci buatannya sendiri ke situs mana saja.
      type: object
      additionalProperties: false
      required: [format, content, signature]
      properties:
        format:
          type: string
          enum: [coreerp-site-report-v1]
        content:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/OfflineReportContent'
        signature:
          type: string
          contentEncoding: base64

    OfflineReportContent:
      type: object
      additionalProperties: false
      required: [report, enrollment]
      properties:
        report:
          $ref: '#/components/schemas/Report'
        enrollment:
          type: [object, 'null']
          additionalProperties: false
          required: [token, public_key]
          properties:
            token:
              type: string
            public_key:
              type: string

    Report:
      type: object
      additionalProperties: false
      required: [site_id, agent_version, created_at, server_time]
      properties:
        site_id:
          type: string
        agent_version:
          type: string
          maxLength: 40
        created_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        edition:
          type: [string, 'null']
          maxLength: 80
        release:
          type: [string, 'null']
          maxLength: 40
        image:
          type: [string, 'null']
          maxLength: 255
        digest:
          type: [string, 'null']
          maxLength: 100
        containers:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [service, state]
            properties:
              service:
                type: string
                maxLength: 60
              state:
                type: string
                maxLength: 30
              health:
                type: [string, 'null']
                maxLength: 30
        disk:
          type: [object, 'null']
          additionalProperties: false
          properties:
            data_free_bytes:
              type: [integer, 'null']
            backup_free_bytes:
              type: [integer, 'null']
        last_backup:
          type: [object, 'null']
          additionalProperties: false
          required: [at, result]
          properties:
            at:
              type: string
              format: date-time
            size_bytes:
              type: [integer, 'null']
            result:
              type: string
              enum: [succeeded, failed]
        last_operation:
          type: [object, 'null']
          additionalProperties: false
          required: [id, result]
          properties:
            id:
              type: string
            result:
              type: string
              enum: [succeeded, failed]
            step:
              type: [string, 'null']
              maxLength: 120
        certificate_expires_at:
          type: [string, 'null']
          format: date-time
        license_expires_at:
          type: [string, 'null']
          format: date
