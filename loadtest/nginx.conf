worker_processes auto;
events {
    worker_connections 8192;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Empat server instance API. Load balancer sengaja eksplisit, bukan DNS round-robin,
    # supaya penyebaran traffic dapat dibuktikan lewat $upstream_addr.
    upstream api_pool {
        least_conn;
        server api1:80 max_fails=0;
        server api2:80 max_fails=0;
        server api3:80 max_fails=0;
        server api4:80 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        client_body_buffer_size 32k;
        keepalive_requests 100000;
        keepalive_timeout 75s;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            # Dibaca k6 untuk menghitung berapa instance yang benar-benar melayani traffic.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
