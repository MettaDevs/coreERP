# Stack load test Management Aset.
#
# Bentuknya sengaja menyerupai deployment nyata pada satu hal yang tidak dapat
# dipalsukan oleh test suite biasa: BEBERAPA server instance API berbagi SATU database
# dan SATU layanan Number Sequence. Itulah yang membuktikan app tidak menyimpan counter,
# cache identitas, atau state tenant pada memori instance.
name: aset-loadtest

x-api: &api
  build:
    context: ..
    dockerfile: api/Dockerfile
  image: aset-loadtest-api:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    core-stub:
      condition: service_started
  # Cache config dan route seperti image produksi. Tanpa ini yang terukur adalah biaya
  # bootstrap Laravel, bukan biaya kode modul.
  command: sh -c "php artisan config:cache && php artisan route:cache && apache2-foreground"
  volumes:
    - ./apache-loadtest.conf:/etc/apache2/conf-enabled/zz-loadtest.conf:ro
  environment: &api-env
    APP_NAME: management-aset
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: base64:l1oHqTLOtVdmz0RRR7Yq1u7oPvHRxDTk1kL7RiEwv3E=
    APP_URL: http://lb
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    DB_CONNECTION: pgsql
    # Diarahkan ke connection pooler, bukan langsung ke Postgres. Laravel membuka dan
    # menutup koneksi per request; tanpa pooler, PostgreSQL fork satu proses per request
    # dan itu menjadi bottleneck sebelum kode app menjadi bottleneck.
    DB_HOST: ${DB_TARGET_HOST:-pgbouncer}
    DB_PORT: "${DB_TARGET_PORT:-6432}"
    DB_DATABASE: app_erp_management_aset
    DB_USERNAME: aset
    DB_PASSWORD: aset
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    DB_PERSISTENT: "${DB_PERSISTENT:-false}"
    COREERP_URL: http://core-stub:8080
    COREERP_APP_ID: management-aset
    COREERP_SERVICE_TOKEN: load-test-service-token
    COREERP_APP_CONTEXT_SIGNING_KEY: loadtest-context-signing-key-32b!!

services:
  db:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_erp_management_aset
      POSTGRES_USER: aset
      POSTGRES_PASSWORD: aset
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=384MB
      - -c
      - work_mem=8MB
      - -c
      - synchronous_commit=off
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aset -d app_erp_management_aset"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "15432:5432"

  # Mode session, bukan transaction: PDO memakai prepared statement sisi server, dan
  # transaction pooling akan memutus statement itu antar request. Session pooling sudah
  # cukup karena koneksi klien PHP berumur satu request lalu dikembalikan ke pool.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: aset
      DB_PASSWORD: aset
      DB_NAME: app_erp_management_aset
      POOL_MODE: session
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "96"
      RESERVE_POOL_SIZE: "16"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    ports:
      - "16432:6432"

  core-stub:
    build:
      context: ./stub-core
    image: aset-loadtest-core-stub:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ID: management-aset
      SERVICE_TOKEN: load-test-service-token
    ports:
      - "18081:8080"

  api1:
    <<: *api
  api2:
    <<: *api
  api3:
    <<: *api
  api4:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api1, api2, api3, api4]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18080:80"
