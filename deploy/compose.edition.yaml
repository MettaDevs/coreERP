name: coreerp

# Berkas compose yang **ikut di dalam bundle**, bukan yang ditarik dari repo lain.
#
# Perbedaannya dengan compose di repo penyebaran bukan bentuk layanannya — keduanya sama — melainkan
# dari mana image-nya datang. Di sana image dibangun di server pelanggan lewat git dan `docker
# build`; di sini seluruh image sudah dimuat dari `images.tar.gz` oleh `update.sh` sebelum satu
# container pun dinyalakan.
#
# Image pendamping di bawah ditulis **harfiah**, bukan lewat variabel, dan itu disengaja: `build-bundle.sh`
# membacanya dari berkas ini untuk menentukan apa saja yang harus ikut disimpan ke dalam bundle.
# Menggantinya menjadi variabel membuatnya lolos dari pembacaan itu, dan bundle-nya akan terlihat
# lengkap padahal masih harus menariknya dari registry saat dipasang.
#
# `docs` sengaja tidak ada di sini. Ia satu image lagi yang harus ikut menyeberang, dan dokumentasi
# bukan bagian yang membuat aplikasi berjalan; pelanggan yang memintanya mendapat bundle terpisah.
#
# **Setiap layanan `pull_policy: never`.** Compose tidak pernah menarik image; yang menyiapkannya adalah
# update.sh (bundle) atau agen situs (rilis v2: ditarik lewat digest dari registry kita, lalu diberi tag
# lokal `coreerp.local/*` yang ditulis perakit ke `compose.yaml` rilis). Dua alasan yang sama beratnya:
#
# - tag lokal yang terhapus harus membuat Compose **gagal**, bukan diam-diam menarik `docker.io/...` — nama
#   yang dapat didaftarkan siapa pun di Docker Hub, dan yang tidak pernah diperiksa tanda tangannya;
# - host registry tidak pernah tertulis di server klien. Registry dapat pindah tanpa menyentuh klien, dan
#   berkas compose yang menyebut host itu justru mengundang Compose menariknya sendiri.
#
# Image pendamping di bawah tetap ditulis dengan nama sumbernya, karena perakit membacanya dari sini;
# `compose.yaml` rilis v2 menggantinya dengan tag lokal.

x-edition-environment: &edition-environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  APP_KEY: ${CORE_APP_KEY}
  DB_CONNECTION: pgsql
  DB_HOST: core-db
  DB_PORT: 5432
  DB_DATABASE: core_erp
  DB_USERNAME: core_erp
  DB_PASSWORD: ${CORE_DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  COREERP_PROVIDER_EMAIL: ${COREERP_PROVIDER_EMAIL}
  COREERP_PROVIDER_PASSWORD: ${COREERP_PROVIDER_PASSWORD}
  COREERP_TRUSTED_PROXIES: ${COREERP_TRUSTED_PROXIES:-}
  # Engine PDF milik platform. Tanpa layanan ini ekspor laporan gagal — dan gagalnya baru terlihat
  # saat pengguna menekan cetak, bukan saat pemasangan.
  COREERP_RENDERER_URL: http://core-renderer:3000
  # Laporan kesalahan ke Discord. Kosong berarti mati, dan itu bawaan yang benar untuk
  # on-prem: channelnya milik pelanggan, bukan milik kita. Lihat .env.example.
  COREERP_SIGNOZ_URL: ${COREERP_SIGNOZ_URL:-}
  COREERP_DISCORD_WEBHOOK_URL: ${COREERP_DISCORD_WEBHOOK_URL:-}
  COREERP_DISCORD_MENTION: ${COREERP_DISCORD_MENTION:-}
  COREERP_DISCORD_JEDA_DETIK: ${COREERP_DISCORD_JEDA_DETIK:-60}
  # Penerima event di **luar** proses ini. Module di dalam image tidak lewat sini; mereka menerima
  # event sebagai pemanggilan fungsi. Biarkan `[]` kecuali ada sistem luar yang berlangganan.
  COREERP_EVENT_ENDPOINTS: ${COREERP_EVENT_ENDPOINTS:-[]}
  # Trace OpenTelemetry. Variabel ini **harus** ada di sini, bukan di `.env` Laravel: SDK-nya
  # menyalakan diri saat autoload Composer, sebelum Laravel membaca `.env` sama sekali.
  #
  # Mati secara bawaan, dan itu disengaja. Bundle ini dipasang di mesin pelanggan yang umumnya
  # tidak punya kolektor trace; kalau ekspor menyala sementara alamat kolektornya tak terjangkau,
  # setiap request membayar waktu tunggu koneksi TCP sebelum proses PHP-nya berakhir.
  # Menyalakannya cukup satu baris di `.env` pemasangan: OTEL_PHP_AUTOLOAD_ENABLED=true.
  OTEL_PHP_AUTOLOAD_ENABLED: ${OTEL_PHP_AUTOLOAD_ENABLED:-false}
  # Bukan variabel yang boleh ditimpa dari luar: nilainya dibedakan per peran di blok layanan
  # masing-masing, dan satu nilai dari host akan menggabungkan ketiganya kembali jadi satu nama.
  OTEL_SERVICE_NAME: coreerp-control-plane
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:-on-prem}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: none
  # Laporan kesalahan internal ikut dikirim sebagai log terstruktur, supaya ia bisa dicari dan
  # disambungkan ke jejak permintaannya. Nilainya `otlp`, bukan `none`, karena saklar
  # sebenarnya ada satu tingkat di atas: `OTEL_PHP_AUTOLOAD_ENABLED` di atas tetap `false`
  # secara bawaan, jadi pemasangan yang tidak punya jalan keluar tidak mengirim apa pun dan
  # tidak membayar waktu tunggu apa pun. Yang menyalakan telemetri menyalakannya sekali, dan
  # mendapat laporan kesalahan sekaligus — bukan menemukan belakangan bahwa ada saklar kedua
  # yang lupa dinyalakan.
  #
  # Berkas log di mesin ditulis tanpa bergantung pada nilai ini sama sekali.
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  # Auto-instrumentation PSR-3 dimatikan; `laravel` tetap hidup karena ia yang menghasilkan
  # trace. Keduanya meneruskan panggilan `Log::` menjadi catatan OTLP, jadi membiarkan keduanya
  # hidup berarti setiap baris log terkirim dua kali. Di mesin pelanggan dengan sambungan
  # terbatas, membayar dua kali untuk isi yang sama bukan pilihan yang netral.
  OTEL_PHP_DISABLED_INSTRUMENTATIONS: ${OTEL_PHP_DISABLED_INSTRUMENTATIONS:-psr3}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  # KOSONG, dan itu keputusan yang dibayar mahal kalau dibalik.
  #
  # Sebelumnya baris ini memuat alamat kolektor milik VENDOR sebagai bawaan. Sakelar di atas
  # memang mati, jadi tidak ada yang pernah terkirim — tetapi komentar di atas mengundang
  # menyalakannya dengan satu baris, dan pelanggan yang menyalakannya tanpa menyebut alamat
  # sendiri akan mengirimkan trace dan log-nya ke mesin kami. Trace memuat pernyataan SQL, URL,
  # dan id tenant.
  #
  # Untuk pelanggan healthcare itu data yang **tidak boleh kami terima**, bukan sekadar tidak
  # ingin. Dan ia bertentangan dengan aturan yang kami tulis sendiri: on-prem perpetual berdiri
  # sendiri, tanpa telemetry wajib. Bawaan yang menelepon rumah begitu dinyalakan bukan "berdiri
  # sendiri".
  #
  # Kosong berarti pelanggan yang menyalakan telemetry WAJIB menyebut ke mana ia dikirim. Kalau
  # ia lupa, exporter-nya gagal berisik di mesinnya sendiri — dan gagal berisik jauh lebih baik
  # daripada berhasil diam-diam ke tempat yang salah.
  #
  # Alamat kolektor kami sendiri tinggal di `.env` server, tempatnya memang sejak awal. Sebuah
  # artefak yang memuat fakta spesifik-lingkungan berhenti dapat dipromosikan: image yang diuji
  # bukan lagi image yang dikirim.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-baggage,tracecontext}
  OTEL_PHP_LOG_DESTINATION: ${OTEL_PHP_LOG_DESTINATION:-none}
  # Lisensi bertanda tangan yang dipasang agen situs, beserta kunci publik pemeriksanya. Keduanya
  # datang lewat bind mount `x-license-mount` di bawah, bukan dari image: lisensi berganti tanpa rilis.
  #
  # Image membawa kode seluruh modul, jadi lisensilah yang menentukan app mana yang boleh dibuka, dan
  # lisensi yang habis, hilang, atau salah tanda tangan mengunci pengguna tenant. Kunci itu hanya
  # berlaku bila COREERP_LICENSE_REQUIRED bernilai true.
  #
  # Bawaannya **false**, dan itu disengaja. Pemasangan beli-putus dan SaaS tidak punya agen maupun
  # berkas lisensi; bawaan true akan mengunci mereka pada pembaruan compose berikutnya tanpa ada yang
  # berubah di sisi mereka. On-prem dikelola menyetelnya true lewat `deploy/agent/env.template`.
  #
  # Nilainya tinggal di `.env` server klien, jadi root di sana dapat mematikannya, dan berkas ini tidak
  # dapat mencegahnya. Yang mengetahuinya laporan agen: `license_required` membawa nilai yang dibaca
  # agen dari `.env` yang sama, dan admin.erp memperingatkan situs on-prem dikelola yang melaporkan false.
  COREERP_LICENSE_REQUIRED: ${COREERP_LICENSE_REQUIRED:-false}
  COREERP_LICENSE_PATH: /run/coreerp-license/license.json
  COREERP_LICENSE_PUBLIC_KEY_PATH: /run/coreerp-license/license-public.pem

# Hanya-baca: yang menulis lisensi hanya agen di host, setelah tanda tangan, situs, dan formatnya
# diperiksa. Container yang dapat menulis ke sini dapat mengganti lisensinya sendiri.
#
# Bila foldernya tidak ada, Docker membuatnya kosong; itu keadaan yang benar untuk pemasangan tanpa
# agen, yang lisensinya tidak wajib.
x-license-mount: &license-mount ${COREERP_LICENSE_DIR:-/opt/coreerp/agent/license}:/run/coreerp-license:ro

services:
  core-db:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_erp
      POSTGRES_USER: core_erp
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U core_erp -d core_erp']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - core-db-data:/var/lib/postgresql/data

  # Sekali jalan, dan aman diulang. Pembaruan on-prem dijalankan admin pelanggan yang tidak punya
  # cara mengetahui apakah sebuah perintah sudah pernah jalan, jadi menjalankannya dua kali harus
  # menghasilkan keadaan yang sama persis dengan sekali.
  #
  # `app:register-manifest` tanpa argumen mendaftarkan **seluruh module yang ada di dalam image
  # ini**, jadi berkas compose tidak perlu tahu edisi mana yang sedang dipasang. Tabel milik module
  # sendiri dibuat saat module dipasang untuk sebuah tenant, lewat jalur pendaftaran usaha.
  # `environment:upgrade` berjalan sebagai langkah terakhir layanan ini, dan letaknya menentukan.
  #
  # Ketiga layanan lain menunggu `core-migrate` selesai, jadi menaruh pembaruan armada di sini
  # berarti **tiap rilis tertahan sampai seluruh lingkungan selesai dimigrasi** — sebelum satu
  # permintaan pun dilayani. Itu diterima dengan sadar untuk tahun pertama: pada 5-10 prospek per
  # minggu, angkanya belasan lingkungan dan jendelanya hitungan menit.
  #
  # Yang membuatnya tidak diterima lagi: dua ratus lingkungan, yang berarti jendela pemeliharaan
  # berpuluh menit bagi semua pelanggan sekaligus pada setiap rilis. Jalan keluarnya sudah
  # dirancang — jendela per lingkungan beserta pembatalan otomatisnya, dan deployment rings — dan
  # rinciannya di `docs/todo/environment-dan-pusat-admin/README.md`.
  #
  # Sampai hari itu, pembaruan dari layar konsol memakai antrean dan tidak menahan apa pun; yang di
  # sini khusus untuk rilis, di mana menahan justru yang benar.
  core-migrate:
    image: ${EDITION_IMAGE}
    pull_policy: never
    restart: 'no'
    depends_on:
      core-db:
        condition: service_healthy
    environment:
      <<: *edition-environment
      # Migrasi bukan lalu lintas yang perlu dilihat sebagai trace, dan ia berjalan justru pada
      # saat kolektor belum tentu sudah siap. Dimatikan di sini saja, bukan di anchor.
      OTEL_PHP_AUTOLOAD_ENABLED: 'false'
      # Layanan ini tidak me-mount folder lisensi, jadi lisensi yang wajib terbaca "hilang" di sini.
      # Migrasi adalah pekerjaan vendor, bukan pengguna tenant: situs yang terkunci justru harus tetap
      # dapat menerima rilis yang memperbaikinya.
      COREERP_LICENSE_REQUIRED: 'false'
    entrypoint: ['sh', '-c']
    command:
      - >-
        php artisan migrate --force --no-interaction &&
        php artisan db:seed --force --no-interaction &&
        php artisan app:register-manifest --no-interaction &&
        php artisan environment:upgrade --no-interaction

  core-app:
    image: ${EDITION_IMAGE}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      core-db:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    environment: *edition-environment
    networks:
      - default
      - renderer
    volumes:
      # Layout unggahan dan hasil ekspor laporan ditulis worker lalu disajikan web, jadi keduanya
      # harus melihat storage yang sama. Tanpa volume bersama, unduhan menjawab 410 untuk berkas
      # yang sebenarnya ada — hanya ada di container yang salah.
      - core-storage:/repo/apps/core/storage/app
      # Tanpa volume ini, log hidup di lapisan tulis container dan lenyap pada setiap upgrade.
      # Di mesin pelanggan itu berarti satu-satunya catatan tentang kegagalan kemarin hilang
      # tepat pada saat seseorang datang untuk membacanya. Nama berkas dibedakan per peran
      # (lihat `config/logging.php`), jadi ketiga container aman berbagi satu volume.
      - core-logs:/repo/apps/core/storage/logs
      - *license-mount
    ports:
      # Bawaan 0.0.0.0 menjaga pemasangan beli-putus yang sudah berjalan: port aplikasinya mungkin
      # dijangkau langsung dari jaringan klinik, dan pembaruan tidak boleh memutusnya. On-prem dikelola
      # mengikatnya ke 127.0.0.1 lewat `deploy/agent/env.template`, karena ia berdiri di belakang proxy
      # HTTPS — core-proxy di bawah, atau reverse proxy klien — dan port yang diterbitkan Docker melewati
      # firewall host.
      #
      # Satu beda dengan bentuk tanpa alamat yang dipakai sebelumnya: bentuk itu juga menerbitkan port di
      # IPv6 (`::`), sedangkan 0.0.0.0 hanya IPv4 — terlihat di `docker inspect` pada Docker Engine 29.
      # Pemasangan yang menjangkau port ini lewat IPv6 kehilangan jalur itu pada bawaan ini.
      - '${CORE_APP_BIND:-0.0.0.0}:${CORE_APP_PORT:-8000}:80'
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@file_get_contents('http://127.0.0.1/up') === false);"]
      interval: 10s
      timeout: 5s
      retries: 12

  core-worker:
    image: ${EDITION_IMAGE}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      core-db:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    environment:
      <<: *edition-environment
      CONTAINER_ROLE: worker
      # Ketiga container menjalankan image yang sama; tanpa nama per peran, span request web,
      # job, dan tick penjadwal menumpuk pada satu layanan dan tidak bisa dipisahkan lagi.
      OTEL_SERVICE_NAME: coreerp-worker
    networks:
      - default
      - renderer
    volumes:
      - core-storage:/repo/apps/core/storage/app
      - core-logs:/repo/apps/core/storage/logs
      - *license-mount

  # Tepat satu replika. Tanpa penjadwal, `number-sequences:recover` tidak pernah berjalan dan
  # reservasi nomor berkelanjutan yang kedaluwarsa tidak pernah dilepas.
  core-scheduler:
    image: ${EDITION_IMAGE}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      core-db:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    environment:
      <<: *edition-environment
      CONTAINER_ROLE: scheduler
      # `schedule:work` bangun tiap menit dan menghasilkan span tiap kali, sebagian besar tanpa
      # pekerjaan. Nama tersendiri membuat kebisingan itu dapat disaring di kolektor tanpa ikut
      # membuang trace request web.
      OTEL_SERVICE_NAME: coreerp-scheduler
    volumes:
      - core-logs:/repo/apps/core/storage/logs
      - *license-mount

  # Stateless, tidak mengenal tenant, dan **tidak punya jalan keluar** — lihat network `renderer`
  # di bawah. Ia hanya mengubah dokumen yang sudah diisi menjadi PDF.
  core-renderer:
    image: gotenberg/gotenberg:8
    pull_policy: never
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=50
      - --chromium-disable-routes=true
    networks:
      - renderer
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12

  # Proxy HTTPS di depan core-app untuk server klien yang dipasang agen. Aplikasinya menuntut HTTPS
  # (SESSION_SECURE_COOKIE), dan server klinik yang tidak punya reverse proxy tidak dapat dimasuki dari
  # peramban tanpa seseorang menyetelnya dengan tangan. Caddy mengambil sertifikat Let's Encrypt untuk
  # COREERP_APP_HOST sendiri, dan mengalihkan HTTP ke HTTPS.
  #
  # **Hanya menyala dengan profil `proxy`**, yang ditulis pasang.sh ke `.env` server klien sebagai
  # COMPOSE_PROFILES. Bundle beli-putus memakai berkas yang sama dan tidak pernah menyetelnya: bagi Compose
  # layanan ini tidak ada, dan port 80 dan 443 — yang lazim sudah dipakai web server klinik — tidak disentuh.
  # Server yang sudah punya reverse proxy sendiri dipasang dengan `pasang.sh --proxy-luar`, juga tanpa profil.
  # update.sh menanyakan Compose apakah layanan ini menyala, lalu menyalakannya sesudah core-app sehat.
  #
  # Port 80 dan 443 diterbitkan ke semua alamat dengan sengaja: inilah pintu masuk dari internet. Aplikasinya
  # sendiri tetap hanya di CORE_APP_BIND.
  #
  # `--from` bawaan `localhost` berlaku sampai agen menulis alamat tenant dari admin.erp ke `.env`. Untuk
  # localhost Caddy hanya memakai CA internalnya, jadi tidak ada sertifikat publik yang diminta untuk nama
  # yang tidak dipilih siapa pun. Host diteruskan apa adanya, dan `X-Forwarded-*` kiriman klien dibuang lalu
  # ditulis ulang Caddy; Core mempercayai header itu lewat COREERP_TRUSTED_PROXIES.
  #
  # Tag versi pasti: tag yang bergerak (`caddy:2`) mengganti Caddy di antara dua rilis tanpa berkas ini
  # berubah. Perakit menyalinnya ke registry kita lewat digest seperti pendamping lain.
  core-proxy:
    image: caddy:2.11.4-alpine
    pull_policy: never
    restart: unless-stopped
    profiles: [proxy]
    depends_on:
      core-app:
        condition: service_healthy
    command: caddy reverse-proxy --from ${COREERP_APP_HOST:-localhost} --to core-app:80
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3.
      - '443:443/udp'
    networks:
      - default
    volumes:
      # Sertifikat dan kunci akun ACME. Tanpa volume keduanya hilang bersama container pada setiap pembaruan
      # yang membuat ulang proxy, dan Let's Encrypt membatasi penerbitan ulang untuk nama yang sama: beberapa
      # pembaruan dalam seminggu dapat meninggalkan situs tanpa sertifikat.
      - core-proxy-data:/data
      - core-proxy-config:/config

networks:
  default:
  # Tanpa jalan keluar: container di sini hanya dapat dihubungi container lain pada network yang
  # sama. Perender menerima dokumen milik pelanggan, jadi ia tidak boleh dapat menghubungi apa pun
  # di luar.
  renderer:
    internal: true

volumes:
  core-db-data:
  core-storage:
  core-logs:
  core-proxy-data:
  core-proxy-config:
