# Rute dan sertifikat. Berkas ini dibaca ulang otomatis; mengubahnya tidak menuntut restart.
#
# ## Kenapa dua router, bukan satu
#
# Konsol operator dan runtime Core adalah dua proses yang mendengar di porta berbeda, dan
# `admin.erp.grenery.xyz` berbentuk persis sama dengan alamat produksi sebuah tenant. Tanpa router
# tersendiri berprioritas lebih tinggi, ia akan mendarat di Core, dicari sebagai tenant bernama
# "admin", tidak ditemukan, lalu dijawab 404 — konsol operator mati dengan pesan yang tidak
# menyebut sebabnya sama sekali.
#
# Prioritasnya ditulis eksplisit. Bawaan Traefik mengurutkan berdasarkan panjang aturan, dan
# panjang aturan bukan ukuran kekhususan — regex Core lebih panjang daripada `Host()` konsol.

http:
  routers:
    # Konsol operator. Didahulukan, alasannya di atas.
    console:
      rule: "Host(`admin.erp.grenery.xyz`)"
      priority: 100
      entryPoints: [websecure]
      service: console
      tls:
        certResolver: cloudflare
        domains: &wildcard
          # Keempat nama diminta di satu tempat saja. Diulang di router kedua lewat anchor YAML,
          # bukan disalin: dua daftar nama yang harus tetap sepakat adalah dua daftar yang kelak
          # berbeda di salah satunya, dan yang hilang akan berupa satu jenis lingkungan yang
          # sertifikatnya diam-diam tidak mencakup apa pun.
          - main: "erp.grenery.xyz"
            sans:
              - "*.erp.grenery.xyz"
              - "*.demo.erp.grenery.xyz"
              - "*.sandbox.erp.grenery.xyz"

    # Seluruh sisanya ke Core: alamat pangkal, produksi tiap tenant, demo, dan sandbox.
    #
    # Core sendiri yang memutuskan sebuah host menunjuk lingkungan mana — `EnvironmentAddress`
    # membacanya, dan label yang bukan lingkungan sudah punya daftarnya sendiri di
    # `coreerp.reserved_labels`. Traefik sengaja tidak ikut memutuskan: dua tempat yang menguraikan
    # alamat yang sama akan menyimpang, dan penyimpangannya berbentuk pelanggan yang tidak dapat
    # masuk ke alamat yang dicetak sistem itu sendiri.
    core:
      rule: "Host(`erp.grenery.xyz`) || HostRegexp(`^[a-z0-9-]+\\.erp\\.grenery\\.xyz$`) || HostRegexp(`^[a-z0-9-]+\\.(demo|sandbox)\\.erp\\.grenery\\.xyz$`)"
      priority: 10
      entryPoints: [websecure]
      service: core
      tls:
        certResolver: cloudflare
        domains: *wildcard

  services:
    core:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"
        passHostHeader: true

    console:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8001"
        passHostHeader: true
