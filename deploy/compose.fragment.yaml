services:
  management-aset-api:
    image: registry.apperp.local/apps/management-aset-api:0.1.0
    environment:
      APP_ENV: production
      COREERP_URL: http://core-app
      COREERP_APP_ID: management-aset
      COREERP_SERVICE_TOKEN: ${COREERP_MANAGEMENT_ASET_SERVICE_TOKEN}
      COREERP_APP_CONTEXT_SIGNING_KEY: ${COREERP_APP_CONTEXT_SIGNING_KEY}
  management-aset-ui:
    image: registry.apperp.local/apps/management-aset-ui:0.1.0
    environment:
      API_UPSTREAM: management-aset-api
