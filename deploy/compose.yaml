services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_erp_human_resources
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_erp_human_resources"]
      interval: 5s
      timeout: 5s
      retries: 12

  app-api:
    image: registry.apperp.local/apps/human-resources-api:0.1.0
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: app-db
      DB_DATABASE: app_erp_human_resources
      DB_USERNAME: app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    depends_on:
      app-db:
        condition: service_healthy

  app-ui:
    image: registry.apperp.local/apps/human-resources-ui:0.1.0

volumes:
  app-db-data:
