name: sandbox copy verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sandbox-copy-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24' }
      - name: Check retry statechart
        run: |
          git init "$RUNNER_TEMP/pstack"
          git -C "$RUNNER_TEMP/pstack" remote add origin https://github.com/cursor/plugins.git
          git -C "$RUNNER_TEMP/pstack" fetch --depth=1 origin 4dd1d05818d19792e7cd6e818f1667f95f7e1dbe
          git -C "$RUNNER_TEMP/pstack" checkout --detach FETCH_HEAD
          curl --fail -L https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          export TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar"
          export JAVA="$(command -v java)"
          mkdir -p "$RUNNER_TEMP/copy-model"
          node "$RUNNER_TEMP/pstack/pstack/skills/statechart/scripts/worker.ts" "$RUNNER_TEMP/copy-model" "$GITHUB_WORKSPACE/.audit/sandbox-copy/CopyRetry.tla" "$GITHUB_WORKSPACE/.audit/sandbox-copy/CopyRetry.cfg" "$GITHUB_WORKSPACE/.audit/sandbox-copy/view.mjs"
          cat "$RUNNER_TEMP/copy-model/done/report.md"
          cd .audit/sandbox-copy
          java -cp "$TLA2TOOLS" tlc2.TLC -workers 1 -config Lease.cfg Lease.tla
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-copy-statechart
          path: ${{ runner.temp }}/copy-model
          retention-days: 7
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: core_erp_test, POSTGRES_USER: core_erp, POSTGRES_PASSWORD: core_erp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U core_erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: core_erp_test
      DB_TEST_USERNAME: core_erp
      DB_TEST_PASSWORD: core_erp
      DB_TEST_SCHEMA: coreerp_test
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: all
    defaults:
      run: { working-directory: apps/core }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - name: Prepare source and clients
        run: |
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-opentelemetry
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD="$DB_TEST_PASSWORD" psql -h "$DB_TEST_HOST" -U "$DB_TEST_USERNAME" -d "$DB_TEST_DATABASE" -c 'CREATE SCHEMA coreerp_test'
      - name: Prove lease regressions fail on the old code
        run: |
          git show 68d904f01991a7193acf432eb11e160158182724:apps/core/app/Platform/ControlPlane/Console/Concerns/HoldsEnvironmentOperation.php > app/Platform/ControlPlane/Console/Concerns/HoldsEnvironmentOperation.php
          git show 68d904f01991a7193acf432eb11e160158182724:apps/core/app/Platform/ControlPlane/Console/ProvisionEnvironment.php > app/Platform/ControlPlane/Console/ProvisionEnvironment.php
          set +e
          php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/EnvironmentLeaseTest.php --filter 'test_a_renewal_after_the_expiry_read_prevents_takeover|test_a_retired_worker_cannot_downgrade_a_successful_replacement' --log-junit "$RUNNER_TEMP/lease-red.xml"
          result=$?
          set -e
          git restore app/Platform/ControlPlane/Console/Concerns/HoldsEnvironmentOperation.php app/Platform/ControlPlane/Console/ProvisionEnvironment.php
          test "$result" = 1
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.environ['RUNNER_TEMP'] + '/lease-red.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 2, len(cases)
          assert all(c.find('failure') is not None and c.find('error') is None for c in cases)
          PY
      - name: Check fixed lease interleavings and controls
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/EnvironmentLeaseTest.php --log-junit "$RUNNER_TEMP/lease-green.xml"
      - name: Queue endpoint and worker serialization tests
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/QueueEnvironmentCopyTest.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: environment-lease-regression
          path: ${{ runner.temp }}/lease-*.xml
          retention-days: 14
      - name: Real copy and failure-retry regression tests
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/CopyEnvironmentTest.php
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '22', cache: npm, cache-dependency-path: docs/package-lock.json }
      - run: npm ci --prefix docs
      - run: npm run docs:build --prefix docs

