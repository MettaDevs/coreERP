name: sandbox copy verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sandbox-copy-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24' }
      - name: Check retry statechart
        run: |
          git init "$RUNNER_TEMP/pstack"
          git -C "$RUNNER_TEMP/pstack" remote add origin https://github.com/cursor/plugins.git
          git -C "$RUNNER_TEMP/pstack" fetch --depth=1 origin 4dd1d05818d19792e7cd6e818f1667f95f7e1dbe
          git -C "$RUNNER_TEMP/pstack" checkout --detach FETCH_HEAD
          curl --fail -L https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          export TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar"
          export JAVA="$(command -v java)"
          mkdir -p "$RUNNER_TEMP/copy-model"
          node "$RUNNER_TEMP/pstack/pstack/skills/statechart/scripts/worker.ts" "$RUNNER_TEMP/copy-model" "$GITHUB_WORKSPACE/.audit/sandbox-copy/CopyRetry.tla" "$GITHUB_WORKSPACE/.audit/sandbox-copy/CopyRetry.cfg" "$GITHUB_WORKSPACE/.audit/sandbox-copy/view.mjs"
          cat "$RUNNER_TEMP/copy-model/done/report.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-copy-statechart
          path: ${{ runner.temp }}/copy-model
          retention-days: 7
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: core_erp_test, POSTGRES_USER: core_erp, POSTGRES_PASSWORD: core_erp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U core_erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: core_erp_test
      DB_TEST_USERNAME: core_erp
      DB_TEST_PASSWORD: core_erp
      DB_TEST_SCHEMA: coreerp_test
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: all
    defaults:
      run: { working-directory: apps/core }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - name: Prepare source and clients
        run: |
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-opentelemetry
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD="$DB_TEST_PASSWORD" psql -h "$DB_TEST_HOST" -U "$DB_TEST_USERNAME" -d "$DB_TEST_DATABASE" -c 'CREATE SCHEMA coreerp_test'
      - name: Queue endpoint and worker serialization tests
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/QueueEnvironmentCopyTest.php
      - name: Real copy and failure-retry regression tests
        if: false # Re-run only the changed console/browser path
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Platform/ControlPlane/CopyEnvironmentTest.php
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '22' }
      - name: Prepare browser environment
        working-directory: .
        run: |
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "COPY_BROWSER_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "COREERP_CONTROL_PLANE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CONTROL_PLANE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "COREERP_URL=http://127.0.0.1:8124" >> "$GITHUB_ENV"
          echo "DB_CONNECTION=pgsql_test" >> "$GITHUB_ENV"
          echo "APP_ENV=local" >> "$GITHUB_ENV"
          echo "CACHE_STORE=file" >> "$GITHUB_ENV"
          echo "SESSION_DRIVER=file" >> "$GITHUB_ENV"
          echo "SESSION_SECURE_COOKIE=false" >> "$GITHUB_ENV"
          echo "CONSOLE_PASSWORD_LOGIN=true" >> "$GITHUB_ENV"
          echo "AUDIT_BROWSER_DIR=$RUNNER_TEMP/copy-browser" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/copy-browser" "$RUNNER_TEMP/browser"
          npm ci
          NODE_OPTIONS=--max-old-space-size=3072 npm run build --workspace @coreerp/control-plane
          cd apps/control-plane
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
      - name: Install ephemeral browser and seed fixture
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          cp .audit/sandbox-copy/browser.mjs "$RUNNER_TEMP/browser/browser.mjs"
          cd apps/core
          php ../../.audit/sandbox-copy/browser-seed.php
      - name: Click copy in real operator browser and run worker
        working-directory: .
        run: |
          cd apps/core
          php artisan serve --host=127.0.0.1 --port=8124 > "$AUDIT_BROWSER_DIR/core-server.log" 2>&1 &
          cd ../control-plane
          php artisan serve --host=127.0.0.1 --port=8123 > "$AUDIT_BROWSER_DIR/console-server.log" 2>&1 &
          cd ../..
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/login >/dev/null; then break; fi
            sleep 1
          done
          node "$RUNNER_TEMP/browser/browser.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-copy-browser
          path: ${{ runner.temp }}/copy-browser
          retention-days: 7
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '22', cache: npm, cache-dependency-path: docs/package-lock.json }
      - run: npm ci --prefix docs
      - run: npm run docs:build --prefix docs

