name: environment lease audit
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: environment-lease-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_erp_test
          POSTGRES_USER: core_erp
          POSTGRES_PASSWORD: core_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: core_erp_test
      DB_TEST_USERNAME: core_erp
      DB_TEST_PASSWORD: core_erp
      DB_TEST_SCHEMA: coreerp_test
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: all
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Prepare source and tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/environment-audit/model" "$RUNNER_TEMP/environment-audit/proof"
          echo "AUDIT_RESULTS_DIR=$RUNNER_TEMP/environment-audit/proof" >> "$GITHUB_ENV"
          git init "$RUNNER_TEMP/pstack"
          git -C "$RUNNER_TEMP/pstack" remote add origin https://github.com/cursor/plugins.git
          git -C "$RUNNER_TEMP/pstack" fetch --depth=1 origin 4dd1d05818d19792e7cd6e818f1667f95f7e1dbe
          git -C "$RUNNER_TEMP/pstack" checkout --detach FETCH_HEAD
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      - name: Explore lease interleavings with statechart
        shell: bash
        run: |
          export TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar"
          export JAVA="$(command -v java)"
          set +e
          node "$RUNNER_TEMP/pstack/pstack/skills/statechart/scripts/worker.ts" "$RUNNER_TEMP/environment-audit/model" "$GITHUB_WORKSPACE/.audit/environment-lease/Lease.tla" "$GITHUB_WORKSPACE/.audit/environment-lease/Lease.cfg" "$GITHUB_WORKSPACE/.audit/environment-lease/view.mjs"
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 1 ]; then exit "$result"; fi
          cat "$RUNNER_TEMP/environment-audit/model/done/report.md"
          echo "statechart_exit=$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Install application dependencies
        working-directory: apps/core
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-req=ext-opentelemetry
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD="$DB_TEST_PASSWORD" psql -h "$DB_TEST_HOST" -p "$DB_TEST_PORT" -U "$DB_TEST_USERNAME" -d "$DB_TEST_DATABASE" -c 'CREATE SCHEMA coreerp_test'
      - name: Replay safety rules against real PHP and PostgreSQL
        working-directory: apps/core
        run: php vendor/phpunit/phpunit/phpunit ../../.audit/environment-lease/LeaseAuditTest.php --log-junit "$RUNNER_TEMP/environment-audit/junit.xml"
      - name: Preserve model and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-lease-evidence
          path: ${{ runner.temp }}/environment-audit
          retention-days: 7
