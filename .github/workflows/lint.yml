name: linter

on:
  # Tidak ada pemicu `push` ke `main`, dan itu keputusan sadar tentang kuota.
  #
  # GitHub menjalankan `pull_request` terhadap `refs/pull/N/merge` — yaitu pull request yang
  # **sudah digabungkan** ke basisnya. Jadi menjalankan alur yang sama lagi setelah merge
  # menguji pohon yang praktis identik dengan yang barusan hijau, dan repo ini privat di paket
  # gratis: separuh kuota habis untuk mengulang hal yang sama.
  #
  # Yang dilepas: bila `main` bergerak antara run sebuah pull request dan saat ia digabungkan,
  # pohon yang diuji menjadi basi. Dengan merge berurutan oleh satu orang, jendela itu nyaris
  # nol; kalau GitHub menandai cabangnya tertinggal, jalankan ulang pemeriksaannya sebelum
  # merge.
  #
  # Konsekuensi kedua: push langsung ke `main` tanpa pull request tidak diperiksa sama sekali.
  # Tanpa daftar cabang. Pull request yang basisnya cabang fitur — pull request
  # bertumpuk, yang dipakai saat sebuah task bergantung pada task sebelumnya — tidak
  # mendapat pemeriksaan sama sekali selama daftar ini ada, dan itu tidak terlihat
  # sebagai kegagalan: halaman pull request-nya hanya kosong.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    # Alasan yang sama seperti pada alur tests: job yang menggantung berjalan enam jam pada
    # batas bawaan GitHub, dan kuota paket gratis dipakai bersama seluruh pemeriksaan lain.
    timeout-minutes: 20

    # Alasannya ditulis lengkap di alur tests. Ringkasnya: mematikan auto-instrumentation di
    # sumbernya, supaya `_register.php` keluar lebih awal dan tidak pernah sampai ke
    # `trigger_error` yang membuat langkah PHP mana pun berisik.
    env:
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: all

    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Riwayat penuh dibutuhkan satu langkah saja: penjaga baseline analisa tipe
          # membandingkan berkasnya terhadap cabang basis. Mengambilnya belakangan lewat
          # `git fetch` tidak mungkin, karena `persist-credentials: false` sengaja tidak
          # meninggalkan kredensial — dan itu keputusan yang tidak diubah demi kenyamanan
          # satu langkah.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      # `--no-scripts` di sini pilihan kecepatan yang sudah ada dan tidak berhubungan; yang
      # ditambahkan adalah pengabaian platform requirement `ext-opentelemetry`, yang ditolak
      # penyelesai dependency dengan atau tanpa script.
      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=ext-opentelemetry

      # Berjalan di akar repo, bukan di folder app. `@apperp/ui` adalah workspace npm,
      # dan lockfile yang memuatnya hanya ada satu — di akar. `npm ci` di folder app
      # tidak menemukan lockfile sama sekali sejak paket itu berhenti dibawa sebagai
      # berkas `.tgz`.
      - name: Install Node Dependencies
        run: npm ci
        working-directory: .

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Impor seperti `@/actions/...` dan `@/routes/...` menunjuk berkas buatan Wayfinder
      # yang tidak ikut di-commit. Tanpa berkasnya, resolver ESLint tidak menemukan
      # modulnya dan import/order menggolongkannya berbeda dari yang dilihat pengembang
      # di mesin sendiri, sehingga alur ini menuntut urutan yang justru ditolak `npm run
      # lint` lokal. Alur test tidak kena karena `npm run build` membuatnya sebagai efek
      # samping.
      - name: Generate Wayfinder Files
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run Pint
        run: composer lint:check

      - name: Format Frontend
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      # ESLint dan Prettier memeriksa bentuk, bukan tipe. Tanpa langkah ini, empat
      # kesalahan TS2322 berdiri di cabang utama tanpa ada yang menahannya. Berkas
      # Wayfinder harus sudah dibuat lebih dulu, karena halaman mengimpor tipe dari sana.
      - name: Check Frontend Types
        run: npm run types:check

      # Dipindah ke sini dari alur test. Analisa tipe PHP tidak bergantung versi PHP, jadi
      # menjalankannya di dalam matriks berarti mengerjakan hal yang sama dua kali dengan
      # hasil yang pasti sama. Pembangunan aset TIDAK ikut pindah: test membutuhkannya.
      - name: Run Type Analysis
        run: composer types:check

      # Baseline analisa tipe hanya boleh menyusut. Aturannya sudah lama tertulis; sampai
      # langkah ini ada, tidak satu pun mesin menegakkannya — pull request yang menambah
      # bungkaman tetap hijau dan hanya tertangkap kalau peninjau kebetulan membuka berkasnya.
      #
      # Dibandingkan per entri, bukan totalnya. Rancangan pertama membandingkan total dan
      # terbukti tidak menjaga apa pun: pada cabang yang membuang tujuh belas bungkaman,
      # menambahkan tiga bungkaman baru masih terbaca "menyusut" dan lolos.
      #
      # Riwayatnya diambil dangkal untuk basis yang dipakai membandingkan saja; `fetch-depth: 0`
      # akan mengunduh seluruh riwayat repo demi satu berkas.
      - name: Periksa baseline analisa tipe tidak bertambah
        working-directory: .
        run: node scripts/periksa-baseline-phpstan.mjs "origin/${{ github.base_ref || 'main' }}"

      # `.agents/skills` dan `.claude/skills` dibaca alat yang berbeda dan isinya sudah
      # menyimpang diam-diam sekali. Tidak ada test yang gagal karena aturan di satu
      # salinan hilang di salinan lain.
      - name: Check skill copies are in sync
        working-directory: .
        run: python3 .github/scripts/check-skill-copies.py

      # A route under internal/v1 is called by another application. No test fails when
      # one is missing from the contract, so this is the only step that notices.
      - name: Check internal API contract coverage
        run: |
          python3 -m pip install --quiet pyyaml
          python3 contracts/check-contract-coverage.py

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
