# Memasang satu RILIS ke SaaS dev dan admin.erp di server pertama.
#
# ## Tidak lagi dipicu merge ke main
#
# Sejak 15 September 2026 merge ke `main` tidak men-deploy apa pun. SaaS dev menjalankan rilis — image yang
# dirakit sekali oleh perakit, disimpan di Harbor, dan persis sama dengan yang nanti dipasang agen di server
# klien. Yang lolos di SaaS dev karena itu adalah yang dikirim. Dulu alur ini membangun image sendiri di server
# dari setiap merge, sehingga yang diuji tim bukan yang diterima klien. Alurnya lengkap di
# docs/dev/29-alur-rilis-server-klien.md.
#
# Dua cara menjalankannya:
#
# - otomatis dari alur `rilis.yml`, sesudah rilis selesai dirakit;
# - tangan, dengan nomor rilis yang sudah ada — untuk memasang ulang sesudah menyunting /etc/coreerp/saas.env,
#   atau untuk mundur ke rilis sebelumnya di SaaS dev.
#
# ## Yang TIDAK dilakukan alur ini
#
# **Tidak membangun apa pun** dan **tidak menyentuh server klien.** Server klien memilih rilisnya lewat
# admin.erp dan menariknya sendiri.
#
# **Tidak memegang sudo.** User `deploy` di server hanya anggota grup `docker` dan `coreerp`: ia dapat
# menjalankan container, membaca /etc/coreerp/saas.env dan kredensial pull-only SaaS dev, tidak lebih.

name: deploy-dev

on:
  workflow_dispatch:
    inputs:
      rilis:
        description: 'Nomor rilis yang sudah dirakit, misalnya 0.3.0'
        required: true
        type: string
  workflow_call:
    inputs:
      rilis:
        required: true
        type: string
    secrets:
      DEV_SSH_KEY:
        required: true
      DEV_KNOWN_HOSTS:
        required: true
      DEV_HOST:
        required: true
      DEV_USER:
        required: true

concurrency:
  # Dua pemasangan yang berjalan bersamaan saling menimpa stack yang sama. `cancel-in-progress` dimatikan
  # dengan sengaja: membatalkan di tengah `docker compose up` meninggalkan stack separuh jadi.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Periksa nomor rilis
        env:
          RILIS: ${{ inputs.rilis }}
        run: |
          # Nilainya dikirim ke shell di server. Diperiksa di sini supaya isian yang bukan nomor rilis tidak
          # pernah menjadi perintah.
          [[ $RILIS =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::Nomor rilis tidak sah: $RILIS"; exit 1; }

      - name: Siapkan kunci SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Kunci host dipin dari secret, BUKAN diterima begitu saja. `StrictHostKeyChecking=no` membuat alur ini
          # menyerahkan kredensialnya kepada siapa pun yang berhasil menyamar sebagai server itu.
          printf '%s\n' "${{ secrets.DEV_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Secret yang diisi `ssh-keyscan -t ed25519` pada server yang hanya punya kunci host RSA berisi baris
          # komentar saja, dan ssh lalu gagal dengan kalimat yang tidak menyebut sebabnya. Kejadian sungguhan.
          if ! grep -qE '^[^#[:space:]]+ +(ssh-(rsa|ed25519)|ecdsa-)' ~/.ssh/known_hosts; then
            echo "::error::Secret DEV_KNOWN_HOSTS tidak memuat satu pun baris kunci host."
            echo "Isi ulang dengan keluaran lengkap 'ssh-keyscan <host>' — TANPA -t."
            exit 1
          fi

      - name: Pasang rilis di server dev
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          RILIS: ${{ inputs.rilis }}
        run: |
          ssh -o BatchMode=yes "$DEV_USER@$DEV_HOST" "RILIS=$RILIS bash -seu" <<'REMOTE'
          cd /opt/coreerp

          # Repo ini dimiliki user lain, dan git menolak bekerja di repo milik orang lain sejak CVE-2022-24765.
          git config --global --add safe.directory /opt/coreerp 2>/dev/null || true

          catatan="/var/lib/coreerp-perakit/rilis/$RILIS/saas.json"
          [ -r "$catatan" ] || { echo "Rilis $RILIS belum dirakit di server ini."; exit 1; }
          commit="$(jq -r '.commit' "$catatan")"

          # Compose, migrasi, dan skrip pemasangnya diambil dari commit rilis itu sendiri — bukan dari main —
          # supaya image dan berkas yang menjalankannya selalu satu commit.
          git fetch --quiet origin
          git checkout -q --detach "$commit"
          bash deploy/saas/pasang-rilis.sh "$RILIS"
          REMOTE
