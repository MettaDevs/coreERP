name: contracts

# Kontrak adalah janji ke kode yang tidak kita kendalikan, dan tidak ada satu tes
# pun yang gagal ketika sebuah endpoint absen darinya. Alur ini satu-satunya yang
# memperhatikan.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --quiet pyyaml

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # `route:list` mem-boot aplikasi, jadi ia butuh env dan app key. Tidak ada
      # database yang disentuh: daftar rute dibaca dari router, bukan dari data.
      - name: Prepare application
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      # Berkas gabungan ikut di-commit supaya perkakas yang tidak dapat
      # menyelesaikan $ref lintas berkas tetap terlayani. Kalau ia tertinggal dari
      # sumbernya di src/, konsumen membaca janji yang sudah tidak berlaku.
      - name: Check the bundled spec matches its source
        run: |
          python contracts/bundle.py
          git diff --exit-code contracts/openapi.yaml || {
            echo "::error::contracts/openapi.yaml tertinggal dari contracts/src/. Jalankan 'python contracts/bundle.py' lalu commit hasilnya."
            exit 1
          }

      - name: Check contract coverage
        run: python contracts/check-contract-coverage.py
