# Batas worker dibuat eksplisit agar hasil load test dapat diulang dan agar jumlah
# koneksi database per instance dapat dihitung terhadap max_connections Postgres.
#
# Dengan DB_PERSISTENT=true setiap worker memegang satu koneksi database, jadi
# MaxRequestWorkers x jumlah instance tidak boleh melebihi max_connections Postgres.
# 48 x 4 instance = 192 koneksi, di bawah max_connections=300.
#
# Instance yang melayani request dibuktikan lewat $upstream_addr pada nginx, bukan header app.
<IfModule mpm_prefork_module>
    StartServers 48
    MinSpareServers 24
    MaxSpareServers 48
    MaxRequestWorkers 48
    MaxConnectionsPerChild 0
</IfModule>
