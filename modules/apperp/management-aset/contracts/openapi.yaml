    GroupAsetFields:
      description: |
        Perlakuan finansial yang melekat pada group; padanan field pada "Fixed asset group"
        di Dynamics 365 F&O. Seluruhnya opsional supaya tenant yang belum memetakan
        perlakuan pajaknya tetap dapat membuat group.

        Sifat harta (berwujud, tidak berwujud, hak guna) tidak ada di sini. Klasifikasi itu
        menentukan akun, dan akun ditentukan posting profile milik Finance; aset yang perlu
        dibedakan sifatnya dibedakan dengan group tersendiri. Field lama `major_type` ditolak
        bila masih dikirim.
      type: object
      properties:
        kelompok_harta_fiskal_id:
          description: Referensi aturan fiskal berversi milik tenant yang dipakai group ini.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        property_type:
          description: |
            Apakah perolehan disajikan di neraca. `inventory_item` tetap diinventarisasi
            tetapi tidak dikapitalisasi; padanan `Continuing property` di F&O dan barang
            ekstrakomptabel pada penatausahaan barang di Indonesia.
          type:
          - string
          - 'null'
          enum:
          - fixed_asset
          - inventory_item
          - other
          - null
        asset_location_id:
          description: |
            Lokasi bawaan saat aset diterima. Hanya nilai awal; lokasi yang berlaku tetap
            hidup pada aset dan penempatannya, dan tidak pernah dibaca ulang dari group.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        capitalization_threshold:
          description: |
            Perolehan di bawah nilai ini tetap dicatat sebagai aset, tetapi bukunya tidak
            menyusut. Ambang ini tidak membatalkan pencatatan aset.
          type:
          - string
          - 'null'
          format: decimal
