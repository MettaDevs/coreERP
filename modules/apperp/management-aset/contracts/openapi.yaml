# DIBANGKITKAN OLEH contracts/bundle.py - JANGAN DISUNTING LANGSUNG.
# Sunting contracts/src/ lalu jalankan: python contracts/bundle.py
openapi: 3.1.0
info:
  title: Management Aset API
  version: 0.1.0
  description: |
    Master data aset. Seluruh endpoint dibatasi tenant dan policy
    `management-aset.asset-responsibility` pada token konteks yang ditandatangani
    Core; `tenant_id` tidak pernah diterima dari request browser. Claim policy
    berisi pasangan legal entity dan operating unit (`scope_grants`), sehingga
    dua grant tidak dapat membentuk kombinasi organisasi baru.

    Kode setiap master diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
    Arsip memakai soft delete agar record yang direferensikan data turunan tidak hilang.

    Klasifikasi aset mengikuti model Dynamics 365 F&O: seluruh master klasifikasi datar
    dan saling lepas, dan aset menunjuk masing-masing secara langsung. `group aset`
    membawa perlakuan finansial (penyusutan, GL, penomoran), `jenis aset` membawa
    perlakuan teknis (maintenance, atribut), dan `model aset` adalah katalog barang per
    pabrikan. Tidak ada rantai berjenjang yang wajib diisi, sehingga tenant dengan
    kedalaman klasifikasi berbeda tidak dipaksa mengisi tingkat yang tidak mereka punya.

    Yang hierarkis hanya data, bukan skema: lokasi aset dan komposisi aset (`parent_asset_id`)
    menunjuk dirinya sendiri sedalam yang dibutuhkan tenant. Keduanya struktur domain milik
    app ini, bukan organization hierarchy CoreERP.
servers:
- url: /
security:
- CoreERPContext: []
tags:
- name: Master data
  description: Master aset dan master maintenance.
- name: Lifecycle aset
  description: Dokumen lifecycle aset, register, mutasi, dan pelepasan tanpa jurnal GL.
- name: Penyusutan
  description: Proposal dan finalisasi penyusutan beserta bridge internal tanpa posting GL.
- name: Reference data
  description: Referensi konfigurasi yang dibaca oleh form dan proses Management Aset.
- name: Laporan
  description: Definisi, layout bawaan, dan dataset laporan yang dipanggil Core atas nama pengguna.
paths:
  /api/v1/health:
    get:
      security: []
      operationId: health
      summary: Memeriksa kesiapan API
      responses:
        '200':
          description: API siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/context:
    get:
      operationId: currentContext
      summary: Membaca hak akses pengguna pada aplikasi
      responses:
        '200':
          description: Konteks sudah diverifikasi gateway
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - permissions
                    properties:
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/reference-data/units-of-measure:
    get:
      tags:
      - Reference data
      operationId: listCoreUnitsOfMeasure
      summary: Menampilkan satuan aktif dari Core untuk dipilih dalam transaksi aset
      responses:
        '200':
          description: Daftar satuan aktif
        '503':
          description: Layanan satuan Core belum dapat dihubungi
  /api/v1/reference-data/kelompok-harta-fiskal:
    get:
      tags:
      - Reference data
      operationId: listFiscalClassifications
      summary: Menampilkan referensi klasifikasi fiskal aktif untuk Group aset
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/ActiveFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar referensi klasifikasi fiskal tenant aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalClassificationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/analisa-maintenance:
    get:
      tags:
      - Master data
      operationId: listAnalisaMaintenance
      summary: Menampilkan analisa maintenance
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/ActiveFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar analisa maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Master data
      operationId: createAnalisaMaintenance
      summary: Membuat analisa maintenance dengan kode dari Number Sequence Core
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisaMaintenanceCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '201':
          description: Analisa maintenance dibuat
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/analisa-maintenance/{id}:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: getAnalisaMaintenance
      summary: Membaca satu analisa maintenance
      responses:
        '200':
          description: Analisa maintenance ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Master data
      operationId: updateAnalisaMaintenance
      summary: Mengubah nama, keterangan, atau status analisa maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisaMaintenancePatch'
      responses:
        '200':
          description: Analisa maintenance diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - Master data
      operationId: archiveAnalisaMaintenance
      summary: Mengarsipkan analisa maintenance
      responses:
        '204':
          description: Analisa maintenance diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
