  /api/v1/validasi-status-work-order:
    get:
      tags:
      - Master data
      operationId: listWorkOrderStatusValidations
      summary: Aturan yang harus dipenuhi sebelum work order boleh berpindah ke satu status. Barisnya matriks tetap status
        x aturan yang disemai saat tenant disiapkan; tidak ada tambah dan tidak ada hapus.
      responses:
        '200':
          description: Daftar aturan validasi status
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Master data
      operationId: replaceWorkOrderStatusValidations
      summary: Mengubah keaktifan dan tingkat keparahan aturan. Keparahan `informasi` hanya dicatat, `peringatan` membiarkan
        transisi berjalan tetapi tersimpan pada jejak status, dan `error` menolak transisi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - aturan
              properties:
                aturan:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - status
                    - aturan
                    - aktif
                    - keparahan
                    properties:
                      status:
                        type: string
                        enum:
                        - dijadwalkan
                        - dikerjakan
                        - selesai
                        - ditutup
                      aturan:
                        type: string
                        enum:
                        - checklist_wajib
                        - sebab_kerusakan
                        - tindakan_perbaikan
                      aktif:
                        type: boolean
                      keparahan:
                        type: string
                        enum:
                        - informasi
                        - peringatan
                        - error
      responses:
        '200':
          description: Aturan tersimpan
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/aset:
    get:
      tags:
      - Lifecycle aset
      operationId: listAset
      summary: Menampilkan register aset tenant aktif
      responses:
        '200':
          description: Register aset
  /api/v1/aset/{id}:
    get:
      tags:
      - Lifecycle aset
      operationId: showAset
      summary: Menampilkan satu aset beserta nilai atribut jenisnya
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Aset beserta atributnya
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Lifecycle aset
      operationId: updateAset
      summary: Mengoreksi data aset; group tidak dapat diganti dan nilai perolehan terkunci setelah ada periode penyusutan
      description: |
        Field yang tidak dikirim tidak berubah. `acquisition_value` dan `residual_value` paling banyak dua
        desimal, seperti kolom register-nya.

        **Koreksi nilai perolehan** (feed posting finance, area 12). Bila `acquisition_value` berbeda dari
        nilai sekarang, `reason` wajib (maks. 250 karakter, ikut ke keterangan jurnal) dan
        `adjustment_date` wajib: tanggal hari koreksi dilakukan menurut jam pengguna (`Y-m-d`), yang hanya
        diterima bila berjarak paling jauh satu hari dari tanggal server. Selisihnya terbit sebagai
        `asset.acquisition_adjustment` (`AST-ADJ-<id aset>-<nomor urut>`) di transaksi yang sama, merujuk
        jurnal perolehan aset itu lewat `adjusts_posting_id` dan memakai akun lawan jurnal itu: hutang
        atau perantara menurut mode yang tercatat di jurnal asal, lawan hibah, atau penyeimbang saldo awal.
        Selisih yang lebih halus dari presisi mata uang ditolak 422.

        Jawaban membawa `adjustment`: `null` bila nilai perolehan tidak berubah, atau
        `{note, posting}`. `posting` berisi `{posting_id, status}` jurnal koreksi yang terbit; `null`
        bersama `note` yang menjelaskan sebabnya bila aset tidak punya jurnal perolehan, atau bila jurnal
        perolehannya dicatat manual — koreksinya juga dicatat manual di aplikasi finance, dan register tetap
        berubah.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Field aset yang dikoreksi, ditambah `version` bila header `If-Match` tidak dikirim.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Aset diperbarui; `data.version` berisi versi terbaru
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersionOrAsetLocked'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/VersionRequired'
        '500':
          description: Jurnal koreksi gagal diterbitkan karena kesalahan sistem (`error.code` = `posting_failed`); tidak ada
            yang berubah
  /api/v1/aset/{id}/pratinjau-koreksi:
    get:
      tags:
      - Lifecycle aset
      operationId: previewAsetAcquisitionAdjustment
      summary: Pratinjau jurnal koreksi nilai perolehan sebelum disimpan
      description: |
        Tanpa menyimpan apa pun. Butuh izin `management-aset.aset.update`. `data` berisi `before`,
        `after`, `difference`, `currency_code`, `blockers` (daftar `{field, message}` — aset sudah dilepas,
        sudah ada periode penyusutan, tanggal koreksi di luar hari ini, atau selisih lebih halus dari
        presisi), `note` (kenapa tidak ada jurnal, bila begitu), dan `posting`: jurnal koreksi yang akan
        terbit `{posting_id, status, posting_date, currency, total, lines, problems}`, atau `null`. Alasan
        yang masih kosong tidak menjadi penghalang di sini; ia baru diwajibkan saat menyimpan.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: acquisition_value
        in: query
        required: true
        schema:
          type: number
          minimum: 0
      - name: adjustment_date
        in: query
        required: false
        description: Tanggal hari ini menurut jam pengguna.
        schema:
          type: string
          format: date
      - name: reason
        in: query
        required: false
        schema:
          type: string
          maxLength: 250
      responses:
        '200':
          description: Pratinjau koreksi
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Jurnal koreksi tidak dapat disusun karena kesalahan sistem (`error.code` = `posting_failed`)
  /api/v1/aset/{id}/history:
    get:
      tags:
      - Lifecycle aset
      operationId: asetHistory
      summary: Membaca histori penempatan efektif aset tanpa mengubah histori lama
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Aset dan histori penempatan
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/aset/{id}/riwayat-perubahan:
    get:
      tags:
      - Lifecycle aset
      operationId: asetChangeHistory
      summary: Membaca riwayat perubahan per field aset dari log perubahan Core, terbaru lebih dulu
      description: |
        Hanya field yang dicatat setelan log perubahan tenant (bawaannya status, nama, lokasi, unit penanggung
        jawab, kondisi, dan arsip). Hak baca dan cakupan unit penanggung jawab sama dengan membuka asetnya.
        `user_name` kosong berarti perubahan oleh sistem. `*_display` berisi nama lokasi, kondisi, unit kerja,
        atau label status; kosong berarti nilai mentahnya yang ditampilkan.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Satu halaman riwayat perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeHistoryPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/perencanaan-aset:
    get:
      tags:
      - Perencanaan aset
      operationId: listAsetPlans
      summary: Menampilkan rencana aset tenant aktif
      responses:
        '200':
          description: Daftar rencana aset
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
