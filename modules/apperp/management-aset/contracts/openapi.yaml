                `management-aset.model-aset.read`.
              type: integer
              minimum: 0
              nullable: true
            asset_count:
              description: |
                Aset yang memakai jenis ini, dibatasi tanggung jawab organisasi pemanggil.
                `null` bila pemanggil tidak memegang `management-aset.aset.read`.
              type: integer
              minimum: 0
              nullable: true
    JenisAsetAtributDefinisi:
