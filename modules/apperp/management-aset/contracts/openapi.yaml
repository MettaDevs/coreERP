    get:
      tags:
      - Master data
      operationId: listJenisAsetAtribut
      summary: Menampilkan atribut yang menempel pada satu jenis aset
      responses:
        '200':
          description: Daftar atribut yang menempel pada satu jenis aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetAtributList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Master data
      operationId: replaceJenisAsetAtribut
      summary: Mengganti seluruh atribut yang menempel pada satu jenis aset
      description: |
        Disunting di dalam form pemiliknya, jadi memakai permission pemilik dan bukan
        permission tersendiri. Saat disimpan, daftar yang dikirim menggantikan seluruh
        baris lama. Baris yang tidak disertakan diarsipkan. Permintaan yang sama dapat
        diulang tanpa efek tambahan sehingga tidak memerlukan header idempotency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JenisAsetAtributReplace'
      responses:
        '200':
          description: Daftar setelah diganti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetAtributList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/jenis-aset/{id}/atribut-definisi:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: getJenisAsetAtributDefinisi
      summary: Menampilkan definisi atribut jenis aset beserta pilihan nilainya
      description: |
        Bentuk siap render untuk form penerimaan aset: tiap atribut sudah membawa tipe
        data, satuan, batas nilai, penanda wajib, dan daftar pilihannya.
      responses:
        '200':
          description: Definisi atribut jenis aset tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetAtributDefinisi'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/jenis-aset/{id}/detail:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: getJenisAsetDetail
      summary: Menampilkan jumlah data yang menggantung pada satu jenis aset
      description: |
        Angka untuk panel detail jenis aset. Berdiri sendiri, bukan bagian respons master,
        supaya daftar tidak menghitung apa pun dan tiap angka dapat menegakkan izin
        resource-nya sendiri.

        `atribut_count` memakai permission jenis aset karena atribut memang milik jenis aset
        dan disunting di dalam formnya. `model_count` dan `asset_count` adalah isi resource
        lain, jadi keduanya bernilai `null` bila pemanggil tidak memegang
        `management-aset.model-aset.read` / `management-aset.aset.read` — `null`, bukan 0,
        karena 0 adalah pernyataan bahwa tidak ada. `asset_count` juga dibatasi tanggung
        jawab organisasi pemanggil, sama seperti jalur baca aset lainnya.
      responses:
        '200':
          description: Jumlah turunan jenis aset tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jenis-aset/{id}/models:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    put:
      tags:
      - Master data
      operationId: replaceJenisAsetModels
      summary: Mengganti seluruh model yang dikaitkan ke satu jenis aset
      description: |
        Relasi disunting dari sisi pemiliknya, yaitu jenis aset. Katalog model dan pabrikan
        tidak dibuat atau diubah di sini; endpoint ini hanya memindahkan keanggotaan.

        Isinya menggantikan, bukan menambah: model yang sebelumnya terkait tetapi tidak ada
        pada `model_ids` akan dilepas. Kirim array kosong untuk melepas semuanya.

        Memerlukan `management-aset.jenis-aset.update` sekaligus `management-aset.model-aset.read`,
        karena tindakannya mengubah jenis aset tetapi membaca isi resource model. Satu model
        hanya boleh dimiliki satu jenis aset; mengaitkan model yang sudah dipegang jenis aset
        lain ditolak sebagai galat validasi, bukan dipindahkan diam-diam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model_ids
              properties:
                model_ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Daftar model yang kini terkait
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - model_ids
                    properties:
                      model_ids:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ulid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/tipe-atribut/{id}/nilai:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: listTipeAtributNilai
      summary: Menampilkan pilihan nilai satu tipe atribut
      responses:
        '200':
          description: Daftar pilihan nilai satu tipe atribut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipeAtributNilaiList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Master data
      operationId: replaceTipeAtributNilai
      summary: Mengganti seluruh pilihan nilai satu tipe atribut
      description: |
        Disunting di dalam form pemiliknya, jadi memakai permission pemilik dan bukan
        permission tersendiri. Saat disimpan, daftar yang dikirim menggantikan seluruh
        pilihan lama. Pilihan yang tidak disertakan diarsipkan. Daftar kosong membuat
        atribut kembali menjadi teks bebas. Daftar nonkosong ditolak bila tidak mencakup
        seluruh nilai aset yang masih tersimpan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipeAtributNilaiReplace'
      responses:
        '200':
          description: Daftar setelah diganti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipeAtributNilaiList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AttributeValuesInUse'
        '422':
          $ref: '#/components/responses/ValidationError'
