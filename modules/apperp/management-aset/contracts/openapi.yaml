  /api/v1/penerimaan-aset/impor-saldo-awal:
    post:
      tags:
      - Penerimaan aset
      operationId: importOpeningBalanceReceipts
      summary: Impor saldo awal aset lama dari CSV menjadi draf penerimaan saldo awal
      description: |
        `multipart/form-data`: `file` (CSV, paling besar 2 MB), `legal_entity_id`,
        `responsible_org_unit_id`, `receiving_org_unit_id` (opsional), `currency_code` (bawaan
        `IDR`), dan `apply`. Tanpa `apply` hasilnya pratinjau dan tidak ada yang disimpan; dengan
        `apply=1` draf benar-benar dibuat, semuanya atau tidak sama sekali, dan `Idempotency-Key`
        wajib — percobaan ulang dengan kunci yang sama memulangkan draf yang sudah dibuat dengan
        header `Idempotent-Replayed: true`.

        Kolom berkas: `tanggal`, `tanggal_siap_pakai`, `lokasi`, `nama`, `group`, `jenis`,
        `kondisi`, `jumlah`, `nilai_per_unit`, `residu_per_unit`, `akumulasi_per_unit`,
        `periode_berjalan`, `keterangan`, ditambah `akumulasi_per_unit:<KODE BUKU>` dan
        `periode_berjalan:<KODE BUKU>` untuk buku yang angkanya berbeda. Master ditulis dengan
        kodenya. Berkas bertitik koma dibaca seperti Excel berbahasa Indonesia (titik ribuan, koma
        desimal); berkas berkoma memakai titik desimal. Tanggal `2022-01-15` atau `15/01/2022`.

        Baris yang tanggal perolehan, tanggal siap pakai, dan lokasinya sama menjadi satu draf.
        Setiap draf melewati aturan yang sama persis dengan `POST /penerimaan-aset`, dan
        kesalahannya dilaporkan per nomor baris berkas. Draf yang lahir tetap draf: jurnal saldo
        awalnya terbit saat tiap draf diselesaikan.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyTransaksi'
      responses:
        '200':
          description: |
            `data: {status, rows, receipts, rejected}`. `status` `preview` untuk pemeriksaan,
            `rejected` bila `apply` diminta tetapi ada baris yang ditolak (tidak ada yang dibuat),
            atau `applied` untuk permintaan ulang. `receipts` pada pratinjau berisi `{tanggal,
            tanggal_siap_pakai, lokasi, lines, jumlah_aset, nilai, akumulasi}`; `rejected` berisi
            `{line, field, reason}`.
        '201':
          description: Draf dibuat; `data.status` `applied` dan `receipts` berisi `{id, kode, tanggal, tanggal_siap_pakai,
            status}`.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Formulir tidak lengkap, berkas bukan CSV, atau `Idempotency-Key` tidak dikirim saat `apply`.
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/penerimaan-aset/impor-saldo-awal/templat:
    get:
      tags:
      - Penerimaan aset
      operationId: openingBalanceImportTemplate
      summary: Baris judul templat impor saldo awal
      responses:
        '200':
          description: Berkas CSV berisi baris judul kolom impor saldo awal.
          content:
            text/csv:
              schema:
                type: string
        '403':
