          type: array
          items:
            $ref: '#/components/schemas/TipeLokasiAset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    LokasiAsetFields:
      type: object
      properties:
        parent_id:
          description: Lokasi induk pada tenant yang sama dan belum diarsipkan. Kosong berarti lokasi akar; perpindahan yang
            membentuk siklus ditolak.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        tipe_lokasi_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        org_unit_id:
          description: |
            Unit organisasi Core yang menjadi dimensi keuangan aset di lokasi ini; padanan
            toggle "Update asset dimension" di F&O. Disimpan sebagai ID opaque tanpa foreign
            key, karena unit organisasi dimiliki Core.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alamat_id:
          description: |
            Tempat beralamat pos di buku alamat Core (Address pada functional location D365).
            Kosong berarti mewarisi alamat lokasi induk terdekat yang punya alamat. Id yang tidak
            ada di buku alamat tenant aktif ditolak 422.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        departemen_bawaan_id:
          description: |
            Unit kerja Core yang mengisi unit penanggung jawab aset saat aset diterima atau
            dimutasi ke lokasi ini, bila dokumennya tidak menyebut unit. Kosong berarti mewarisi
            lokasi induk terdekat yang mengisinya. Berbeda dari `org_unit_id` (dimensi keuangan).
            Unit yang tidak ada di tenant aktif ditolak 422.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    LokasiAsetAlamat:
      type: object
      required:
      - id
      - nama
      - alamat
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        nama:
          type: string
          description: Nama tempat di buku alamat.
        alamat:
          type: string
          description: Alamat tercetak, beberapa baris dipisah baris baru.
    LokasiAsetWarisanSumber:
      description: Lokasi pemilik nilai yang diwarisi; `null` bila nilainya milik lokasi ini sendiri.
      oneOf:
      - $ref: '#/components/schemas/MasterSummary'
      - type: 'null'
    LokasiAset:
      description: |
        Pohon lokasi fisik aset; padanan "Functional location" di Dynamics 365 F&O. Ia
        mereferensikan dirinya sendiri lewat `parent_id`, jadi kedalamannya ditentukan data
        tenant dan bukan skema. Sengaja terpisah dari struktur organisasi Core: "di mana
        benda ini" dan "siapa yang bertanggung jawab" berubah karena sebab yang berbeda.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/LokasiAsetFields'
      - type: object
        required:
        - parent
        - tipe_lokasi
        - alamat
        - alamat_efektif
        - departemen_bawaan_nama
        - departemen_bawaan_efektif
        properties:
          parent:
            oneOf:
            - $ref: '#/components/schemas/MasterSummary'
            - type: 'null'
          tipe_lokasi:
            oneOf:
            - $ref: '#/components/schemas/MasterSummary'
            - type: 'null'
          alamat:
            description: Alamat milik lokasi ini sendiri, diterjemahkan saat dibaca.
            oneOf:
            - $ref: '#/components/schemas/LokasiAsetAlamat'
            - type: 'null'
          alamat_efektif:
            description: Alamat yang berlaku, milik sendiri atau warisan lokasi induk terdekat.
            oneOf:
            - allOf:
              - $ref: '#/components/schemas/LokasiAsetAlamat'
              - type: object
                required:
                - diwarisi_dari
                properties:
                  diwarisi_dari:
                    $ref: '#/components/schemas/LokasiAsetWarisanSumber'
            - type: 'null'
          departemen_bawaan_nama:
            type: string
            nullable: true
          departemen_bawaan_efektif:
            description: Unit kerja bawaan yang berlaku, milik sendiri atau warisan lokasi induk terdekat.
            oneOf:
            - type: object
              required:
              - id
              - nama
              - diwarisi_dari
              properties:
                id:
                  $ref: '#/components/schemas/Ulid'
                nama:
                  type: string
                  nullable: true
                diwarisi_dari:
                  $ref: '#/components/schemas/LokasiAsetWarisanSumber'
            - type: 'null'
    LokasiAsetCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/LokasiAsetFields'
    LokasiAsetPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/LokasiAsetFields'
    LokasiAsetResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/LokasiAset'
    LokasiAsetList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LokasiAset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ProfilPenyusutanFields:
      description: |
        Aturan penyusutan yang dapat dipakai ulang lintas aset; padanan "Depreciation profile"
        di Dynamics 365 F&O. Field mana yang wajib bergantung pada `method`:
        `useful_life_periods` untuk garis lurus dan saldo menurun, `rate_percent` untuk
        saldo menurun, `manual_schedule` untuk metode manual. `effective_from` dan
        `effective_to` membatasi versi profil; nilai null berarti tidak dibatasi pada sisi itu.
      type: object
      properties:
        method:
          type: string
          enum:
          - straight_line
          - straight_line_life_remaining
          - reducing_balance
          - manual
          - consumption
        frequency:
          type: string
          enum:
          - monthly
          - quarterly
          - half_yearly
          - yearly
        year_basis:
          type: string
          enum:
          - calendar
          - fiscal
        effective_from:
          description: Tanggal mulai profil ini berlaku; null berarti berlaku sejak awal.
          type:
          - string
          - 'null'
          format: date
        effective_to:
          description: Tanggal terakhir profil ini berlaku; null berarti belum berakhir.
          type:
          - string
          - 'null'
          format: date
        convention:
          description: Belum dibaca mesin penyusutan; diaktifkan bersama buku penyusutan.
          type:
          - string
          - 'null'
          maxLength: 40
        useful_life_periods:
          type:
          - integer
          - 'null'
          minimum: 1
        rate_percent:
          type:
          - string
          - 'null'
          format: decimal
        manual_schedule:
          oneOf:
          - type: array
            items:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  minimum: 0
          - type: 'null'
    ProfilPenyusutan:
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
    ProfilPenyusutanResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ProfilPenyusutan'
    ProfilPenyusutanList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfilPenyusutan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BukuPenyusutanFields:
      type: object
      properties:
        posting_layer:
          description: |
            Lapisan posting buku ini, dan satu-satunya saklar posting (K-15): buku `none`
            (memorandum) dihitung dan dilaporkan tetapi tidak pernah di-post ke aplikasi finance;
            lapisan lain di-post. Buku fiskal lazimnya `none`, supaya penyusutan aset yang sama tidak
            dijurnal dua kali. Field `export_to_backoffice` yang dulu ada ditolak dengan 422.
          type: string
          enum:
          - current
          - operations
          - tax
          - none
          default: current
        round_off_depreciation:
          description: Kelipatan nominal pembulatan penyusutan. Nol berarti tanpa pembulatan.
          type:
          - number
          - 'null'
          minimum: 0
          format: decimal
        depreciation_profile_id:
          description: Profil utama buku; boleh kosong bila setiap group memberi profil pada matriksnya.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alternative_profile_id:
          description: Profil pengganti saat saldo menurun sudah kalah dari garis lurus sisa umur.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    BukuPenyusutan:
      description: |
        Buku penyusutan; padanan "Book" di Dynamics 365 F&O. Satu aset dapat memiliki
        beberapa buku sekaligus, lazimnya satu komersial dan satu fiskal, dan tiap buku
        melacak nilai aset secara mandiri dengan aturannya sendiri.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/BukuPenyusutan'
    BukuPenyusutanList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BukuPenyusutan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    GroupBukuPenyusutanRow:
      description: |
        Satu baris matriks group x buku; padanan "Fixed asset group/book" di F&O. Nilainya
        adalah sumber konfigurasi efektif yang disalin ke buku aset saat aset diterima, bukan
        acuan hidup: mengubah matriks tidak menulis ulang aset yang sudah berjalan. Profil
        utama harus berasal dari baris ini atau header buku sebelum aset dapat ditempatkan.
      type: object
      required:
      - buku_id
      properties:
        buku_id:
          $ref: '#/components/schemas/Ulid'
        depreciation_profile_id:
          description: Profil utama untuk group ini. Kosong berarti memakai profil utama buku.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alternative_profile_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        useful_life_periods:
          type:
          - integer
          - 'null'
          minimum: 1
        convention:
          description: Perlakuan periode pertama, dihitung dari tanggal aset mulai digunakan.
          type:
          - string
          - 'null'
          enum:
          - none
          - full_month
          - half_year
          - mid_quarter
          - mid_month_1st
          - mid_month_15th
          - half_year_start_of_year
          - half_year_next_year
          - null
        depreciate:
          description: Aset dari group ini mendapat buku tersebut tetapi tidak disusutkan bila `false`.
          type: boolean
          default: true
        round_off_depreciation:
          description: |
            Kelipatan nominal pembulatan untuk group dan book ini. Null berarti mengikuti
            nilai pada Book; periode terakhir tetap memakai sisa nilai tanpa pembulatan.
          type:
          - number
          - 'null'
          minimum: 0
          format: decimal
    GroupBukuPenyusutanReplace:
      description: Daftar penuh baris matriks; baris yang tidak disertakan diarsipkan.
      type: object
      required:
      - rows
      properties:
        version:
          $ref: '#/components/schemas/VersionField'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GroupBukuPenyusutanRow'
    GroupBukuPenyusutanList:
      type: object
      required:
      - data
      - version
      properties:
        version:
          description: Versi group aset pemilik matriks; kirim sebagai `version` saat menyimpan matriksnya.
          $ref: '#/components/schemas/RecordVersion'
        data:
          type: array
          items:
            allOf:
            - type: object
              required:
              - id
              properties:
                id:
                  $ref: '#/components/schemas/Ulid'
            - $ref: '#/components/schemas/GroupBukuPenyusutanRow'
    PostingGroupAsetAccounts:
      type: object
      description: |
        Delapan akun jurnal satu group aset, masing-masing id daftar akun referensi Core (`AccountDirectory`),
        bukan nomornya. `null` berarti belum dipetakan; posting yang membutuhkannya tertahan di Core.

        Pada permintaan PUT body juga membawa `version` (atau kirim header `If-Match`): versi baris yang
        dibuka pengguna, dan 0 bila barisnya untuk tanggal berlaku yang belum ada. Pada jawaban `version`
        berisi versi baris sesudah disimpan.
      additionalProperties: false
      properties:
        version:
          $ref: '#/components/schemas/VersionField'
        acquisition_account_id:
          description: Harga perolehan. Wajib.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        accumulated_depreciation_account_id:
          description: Akumulasi penyusutan. Wajib.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        depreciation_expense_account_id:
          description: Beban penyusutan. Wajib.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        payable_account_id:
          description: Lawan hutang untuk mode `direct_payable`, bawaan setiap entitas legal. Wajib.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        clearing_account_id:
          description: Perantara, hanya untuk entitas legal bermode `clearing`.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        input_vat_account_id:
          description: PPN Masukan, hanya untuk penerimaan yang membawa PPN.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        opening_balance_offset_account_id:
          description: Penyeimbang saldo awal, hanya untuk saldo awal saat cutover.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        grant_offset_account_id:
          description: Lawan hibah, hanya untuk penerimaan dengan cara perolehan `hibah`; hibah tidak dikreditkan ke hutang.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        write_down_account_id:
          description: Akumulasi penurunan nilai (BC Write-Down Account), dikreditkan saat penurunan nilai diposting dan dibalik
            saat aset dilepas.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        write_down_expense_account_id:
          description: Beban penurunan nilai (BC Write-Down Expense Acc.), akun laba rugi.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        appreciation_account_id:
          description: Kenaikan nilai aset (BC Appreciation Account), didebit saat kenaikan nilai diposting dan dibalik saat
            aset dilepas.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        appreciation_offset_account_id:
          description: Lawan kenaikan nilai (BC Appreciation Bal. Account), lazimnya surplus revaluasi.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        disposal_proceeds_account_id:
          description: Hasil penjualan aset (BC Sales Bal. Acc.), didebit sebesar nilai jual saat penjualan diposting.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        disposal_gain_account_id:
          description: Laba pelepasan (BC Gains Acc. on Disposal), akun laba rugi.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        disposal_loss_account_id:
          description: Rugi pelepasan (BC Losses Acc. on Disposal), akun laba rugi; juga menerima seluruh nilai buku aset
            yang dimusnahkan.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    PostingGroupAsetRow:
      allOf:
      - type: object
        required:
        - group_aset_id
        - effective_from
        - missing
        - version
        properties:
          group_aset_id:
            $ref: '#/components/schemas/Ulid'
          version:
            $ref: '#/components/schemas/RecordVersion'
          effective_from:
            type: string
            format: date
          missing:
            description: Akun wajib yang masih kosong di baris ini, urut seperti kolom matriks.
            type: array
            items:
              type: string
      - $ref: '#/components/schemas/PostingGroupAsetAccounts'
    PostingGroupAsetRowResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PostingGroupAsetRow'
    PostingGroupAsetMatrix:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - today
          - accounts
          - groups
          - groups_needing_attention
          - account_details
          properties:
            today:
              type: string
              format: date
            accounts:
              description: Kolom matriks, urut, dengan label dan apakah akunnya wajib.
              type: array
              items:
                type: object
                required:
                - column
                - label
                - required
                properties:
                  column:
                    type: string
                  label:
                    type: string
                  required:
                    type: boolean
            groups:
              type: array
              items:
                type: object
                required:
                - id
                - kode
                - nama
                - aktif
                - current
                - rows
                - missing
                - unusable_accounts
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  kode:
                    type: string
                  nama:
                    type: string
                  aktif:
                    type: boolean
                  current:
                    description: Baris yang berlaku hari ini, atau `null`.
                    oneOf:
                    - $ref: '#/components/schemas/PostingGroupAsetRow'
                    - type: 'null'
                  rows:
                    description: Seluruh baris yang belum diarsipkan, tanggal berlaku terbaru lebih dulu.
                    type: array
                    items:
                      $ref: '#/components/schemas/PostingGroupAsetRow'
                  missing:
                    description: Akun wajib yang kosong pada baris yang berlaku; seluruh akun wajib bila belum ada baris.
                    type: array
                    items:
                      type: string
                  unusable_accounts:
                    description: 'Kolom baris yang berlaku yang menunjuk akun yang tidak bisa dipakai posting: tidak ada lagi
                      di daftar akun, nonaktif, atau kini khusus satu entitas legal. Hanya terjadi bila daftar akun berubah
                      sesudah dipetakan; posting yang memakainya tertahan di Core.'
                    type: array
                    items:
                      type: string
            groups_needing_attention:
              description: 'Jumlah group yang posting-nya akan tertahan dengan baris yang berlaku hari ini: `missing` atau
                `unusable_accounts`-nya tidak kosong.'
              type: integer
            account_details:
              description: Akun yang dipakai matriks, berkunci id.
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ReferenceAccount'
    ReferenceAccount:
      type: object
      description: Satu akun dari daftar akun referensi Core (K-05).
      required:
      - id
      - external_id
      - code
      - name
      - type
      - active
      - legal_entity_id
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        external_id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - balance_sheet
          - profit_loss
        active:
          type: boolean
        legal_entity_id:
          description: '`null` berarti berlaku untuk semua entitas legal tenant.'
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    ReferenceAccountList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceAccount'
    TipeAtributFields:
      type: object
      properties:
        data_type:
          description: |
            Tipe dasar nilai, terpisah dari batasannya. `string` tanpa Values menjadi teks
            bebas dan dengan Values menjadi dropdown. `decimal`/`integer` tanpa min/max
            menerima angka bebas dan dengan min/max menegakkan rentang.
          type: string
          enum:
          - string
          - decimal
          - integer
          - date
          - boolean
        satuan_id:
          description: |
            Satuan milik Core yang dirujuk atribut ini. Hanya bermakna untuk `decimal` dan
            `integer`; dikirim untuk tipe lain akan ditolak. Inilah yang ditulis klien —
            `satuan` tidak diterima sebagai masukan.
          type:
          - string
          - 'null'
          format: ulid
        satuan:
          description: |
            Kode satuan hasil rujukan di atas, disalin saat disimpan supaya layar dapat
            menampilkan "cm" tanpa menghubungi Core. Hanya keluaran; kiriman diabaikan.
          readOnly: true
          type:
          - string
          - 'null'
          maxLength: 50
        min_value:
          description: Batas minimum opsional. Wajib diisi bersama `max_value` dan hanya berlaku untuk decimal/integer.
          type:
          - string
          - 'null'
          format: decimal
        max_value:
          description: Batas maksimum opsional. Wajib diisi bersama `min_value` dan hanya berlaku untuk decimal/integer.
          type:
          - string
          - 'null'
          format: decimal
        values_count:
          description: Jumlah Values yang belum diarsipkan. Hanya keluaran.
          readOnly: true
          type: integer
          minimum: 0
        jenis_aset_count:
          description: Jumlah jenis aset yang masih memasang atribut ini. Hanya keluaran.
          readOnly: true
          type: integer
          minimum: 0
        data_type_locked:
          description: Bernilai benar setelah atribut pernah berhasil disimpan pada aset. Hanya keluaran.
          readOnly: true
          type: boolean
    TipeAtribut:
      description: |
        Padanan "Attribute type" di Dynamics 365 F&O. Inilah cara menambah pembeda aset
        tanpa menambah tingkat klasifikasi baru: tenant membuat atributnya sendiri,
        menempelkannya ke jenis aset, dan aset mewarisinya.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/TipeAtributFields'
      - type: object
        required:
        - data_type
        - satuan_id
        - satuan
        - min_value
        - max_value
        - values_count
        - jenis_aset_count
        - data_type_locked
    TipeAtributCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/TipeAtributFields'
      - type: object
        required:
        - data_type
    TipeAtributPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/TipeAtributFields'
    TipeAtributResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/TipeAtribut'
    TipeAtributList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TipeAtribut'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    TipeAtributNilaiReplace:
      description: Daftar penuh pilihan nilai; pilihan yang tidak disertakan diarsipkan.
      type: object
      required:
      - rows
      properties:
        version:
          $ref: '#/components/schemas/VersionField'
        rows:
          type: array
          items:
            type: object
            required:
            - nilai
            properties:
              nilai:
                type: string
                maxLength: 150
              urutan:
                type: integer
                minimum: 0
                default: 0
    TipeAtributNilaiList:
      type: object
      required:
      - data
      - version
      properties:
        version:
          description: Versi tipe atribut pemilik pilihan nilai; kirim sebagai `version` saat menyimpannya.
          $ref: '#/components/schemas/RecordVersion'
        data:
          type: array
          items:
            type: object
            required:
            - id
            - nilai
            - urutan
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              nilai:
                type: string
              urutan:
                type: integer
    JenisAsetAtributReplace:
      description: Daftar penuh atribut yang menempel pada jenis aset ini.
      type: object
      required:
      - rows
      properties:
        version:
          $ref: '#/components/schemas/VersionField'
        rows:
          type: array
          items:
            type: object
            required:
            - tipe_atribut_id
            properties:
              tipe_atribut_id:
                $ref: '#/components/schemas/Ulid'
              wajib:
                type: boolean
                default: false
              urutan:
                type: integer
                minimum: 0
                default: 0
    JenisAsetAtributList:
      type: object
      required:
      - data
      - version
      properties:
        version:
          description: Versi jenis aset pemilik atribut; kirim sebagai `version` saat menyimpannya.
          $ref: '#/components/schemas/RecordVersion'
        data:
          type: array
          items:
            type: object
            required:
            - id
            - tipe_atribut_id
            - wajib
            - urutan
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              tipe_atribut_id:
                $ref: '#/components/schemas/Ulid'
              wajib:
                type: boolean
              urutan:
                type: integer
    JenisAsetDetail:
      description: |
        Jumlah data yang menggantung pada satu jenis aset, untuk kotak angka pada panel
        detailnya. `null` berarti pemanggil tidak berhak membaca resource tersebut, dan
        sengaja dibedakan dari 0 yang berarti benar-benar tidak ada.
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - version
          - atribut_count
          - model_count
          - aset_count
          properties:
            version:
              description: |
                Versi jenis aset. Daftar model pada panel ini disimpan lewat `PUT /api/v1/jenis-aset/{id}/models`
                dengan versi ini.
              $ref: '#/components/schemas/RecordVersion'
            atribut_count:
              description: Tipe atribut yang terpasang pada jenis aset ini.
              type: integer
              minimum: 0
            model_count:
              description: |
                Model aset yang memakai jenis ini. `null` bila pemanggil tidak memegang
                `management-aset.model-aset.read`.
              type: integer
              minimum: 0
              nullable: true
            aset_count:
              description: |
                Aset yang memakai jenis ini, dibatasi tanggung jawab organisasi pemanggil.
                `null` bila pemanggil tidak memegang `management-aset.aset.read`.
              type: integer
