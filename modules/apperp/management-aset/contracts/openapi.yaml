                  type: string
                  maxLength: 2000
                  description: Wajib diisi ketika tujuannya adalah dibatalkan.
                  nullable: true
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Status berpindah
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version sudah berubah
        '422':
          description: Transisi tidak sah, atau syarat isi data belum terpenuhi — misalnya masih ada pemeriksaan wajib yang
            kosong, atau sebab dan tindakan belum diisi pada tipe work order yang mewajibkannya.
  /api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/checklist:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    get:
      tags:
      - Pemeliharaan aset
      operationId: getWorkOrderChecklist
      summary: Membaca baris checklist satu baris pekerjaan
      responses:
        '200':
          description: Baris checklist beserta nilai dan penanda pemeriksaannya
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Pemeliharaan aset
      operationId: saveWorkOrderChecklist
      summary: Menyimpan hasil pemeriksaan sekaligus. Hanya nilai, penanda tidak berlaku, dan catatan teknisi yang dapat diubah;
        nama, tipe, satuan, dan penanda wajib adalah salinan prosedur dan tidak dapat disunting dari lapangan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - baris
              properties:
                baris:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        $ref: '#/components/schemas/Ulid'
                      nilai:
                        type: string
                        maxLength: 255
                        nullable: true
                      tidak_berlaku:
                        type: boolean
                      catatan_teknisi:
                        type: string
                        maxLength: 2000
                        nullable: true
      responses:
        '200':
          description: Hasil pemeriksaan tersimpan
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Pekerjaan belum berstatus dikerjakan, ada baris yang bukan milik pekerjaan ini, atau nilai di luar
            pilihan yang ditetapkan variabelnya.
  /api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/execution:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    patch:
      tags:
      - Pemeliharaan aset
      operationId: saveWorkOrderJobExecution
      summary: Menyimpan jam aktual, sebab kerusakan, dan tindakan perbaikan pada baris pekerjaan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aktual_jam:
                  type: number
                  minimum: 0
                  maximum: 999999.99
                  nullable: true
                sebab_kerusakan_id:
                  allOf:
                  - $ref: '#/components/schemas/Ulid'
                  nullable: true
                tindakan_perbaikan_id:
                  allOf:
                  - $ref: '#/components/schemas/Ulid'
                  nullable: true
                sebab_kerusakan_keterangan:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Wajib bila sebab kerusakan yang dipilih meminta keterangan.
                tindakan_perbaikan_keterangan:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Wajib bila tindakan perbaikan yang dipilih meminta keterangan.
      responses:
        '200':
          description: Hasil pelaksanaan tersimpan
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Pekerjaan belum dapat menerima hasil pelaksanaan atau referensi tidak valid
  /api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/checklist/dari-template:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    post:
      tags:
      - Pemeliharaan aset
      operationId: copyWorkOrderChecklistFromTemplate
      summary: Menyalin baris template checklist ke baris pekerjaan. Baris bertipe template dimekarkan menjadi isinya dan
        dinomori ulang berurutan, sehingga teknisi melihat satu daftar datar. Salinan bersifat snapshot; perubahan template
        setelahnya tidak mengubah pemeriksaan yang sudah dikerjakan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - template_id
              properties:
                template_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '201':
          description: Baris checklist tersalin; baris sebelumnya pada pekerjaan ini digantikan
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Pekerjaan sudah dimulai, atau template belum memiliki baris pemeriksaan
  /api/v1/pemeliharaan-aset/{id}:
    get:
      tags:
      - Pemeliharaan aset
      operationId: showWorkOrder
      summary: Menampilkan satu work order beserta baris pekerjaan dan jejak perpindahan statusnya
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Work order, baris pekerjaan, dan status log
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Pemeliharaan aset
      operationId: updateWorkOrder
      summary: Mengubah work order draf dengan version saat ini. Baris pekerjaan diganti seluruhnya, dan itulah sebabnya perubahan
        hanya sah selama status masih draf.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WorkOrderWrite'
              - type: object
                required:
                - version
                properties:
                  version:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Work order diperbarui
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version sudah berubah
        '422':
          description: Work order tidak lagi berstatus draf, atau payload tidak lolos validasi
    delete:
      tags:
      - Pemeliharaan aset
      operationId: archiveWorkOrder
      summary: Mengarsipkan work order draf atau yang sudah dibatalkan tanpa menghapus data fisik
      parameters:
      - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        '204':
          description: Work order diarsipkan
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version sudah berubah
        '422':
          description: Hanya work order draf atau yang sudah dibatalkan yang dapat diarsipkan
  /api/v1/penyusutan/proposal:
    post:
      tags:
      - Penyusutan
      operationId: proposeDepreciation
      summary: Membuat proposal penyusutan satu Asset Book tanpa jurnal GL
      responses:
        '201':
          description: Proposal dibuat
  /api/v1/penyusutan/proposal-massal:
    post:
      tags:
      - Penyusutan
      operationId: proposeDepreciationBulk
      summary: Membuat proposal penyusutan seluruh Asset Book aktif satu periode sekaligus tanpa jurnal GL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - period_starts_on
              - period_ends_on
              properties:
                period_starts_on:
                  type: string
                  format: date
                period_ends_on:
                  type: string
                  format: date
                group_aset_id:
                  type: string
                  nullable: true
                  description: Menjalankan hanya untuk aset dari satu group.
                buku_id:
                  type: string
                  nullable: true
                  description: Menjalankan hanya untuk satu buku, misalnya komersial lebih dahulu.
      responses:
        '201':
          description: Ringkasan proposal. Buku yang tidak dapat diusulkan dilewati beserta alasannya, bukan menggagalkan
            seluruh proses.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/penyusutan:
    get:
      tags:
      - Penyusutan
      operationId: listDepreciationPeriods
      summary: Menampilkan periode penyusutan tenant aktif
      responses:
        '200':
          description: Daftar periode
  /api/v1/penyusutan/buku:
    get:
      tags:
      - Penyusutan
      operationId: listAssetBooksForDepreciation
      summary: Menampilkan Asset Book aktif yang dapat dihitung penyusutannya
      responses:
        '200':
          description: Daftar Asset Book
  /api/v1/penyusutan/{id}/finalisasi:
    post:
      tags:
      - Penyusutan
      operationId: finalizeDepreciation
      summary: Mengunci subledger periode dan mengembalikan bridge internal tanpa posting GL
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Periode final; retry mengembalikan data yang sama tanpa export kedua
  /api/v1/penyusutan/{id}/reversal:
    post:
      tags:
      - Penyusutan
      operationId: reverseDepreciation
      summary: Membuat pembalikan baru untuk periode final tanpa mengubah periode asal
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '201': null
        description: Pembalikan dan bridge internal dibuat tanpa posting GL
        '409':
          description: Periode tidak dapat dibalik
  /api/internal/v1/laporan/{kode}:
    get:
      tags:
      - Laporan
      operationId: internalShowReport
      summary: Definisi laporan untuk Core; placeholder, parameter, dan layout bawaan
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      responses:
        '200':
          description: Definisi laporan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LaporanDefinisi'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/v1/laporan/{kode}/layouts/{key}:
    get:
      tags:
      - Laporan
      operationId: internalDownloadBuiltinLayout
      summary: Berkas layout bawaan yang ikut release app
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]+$
      responses:
        '200':
          description: Berkas .docx atau .xlsx
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/v1/laporan/{kode}/dataset:
    post:
      tags:
      - Laporan
      operationId: internalReportDataset
      summary: Dataset laporan untuk diisi ke layout oleh Core
      description: Parameter divalidasi dengan aturan laporan; scope organisasi ditegakkan dengan `OrganizationScope` yang
        sama seperti endpoint detailnya. Record yang tidak ada atau di luar scope dijawab 422 dengan `message` yang layak
        ditampilkan ke pengguna.
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parameter
              properties:
                parameter:
                  type: object
                  description: '`work-order` menuntut `id`; `daftar-work-order` menerima `status`, `dari`, `sampai`.'
                  additionalProperties: true
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LaporanDataset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Parameter tidak valid, atau record tidak ada / di luar scope (`message`)
components:
  securitySchemes:
    CoreERPContext:
      type: http
      scheme: bearer
      bearerFormat: CoreERP context token
      description: Token singkat bertanda tangan yang diterbitkan Web Shell untuk aplikasi ini.
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kunci stabil per percobaan pembuatan; retry dengan kunci sama tidak menerbitkan nomor baru.
        Batas 133 karakter: Core membatasi idempotency_key pada 160 dan kunci yang diteruskan ke sana
        diawali slug resource, sehingga slug master terpanjang (`item-checklist-maintenance`, 26) plus
        `:` menyisakan 133.
      schema:
        type: string
        maxLength: 133
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyTransaksi:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, tetapi untuk endpoint transaksi yang slug resource-nya lebih
        pendek sehingga menyisakan 154 karakter.
      schema:
        type: string
        maxLength: 154
        pattern: ^[A-Za-z0-9._:-]+$
    Search:
      name: q
      in: query
      description: Mencari pada kode atau nama.
      schema:
        type: string
        maxLength: 100
    ActiveFilter:
      name: aktif
      in: query
      schema:
        type: boolean
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PabrikanAsetFilter:
      name: pabrikan_aset_id
      in: query
      description: Membatasi daftar pada satu pabrikan aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    JenisAsetFilter:
      name: jenis_aset_id
      in: query
      description: Membatasi daftar pada satu jenis aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    ParentLokasiAsetFilter:
      name: parent_id
      in: query
      description: Membatasi daftar pada anak langsung satu lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    TipeLokasiAsetFilter:
      name: tipe_lokasi_id
      in: query
      description: Membatasi daftar pada satu tipe lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    KodeLaporan:
      name: kode
      in: path
      required: true
      description: Kode laporan seperti pada katalog `GET /laporan`, misalnya `work-order`.
      schema:
        type: string
        pattern: ^[a-z0-9-]+$
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    AssetPlanningDetailWrite:
      type: object
      required:
      - jenis_aset_id
      - satuan_id
      - quantity
      - requested_specification
      properties:
        jenis_aset_id:
          $ref: '#/components/schemas/Ulid'
        satuan_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
        quantity:
          type: number
          exclusiveMinimum: 0
        requested_specification:
          type: string
          maxLength: 2000
          example: RAM 16 GB, SSD 512 GB
        estimated_unit_price:
          type: number
          minimum: 0
    AssetPlanningWrite:
      type: object
      required:
      - legal_entity_id
      - planning_org_unit_id
      - planned_on
      - planning_year
      - planning_type
      - details
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        planning_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        planned_on:
          type: string
          format: date
        planning_year:
          type: integer
          minimum: 2000
          maximum: 2100
        planning_type:
          type: string
          enum:
          - regular
          - additional
        funding_source:
          type: string
          maxLength: 250
          nullable: true
        description:
          type: string
          maxLength: 2000
          nullable: true
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssetPlanningDetailWrite'
    WorkOrderWrite:
      type: object
      description: Work order pemeliharaan. Aset tidak berada di header melainkan pada setiap baris pekerjaan, sehingga satu
        perintah kerja dapat mencakup beberapa aset. Sebab kerusakan dan tindakan perbaikan tidak diterima di sini karena
        keduanya adalah temuan saat pengerjaan, bukan bagian dari rencana.
      required:
      - legal_entity_id
      - responsible_org_unit_id
      - tipe_work_order_id
      - details
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        tipe_work_order_id:
          $ref: '#/components/schemas/Ulid'
        tingkat_layanan_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          nullable: true
        keterangan:
          type: string
          maxLength: 2000
          nullable: true
        penanggung_jawab_user_id:
          type: string
          maxLength: 64
          nullable: true
        diharapkan_mulai:
          type: string
          format: date-time
          nullable: true
        diharapkan_selesai:
          type: string
          format: date-time
          nullable: true
        dijadwalkan_mulai:
          type: string
          format: date-time
          nullable: true
        dijadwalkan_selesai:
          type: string
          format: date-time
          nullable: true
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkOrderJobWrite'
    WorkOrderJobWrite:
      type: object
      description: Satu baris pekerjaan; lokasi aset disalin server sebagai snapshot saat baris dibuat.
      required:
      - asset_id
      - maintenance_job_type_id
      properties:
        asset_id:
          $ref: '#/components/schemas/Ulid'
        maintenance_job_type_id:
          $ref: '#/components/schemas/Ulid'
        variant_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          description: Wajib berasal dari jenis pekerjaan pada baris yang sama.
          nullable: true
        trade_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          nullable: true
        ditugaskan_ke_user_id:
          type: string
          maxLength: 64
          nullable: true
        dijadwalkan_mulai:
          type: string
          format: date-time
          nullable: true
        dijadwalkan_selesai:
          type: string
          format: date-time
          nullable: true
        estimasi_jam:
          type: number
          minimum: 0
          maximum: 9999
          nullable: true
        catatan:
          type: string
          maxLength: 2000
          nullable: true
    HealthResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              const: ready
    PaginationMeta:
      type: object
      required:
      - current_page
      - last_page
      - per_page
      - total
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    FiscalClassification:
      description: |
        Referensi aturan fiskal tenant yang berversi. Record ini bukan master bisnis dan
        tidak memiliki nomor urut; `template_key` dipakai untuk seed idempoten. Group aset
        menyimpan ID record ini, sedangkan aset menyimpan snapshot ID saat diterima.
      type: object
      required:
      - id
      - template_key
      - jurisdiction
      - label
      - effective_from
      - allow_reducing_balance
      - depreciable
      - aktif
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        template_key:
          type: string
          maxLength: 160
        jurisdiction:
          type: string
          maxLength: 32
        label:
          type: string
          maxLength: 150
        display_label:
          type: string
          description: Label siap tampil yang membedakan versi berdasarkan tanggal berlaku.
        regulation_reference:
          type:
          - string
          - 'null'
          maxLength: 250
        effective_from:
          type: string
          format: date
        effective_to:
          type:
          - string
          - 'null'
          format: date
        useful_life_years:
          type:
          - integer
          - 'null'
          minimum: 1
        straight_line_rate_percent:
          type:
          - string
          - 'null'
          format: decimal
        reducing_balance_rate_percent:
          type:
          - string
          - 'null'
          format: decimal
        allow_reducing_balance:
          type: boolean
        depreciable:
          type: boolean
        aktif:
          type: boolean
    FiscalClassificationList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FiscalClassification'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    AttributeValuesConflictResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - conflicting_count
          - conflicting_values
          properties:
            code:
              type: string
              const: attribute_values_in_use
            message:
              type: string
            conflicting_count:
              type: integer
              minimum: 1
            conflicting_values:
              type: array
              maxItems: 20
              items:
                type: string
    MasterSummary:
      description: Ringkasan induk untuk ditampilkan tanpa permintaan tambahan. Induk yang sudah diarsipkan tetap disertakan.
      type: object
      required:
      - id
      - kode
      - nama
      properties:
        id:
