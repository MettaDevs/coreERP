    TipeLokasiAset:
      description: |
        Tingkatan lokasi yang dipakai tenant; padanan "Functional location type" di
        Dynamics 365 F&O. Datar: kedalaman pohon lokasi ditentukan data, bukan tipe.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
    TipeLokasiAsetCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
    TipeLokasiAsetPatch:
      allOf:
