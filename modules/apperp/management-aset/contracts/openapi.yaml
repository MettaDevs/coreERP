  /api/v1/kpi-pemeliharaan:
    get:
      tags:
      - Downtime dan KPI
      operationId: getMaintenanceKpis
      description: |
        KPI pemeliharaan per aset, jenis aset, atau lokasi untuk satu periode (tanggal zona pengguna, inklusif,
        paling panjang 400 hari; bawaan awal bulan ini sampai hari ini). Dihitung saat dibaca. Rumusnya di
        halaman fitur Downtime dan KPI pemeliharaan; ringkasnya: availability = (total − downtime) ÷ total × 100,
        MTBF = total ÷ kerusakan (tanpa kerusakan = total), MTTR = jam perbaikan ÷ kerusakan (tanpa kerusakan =
        jam perbaikan). Kalender 24 jam; periode yang melewati saat ini dihitung sampai saat ini.
      parameters:
      - name: dari
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: sampai
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: kelompok
        in: query
        required: false
        schema:
          type: string
          enum:
          - aset
          - jenis
          - lokasi
          default: aset
      - name: legal_entity_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
      - $ref: '#/components/parameters/JenisAsetFilter'
      - name: lokasi_aset_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: aset_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: KPI per kelompok dan totalnya
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceKpiRow'
                  meta:
                    type: object
                    properties:
                      dari:
                        type: string
                        format: date
                      sampai:
                        type: string
                        format: date
                      zona_waktu:
                        type: string
                      kelompok:
                        type: string
                      total:
                        $ref: '#/components/schemas/MaintenanceKpiFigures'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
