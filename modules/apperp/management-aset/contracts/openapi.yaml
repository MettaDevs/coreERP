      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar group aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
