                type: boolean
              urutan:
                type: integer
    JenisAsetDetail:
      description: |
        Jumlah data yang menggantung pada satu jenis aset, untuk kotak angka pada panel
        detailnya. `null` berarti pemanggil tidak berhak membaca resource tersebut, dan
