  /api/v1/penerimaan-aset:
    get:
      tags:
      - Penerimaan aset
      operationId: listAsetReceipts
      summary: Menampilkan dokumen penerimaan dalam jangkauan organisasi pengguna
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - selesai
      - name: dari
        in: query
        required: false
        description: Batas bawah tanggal terima, `YYYY-MM-DD`.
        schema:
          type: string
          format: date
      - name: sampai
        in: query
        required: false
        description: Batas atas tanggal terima, `YYYY-MM-DD`.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: |
            Daftar penerimaan. `jumlah_baris` adalah banyaknya baris barang, `jumlah_aset`
            adalah total unit yang datang — angka kedua itulah yang dicocokkan dengan surat
            jalan, dan keduanya berbeda begitu satu baris berjumlah lebih dari satu.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Penerimaan aset
      operationId: createAsetReceipt
      summary: Membuat draf penerimaan; belum ada aset yang lahir sampai diselesaikan
      description: |
        Kepala dokumen membawa `cara_perolehan` (`pembelian`, `hibah`, atau `saldo_awal`; bawaan
        `pembelian`), `vendor_id` (vendor Core milik entitas legal yang sama),
        `vendor_invoice_reference`, dan `vendor_invoice_date`. Baris membawa `nilai_per_unit` dan
        `ppn_per_unit`, keduanya boleh memakai presisi harga satuan mata uangnya (IDR bawaan 3
        desimal), tidak lebih halus.

        **Saldo awal** (area 10, K-27, K-28) adalah aset lama saat cutover. `tanggal` berisi tanggal
        perolehan aslinya dan tidak boleh sesudah cutover entitas legal; vendor, faktur, dan PPN
        tidak berlaku. Baris membawa `akumulasi_per_unit` (presisi nilai mata uang) dan
        `periode_berjalan` — jumlah periode yang sudah disusutkan sampai cutover — untuk buku yang
        di-post ke finance, sekaligus bawaan setiap buku lain. Buku yang angkanya berbeda, lazimnya
        buku fiskal, ditulis di `saldo_awal_buku: [{buku_id, akumulasi_per_unit, periode_berjalan}]`.
        Akumulasi ditambah residu tidak boleh melebihi nilai per unit, dan periode berjalan tidak
        boleh melebihi masa manfaat buku yang memakainya. Dokumen selain saldo awal tidak boleh
        membawa angka-angka itu.

        `responsible_org_unit_id` boleh kosong bila `lokasi_aset_id` punya unit kerja bawaan
        (milik sendiri atau warisan lokasi induk terdekat); unit itulah yang dipakai. Bila keduanya
        kosong, 422 pada `responsible_org_unit_id`. Aturan yang sama berlaku pada `PATCH`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyTransaksi'
      responses:
        '200':
          description: 'Permintaan ulang dengan kunci idempotensi yang sama; header `Idempotent-Replayed: true`'
        '201':
          description: Draf penerimaan dibuat, nomor diterbitkan Number Sequence Core
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: |
            Master di luar tenant, kombinasi pabrikan x model x jenis tidak sah, atau nilai
            atribut tidak sesuai definisi jenis asetnya. Atribut diperiksa sudah di sini,
            bukan menunggu penyelesaian: draf yang lolos padahal mustahil diselesaikan adalah
            jebakan yang baru terbuka setelah tombol terakhir ditekan. Juga vendor milik entitas
            legal lain, mata uang yang presisinya belum disetel, harga satuan atau PPN per unit
            yang lebih halus dari presisi harga satuannya, dan pelanggaran aturan saldo awal di atas
            (kuncinya menunjuk baris dan bukunya, misalnya `details.0.saldo_awal_buku.1.buku_id`).
  /api/v1/penerimaan-aset/vendor:
    get:
