# DIBANGKITKAN OLEH contracts/bundle.py - JANGAN DISUNTING LANGSUNG.
# Sunting contracts/src/ lalu jalankan: python contracts/bundle.py
openapi: 3.1.0
info:
  title: Management Aset API
  version: 0.1.0
  description: |
    Master data aset. Seluruh endpoint dibatasi tenant dan policy
    `management-aset.asset-responsibility` pada token konteks yang ditandatangani
    Core; `tenant_id` tidak pernah diterima dari request browser. Claim policy
    berisi pasangan legal entity dan operating unit (`scope_grants`), sehingga
    dua grant tidak dapat membentuk kombinasi organisasi baru.

    Kode setiap master diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
    Arsip memakai soft delete agar record yang direferensikan data turunan tidak hilang.

    Klasifikasi aset mengikuti model Dynamics 365 F&O: seluruh master klasifikasi datar
    dan saling lepas, dan aset menunjuk masing-masing secara langsung. `group aset`
    membawa perlakuan finansial (penyusutan, GL, penomoran), `jenis aset` membawa
    perlakuan teknis (maintenance, atribut), dan `model aset` adalah katalog barang per
    pabrikan. Tidak ada rantai berjenjang yang wajib diisi, sehingga tenant dengan
    kedalaman klasifikasi berbeda tidak dipaksa mengisi tingkat yang tidak mereka punya.

    Yang hierarkis hanya data, bukan skema: lokasi aset dan komposisi aset (`induk_aset_id`)
    menunjuk dirinya sendiri sedalam yang dibutuhkan tenant. Keduanya struktur domain milik
    app ini, bukan organization hierarchy CoreERP.

    **Versi baris (edit bersamaan).** Setiap data yang sudah ada membawa `version` (integer, hanya
    dibaca), dan jawaban GET detailnya mengirim header `ETag` berbentuk `W/"<n>"` dengan angka yang
    sama. Setiap PATCH, PUT, dan DELETE atas data yang sudah ada, serta aksi atas dokumen yang sudah
    ada (`/selesaikan`, `/batal`, `/status`, `/checklist/dari-template`), wajib membawa versi itu:
    header `If-Match: W/"<n>"` atau field `version` pada body (bila keduanya ada, header yang dipakai).
    Tanpa versi permintaan ditolak 428 `version_required`; versi yang sudah tertinggal ditolak 409
    `stale_version` dan tidak ada yang tersimpan. Himpunan anak yang diganti utuh (atribut jenis aset,
    nilai tipe atribut, matriks group x buku, model per jenis aset, baris checklist, dan sejenisnya)
    memakai versi pemiliknya, yang dikirim GET-nya sebagai `version` di samping `data` (atau `data.version`
    pada panel jenis aset dan jawaban `PUT /jenis-aset/{id}/models`). Baris posting group yang belum ada
    dikirim dengan versi 0.

    Setiap penyimpanan menaikkan versi, biasanya dua sekaligus dan bukan satu, jadi angkanya tidak
    berarti apa-apa selain "berbeda". Klien wajib memakai `version` dari jawaban terakhir, bukan
    menghitung sendiri dari versi sebelumnya.
servers:
- url: /
security:
- CoreERPContext: []
tags:
- name: Master data
  description: Master aset dan master maintenance.
- name: Lifecycle aset
  description: Dokumen lifecycle aset, register, mutasi, serta penjualan dan pemusnahan yang diposting beserta jurnal pelepasannya.
- name: Penerimaan aset
  description: Dokumen penerimaan aset; satu kedatangan barang, banyak aset. Satu-satunya pintu masuk ke register.
- name: Mutasi aset
  description: Berita acara serah terima aset; memindahkan lokasi dan tanggung jawab, bukan dimensi keuangan per buku.
- name: Monitoring aset
  description: Pemeriksaan fisik aset di satu lokasi; mencatat dan membekukan temuan tanpa mengubah register.
- name: Pemeliharaan preventif
  description: Counter aset, rencana pemeliharaan, dan usulan jadwal yang diubah menjadi work order.
- name: Permintaan pemeliharaan
  description: Laporan kerusakan dari unit; diajukan, diterima atau ditolak, lalu dibuatkan satu work order.
- name: Asuransi aset
  description: Jenis asuransi, polis, dan pertanggungan aset per periode; ringkasan aset yang belum atau kurang diasuransikan.
- name: Garansi dan kontrak servis
  description: Garansi per aset dan kontrak servis vendor; daftar yang akan berakhir dan pemberitahuan untuk work order.
- name: Downtime dan KPI
  description: Pencatatan downtime aset dan KPI pemeliharaan yang dihitung saat dibaca.
- name: Penyesuaian nilai aset
  description: Penurunan nilai (write-down) dan kenaikan nilai (appreciation) atas satu buku penyusutan, beserta jurnalnya
    ke aplikasi finance.
- name: Reklasifikasi aset
  description: Pindah group aset dan pecah aset, beserta jurnal pemindahan saldonya antar group ke aplikasi finance.
- name: Penyusutan
  description: Proposal, finalisasi, dan pembalikan penyusutan, serta "Post penyusutan" yang mengirim jurnal ringkasnya ke
    aplikasi finance.
- name: Reference data
  description: Referensi konfigurasi yang dibaca oleh form dan proses Management Aset.
- name: Laporan
  description: Definisi, layout bawaan, dan dataset laporan yang dipanggil Core atas nama pengguna.
paths:
  /api/v1/health:
    get:
      security: []
      operationId: health
      summary: Memeriksa kesiapan API
      responses:
        '200':
          description: API siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/context:
    get:
      operationId: currentContext
      summary: Membaca hak akses pengguna pada aplikasi
      responses:
        '200':
          description: Konteks sudah diverifikasi gateway
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - permissions
                    properties:
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/reference-data/units-of-measure:
    get:
      tags:
      - Reference data
      operationId: listCoreUnitsOfMeasure
      summary: Menampilkan satuan aktif dari Core untuk dipilih dalam transaksi aset
      responses:
        '200':
          description: Daftar satuan aktif
        '503':
          description: Layanan satuan Core belum dapat dihubungi
  /api/v1/reference-data/kelompok-harta-fiskal:
    get:
      tags:
      - Reference data
      operationId: listFiscalClassifications
      summary: Menampilkan referensi klasifikasi fiskal aktif untuk Group aset
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/ActiveFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar referensi klasifikasi fiskal tenant aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalClassificationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reference-data/unit-kerja:
    get:
      tags:
      - Reference data
      operationId: listOperatingUnits
      summary: Unit kerja tenant milik Core, untuk dropdown yang menampilkan nama
      description: |
        Modul menyimpan id unit kerja sebagai teks opaque dan tidak pernah menanyakannya
        ke database Core; daftar ini dibaca lewat kontrak `OrganizationDirectory` di dalam
        proses yang sama. Ia ada supaya layar berhenti meminta pengguna mengetik ULID.

        Izinnya menumpang izin layar yang memakainya — mutasi, register aset, pemeliharaan,
        monitoring, atau lokasi aset — sama seperti daftar satuan.
      responses:
        '200':
          description: Daftar unit kerja; `kode` disamakan dengan `nama` karena Core tidak memulangkan kode unit
        '403':
          description: Pengguna tidak memegang satu pun izin layar yang memakai daftar ini
  /api/v1/reference-data/alamat:
    get:
      tags:
      - Reference data
      operationId: listAddresses
      summary: Alamat dari buku alamat Core, untuk dipilih pada lokasi aset
      description: |
        Tempat beralamat pos milik tenant aktif, dibaca lewat kontrak `AddressDirectory`. Modul
        menyimpan id tempatnya saja; nama dan alamat diterjemahkan saat dibaca. Butuh
        `management-aset.lokasi-aset.read`.

        Dengan `unit_kerja_id`, yang dipulangkan hanya alamat utama unit kerja itu (nol atau satu
        baris) — saran alamat saat lokasi diberi unit kerja bawaan.
      parameters:
      - name: unit_kerja_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Daftar alamat dengan `id`, `kode` (= nama), `nama`, `alamat`, dan `display_label`
        '403':
          description: Pengguna tidak memegang izin lihat lokasi aset
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/reference-data/anggota:
    get:
      tags:
      - Reference data
      operationId: listTenantMembers
      summary: Anggota tenant milik Core, berkunci id pengguna
      description: |
        `id` adalah id **pengguna**, bukan id keanggotaan, karena itulah yang dibawa
        konteks permintaan dan yang tersimpan pada kolom penanggung jawab modul ini.
      responses:
        '200':
          description: Daftar anggota dengan nama dan email
        '403':
          description: Pengguna tidak memegang satu pun izin layar yang memakai daftar ini
  /api/v1/analisa-maintenance:
    get:
      tags:
      - Master data
      operationId: listAnalisaMaintenance
      summary: Menampilkan analisa maintenance
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/ActiveFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar analisa maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Master data
      operationId: createAnalisaMaintenance
      summary: Membuat analisa maintenance dengan kode dari Number Sequence Core
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisaMaintenanceCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '201':
          description: Analisa maintenance dibuat
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/analisa-maintenance/{id}:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: getAnalisaMaintenance
      summary: Membaca satu analisa maintenance
      responses:
        '200':
          description: Analisa maintenance ditemukan
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Master data
      operationId: updateAnalisaMaintenance
      summary: Mengubah nama, keterangan, atau status analisa maintenance
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisaMaintenancePatch'
      responses:
        '200':
          description: Analisa maintenance diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisaMaintenanceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/VersionRequired'
    delete:
      tags:
      - Master data
      operationId: archiveAnalisaMaintenance
      summary: Mengarsipkan analisa maintenance
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '204':
          description: Analisa maintenance diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /api/v1/group-aset:
    get:
      tags:
      - Master data
      operationId: listGroupAset
      summary: Menampilkan group aset
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/ActiveFilter'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar group aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Master data
      operationId: createGroupAset
      summary: Membuat group aset
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAsetCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '201':
          description: Group aset dibuat
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/group-aset/{id}:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: getGroupAset
      summary: Membaca satu group aset
      responses:
        '200':
          description: Group aset ditemukan
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Master data
      operationId: updateGroupAset
      summary: Mengubah nama, keterangan, atau status group aset
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAsetPatch'
      responses:
        '200':
          description: Group aset diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/VersionRequired'
    delete:
      tags:
      - Master data
      operationId: archiveGroupAset
      summary: Mengarsipkan group aset
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '204':
          description: Group aset diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersionOrReferencedByChildren'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /api/v1/group-aset/{id}/buku-penyusutan:
    parameters:
    - $ref: '#/components/parameters/RecordId'
    get:
      tags:
      - Master data
      operationId: listGroupBukuPenyusutan
      summary: Menampilkan matriks buku penyusutan satu group aset
      responses:
        '200':
          description: Baris matriks group aset tersebut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBukuPenyusutanList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Master data
      operationId: replaceGroupBukuPenyusutan
      summary: Mengganti seluruh baris matriks buku penyusutan satu group aset
      description: |
        Baris disunting di dalam form group, jadi endpoint ini memakai permission
        `management-aset.group-aset.update` dan bukan permission tersendiri.

        Saat disimpan, daftar yang dikirim menggantikan seluruh baris lama. Baris yang
        tidak disertakan diarsipkan. Karena itu permintaan yang sama dapat diulang tanpa
        efek tambahan dan tidak memerlukan `Idempotency-Key`.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupBukuPenyusutanReplace'
      responses:
        '200':
          description: Matriks setelah diganti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBukuPenyusutanList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /api/v1/posting-group-aset:
    get:
      tags:
      - Master data
      operationId: listPostingGroupAset
      summary: Matriks posting group aset beserta riwayat tanggal berlakunya
      description: |
        Permission `management-aset.fixed-asset-posting-profiles.read`. Satu entri per group aset
        yang belum diarsipkan: baris yang berlaku hari ini (`current`), seluruh baris bertanggal
        berlaku, dan akun wajib yang masih kosong (`missing`). Posting memakai baris dengan
        `effective_from` terbesar yang tidak melewati tanggal postingnya. `account_details`
        menerjemahkan id akun menjadi nomor dan nama dari daftar akun referensi Core.
      responses:
        '200':
          description: Matriks posting group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroupAsetMatrix'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/posting-group-aset/akun:
    get:
      tags:
      - Master data
      operationId: searchPostingGroupAsetAccounts
      summary: Akun untuk pemilih akun posting group
      description: |
        Permission `management-aset.fixed-asset-posting-profiles.read`. Hanya akun aktif yang
        berlaku untuk semua entitas legal, karena posting group berlaku untuk seluruh tenant. Paling
        banyak 20 akun, dicocokkan dengan nomor, nama, atau `external_id`.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Akun yang cocok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceAccountList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/posting-group-aset/{groupAset}/{effectiveFrom}:
    parameters:
    - name: groupAset
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    - name: effectiveFrom
      in: path
      required: true
      description: Tanggal berlaku, `Y-m-d`. Bentuk lain tidak cocok dengan rutenya dan dijawab 404.
      schema:
        type: string
        format: date
    put:
      tags:
      - Master data
      operationId: upsertPostingGroupAset
      summary: Menyimpan akun satu group aset untuk satu tanggal berlaku
      description: |
        Satu baris diidentifikasi pasangan group dan tanggal berlaku, jadi mengulang permintaan yang
        sama tidak menambah baris dan tidak memerlukan `Idempotency-Key`. Baris untuk tanggal baru
        butuh `management-aset.fixed-asset-posting-profiles.create`; baris yang sudah ada butuh
        `...update`. Kolom akun yang tidak dikirim dikosongkan.

        Setiap akun harus ada di daftar akun tenant, berlaku untuk semua entitas legal, dan aktif.
        Akun yang dinonaktifkan sesudah dipetakan boleh tetap di kolom yang tidak diubah, supaya
        baris lama masih dapat disimpan untuk memperbaiki kolom lain.

        Baris yang sudah ada hanya boleh diubah dari versi yang dibuka pengguna (`version` pada body
        atau header `If-Match`). Baris untuk tanggal berlaku yang belum ada dikirim dengan versi 0; bila
        tab lain sudah membuatnya lebih dulu, versi 0 itu ditolak 409 `stale_version`.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingGroupAsetAccounts'
      responses:
        '200':
          description: Baris yang sudah ada diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingGroupAsetRowResponse'
        '201':
          description: Baris untuk tanggal berlaku baru dibuat
