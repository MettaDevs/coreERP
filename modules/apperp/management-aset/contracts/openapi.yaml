        dikirim dipertahankan beserta nomornya, yang tidak dikirim diarsipkan, dan aset baru
        mendapat nomor baris berikutnya. Nomor baris tidak dipakai ulang. `legal_entity_id`
        wajib sama dengan milik dokumen.
