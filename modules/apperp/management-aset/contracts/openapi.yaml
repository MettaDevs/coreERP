    ProfilPenyusutanFields:
      description: |
        Aturan penyusutan yang dapat dipakai ulang lintas aset; padanan "Depreciation profile"
        di Dynamics 365 F&O. Field mana yang wajib bergantung pada `method`:
        `useful_life_periods` untuk garis lurus dan saldo menurun, `rate_percent` untuk
        saldo menurun, `manual_schedule` untuk metode manual. `effective_from` dan
        `effective_to` membatasi versi profil; nilai null berarti tidak dibatasi pada sisi itu.
      type: object
      properties:
        method:
          type: string
          enum:
          - straight_line
          - straight_line_life_remaining
          - reducing_balance
          - manual
          - consumption
        frequency:
          type: string
          enum:
          - monthly
          - quarterly
          - half_yearly
          - yearly
        year_basis:
          type: string
          enum:
          - calendar
          - fiscal
        effective_from:
          description: Tanggal mulai profil ini berlaku; null berarti berlaku sejak awal.
          type:
          - string
          - 'null'
          format: date
        effective_to:
          description: Tanggal terakhir profil ini berlaku; null berarti belum berakhir.
          type:
          - string
          - 'null'
          format: date
        convention:
          description: Belum dibaca mesin penyusutan; diaktifkan bersama buku penyusutan.
          type:
          - string
          - 'null'
          maxLength: 40
        useful_life_periods:
          type:
          - integer
          - 'null'
          minimum: 1
        rate_percent:
          type:
          - string
          - 'null'
          format: decimal
        manual_schedule:
          oneOf:
          - type: array
            items:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  minimum: 0
          - type: 'null'
    ProfilPenyusutan:
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
    ProfilPenyusutanResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ProfilPenyusutan'
    ProfilPenyusutanList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfilPenyusutan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BukuPenyusutanFields:
      type: object
      properties:
        posting_layer:
          description: Lapisan posting buku ini. `tax` lazim dipakai buku fiskal.
          type: string
          enum:
          - current
          - operations
          - tax
          - none
          default: current
        export_to_backoffice:
          description: |
            App ini belum menjurnal. Saat aktif, field ini hanya menyiapkan bridge internal;
            pengiriman ke Finance baru boleh dilakukan setelah kontrak posting dan ownership
            COA tersedia.
          type: boolean
          default: false
        round_off_depreciation:
          description: Kelipatan nominal pembulatan penyusutan. Nol berarti tanpa pembulatan.
          type:
          - number
          - 'null'
          minimum: 0
          format: decimal
        depreciation_profile_id:
          description: Profil utama buku; boleh kosong bila setiap group memberi profil pada matriksnya.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alternative_profile_id:
          description: Profil pengganti saat saldo menurun sudah kalah dari garis lurus sisa umur.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    BukuPenyusutan:
      description: |
        Buku penyusutan; padanan "Book" di Dynamics 365 F&O. Satu aset dapat memiliki
        beberapa buku sekaligus, lazimnya satu komersial dan satu fiskal, dan tiap buku
        melacak nilai aset secara mandiri dengan aturannya sendiri.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
