  /api/v1/jadwal-pemeliharaan/hitung:
    post:
      tags:
      - Pemeliharaan preventif
      operationId: runMaintenanceSchedule
      summary: Menghitung usulan jadwal dari rencana aktif sampai tanggal batas
      description: |
        Idempoten: jatuh tempo yang sudah diusulkan, dibuatkan work order, atau diabaikan tidak diusulkan
        lagi. Usulan terbuka yang tidak lagi dihasilkan perhitungan diarsipkan. Hanya aset dalam
        jangkauan organisasi pengguna yang dihitung. Tanggal batas paling jauh satu tahun dari hari ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sampai
              properties:
                sampai:
                  type: string
                  format: date
                rencana_pemeliharaan_id:
                  oneOf:
                  - $ref: '#/components/schemas/Ulid'
                  - type: 'null'
      responses:
        '200':
          description: Jumlah usulan baru dan yang dibersihkan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - dibuat
                    - dibersihkan
                    properties:
                      dibuat:
                        type: integer
                      dibersihkan:
                        type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/jadwal-pemeliharaan/work-order:
    post:
      tags:
      - Pemeliharaan preventif
      operationId: createWorkOrdersFromSchedule
      summary: Mengubah usulan terpilih menjadi work order draf
      description: |
        Menuntut `management-aset.pemeliharaan-aset.create` di samping hak membaca jadwal. `kelompok=baris`
        membuat satu work order per usulan; `kelompok=aset` menggabungkan usulan satu aset dengan tipe work
        order yang sama. Work order dibuat lewat jalur yang sama dengan `POST /pemeliharaan-aset`, termasuk
        nomor dan checklist bawaan jenis pekerjaan. Setiap usulan mengklaim versinya sendiri.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lines
              properties:
                kelompok:
                  type: string
                  enum:
                  - baris
                  - aset
                  default: baris
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - id
                    - version
                    properties:
                      id:
                        $ref: '#/components/schemas/Ulid'
                      version:
                        $ref: '#/components/schemas/VersionField'
      responses:
        '201':
          description: Work order yang dibuat
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      work_orders:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              $ref: '#/components/schemas/Ulid'
                            kode:
                              type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
