  /api/v1/mutasi-aset/{id}:
    get:
      tags:
      - Mutasi aset
      operationId: showAsetTransfer
      summary: Membaca satu berita acara beserta barisnya dan keadaan asal tiap aset
      description: |
        Keadaan asal tiap baris (`asal_lokasi_efektif_id`, `asal_org_unit_efektif_id`,
        `asal_custodian_efektif_id`) adalah nilai beku bila dokumen sudah selesai, dan
        keadaan aset **sekarang** selama dokumen masih draf. Klien tidak perlu memilih
        sendiri di antara keduanya, dan tidak boleh mengirimkannya kembali saat menyimpan.

        Setiap id unit kerja dan id pengguna dipulangkan berpasangan dengan namanya
        (`tujuan_org_unit_nama`, `diserahkan_oleh_nama`, `diterima_oleh_nama`, dan pada
        baris `asal_org_unit_nama` serta `asal_custodian_nama`). Nama dibaca dari Core
        saat permintaan dilayani, bukan disimpan sebagai snapshot: nama orang dan nama
        unit berubah karena sebab di luar aset, dan dokumen yang membekukannya akan
        menampilkan ejaan lama selamanya. Nama bernilai `null` berarti unit atau
        keanggotaannya sudah tidak ada di Core.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Mutasi beserta barisnya
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Mutasi aset
      operationId: updateAsetTransfer
      summary: Mengubah draf berita acara; seluruh baris diganti
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AsetTransferWrite'
              - $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Mutasi setelah diubah
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          description: Mutasi yang sudah selesai tidak dapat diubah
        '428':
          $ref: '#/components/responses/VersionRequired'
    delete:
      tags:
      - Mutasi aset
      operationId: archiveAsetTransfer
      summary: Mengarsipkan draf berita acara
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '204':
          description: Draf diarsipkan
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          description: Mutasi yang sudah selesai tidak dapat diarsipkan
        '428':
          $ref: '#/components/responses/VersionRequired'
  /api/v1/mutasi-aset/{id}/selesaikan:
    post:
      tags:
      - Mutasi aset
      operationId: completeAsetTransfer
      summary: Menyelesaikan serah terima; penempatan setiap aset pada dokumen berpindah
      description: |
        Memerlukan permission `management-aset.aset.mutate`, bukan permission dokumen ini:
        menyusun berita acara dan benar-benar memindahkan aset adalah dua wewenang berbeda.

        Untuk setiap baris: keadaan asal dibekukan, satu baris riwayat penempatan dibuat
        dengan `mutasi_aset_id` menunjuk dokumen ini, dan aset diperbarui lokasi, unit
        penanggung jawab, serta dimensi keuangannya. `lifecycle_state` aset **tidak**
        disentuh — di Dynamics 365 memasang aset pada functional location dan mengubah
        lifecycle state juga dua tindakan terpisah.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: Mutasi setelah diselesaikan, beserta barisnya
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          description: Dokumen tanpa baris, sudah selesai, atau salah satu asetnya sudah dilepas
        '428':
          $ref: '#/components/responses/VersionRequired'
  /api/v1/monitoring-aset:
