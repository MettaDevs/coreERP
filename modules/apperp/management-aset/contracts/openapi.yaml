      responses:
        '200':
          description: Daftar Aset Book
  /api/v1/penyusutan/posting/pratinjau:
    get:
      tags:
      - Penyusutan
      operationId: previewDepreciationPosting
      summary: Pratinjau "Post penyusutan" satu entitas legal, buku, dan tanggal akhir periode
      description: |
        Pemeriksaan yang sama persis dengan proses post, tanpa menyimpan apa pun (TODO 11.2.7, K-22).
        Jawabannya: `assets` (jumlah aset yang ikut), `register_total` (jumlah penyusutannya di
        register, yang harus sama dengan total jurnal), `skipped` — periode yang tidak ikut, dihitung
        per alasan: `proposed` (belum final), `posted` (sudah di-post), `reversed` (sudah dibalik), dan
        `other_book` (jurnal asetnya dikirim lewat buku lain, K-26) — `blockers` (`{field, message}`
        yang akan menolak proses post), dan `posting`: nomor, status yang akan diperoleh, tanggal,
        mata uang, total, baris jurnal, dan masalah pemetaannya. `posting` `null` berarti tidak ada
        yang perlu di-post, atau ada penghalang.

        Hanya periode di dalam cakupan unit pengguna yang ikut. Pengguna yang sama sekali tidak
        berwenang di entitas legal itu dijawab 403.
      parameters:
      - name: legal_entity_id
        in: query
        required: true
        schema:
          type: string
      - name: buku_id
        in: query
        required: true
        description: Master buku penyusutan.
        schema:
          type: string
      - name: period_ends_on
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Pratinjau proses post
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Kesalahan sistem pada penyusunan jurnal; kode kesalahan `posting_failed`
  /api/v1/penyusutan/posting:
    post:
      tags:
      - Penyusutan
      operationId: postDepreciation
      summary: Post penyusutan final satu entitas legal, buku, dan periode sebagai satu jurnal ringkas
      description: |
        Menerbitkan satu posting `asset.depreciation` untuk periode asli berstatus final yang belum
        di-post, lalu menandai periodenya, di satu transaksi (TODO 11.2, K-14). Jurnalnya bertanggal
        akhir periode: debit beban penyusutan per group aset dan unit penggunaan, kredit akumulasi
        penyusutan per group aset dan business unit. `posting_id`-nya
        `AST-DEP-<entitas legal>-<buku>-<YYYYMMDD>-<nomor urut proses>`: periode yang difinalkan
        sesudah proses pertama ikut proses berikutnya dengan nomor urut berikutnya.

        Hanya buku yang mengirim jurnal perolehan asetnya yang mengirim penyusutan; periode buku lain
        dihitung di `skipped.other_book`. Periode yang sudah dibalik tidak pernah ikut. Pemetaan akun
        yang kosong tidak menahan proses: posting terbit `held` dan periodenya tetap ditandai (K-18).

        Bentuk jawabannya sama dengan pratinjau.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - legal_entity_id
              - buku_id
              - period_ends_on
              properties:
                legal_entity_id:
                  type: string
                buku_id:
                  type: string
                  description: Master buku penyusutan.
                period_ends_on:
                  type: string
                  format: date
      responses:
        '201':
          description: Posting terbit dan periodenya ditandai sudah di-post
        '200':
          description: Tidak ada periode yang perlu di-post — proses kedua untuk buku dan periode yang sama, atau proses yang
            kalah balapan — sehingga `posting` `null`.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Buku berlapisan posting none, periode yang memakai lebih dari satu mata uang, atau penyusutan yang
            lebih halus dari presisi mata uang (K-18, K-20).
        '500':
          description: Kesalahan sistem pada penyusunan jurnal; kode kesalahan `posting_failed`. Tidak ada yang berubah.
  /api/v1/penyusutan/{id}/finalisasi:
    post:
      tags:
      - Penyusutan
      operationId: finalizeDepreciation
      summary: Mengunci nilai satu periode dan menambahkannya ke saldo buku aset
      description: |
        Tidak lagi menulis ekspor penyusutan lama (TODO 11.4): jurnalnya sampai ke aplikasi finance
        lewat "Post penyusutan". Jawabannya `{period}`.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: Periode final; retry mengembalikan periode yang sama tanpa menambah saldo kedua kali
  /api/v1/penyusutan/{id}/reversal:
    post:
      tags:
      - Penyusutan
      operationId: reverseDepreciation
      summary: Membuat pembalikan baru untuk periode final tanpa mengubah periode asal
      description: |
        Bila periode aslinya sudah di-post, jurnal baliknya (`asset.depreciation_reversal`, `posting_id`
        `AST-DRV-<id baris pembalik>`) terbit di transaksi yang sama: kebalikan porsi aset itu saja,
        bertanggal periode asal, merujuk posting asalnya (TODO 11.3). Bila belum, tidak ada posting,
        dan periode aslinya tidak pernah ikut proses post. Jawabannya `{period, posting}`.
      parameters:
      - $ref: '#/components/parameters/RecordId'
      responses:
        '201':
          description: Pembalikan dibuat, beserta jurnal baliknya bila periode aslinya sudah di-post
        '409':
          description: Periode tidak dapat dibalik
        '422':
          description: Penyusutan periode asal lebih halus dari presisi mata uang yang berlaku sekarang
        '500':
          description: Kesalahan sistem pada penyusunan jurnal balik; kode kesalahan `posting_failed`. Tidak ada yang berubah.
  /api/internal/v1/laporan/{kode}:
    get:
      tags:
      - Laporan
      operationId: internalShowReport
      summary: Definisi laporan untuk Core; placeholder, parameter, dan layout bawaan
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      responses:
        '200':
          description: Definisi laporan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LaporanDefinisi'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/v1/laporan/{kode}/layouts/{key}:
    get:
      tags:
      - Laporan
      operationId: internalDownloadBuiltinLayout
      summary: Berkas layout bawaan yang ikut release app
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]+$
      responses:
        '200':
          description: Berkas .docx atau .xlsx
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
  /api/internal/v1/laporan/{kode}/dataset:
    post:
      tags:
      - Laporan
      operationId: internalReportDataset
      summary: Dataset laporan untuk diisi ke layout oleh Core
      description: Parameter divalidasi dengan aturan laporan; scope organisasi ditegakkan dengan `OrganizationScope` yang
        sama seperti endpoint detailnya. Record yang tidak ada atau di luar scope dijawab 422 dengan `message` yang layak
        ditampilkan ke pengguna.
      parameters:
      - $ref: '#/components/parameters/KodeLaporan'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parameter
              properties:
                parameter:
                  type: object
                  description: '`work-order` menuntut `id`; `daftar-work-order` menerima `status`, `dari`, `sampai`.'
                  additionalProperties: true
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LaporanDataset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna pada token tidak memegang permission data laporan ini
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Parameter tidak valid, atau record tidak ada / di luar scope (`message`)
components:
  securitySchemes:
    CoreERPContext:
      type: http
      scheme: bearer
      bearerFormat: CoreERP context token
      description: Token singkat bertanda tangan yang diterbitkan Web Shell untuk aplikasi ini.
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kunci stabil per percobaan pembuatan; retry dengan kunci sama tidak menerbitkan nomor baru.
        Batas 133 karakter: Core membatasi idempotency_key pada 160 dan kunci yang diteruskan ke sana
        diawali slug resource, sehingga slug master terpanjang (`item-checklist-maintenance`, 26) plus
        `:` menyisakan 133.
      schema:
        type: string
        maxLength: 133
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyMonitoring:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, untuk monitoring aset: kunci diteruskan ke Core diawali
        `monitoring-aset:`, sehingga batasnya 143 karakter.
      schema:
        type: string
        maxLength: 143
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyReklasifikasi:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, untuk reklasifikasi aset: kunci diteruskan ke Core diawali
        `reklasifikasi-aset:`, sehingga batasnya 140 karakter.
      schema:
        type: string
        maxLength: 140
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyPenyesuaianNilai:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, untuk penyesuaian nilai aset: kunci diteruskan ke Core diawali
        `penyesuaian-nilai-aset:`, sehingga batasnya 135 karakter.
      schema:
        type: string
        maxLength: 135
        pattern: ^[A-Za-z0-9._:-]+$
    DisposalDocument:
      name: disposalDocument
      in: path
      required: true
      schema:
        type: string
        enum:
        - penjualan-aset
        - pemusnahan-aset
    IdempotencyKeyTransaksi:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, tetapi untuk endpoint transaksi yang slug resource-nya lebih
        pendek sehingga menyisakan 154 karakter.
      schema:
        type: string
        maxLength: 154
        pattern: ^[A-Za-z0-9._:-]+$
    Search:
      name: q
      in: query
      description: Mencari pada kode atau nama.
      schema:
        type: string
        maxLength: 100
    ActiveFilter:
      name: aktif
      in: query
      schema:
        type: boolean
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PabrikanAsetFilter:
      name: pabrikan_aset_id
      in: query
      description: Membatasi daftar pada satu pabrikan aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    JenisAsetFilter:
      name: jenis_aset_id
      in: query
      description: Membatasi daftar pada satu jenis aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    ParentLokasiAsetFilter:
      name: parent_id
      in: query
      description: Membatasi daftar pada anak langsung satu lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    TipeLokasiAsetFilter:
      name: tipe_lokasi_id
      in: query
      description: Membatasi daftar pada satu tipe lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    KodeLaporan:
      name: kode
      in: path
      required: true
      description: Kode laporan seperti pada katalog `GET /laporan`, misalnya `work-order`.
      schema:
        type: string
        pattern: ^[a-z0-9-]+$
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Versi data yang sedang diubah, dalam bentuk ETag lemah seperti yang dikirim `ETag` pada
        jawaban baca, misalnya `W/"12"`. Wajib pada setiap PATCH, PUT, dan DELETE atas data yang
        sudah ada, serta pada aksi atas dokumen yang sudah ada (`/selesaikan`, `/batal`, `/status`,
        `/checklist/dari-template`). Nilainya boleh dikirim lewat body sebagai field `version`
        (integer) sebagai gantinya; bila keduanya ada, header yang dipakai. Tanpa keduanya
        permintaan ditolak 428, dan bila versinya sudah tertinggal ditolak 409.
      schema:
        type: string
        pattern: ^\s*(W/)?"\d+"\s*$
        examples:
        - W/"12"
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    RecordVersion:
      description: |
        Versi baris ini, integer yang hanya dibaca. Setiap penyimpanan menaikkannya (biasanya dua, bukan
        satu), sehingga angkanya tidak berarti apa-apa selain "berbeda". Kirim nilai dari jawaban terakhir
        sebagai header `If-Match` atau field `version` saat mengubah baris ini.
      type: integer
      minimum: 1
      readOnly: true
    VersionField:
      description: |
        Versi baris yang sedang diubah, dari `version` pada jawaban baca terakhir. Boleh diganti header
        `If-Match`; salah satunya wajib. Untuk baris yang belum ada pada penyimpanan pertamanya (posting
        group), kirim 0.
      type: integer
      minimum: 0
    VersionInput:
      description: Body yang hanya membawa versi, untuk DELETE dan aksi atas dokumen yang sudah ada.
      type: object
      properties:
        version:
          $ref: '#/components/schemas/VersionField'
    AsetPlanningDetailWrite:
      type: object
      required:
      - jenis_aset_id
      - satuan_id
      - quantity
      - requested_specification
      properties:
        jenis_aset_id:
          $ref: '#/components/schemas/Ulid'
        satuan_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
        quantity:
          type: number
          exclusiveMinimum: 0
        requested_specification:
          type: string
          maxLength: 2000
          example: RAM 16 GB, SSD 512 GB
        estimated_unit_price:
          type: number
          minimum: 0
    AsetPlanningWrite:
      type: object
      required:
      - legal_entity_id
      - planning_org_unit_id
      - planned_on
      - planning_year
      - planning_type
      - details
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        planning_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        planned_on:
          type: string
          format: date
        planning_year:
          type: integer
          minimum: 2000
          maximum: 2100
        planning_type:
          type: string
          enum:
          - regular
          - additional
        funding_source:
          type: string
          maxLength: 250
          nullable: true
        description:
          type: string
          maxLength: 2000
          nullable: true
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AsetPlanningDetailWrite'
    AsetTransferWrite:
      type: object
      description: |
        Tujuan berada di header dan aset di baris: satu serah terima adalah satu perpindahan
        antara dua pihak. Keadaan asal tidak dikirim klien — server membacanya dari aset saat
        dokumen diselesaikan.
      required:
      - legal_entity_id
      - responsible_org_unit_id
      - tanggal
      - alasan
      - details
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          description: Unit kerja pemilik dokumen, yaitu pihak yang menyerahkan.
          $ref: '#/components/schemas/Ulid'
        tanggal:
          type: string
          format: date
        tujuan_lokasi_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        tujuan_org_unit_id:
          description: |
            Unit kerja penanggung jawab aset setelah serah terima. Bila kosong, diisi unit kerja
            bawaan lokasi tujuan (atau lokasi induk terdekat yang mengisinya); bila keduanya kosong,
            422 pada field ini.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        diserahkan_oleh_user_id:
          type: string
          maxLength: 64
          nullable: true
        diterima_oleh_user_id:
          description: Menjadi penanggung jawab aset pada riwayat penempatan setelah diselesaikan.
          type: string
          maxLength: 64
          nullable: true
        alasan:
          type: string
          maxLength: 250
        keterangan:
          type: string
          maxLength: 2000
          nullable: true
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AsetTransferDetailWrite'
    AssetDisposalWrite:
      type: object
      description: Isian draf penjualan atau pemusnahan yang boleh diubah. Asetnya tidak dapat diganti.
      properties:
        tanggal:
          description: Tanggal pelepasan, sekaligus tanggal jurnal dan tanggal buku aset ditutup.
          type: string
          format: date
        nilai:
          description: Nilai penjualan; kosong berarti nol. Pemusnahan tidak membawa nilai.
          type: number
          minimum: 0
          nullable: true
        keterangan:
          type: string
          maxLength: 2000
          nullable: true
    AssetDisposal:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kode:
          type: string
        jenis_dokumen:
          type: string
          enum:
          - penjualan-aset
          - pemusnahan-aset
        status:
          type: string
          enum:
          - draft
          - posted
          - cancelled
        version:
          $ref: '#/components/schemas/RecordVersion'
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        aset_id:
          $ref: '#/components/schemas/Ulid'
        aset_kode:
          type: string
          nullable: true
        aset_nama:
          type: string
          nullable: true
        aset_lifecycle_state:
          type: string
          nullable: true
        currency_code:
          type: string
          nullable: true
        tanggal:
          type: string
          format: date
        nilai:
          type: string
          nullable: true
        keterangan:
          type: string
          nullable: true
        posting:
          description: Keadaan jurnal pelepasan sesudah diposting, atau `null` (draf, atau tidak ada yang dijurnal).
          type: object
          nullable: true
          properties:
            posting_id:
              type: string
            status:
              type: string
    AssetDisposalResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AssetDisposal'
    AssetValueAdjustmentWrite:
      type: object
      required:
      - legal_entity_id
      - responsible_org_unit_id
      - jenis
      - buku_id
      - tanggal
      - keterangan
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        jenis:
          description: '`write_down` menurunkan nilai buku, `appreciation` menaikkannya.'
          type: string
          enum:
          - write_down
          - appreciation
        buku_id:
          description: Buku penyusutan yang disesuaikan. Jurnal hanya terbit untuk aset yang buku ini di-post ke finance.
          $ref: '#/components/schemas/Ulid'
        tanggal:
          description: Tanggal nilai buku berubah dan tanggal jurnal.
          type: string
          format: date
        keterangan:
          description: Alasan penyesuaian; ikut ke keterangan jurnal di aplikasi finance.
          type: string
          maxLength: 250
        details:
          description: Wajib dikirim pada PATCH, walau kosong. Satu aset paling banyak sekali.
          type: array
          items:
            type: object
            required:
            - aset_id
            - nilai
            properties:
              aset_id:
                $ref: '#/components/schemas/Ulid'
              nilai:
                description: Selalu positif, paling banyak dua desimal; arahnya ditentukan `jenis`.
                type: number
                exclusiveMinimum: 0
              keterangan:
                type: string
                maxLength: 500
                nullable: true
    AssetValueAdjustment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kode:
          type: string
        jenis:
          type: string
          enum:
          - write_down
          - appreciation
        status:
          type: string
          enum:
          - draft
          - posted
        version:
          $ref: '#/components/schemas/RecordVersion'
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_nama:
          type: string
          nullable: true
        buku_id:
          $ref: '#/components/schemas/Ulid'
        buku_kode:
          type: string
          nullable: true
        buku_nama:
          type: string
          nullable: true
        buku_di_post:
          description: Hanya pada jawaban satu dokumen. Lapisan posting buku itu bukan `none`.
          type: boolean
        tanggal:
          type: string
          format: date
        keterangan:
          type: string
        diposting_pada:
          type: string
          format: date-time
          nullable: true
        posting_id:
          description: Posting finance yang terbit saat diposting; kosong bila tidak ada yang dijurnal.
          type: string
          nullable: true
        posting:
          description: Hanya pada jawaban satu dokumen. Keadaan jurnalnya sekarang.
          type: object
          nullable: true
          properties:
            posting_id:
              type: string
            status:
              type: string
        jumlah_baris:
          description: Hanya pada daftar.
          type: integer
        total_nilai:
          description: Hanya pada daftar.
          type: string
        details:
          description: Hanya pada jawaban satu dokumen.
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              line_number:
                type: integer
              aset_id:
                $ref: '#/components/schemas/Ulid'
              aset_kode:
                type: string
                nullable: true
              aset_nama:
                type: string
                nullable: true
              nilai:
                type: string
              keterangan:
                type: string
                nullable: true
              nilai_buku_sebelum:
                type: string
                nullable: true
              nilai_buku_sesudah:
                type: string
                nullable: true
    AssetValueAdjustmentResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AssetValueAdjustment'
    AssetReclassificationWrite:
      type: object
      required:
      - legal_entity_id
      - responsible_org_unit_id
      - jenis
      - tanggal
      - keterangan
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        responsible_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        jenis:
          description: '`pindah_group` memindah seluruh aset ke group lain; `pecah` memindah sebagian nilainya ke aset baru.
            Tidak dapat diganti sesudah draf disimpan.'
          type: string
          enum:
          - pindah_group
          - pecah
        tanggal:
          description: Tanggal nilai berpindah dan tanggal jurnal.
          type: string
          format: date
        keterangan:
          description: Alasan reklasifikasi; ikut ke keterangan jurnal di aplikasi finance.
          type: string
          maxLength: 250
        details:
