  /api/v1/{disposalDocument}/{id}/pratinjau-posting:
    get:
      tags:
      - Lifecycle aset
      operationId: previewAssetDisposalPosting
      summary: Pratinjau jurnal pelepasan draf, tanpa menyimpan apa pun
      description: |
        Butuh izin memposting atau membuat dokumen jenis itu. `data` berisi `currency_code`, `blockers`
        (daftar `{field, message}` yang menahan posting: aset belum dihentikan pemakaiannya atau sudah
        dilepas, usulan penyusutan yang belum difinalkan, penyusutan final yang berakhir sesudah tanggal
        pelepasan, nilai pemusnahan, atau nilai yang lebih halus dari presisi mata uang), `note` (kenapa
        tidak ada jurnal, misalnya group aset tanpa buku yang di-post), `amounts` — saldo buku yang di-post
        `{book, acquisition_value, accumulated_depreciation, write_down_amount, appreciation_amount,
        net_book_value, proceeds, gain_loss}` — dan `posting` `{posting_id, status, posting_date, currency,
        total, lines, problems}` atau `null`. Pemeriksaannya sama persis dengan posting.
