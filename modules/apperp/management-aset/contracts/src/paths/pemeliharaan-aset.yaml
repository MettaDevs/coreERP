# Work order pemeliharaan aset. Menggantikan jalur dokumen siklus generik yang dulu
# melayani `pemeliharaan-aset` sebagai catatan satu baris.
/api/v1/pemeliharaan-aset:
  get:
    tags:
    - Pemeliharaan aset
    operationId: listWorkOrders
    summary: Menampilkan work order pemeliharaan dalam jangkauan organisasi pengguna
    responses:
      '200':
        description: Daftar work order beserta tipe, tingkat layanan, dan jumlah baris pekerjaan
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    tags:
    - Pemeliharaan aset
    operationId: createWorkOrder
    summary: Membuat work order draf beserta baris pekerjaannya
    parameters:
    - $ref: '#/components/parameters/IdempotencyKeyTransaksi'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOrderWrite'
    responses:
      '200':
        description: Permintaan yang sama diulang; work order dikembalikan tanpa menerbitkan nomor baru
        headers:
          Idempotent-Replayed:
            schema:
              type: string
              const: 'true'
      '201':
        description: Work order dibuat berstatus draf
        headers:
          Location:
            schema:
              type: string
              format: uri
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/ValidationError'
      '500':
        $ref: '#/components/responses/InternalError'
/api/v1/pemeliharaan-aset/referensi/job-types:
  get:
    tags:
    - Pemeliharaan aset
    operationId: listWorkOrderJobTypesForAset
    summary: Menampilkan jenis pekerjaan yang boleh dipilih untuk aset
    parameters:
    - name: aset_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    responses:
      '200':
        description: Jenis pekerjaan maintenance yang terkait dengan jenis aset
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/ValidationError'
/api/v1/pemeliharaan-aset/saya:
  get:
    tags:
    - Pemeliharaan aset
    operationId: listMyWorkOrderJobs
    summary: >-
      Menampilkan baris pekerjaan yang ditugaskan kepada pengguna yang sedang masuk.
      Penyaringan dilakukan pada baris, bukan header, karena satu work order dapat
      dikerjakan beberapa orang untuk aset yang berbeda.
    responses:
      '200':
        description: Baris pekerjaan berstatus dijadwalkan atau dikerjakan milik pengguna
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
/api/v1/pemeliharaan-aset/{id}/status:
  post:
    tags:
    - Pemeliharaan aset
    operationId: transitionWorkOrder
    summary: >-
      Memindahkan status work order dan mencatatnya pada jejak status. Hak yang dituntut
      mengikuti transisinya: penjadwalan dan pembatalan memakai schedule, mulai dan selesai
      memakai execute, penutupan memakai close.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - ke_status
            properties:
              ke_status:
                type: string
                enum:
                - draft
                - dijadwalkan
                - dikerjakan
                - selesai
                - ditutup
                - dibatalkan
              alasan:
                type: string
                maxLength: 2000
                description: Wajib diisi ketika tujuannya adalah dibatalkan.
                nullable: true
              version:
                $ref: '#/components/schemas/VersionField'
    responses:
      '200':
        description: Status berpindah; jawabannya work order dengan `version` terbaru
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: >-
          Transisi tidak sah, atau syarat isi data belum terpenuhi — misalnya masih ada
          pemeriksaan wajib yang kosong, atau sebab dan tindakan belum diisi pada tipe work
          order yang mewajibkannya.
      '428':
        $ref: '#/components/responses/VersionRequired'
/api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/checklist:
  parameters:
  - $ref: '#/components/parameters/RecordId'
  - name: jobId
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Ulid'
  get:
    tags:
    - Pemeliharaan aset
    operationId: getWorkOrderChecklist
    summary: Membaca baris checklist satu baris pekerjaan
    responses:
      '200':
        description: Baris checklist beserta nilai dan penanda pemeriksaannya
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags:
    - Pemeliharaan aset
    operationId: saveWorkOrderChecklist
    summary: >-
      Menyimpan hasil pemeriksaan sekaligus. Hanya nilai, penanda tidak berlaku, dan catatan
      teknisi yang dapat diubah; nama, tipe, satuan, dan penanda wajib adalah salinan
      prosedur dan tidak dapat disunting dari lapangan.
    parameters:
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - baris
            properties:
              version:
                $ref: '#/components/schemas/VersionField'
              baris:
                type: array
                maxItems: 200
                items:
                  type: object
                  required:
                  - id
                  properties:
                    id:
                      $ref: '#/components/schemas/Ulid'
                    nilai:
                      type: string
                      maxLength: 255
                      nullable: true
                    tidak_berlaku:
                      type: boolean
                    catatan_teknisi:
                      type: string
                      maxLength: 2000
                      nullable: true
    responses:
      '200':
        description: |
          Hasil pemeriksaan tersimpan. Jawabannya `{data, version}`: `data` daftar baris checklist, dan
          `version` versi work order pemiliknya sesudah disimpan (bukan versi tiap baris).
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: >-
          Pekerjaan belum berstatus dikerjakan, ada baris yang bukan milik pekerjaan ini,
          atau nilai di luar pilihan yang ditetapkan variabelnya.
      '428':
        $ref: '#/components/responses/VersionRequired'
/api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/execution:
  parameters:
  - $ref: '#/components/parameters/RecordId'
  - name: jobId
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Ulid'
  patch:
    tags:
    - Pemeliharaan aset
    operationId: saveWorkOrderJobExecution
    summary: Menyimpan jam aktual, sebab kerusakan, dan tindakan perbaikan pada baris pekerjaan
    parameters:
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              version:
                $ref: '#/components/schemas/VersionField'
              aktual_jam:
                type: number
                minimum: 0
                maximum: 999999.99
                nullable: true
              sebab_kerusakan_id:
                allOf:
                - $ref: '#/components/schemas/Ulid'
                nullable: true
              tindakan_perbaikan_id:
                allOf:
                - $ref: '#/components/schemas/Ulid'
                nullable: true
              sebab_kerusakan_keterangan:
                type: string
                maxLength: 1000
                nullable: true
                description: Wajib bila sebab kerusakan yang dipilih meminta keterangan.
              tindakan_perbaikan_keterangan:
                type: string
                maxLength: 1000
                nullable: true
                description: Wajib bila tindakan perbaikan yang dipilih meminta keterangan.
    responses:
      '200':
        description: Hasil pelaksanaan tersimpan; jawabannya work order dengan `version` terbaru
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Pekerjaan belum dapat menerima hasil pelaksanaan atau referensi tidak valid
      '428':
        $ref: '#/components/responses/VersionRequired'
/api/v1/pemeliharaan-aset/{id}/jobs/{jobId}/checklist/dari-template:
  parameters:
  - $ref: '#/components/parameters/RecordId'
  - name: jobId
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Ulid'
  post:
    tags:
    - Pemeliharaan aset
    operationId: copyWorkOrderChecklistFromTemplate
    summary: >-
      Menyalin baris template checklist ke baris pekerjaan. Baris bertipe template
      dimekarkan menjadi isinya dan dinomori ulang berurutan, sehingga teknisi melihat satu
      daftar datar. Salinan bersifat snapshot; perubahan template setelahnya tidak mengubah
      pemeriksaan yang sudah dikerjakan.
    parameters:
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - template_id
            properties:
              version:
                $ref: '#/components/schemas/VersionField'
              template_id:
                $ref: '#/components/schemas/Ulid'
    responses:
      '201':
        description: |
          Baris checklist tersalin; baris sebelumnya pada pekerjaan ini digantikan. Jawabannya `{data, version}`:
          `version` adalah versi work order pemiliknya sesudah disalin.
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Pekerjaan sudah dimulai, atau template belum memiliki baris pemeriksaan
      '428':
        $ref: '#/components/responses/VersionRequired'
/api/v1/pemeliharaan-aset/{id}:
  get:
    tags:
    - Pemeliharaan aset
    operationId: showWorkOrder
    summary: Menampilkan satu work order beserta baris pekerjaan dan jejak perpindahan statusnya
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Work order, baris pekerjaan, dan status log
        headers:
          ETag:
            $ref: '#/components/headers/ETag'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
    - Pemeliharaan aset
    operationId: updateWorkOrder
    summary: >-
      Mengubah work order draf dengan version saat ini. Baris pekerjaan diganti seluruhnya,
      dan itulah sebabnya perubahan hanya sah selama status masih draf.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/WorkOrderWrite'
            - $ref: '#/components/schemas/VersionInput'
    responses:
      '200':
        description: Work order diperbarui
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Work order tidak lagi berstatus draf, atau payload tidak lolos validasi
      '428':
        $ref: '#/components/responses/VersionRequired'
  delete:
    tags:
    - Pemeliharaan aset
    operationId: archiveWorkOrder
    summary: Mengarsipkan work order draf atau yang sudah dibatalkan tanpa menghapus data fisik
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionInput'
    responses:
      '204':
        description: Work order diarsipkan
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Hanya work order draf atau yang sudah dibatalkan yang dapat diarsipkan
      '428':
        $ref: '#/components/responses/VersionRequired'
