# Dokumen reklasifikasi aset — pindah group aset (`pindah_group`) dan pecah aset (`pecah`), padanan FA
# Reclass. Journal Business Central. Draf disusun, dipratinjau, lalu diposting: saldo setiap buku aset
# berpindah (seluruhnya, atau bagian yang diminta ke aset baru yang lahir dari dokumen), dan bila group
# berubah jurnalnya (`asset.reclassification`) terbit ke feed posting finance di satu transaksi untuk buku
# yang di-post ke finance.
/api/v1/reklasifikasi-aset:
  get:
    tags:
    - Reklasifikasi aset
    operationId: listAssetReclassifications
    summary: Menampilkan reklasifikasi aset dalam jangkauan organisasi pengguna
    parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [draft, posted]
    - name: jenis
      in: query
      required: false
      schema:
        type: string
        enum: [pindah_group, pecah]
    - name: dari
      in: query
      required: false
      schema:
        type: string
        format: date
    - name: sampai
      in: query
      required: false
      schema:
        type: string
        format: date
    responses:
      '200':
        description: Daftar reklasifikasi beserta jumlah barisnya
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssetReclassification'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    tags:
    - Reklasifikasi aset
    operationId: createAssetReclassification
    summary: Membuat draf reklasifikasi; nomor diterbitkan Number Sequence Core per entitas legal
    parameters:
    - $ref: '#/components/parameters/IdempotencyKeyReklasifikasi'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetReclassificationWrite'
    responses:
      '200':
        description: 'Permintaan ulang dengan kunci idempotensi yang sama; header `Idempotent-Replayed: true`'
      '201':
        description: Draf dibuat beserta barisnya
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReclassificationResponse'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        description: Isian baris tidak sesuai jenisnya, aset di luar jangkauan, milik entitas legal lain, sudah dilepas, atau muncul dua kali pada pindah group
/api/v1/reklasifikasi-aset/{id}:
  get:
    tags:
    - Reklasifikasi aset
    operationId: showAssetReclassification
    summary: Membaca satu reklasifikasi beserta barisnya
    description: |
      Sesudah diposting, setiap baris membawa group asal yang dibekukan, aset baru pecahan
      (`aset_baru_id`, `aset_baru_kode`), nilai perolehan register yang dipindah, dan `books`: yang
      dipindah per buku penyusutan beserta tanda apakah buku itu dibawa jurnal.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Reklasifikasi beserta barisnya
        headers:
          ETag:
            $ref: '#/components/headers/ETag'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReclassificationResponse'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
    - Reklasifikasi aset
    operationId: updateAssetReclassification
    summary: Mengubah draf dan menyamakan barisnya dengan daftar yang dikirim
    description: |
      `details` wajib dikirim, walau kosong. Baris dicocokkan menurut `id`: baris yang dikirim dengan
      `id`-nya dipertahankan beserta nomornya, yang tidak dikirim diarsipkan, dan baris tanpa `id` mendapat
      nomor baru. `legal_entity_id` dan `jenis` wajib sama dengan milik dokumen.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/AssetReclassificationWrite'
            - $ref: '#/components/schemas/VersionInput'
    responses:
      '200':
        description: Reklasifikasi setelah diubah
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReclassificationResponse'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Reklasifikasi sudah diposting, jenis atau entitas legal diganti, atau isian tidak sah
      '428':
        $ref: '#/components/responses/VersionRequired'
  delete:
    tags:
    - Reklasifikasi aset
    operationId: archiveAssetReclassification
    summary: Mengarsipkan draf reklasifikasi
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionInput'
    responses:
      '204':
        description: Draf diarsipkan
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Reklasifikasi yang sudah diposting tidak dapat diarsipkan
      '428':
        $ref: '#/components/responses/VersionRequired'
/api/v1/reklasifikasi-aset/{id}/pratinjau-posting:
  get:
    tags:
    - Reklasifikasi aset
    operationId: previewAssetReclassificationPosting
    summary: Pratinjau pemindahan dan jurnal reklasifikasi draf, tanpa menyimpan apa pun
    description: |
      Butuh izin `management-aset.reklasifikasi-aset.post` atau `.update`. `data` berisi `blockers` (daftar
      `{field, message}`: dokumen tanpa baris, aset dilepas atau dihentikan, aset tanpa buku, usulan
      penyusutan yang belum difinalkan, penyusutan final sesudah tanggal reklasifikasi, group tujuan sama
      dengan group sekarang, group tujuan dengan buku yang di-post ke finance berbeda, bagian pecah 100% atau
      lebih, atau masalah mata uang berkunci `currency_code`), `note` (kenapa tidak ada jurnal), `moves`
      (pemindahan per baris yang tidak tertahan: `line_number`, `aset_kode`, `from_group_id`, `to_group_id`,
      `journal`, `nilai_perolehan_aset`, dan `books` berisi `book_code`, `nilai_perolehan`,
      `akumulasi_penyusutan`, `penurunan_nilai`, `kenaikan_nilai`, `nilai_buku`), dan `posting`
      `{posting_id, status, posting_date, currency, total, lines, problems}` atau `null`.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Pratinjau pemindahan dan jurnal reklasifikasi
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        description: Reklasifikasi sudah diposting
      '500':
        description: Jurnal tidak dapat disusun karena kesalahan sistem (`error.code` = `posting_failed`)
/api/v1/reklasifikasi-aset/{id}/posting:
  post:
    tags:
    - Reklasifikasi aset
    operationId: postAssetReclassification
    summary: Memposting draf — saldo berpindah, aset baru lahir atau group berganti, jurnal terbit, dokumen terkunci
    description: |
      Butuh izin `management-aset.reklasifikasi-aset.post`. Penghalangnya sama dengan pratinjau dan dijawab 422
      berkunci field-nya. Untuk pecah, nomor aset baru diterbitkan Number Sequence Core (`management-aset.aset`)
      sebelum transaksi dengan kunci per baris, sehingga percobaan ulang memakai nomor yang sama. Posting yang
      pemetaan akunnya belum lengkap tetap terbit sebagai `held` dan nilainya tetap berpindah.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - $ref: '#/components/parameters/IfMatch'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionInput'
    responses:
      '200':
        description: Reklasifikasi berstatus `posted`
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReclassificationResponse'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/StaleVersion'
      '422':
        description: Penghalang posting berkunci field-nya (bentuk `ValidationError`), atau nomor aset baru tidak dapat diterbitkan Core (`error.code` dari Number Sequence)
      '428':
        $ref: '#/components/responses/VersionRequired'
      '500':
        description: Jurnal gagal diterbitkan karena kesalahan sistem (`error.code` = `posting_failed`); tidak ada nilai yang berpindah
