# Asuransi aset: padanan *Insurance Type*, *Insurance*, dan *Ins. Coverage Ledger Entry* Business Central.
# Tidak ada posting ke buku besar. Pertanggungan adalah riwayat: nilai yang berubah mengakhiri baris lama.
/api/v1/jenis-asuransi:
  get:
    tags: [Asuransi aset]
    operationId: listInsuranceTypes
    parameters: [$ref: '#/components/parameters/Search', $ref: '#/components/parameters/ActiveFilter', $ref: '#/components/parameters/Page', $ref: '#/components/parameters/PerPage']
    responses: {'200': {description: Daftar jenis asuransi, content: {application/json: {schema: {$ref: '#/components/schemas/InsuranceTypeList'}}}}}
  post:
    tags: [Asuransi aset]
    operationId: createInsuranceType
    parameters: [$ref: '#/components/parameters/IdempotencyKey']
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterCreate'}}}}
    responses: {'201': {description: Jenis asuransi dibuat, content: {application/json: {schema: {$ref: '#/components/schemas/InsuranceTypeResponse'}}}}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'}}
/api/v1/jenis-asuransi/{id}:
  parameters: [$ref: '#/components/parameters/RecordId']
  get: {tags: [Asuransi aset], operationId: getInsuranceType, responses: {'200': {description: Jenis asuransi, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/InsuranceTypeResponse'}}}}}}
  patch: {tags: [Asuransi aset], operationId: updateInsuranceType, parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterPatch'}}}}, responses: {'200': {description: Jenis asuransi diubah, content: {application/json: {schema: {$ref: '#/components/schemas/InsuranceTypeResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
  delete: {tags: [Asuransi aset], operationId: archiveInsuranceType, parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'204': {description: Jenis asuransi diarsipkan}, '409': {$ref: '#/components/responses/StaleVersion'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/polis-asuransi:
  get:
    tags: [Asuransi aset]
    operationId: listInsurancePolicies
    description: Paling banyak 500 polis dalam jangkauan entitas legal pengguna, beserta total yang ditanggung hari ini (zona pengguna).
    parameters: [{name: legal_entity_id, in: query, required: false, schema: {$ref: '#/components/schemas/Ulid'}}, $ref: '#/components/parameters/Search']
    responses: {'200': {description: Daftar polis, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/InsurancePolicy'}}}}}}}}
  post:
    tags: [Asuransi aset]
    operationId: createInsurancePolicy
    description: Nomor polis sistem diterbitkan Number Sequence Core per entitas legal. Penanggung wajib vendor entitas legal itu.
    parameters: [$ref: '#/components/parameters/IdempotencyKeyTransaksi']
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyWrite'}}}}
    responses: {'200': {description: 'Permintaan ulang; header `Idempotent-Replayed: true`'}, '201': {description: Polis dibuat, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'}}
/api/v1/polis-asuransi/vendor:
  get:
    tags: [Asuransi aset]
    operationId: listInsuranceVendors
    description: Vendor aktif satu entitas legal untuk pemilih penanggung.
    parameters: [{name: legal_entity_id, in: query, required: true, schema: {$ref: '#/components/schemas/Ulid'}}, {name: q, in: query, required: false, schema: {type: string, maxLength: 100}}]
    responses: {'200': {description: Vendor aktif, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/VendorOption'}}}}}}}}
/api/v1/polis-asuransi/{id}:
  parameters: [$ref: '#/components/parameters/RecordId']
  get: {tags: [Asuransi aset], operationId: getInsurancePolicy, description: Polis beserta seluruh pertanggungan (termasuk yang sudah berakhir) atas aset dalam jangkauan pengguna., responses: {'200': {description: Polis, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  patch: {tags: [Asuransi aset], operationId: updateInsurancePolicy, description: Entitas legal tidak dapat diganti; masa berlaku wajib tetap mencakup seluruh pertanggungan., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/InsurancePolicyWrite'}, {type: object, properties: {version: {$ref: '#/components/schemas/VersionField'}}}]}}}}, responses: {'200': {description: Polis diubah, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
  delete: {tags: [Asuransi aset], operationId: archiveInsurancePolicy, description: Ditolak 422 selama polis masih menanggung aset hari ini atau sesudahnya., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'204': {description: Polis diarsipkan}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {description: Polis masih menanggung aset}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/polis-asuransi/{id}/pertanggungan:
  parameters: [$ref: '#/components/parameters/RecordId']
  post:
    tags: [Asuransi aset]
    operationId: addInsuranceCoverage
    description: |
      Menambah pertanggungan satu aset (padanan satu baris *Insurance Journal* BC). Memakai versi polis. Aset wajib
      dalam jangkauan pengguna, milik entitas legal polis, dan masih beredar; periode wajib di dalam masa berlaku
      polis; satu aset tidak boleh ditanggung dua kali oleh polis yang sama pada tanggal yang sama. Polis yang
      diblokir menolak pertanggungan baru.
    parameters: [$ref: '#/components/parameters/IdempotencyKeyTransaksi', $ref: '#/components/parameters/IfMatch']
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InsuranceCoverageWrite'}}}}
    responses: {'201': {description: Polis beserta pertanggungannya, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}
/api/v1/polis-asuransi/{id}/pertanggungan/{coverageId}/akhiri:
  parameters: [$ref: '#/components/parameters/RecordId', {name: coverageId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}]
  post: {tags: [Asuransi aset], operationId: endInsuranceCoverage, description: Mengisi tanggal akhir; tidak boleh sebelum mulai atau sesudah tanggal akhir yang sudah ada., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [berlaku_sampai], properties: {berlaku_sampai: {type: string, format: date}, version: {$ref: '#/components/schemas/VersionField'}}}}}}, responses: {'200': {description: Polis beserta pertanggungannya, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/polis-asuransi/{id}/pertanggungan/{coverageId}/ganti-nilai:
  parameters: [$ref: '#/components/parameters/RecordId', {name: coverageId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}]
  post: {tags: [Asuransi aset], operationId: replaceInsuranceCoverageValue, description: 'Baris lama berakhir sehari sebelum `berlaku_mulai`; baris baru membawa nilai baru dan sisa periodenya.', parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [nilai_pertanggungan, berlaku_mulai], properties: {nilai_pertanggungan: {type: number, exclusiveMinimum: 0}, berlaku_mulai: {type: string, format: date}, keterangan: {type: [string, 'null'], maxLength: 2000}, version: {$ref: '#/components/schemas/VersionField'}}}}}}, responses: {'200': {description: Polis beserta pertanggungannya, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/polis-asuransi/{id}/pertanggungan/{coverageId}:
  parameters: [$ref: '#/components/parameters/RecordId', {name: coverageId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}]
  delete: {tags: [Asuransi aset], operationId: archiveInsuranceCoverage, description: Mengarsipkan pertanggungan yang salah dicatat. Memakai versi polis., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'200': {description: Polis beserta pertanggungannya, content: {application/json: {schema: {$ref: '#/components/schemas/InsurancePolicyResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/asuransi-aset:
  get:
    tags: [Asuransi aset]
    operationId: getAssetInsurance
    description: Riwayat pertanggungan satu aset dari seluruh polis, total yang ditanggung hari ini, nilai perolehan buku komersial, dan statusnya.
    parameters: [{name: aset_id, in: query, required: true, schema: {$ref: '#/components/schemas/Ulid'}}]
    responses: {'200': {description: Asuransi aset, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/AssetInsurance'}}}}}}, '404': {$ref: '#/components/responses/NotFound'}}
/api/v1/asuransi-aset/ringkasan:
  get:
    tags: [Asuransi aset]
    operationId: summarizeAssetInsurance
    description: |
      Aset beredar beserta total pertanggungannya pada satu tanggal (padanan laporan *Insurance - Uninsured FAs*
      BC). Bawaan `status=bermasalah`: tidak diasuransikan dan kurang diasuransikan (total < nilai perolehan).
      Paling banyak 2000 baris; `meta.terpotong` menyatakan sisanya.
    parameters:
    - {name: tanggal, in: query, required: false, schema: {type: string, format: date}}
    - {name: legal_entity_id, in: query, required: false, schema: {$ref: '#/components/schemas/Ulid'}}
    - $ref: '#/components/parameters/JenisAsetFilter'
    - {name: lokasi_aset_id, in: query, required: false, schema: {$ref: '#/components/schemas/Ulid'}}
    - {name: status, in: query, required: false, schema: {type: string, enum: [bermasalah, tidak_diasuransikan, kurang_diasuransikan, cukup, semua]}}
    responses: {'200': {description: Ringkasan, content: {application/json: {schema: {type: object, required: [data, meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/AssetInsuranceSummaryRow'}}, meta: {type: object, properties: {tanggal: {type: string, format: date}, terpotong: {type: boolean}}}}}}}}}
