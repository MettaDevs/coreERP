# Permintaan pemeliharaan: laporan kerusakan atau kebutuhan perbaikan dari unit atas aset atau lokasi.
# Padanan *Maintenance requests* Dynamics 365 F&O. Setiap perpindahan status adalah tindakan tersendiri.
/api/v1/jenis-permintaan-pemeliharaan:
  get:
    tags: [Permintaan pemeliharaan]
    operationId: listMaintenanceRequestTypes
    parameters: [$ref: '#/components/parameters/Search', $ref: '#/components/parameters/ActiveFilter', $ref: '#/components/parameters/Page', $ref: '#/components/parameters/PerPage']
    responses: {'200': {description: Daftar jenis permintaan, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypeList'}}}}}
  post:
    tags: [Permintaan pemeliharaan]
    operationId: createMaintenanceRequestType
    parameters: [$ref: '#/components/parameters/IdempotencyKey']
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypeCreate'}}}}
    responses: {'201': {description: Jenis permintaan dibuat, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypeResponse'}}}}}
/api/v1/jenis-permintaan-pemeliharaan/{id}:
  parameters: [$ref: '#/components/parameters/RecordId']
  get: {tags: [Permintaan pemeliharaan], operationId: getMaintenanceRequestType, responses: {'200': {description: Jenis permintaan, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypeResponse'}}}}}}
  patch: {tags: [Permintaan pemeliharaan], operationId: updateMaintenanceRequestType, parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypePatch'}}}}, responses: {'200': {description: Jenis permintaan diubah, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestTypeResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
  delete: {tags: [Permintaan pemeliharaan], operationId: archiveMaintenanceRequestType, parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'204': {description: Jenis permintaan diarsipkan}, '409': {$ref: '#/components/responses/StaleVersion'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/permintaan-pemeliharaan:
  get:
    tags: [Permintaan pemeliharaan]
    operationId: listMaintenanceRequests
    description: Paling banyak 500 permintaan terbaru dalam jangkauan organisasi pengguna (unit pelapor).
    parameters: [{name: status, in: query, required: false, schema: {type: string, enum: [draft, diajukan, diterima, ditolak, work_order_dibuat]}}]
    responses: {'200': {description: Daftar permintaan, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/MaintenanceRequest'}}}}}}}}
  post:
    tags: [Permintaan pemeliharaan]
    operationId: createMaintenanceRequest
    description: Membuat permintaan draf; nomor diterbitkan Number Sequence Core per entitas legal. Lokasi kosong diisi lokasi aset saat ini.
    parameters: [$ref: '#/components/parameters/IdempotencyKeyTransaksi']
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestWrite'}}}}
    responses: {'200': {description: 'Permintaan ulang; header `Idempotent-Replayed: true`'}, '201': {description: Permintaan dibuat, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalError'}}
/api/v1/permintaan-pemeliharaan/{id}:
  parameters: [$ref: '#/components/parameters/RecordId']
  get: {tags: [Permintaan pemeliharaan], operationId: getMaintenanceRequest, responses: {'200': {description: Permintaan beserta nama unit, pelapor, dan pemutus, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  patch: {tags: [Permintaan pemeliharaan], operationId: updateMaintenanceRequest, description: Hanya permintaan draf., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/MaintenanceRequestWrite'}, {type: object, properties: {version: {$ref: '#/components/schemas/VersionField'}}}]}}}}, responses: {'200': {description: Permintaan diubah, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
  delete: {tags: [Permintaan pemeliharaan], operationId: archiveMaintenanceRequest, description: Hanya permintaan draf atau yang ditolak., parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'204': {description: Permintaan diarsipkan}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {description: Status tidak boleh diarsipkan}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/permintaan-pemeliharaan/{id}/ajukan:
  parameters: [$ref: '#/components/parameters/RecordId']
  post: {tags: [Permintaan pemeliharaan], operationId: submitMaintenanceRequest, description: 'draft → diajukan. Permission `submit`.', parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'200': {description: Permintaan diajukan, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {description: Status tidak sesuai}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/permintaan-pemeliharaan/{id}/terima:
  parameters: [$ref: '#/components/parameters/RecordId']
  post: {tags: [Permintaan pemeliharaan], operationId: acceptMaintenanceRequest, description: 'diajukan → diterima. Permission `review`.', parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/VersionInput'}}}}, responses: {'200': {description: Permintaan diterima, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {description: Status tidak sesuai}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/permintaan-pemeliharaan/{id}/tolak:
  parameters: [$ref: '#/components/parameters/RecordId']
  post: {tags: [Permintaan pemeliharaan], operationId: rejectMaintenanceRequest, description: 'diajukan → ditolak, dengan alasan wajib. Permission `review`.', parameters: [$ref: '#/components/parameters/IfMatch'], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [alasan], properties: {alasan: {type: string, maxLength: 2000}, version: {$ref: '#/components/schemas/VersionField'}}}}}}, responses: {'200': {description: Permintaan ditolak, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}}}
/api/v1/permintaan-pemeliharaan/{id}/work-order:
  parameters: [$ref: '#/components/parameters/RecordId']
  post:
    tags: [Permintaan pemeliharaan]
    operationId: createWorkOrderFromMaintenanceRequest
    description: |
      diterima → work_order_dibuat. Menuntut permission `review` dan `management-aset.pemeliharaan-aset.create`.
      Membuat satu work order draf lewat jalur yang sama dengan `POST /pemeliharaan-aset`. Tipe work
      order bawaannya dari jenis permintaan; `aset_id` wajib bila permintaan hanya menyebut lokasi.
    parameters: [$ref: '#/components/parameters/IfMatch']
    requestBody: {required: true, content: {application/json: {schema: {type: object, required: [maintenance_job_type_id], properties: {aset_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}, maintenance_job_type_id: {$ref: '#/components/schemas/Ulid'}, variant_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}, trade_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}, tipe_work_order_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}, version: {$ref: '#/components/schemas/VersionField'}}}}}}
    responses: {'200': {description: Permintaan beserta nomor work order-nya, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceRequestResponse'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/StaleVersion'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/VersionRequired'}, '500': {$ref: '#/components/responses/InternalError'}}
