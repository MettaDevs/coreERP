# Health, context, dan reference data Core.
/api/v1/health:
  get:
    security: []
    operationId: health
    summary: Memeriksa kesiapan API
    responses:
      '200':
        description: API siap
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthResponse'
/api/v1/context:
  get:
    operationId: currentContext
    summary: Membaca hak akses pengguna pada aplikasi
    responses:
      '200':
        description: Konteks sudah diverifikasi gateway
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - permissions
                  properties:
                    permissions:
                      type: array
                      items:
                        type: string
      '401':
        $ref: '#/components/responses/Unauthenticated'
/api/v1/reference-data/units-of-measure:
  get:
    tags:
    - Reference data
    operationId: listCoreUnitsOfMeasure
    summary: Menampilkan satuan aktif dari Core untuk dipilih dalam transaksi aset
    responses:
      '200':
        description: Daftar satuan aktif
      '503':
        description: Layanan satuan Core belum dapat dihubungi
/api/v1/reference-data/kelompok-harta-fiskal:
  get:
    tags:
    - Reference data
    operationId: listFiscalClassifications
    summary: Menampilkan referensi klasifikasi fiskal aktif untuk Group aset
    parameters:
    - $ref: '#/components/parameters/Search'
    - $ref: '#/components/parameters/ActiveFilter'
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Daftar referensi klasifikasi fiskal tenant aktif
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiscalClassificationList'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
/api/v1/reference-data/unit-kerja:
  get:
    tags:
    - Reference data
    operationId: listOperatingUnits
    summary: Unit kerja tenant milik Core, untuk dropdown yang menampilkan nama
    description: |
      Modul menyimpan id unit kerja sebagai teks opaque dan tidak pernah menanyakannya
      ke database Core; daftar ini dibaca lewat kontrak `OrganizationDirectory` di dalam
      proses yang sama. Ia ada supaya layar berhenti meminta pengguna mengetik ULID.

      Izinnya menumpang izin layar yang memakainya — mutasi, register aset, pemeliharaan,
      monitoring, atau lokasi aset — sama seperti daftar satuan.
    responses:
      '200':
        description: Daftar unit kerja; `kode` disamakan dengan `nama` karena Core tidak memulangkan kode unit
      '403':
        description: Pengguna tidak memegang satu pun izin layar yang memakai daftar ini
/api/v1/reference-data/alamat:
  get:
    tags:
    - Reference data
    operationId: listAddresses
    summary: Alamat dari buku alamat Core, untuk dipilih pada lokasi aset
    description: |
      Tempat beralamat pos milik tenant aktif, dibaca lewat kontrak `AddressDirectory`. Modul
      menyimpan id tempatnya saja; nama dan alamat diterjemahkan saat dibaca. Butuh
      `management-aset.lokasi-aset.read`.

      Dengan `unit_kerja_id`, yang dipulangkan hanya alamat utama unit kerja itu (nol atau satu
      baris) — saran alamat saat lokasi diberi unit kerja bawaan.
    parameters:
    - name: unit_kerja_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Ulid'
    responses:
      '200':
        description: Daftar alamat dengan `id`, `kode` (= nama), `nama`, `alamat`, dan `display_label`
      '403':
        description: Pengguna tidak memegang izin lihat lokasi aset
      '422':
        $ref: '#/components/responses/ValidationError'
/api/v1/reference-data/anggota:
  get:
    tags:
    - Reference data
    operationId: listTenantMembers
    summary: Anggota tenant milik Core, berkunci id pengguna
    description: |
      `id` adalah id **pengguna**, bukan id keanggotaan, karena itulah yang dibawa
      konteks permintaan dan yang tersimpan pada kolom penanggung jawab modul ini.
    responses:
      '200':
        description: Daftar anggota dengan nama dan email
      '403':
        description: Pengguna tidak memegang satu pun izin layar yang memakai daftar ini
