# Register aset, penempatan, perencanaan, dan dokumen lifecycle.
#
# Tidak ada `POST /api/v1/aset`. Ia dibuang 18 September 2026: aset hanya lahir dari
# dokumen penerimaan, yang membawa nomor, jumlah per baris, rujukan permintaan pembelian,
# dan peringatan ambang kapitalisasi sebelum nomornya terbit. Lihat `penerimaan-aset.yaml`.
/api/v1/aset:
  get:
    tags:
    - Lifecycle aset
    operationId: listAset
    summary: Menampilkan register aset tenant aktif
    responses:
      '200':
        description: Register aset
/api/v1/aset/{id}:
  get:
    tags:
    - Lifecycle aset
    operationId: showAset
    summary: Menampilkan satu aset beserta nilai atribut jenisnya
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Aset beserta atributnya
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
    - Lifecycle aset
    operationId: updateAset
    summary: Mengoreksi data aset; group tidak dapat diganti dan nilai perolehan terkunci setelah ada periode penyusutan
    description: |
      Field yang tidak dikirim tidak berubah. `acquisition_value` dan `residual_value` paling banyak dua
      desimal, seperti kolom register-nya.

      **Koreksi nilai perolehan** (feed posting finance, area 12). Bila `acquisition_value` berbeda dari
      nilai sekarang, `reason` wajib (maks. 250 karakter, ikut ke keterangan jurnal) dan
      `adjustment_date` wajib: tanggal hari koreksi dilakukan menurut jam pengguna (`Y-m-d`), yang hanya
      diterima bila berjarak paling jauh satu hari dari tanggal server. Selisihnya terbit sebagai
      `asset.acquisition_adjustment` (`AST-ADJ-<id aset>-<nomor urut>`) di transaksi yang sama, merujuk
      jurnal perolehan aset itu lewat `adjusts_posting_id` dan memakai akun lawan jurnal itu: hutang
      atau perantara menurut mode yang tercatat di jurnal asal, lawan hibah, atau penyeimbang saldo awal.
      Selisih yang lebih halus dari presisi mata uang ditolak 422.

      Jawaban membawa `adjustment`: `null` bila nilai perolehan tidak berubah, atau
      `{note, posting}`. `posting` berisi `{posting_id, status}` jurnal koreksi yang terbit; `null`
      bersama `note` yang menjelaskan sebabnya bila aset tidak punya jurnal perolehan, atau bila jurnal
      perolehannya dicatat manual — koreksinya juga dicatat manual di aplikasi finance, dan register tetap
      berubah.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Aset diperbarui
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        description: Aset sudah dilepas, atau nilainya terkunci oleh periode penyusutan
      '422':
        $ref: '#/components/responses/ValidationError'
      '500':
        description: Jurnal koreksi gagal diterbitkan karena kesalahan sistem (`error.code` = `posting_failed`); tidak ada yang berubah
/api/v1/aset/{id}/pratinjau-koreksi:
  get:
    tags:
    - Lifecycle aset
    operationId: previewAsetAcquisitionAdjustment
    summary: Pratinjau jurnal koreksi nilai perolehan sebelum disimpan
    description: |
      Tanpa menyimpan apa pun. Butuh izin `management-aset.aset.update`. `data` berisi `before`,
      `after`, `difference`, `currency_code`, `blockers` (daftar `{field, message}` — aset sudah dilepas,
      sudah ada periode penyusutan, tanggal koreksi di luar hari ini, atau selisih lebih halus dari
      presisi), `note` (kenapa tidak ada jurnal, bila begitu), dan `posting`: jurnal koreksi yang akan
      terbit `{posting_id, status, posting_date, currency, total, lines, problems}`, atau `null`. Alasan
      yang masih kosong tidak menjadi penghalang di sini; ia baru diwajibkan saat menyimpan.
    parameters:
    - $ref: '#/components/parameters/RecordId'
    - name: acquisition_value
      in: query
      required: true
      schema:
        type: number
        minimum: 0
    - name: adjustment_date
      in: query
      required: false
      description: Tanggal hari ini menurut jam pengguna.
      schema:
        type: string
        format: date
    - name: reason
      in: query
      required: false
      schema:
        type: string
        maxLength: 250
    responses:
      '200':
        description: Pratinjau koreksi
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'
      '500':
        description: Jurnal koreksi tidak dapat disusun karena kesalahan sistem (`error.code` = `posting_failed`)
/api/v1/aset/{id}/history:
  get:
    tags:
    - Lifecycle aset
    operationId: asetHistory
    summary: Membaca histori penempatan efektif aset tanpa mengubah histori lama
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Aset dan histori penempatan
      '404':
        $ref: '#/components/responses/NotFound'
/api/v1/perencanaan-aset:
  get:
    tags:
    - Perencanaan aset
    operationId: listAsetPlans
    summary: Menampilkan rencana aset tenant aktif
    responses:
      '200':
        description: Daftar rencana aset
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
  post:
    tags:
    - Perencanaan aset
    operationId: createAsetPlan
    summary: Membuat header dan rincian perencanaan aset; spesifikasi adalah snapshot pada rincian transaksi
    parameters:
    - $ref: '#/components/parameters/IdempotencyKeyTransaksi'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AsetPlanningWrite'
    responses:
      '200':
        description: Permintaan yang sama diulang
      '201':
        description: Rencana dibuat
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/ValidationError'
      '503':
        description: Number Sequence Core belum tersedia
/api/v1/perencanaan-aset/{id}:
  get:
    tags:
    - Perencanaan aset
    operationId: showAsetPlan
    summary: Menampilkan satu rencana aset beserta rinciannya
    parameters:
    - $ref: '#/components/parameters/RecordId'
    responses:
      '200':
        description: Rencana aset
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        description: Rencana tidak ditemukan
  patch:
    tags:
    - Perencanaan aset
    operationId: updateAsetPlan
    summary: Mengubah rencana draf dengan version saat ini
    parameters:
    - $ref: '#/components/parameters/RecordId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/AsetPlanningWrite'
            - type: object
              required:
              - version
              properties:
                version:
                  type: integer
                  minimum: 1
    responses:
      '200':
        description: Rencana diperbarui
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        description: Version sudah berubah
      '422':
        $ref: '#/components/responses/ValidationError'
  delete:
    tags:
    - Perencanaan aset
    operationId: archiveAsetPlan
    summary: Mengarsipkan rencana draf tanpa menghapus data fisik
    parameters:
    - $ref: '#/components/parameters/RecordId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - version
            properties:
              version:
                type: integer
                minimum: 1
    responses:
      '204':
        description: Rencana diarsipkan
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        description: Version sudah berubah
      '422':
        $ref: '#/components/responses/ValidationError'
/api/v1/{lifecycleDocument}:
  get:
    tags:
    - Lifecycle aset
    operationId: listLifecycleDocument
    summary: Menampilkan permintaan pembelian, dekomisioning, penjualan, atau pemusnahan
    parameters:
    - name: lifecycleDocument
      in: path
      required: true
      schema:
        type: string
        enum:
        - permintaan-pembelian-aset
        - dekomisioning-aset
        - penjualan-aset
        - pemusnahan-aset
    responses:
      '200':
        description: Daftar dokumen lifecycle
  post:
    tags:
    - Lifecycle aset
    operationId: createLifecycleDocument
    summary: Membuat dokumen lifecycle; dekomisioning yang disetujui menghentikan pemakaian aset sebelum penjualan atau pemusnahan
    parameters:
    - name: lifecycleDocument
      in: path
      required: true
      schema:
        type: string
        enum:
        - permintaan-pembelian-aset
        - dekomisioning-aset
        - penjualan-aset
        - pemusnahan-aset
    - $ref: '#/components/parameters/IdempotencyKeyTransaksi'
    responses:
      '201':
        description: Dokumen dibuat
