/api/v1/validasi-status-work-order:
  get:
    tags: [Master data]
    operationId: listWorkOrderStatusValidations
    summary: >-
      Aturan yang harus dipenuhi sebelum work order boleh berpindah ke satu status. Barisnya
      matriks tetap status x aturan yang disemai saat tenant disiapkan; tidak ada tambah dan
      tidak ada hapus.
    responses:
      '200': {description: Daftar aturan validasi status}
      '403': {$ref: '#/components/responses/Forbidden'}
  put:
    tags: [Master data]
    operationId: replaceWorkOrderStatusValidations
    summary: >-
      Mengubah keaktifan dan tingkat keparahan aturan. Keparahan `informasi` hanya dicatat,
      `peringatan` membiarkan transisi berjalan tetapi tersimpan pada jejak status, dan
      `error` menolak transisi.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [aturan]
            properties:
              aturan:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [status, aturan, aktif, keparahan]
                  properties:
                    status: {type: string, enum: [dijadwalkan, dikerjakan, selesai, ditutup]}
                    aturan: {type: string, enum: [checklist_wajib, sebab_kerusakan, tindakan_perbaikan]}
