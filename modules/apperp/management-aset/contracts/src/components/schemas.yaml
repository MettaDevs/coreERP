    meta:
      $ref: '#/components/schemas/PaginationMeta'
ProfilPenyusutanFields:
  description: |
    Aturan penyusutan yang dapat dipakai ulang lintas aset; padanan "Depreciation profile"
    di Dynamics 365 F&O. Field mana yang wajib bergantung pada `method`:
    `useful_life_periods` untuk garis lurus dan saldo menurun, `rate_percent` untuk
    saldo menurun, `manual_schedule` untuk metode manual. `effective_from` dan
    `effective_to` membatasi versi profil; nilai null berarti tidak dibatasi pada sisi itu.
  type: object
  properties:
    method:
      type: string
      enum:
      - straight_line
      - straight_line_life_remaining
      - reducing_balance
      - manual
      - consumption
    frequency:
      type: string
      enum:
      - monthly
      - quarterly
      - half_yearly
      - yearly
    year_basis:
      type: string
      enum:
      - calendar
      - fiscal
    effective_from:
      description: Tanggal mulai profil ini berlaku; null berarti berlaku sejak awal.
      type:
      - string
      - 'null'
      format: date
    effective_to:
      description: Tanggal terakhir profil ini berlaku; null berarti belum berakhir.
      type:
      - string
      - 'null'
      format: date
    convention:
      description: Belum dibaca mesin penyusutan; diaktifkan bersama buku penyusutan.
      type:
      - string
      - 'null'
      maxLength: 40
    useful_life_periods:
      type:
      - integer
      - 'null'
      minimum: 1
    rate_percent:
      type:
      - string
      - 'null'
      format: decimal
    manual_schedule:
      oneOf:
      - type: array
        items:
          type: object
          required:
          - amount
          properties:
            amount:
              type: number
              minimum: 0
      - type: 'null'
ProfilPenyusutan:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/ProfilPenyusutanFields'
  - type: object
    required:
    - method
    - frequency
    - year_basis
ProfilPenyusutanCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/ProfilPenyusutanFields'
  - type: object
    required:
    - method
    - frequency
    - year_basis
ProfilPenyusutanPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - $ref: '#/components/schemas/ProfilPenyusutanFields'
ProfilPenyusutanResponse:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/ProfilPenyusutan'
ProfilPenyusutanList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/ProfilPenyusutan'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
BukuPenyusutanFields:
  type: object
  properties:
    posting_layer:
      description: Lapisan posting buku ini. `tax` lazim dipakai buku fiskal.
      type: string
      enum: [current, operations, tax, none]
      default: current
    export_to_backoffice:
      description: |
        App ini belum menjurnal. Saat aktif, field ini hanya menyiapkan bridge internal;
        pengiriman ke Finance baru boleh dilakukan setelah kontrak posting dan ownership
        COA tersedia.
      type: boolean
      default: false
    round_off_depreciation:
      description: Kelipatan nominal pembulatan penyusutan. Nol berarti tanpa pembulatan.
      type:
      - number
      - 'null'
      minimum: 0
      format: decimal
    depreciation_profile_id:
      description: Profil utama buku; boleh kosong bila setiap group memberi profil pada matriksnya.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    alternative_profile_id:
      description: Profil pengganti saat saldo menurun sudah kalah dari garis lurus sisa umur.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
BukuPenyusutan:
  description: |
    Buku penyusutan; padanan "Book" di Dynamics 365 F&O. Satu aset dapat memiliki
    beberapa buku sekaligus, lazimnya satu komersial dan satu fiskal, dan tiap buku
    melacak nilai aset secara mandiri dengan aturannya sendiri.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/BukuPenyusutanFields'
BukuPenyusutanCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/BukuPenyusutanFields'
BukuPenyusutanPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - $ref: '#/components/schemas/BukuPenyusutanFields'
BukuPenyusutanResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/components/schemas/BukuPenyusutan'
BukuPenyusutanList:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/BukuPenyusutan'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
GroupBukuPenyusutanRow:
  description: |
    Satu baris matriks group x buku; padanan "Fixed asset group/book" di F&O. Nilainya
    adalah sumber konfigurasi efektif yang disalin ke buku aset saat aset diterima, bukan
    acuan hidup: mengubah matriks tidak menulis ulang aset yang sudah berjalan. Profil
    utama harus berasal dari baris ini atau header buku sebelum aset dapat ditempatkan.
  type: object
  required: [buku_id]
  properties:
    buku_id:
      $ref: '#/components/schemas/Ulid'
    depreciation_profile_id:
      description: Profil utama untuk group ini. Kosong berarti memakai profil utama buku.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    alternative_profile_id:
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    useful_life_periods:
      type:
      - integer
      - 'null'
      minimum: 1
    convention:
      description: Perlakuan periode pertama, dihitung dari tanggal aset mulai digunakan.
      type:
      - string
      - 'null'
      enum:
      - none
      - full_month
      - half_year
      - mid_quarter
      - mid_month_1st
      - mid_month_15th
      - half_year_start_of_year
      - half_year_next_year
      - null
    depreciate:
      description: Aset dari group ini mendapat buku tersebut tetapi tidak disusutkan bila `false`.
      type: boolean
      default: true
    round_off_depreciation:
      description: |
        Kelipatan nominal pembulatan untuk group dan book ini. Null berarti mengikuti
        nilai pada Book; periode terakhir tetap memakai sisa nilai tanpa pembulatan.
      type:
      - number
      - 'null'
      minimum: 0
      format: decimal
GroupBukuPenyusutanReplace:
  description: Daftar penuh baris matriks; baris yang tidak disertakan diarsipkan.
  type: object
  required: [rows]
  properties:
    rows:
      type: array
      items:
        $ref: '#/components/schemas/GroupBukuPenyusutanRow'
GroupBukuPenyusutanList:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        allOf:
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
        - $ref: '#/components/schemas/GroupBukuPenyusutanRow'
TipeAtributFields:
  type: object
  properties:
    data_type:
      description: |
        Tipe dasar nilai, terpisah dari batasannya. `string` tanpa Values menjadi teks
        bebas dan dengan Values menjadi dropdown. `decimal`/`integer` tanpa min/max
        menerima angka bebas dan dengan min/max menegakkan rentang.
      type: string
      enum: [string, decimal, integer, date, boolean]
    satuan_id:
      description: |
        Satuan milik Core yang dirujuk atribut ini. Hanya bermakna untuk `decimal` dan
        `integer`; dikirim untuk tipe lain akan ditolak. Inilah yang ditulis klien —
        `satuan` tidak diterima sebagai masukan.
      type: [string, 'null']
      format: ulid
    satuan:
      description: |
        Kode satuan hasil rujukan di atas, disalin saat disimpan supaya layar dapat
        menampilkan "cm" tanpa menghubungi Core. Hanya keluaran; kiriman diabaikan.
      readOnly: true
      type: [string, 'null']
      maxLength: 50
    min_value:
      description: Batas minimum opsional. Wajib diisi bersama `max_value` dan hanya berlaku untuk decimal/integer.
      type: [string, 'null']
      format: decimal
    max_value:
      description: Batas maksimum opsional. Wajib diisi bersama `min_value` dan hanya berlaku untuk decimal/integer.
      type: [string, 'null']
      format: decimal
    values_count:
      description: Jumlah Values yang belum diarsipkan. Hanya keluaran.
      readOnly: true
      type: integer
      minimum: 0
    asset_types_count:
      description: Jumlah jenis aset yang masih memasang atribut ini. Hanya keluaran.
      readOnly: true
      type: integer
      minimum: 0
    data_type_locked:
      description: Bernilai benar setelah atribut pernah berhasil disimpan pada aset. Hanya keluaran.
      readOnly: true
      type: boolean
TipeAtribut:
  description: |
    Padanan "Attribute type" di Dynamics 365 F&O. Inilah cara menambah pembeda aset
    tanpa menambah tingkat klasifikasi baru: tenant membuat atributnya sendiri,
    menempelkannya ke jenis aset, dan aset mewarisinya.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/TipeAtributFields'
  - type: object
    required: [data_type, satuan_id, satuan, min_value, max_value, values_count, asset_types_count, data_type_locked]
TipeAtributCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/TipeAtributFields'
  - type: object
    required: [data_type]
TipeAtributPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - $ref: '#/components/schemas/TipeAtributFields'
TipeAtributResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/components/schemas/TipeAtribut'
TipeAtributList:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/TipeAtribut'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
TipeAtributNilaiReplace:
  description: Daftar penuh pilihan nilai; pilihan yang tidak disertakan diarsipkan.
  type: object
  required: [rows]
  properties:
    rows:
      type: array
      items:
        type: object
        required: [nilai]
        properties:
          nilai:
            type: string
            maxLength: 150
          urutan:
            type: integer
            minimum: 0
            default: 0
TipeAtributNilaiList:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        required: [id, nilai, urutan]
        properties:
          id:
            $ref: '#/components/schemas/Ulid'
          nilai:
            type: string
          urutan:
            type: integer
JenisAsetAtributReplace:
  description: Daftar penuh atribut yang menempel pada jenis aset ini.
  type: object
  required: [rows]
  properties:
    rows:
      type: array
      items:
        type: object
        required: [tipe_atribut_id]
        properties:
          tipe_atribut_id:
            $ref: '#/components/schemas/Ulid'
          wajib:
            type: boolean
            default: false
          urutan:
            type: integer
            minimum: 0
            default: 0
JenisAsetAtributList:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        required: [id, tipe_atribut_id, wajib, urutan]
        properties:
          id:
            $ref: '#/components/schemas/Ulid'
          tipe_atribut_id:
            $ref: '#/components/schemas/Ulid'
          wajib:
            type: boolean
          urutan:
            type: integer
JenisAsetDetail:
  description: |
    Jumlah data yang menggantung pada satu jenis aset, untuk kotak angka pada panel
    detailnya. `null` berarti pemanggil tidak berhak membaca resource tersebut, dan
    sengaja dibedakan dari 0 yang berarti benar-benar tidak ada.
  type: object
  required: [data]
  properties:
    data:
      type: object
      required: [atribut_count, model_count, asset_count]
      properties:
        atribut_count:
          description: Tipe atribut yang terpasang pada jenis aset ini.
          type: integer
          minimum: 0
        model_count:
          description: |
            Model aset yang memakai jenis ini. `null` bila pemanggil tidak memegang
            `management-aset.model-aset.read`.
          type: integer
          minimum: 0
          nullable: true
        asset_count:
          description: |
            Aset yang memakai jenis ini, dibatasi tanggung jawab organisasi pemanggil.
            `null` bila pemanggil tidak memegang `management-aset.aset.read`.
          type: integer
          minimum: 0
          nullable: true
JenisAsetAtributDefinisi:
  description: |
    Definisi atribut satu jenis aset, siap dipakai form penerimaan aset untuk merender
    field dinamisnya tanpa perlu menggabungkan sendiri dari beberapa endpoint.
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        allOf:
        - $ref: '#/components/schemas/TipeAtributFields'
        - type: object
          required: [tipe_atribut_id, kode, nama, wajib, urutan, nilai_pilihan]
          properties:
            tipe_atribut_id:
              $ref: '#/components/schemas/Ulid'
            kode:
              type: string
            nama:
              type: string
            wajib:
              type: boolean
            urutan:
              type: integer
            nilai_pilihan:
              type: array
              items:
                type: object
                required: [id, nilai]
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  nilai:
                    type: string
LaporanField:
  type: object
  required: [key, label, table]
  properties:
    key:
      type: string
      description: Nama placeholder, dipakai sebagai `${key}` pada layout.
    label:
      type: string
    table:
      type: [string, 'null']
      description: Nama tabel bila kolom ini diulang per baris.
LaporanDefinisi:
  type: object
  required: [kode, nama, fields, parameters, builtin_layouts]
  properties:
    kode:
      type: string
    nama:
      type: string
    fields:
      type: array
      items:
        $ref: '#/components/schemas/LaporanField'
    parameters:
      type: array
      items:
        type: string
    builtin_layouts:
      type: array
      items:
        type: object
        required: [key, name, description, format]
        properties:
          key:
            type: string
          name:
            type: string
          description:
            type: [string, 'null']
          format:
            type: string
            enum: [docx, xlsx]
LaporanDataset:
  type: object
  required: [fields, tables, file_name]
  properties:
    fields:
      type: object
      description: Nilai tunggal siap tampil; tanggal dan angka sudah diformat app.
      additionalProperties:
        type: [string, number, 'null']
    tables:
      type: object
      description: Baris yang diulang per tabel; kunci tabel adalah awalan placeholder.
      additionalProperties:
        type: array
        items:
          type: object
          additionalProperties:
            type: [string, number, 'null']
    file_name:
      type: string
      description: Nama berkas hasil tanpa ekstensi.
