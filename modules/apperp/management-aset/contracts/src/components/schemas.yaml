# Skema request dan response.
Ulid:
  type: string
  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
AssetPlanningDetailWrite:
  type: object
  required:
  - jenis_aset_id
  - satuan_id
  - quantity
  - requested_specification
  properties:
    jenis_aset_id:
      $ref: '#/components/schemas/Ulid'
    satuan_id:
      allOf:
      - $ref: '#/components/schemas/Ulid'
      description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
    quantity:
      type: number
      exclusiveMinimum: 0
    requested_specification:
      type: string
      maxLength: 2000
      example: RAM 16 GB, SSD 512 GB
    estimated_unit_price:
      type: number
      minimum: 0
AssetPlanningWrite:
  type: object
  required:
  - legal_entity_id
  - planning_org_unit_id
  - planned_on
  - planning_year
  - planning_type
  - details
  properties:
    legal_entity_id:
      $ref: '#/components/schemas/Ulid'
    planning_org_unit_id:
      $ref: '#/components/schemas/Ulid'
    planned_on:
      type: string
      format: date
    planning_year:
      type: integer
      minimum: 2000
      maximum: 2100
    planning_type:
      type: string
      enum:
      - regular
      - additional
    funding_source:
      type: string
      maxLength: 250
      nullable: true
    description:
      type: string
      maxLength: 2000
      nullable: true
    details:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/AssetPlanningDetailWrite'
WorkOrderWrite:
  type: object
  description: >-
    Work order pemeliharaan. Aset tidak berada di header melainkan pada setiap baris
    pekerjaan, sehingga satu perintah kerja dapat mencakup beberapa aset. Sebab kerusakan
    dan tindakan perbaikan tidak diterima di sini karena keduanya adalah temuan saat
    pengerjaan, bukan bagian dari rencana.
  required:
  - legal_entity_id
  - responsible_org_unit_id
  - tipe_work_order_id
  - details
  properties:
    legal_entity_id:
      $ref: '#/components/schemas/Ulid'
    responsible_org_unit_id:
      $ref: '#/components/schemas/Ulid'
    tipe_work_order_id:
      $ref: '#/components/schemas/Ulid'
    tingkat_layanan_id:
      allOf:
      - $ref: '#/components/schemas/Ulid'
      nullable: true
    keterangan:
      type: string
      maxLength: 2000
      nullable: true
    penanggung_jawab_user_id:
      type: string
      maxLength: 64
      nullable: true
    diharapkan_mulai:
      type: string
      format: date-time
      nullable: true
    diharapkan_selesai:
      type: string
      format: date-time
      nullable: true
    dijadwalkan_mulai:
      type: string
      format: date-time
      nullable: true
    dijadwalkan_selesai:
      type: string
      format: date-time
      nullable: true
    details:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/WorkOrderJobWrite'
WorkOrderJobWrite:
  type: object
  description: Satu baris pekerjaan; lokasi aset disalin server sebagai snapshot saat baris dibuat.
  required:
  - asset_id
  - maintenance_job_type_id
  properties:
    asset_id:
      $ref: '#/components/schemas/Ulid'
    maintenance_job_type_id:
      $ref: '#/components/schemas/Ulid'
    variant_id:
      allOf:
      - $ref: '#/components/schemas/Ulid'
      description: Wajib berasal dari jenis pekerjaan pada baris yang sama.
      nullable: true
    trade_id:
      allOf:
      - $ref: '#/components/schemas/Ulid'
      nullable: true
    ditugaskan_ke_user_id:
      type: string
      maxLength: 64
      nullable: true
    dijadwalkan_mulai:
      type: string
      format: date-time
      nullable: true
    dijadwalkan_selesai:
      type: string
      format: date-time
      nullable: true
    estimasi_jam:
      type: number
      minimum: 0
      maximum: 9999
      nullable: true
    catatan:
      type: string
      maxLength: 2000
      nullable: true
HealthResponse:
  type: object
  required:
  - data
  properties:
    data:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ready
PaginationMeta:
  type: object
  required:
  - current_page
  - last_page
  - per_page
  - total
  properties:
    current_page:
      type: integer
    last_page:
      type: integer
    per_page:
      type: integer
    total:
      type: integer
FiscalClassification:
  description: |
    Referensi aturan fiskal tenant yang berversi. Record ini bukan master bisnis dan
    tidak memiliki nomor urut; `template_key` dipakai untuk seed idempoten. Group aset
    menyimpan ID record ini, sedangkan aset menyimpan snapshot ID saat diterima.
  type: object
  required:
  - id
  - template_key
  - jurisdiction
  - label
  - effective_from
  - allow_reducing_balance
  - depreciable
  - aktif
  properties:
    id:
      $ref: '#/components/schemas/Ulid'
    template_key:
      type: string
      maxLength: 160
    jurisdiction:
      type: string
      maxLength: 32
    label:
      type: string
      maxLength: 150
    display_label:
      type: string
      description: Label siap tampil yang membedakan versi berdasarkan tanggal berlaku.
    regulation_reference:
      type:
      - string
      - 'null'
      maxLength: 250
    effective_from:
      type: string
      format: date
    effective_to:
      type:
      - string
      - 'null'
      format: date
    useful_life_years:
      type:
      - integer
      - 'null'
      minimum: 1
    straight_line_rate_percent:
      type:
      - string
      - 'null'
      format: decimal
    reducing_balance_rate_percent:
      type:
      - string
      - 'null'
      format: decimal
    allow_reducing_balance:
      type: boolean
    depreciable:
      type: boolean
    aktif:
      type: boolean
FiscalClassificationList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/FiscalClassification'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
ErrorResponse:
  type: object
  required:
  - error
  properties:
    error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
AttributeValuesConflictResponse:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message, conflicting_count, conflicting_values]
      properties:
        code:
          type: string
          const: attribute_values_in_use
        message:
          type: string
        conflicting_count:
          type: integer
          minimum: 1
        conflicting_values:
          type: array
          maxItems: 20
          items:
            type: string
MasterSummary:
  description: Ringkasan induk untuk ditampilkan tanpa permintaan tambahan. Induk yang sudah diarsipkan tetap disertakan.
  type: object
  required:
  - id
  - kode
  - nama
  properties:
    id:
      $ref: '#/components/schemas/Ulid'
    kode:
      type: string
    nama:
      type: string
MasterRecord:
  description: Bentuk dasar seluruh master. `kode` selalu diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
  type: object
  required:
  - id
  - kode
  - nama
  - keterangan
  - aktif
  - created_at
  - updated_at
  properties:
    id:
      $ref: '#/components/schemas/Ulid'
    kode:
      type: string
      maxLength: 50
    nama:
      type: string
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
    created_at:
      type:
      - string
      - 'null'
      format: date-time
    updated_at:
      type:
      - string
      - 'null'
      format: date-time
MasterCreate:
  type: object
  required:
  - nama
  properties:
    nama:
      type: string
      minLength: 1
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
      default: true
MasterPatch:
  type: object
  properties:
    nama:
      type: string
      minLength: 1
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
ModelAset:
  description: |
    Katalog model barang milik satu pabrikan; padanan "Manufacturers and models" di
    Dynamics 365 F&O. Pabrikan dan jenis adalah induk yang saling lepas: memilih salah
    satu tidak menyaring pilihan yang lain, dan keduanya dapat disaring bersamaan pada
    endpoint daftar.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - type: object
    required:
    - pabrikan_aset_id
    - pabrikan_aset
    - asset_count
    properties:
      pabrikan_aset_id:
        $ref: '#/components/schemas/Ulid'
      pabrikan_aset:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
      jenis_aset:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
      asset_count:
        description: Aset yang memakai model ini, dibatasi tanggung jawab organisasi pemanggil.
        type:
        - integer
        - 'null'
        minimum: 0
  examples:
  - id: 01JZ0000000000000000000000
    kode: MDLA-000001
    nama: Kompresor Angin PK-100
    keterangan: Kompresor 100 liter untuk lini produksi.
    pabrikan_aset_id: 01JZ0000000000000000000001
    pabrikan_aset:
      id: 01JZ0000000000000000000001
      kode: PBRA-000001
      nama: Pabrikan contoh
    model_number: PK-100
    asset_count: 3
    aktif: true
    created_at: '2026-07-26T02:00:00.000000Z'
    updated_at: '2026-07-26T02:00:00.000000Z'
ModelAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - type: object
    required:
    - pabrikan_aset_id
    properties:
      pabrikan_aset_id:
        allOf:
        - $ref: '#/components/schemas/Ulid'
        description: Pabrikan pada tenant yang sama dan belum diarsipkan. Wajib, karena sebuah model selalu milik satu pabrikan.
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
        description: Opsional, supaya katalog dapat mulai diisi sebelum klasifikasi teknis ditetapkan.
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
ModelAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - type: object
    properties:
      pabrikan_aset_id:
        $ref: '#/components/schemas/Ulid'
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
ModelAsetResponse:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/ModelAset'
ModelAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/ModelAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
GroupAsetFields:
  description: |
    Perlakuan finansial yang melekat pada group; padanan field pada "Fixed asset group"
    di Dynamics 365 F&O. Seluruhnya opsional supaya tenant yang belum memetakan
    perlakuan pajaknya tetap dapat membuat group.

    Sifat harta (berwujud, tidak berwujud, hak guna) tidak ada di sini. Klasifikasi itu
    menentukan akun, dan akun ditentukan posting profile milik Finance; aset yang perlu
    dibedakan sifatnya dibedakan dengan group tersendiri. Field lama `major_type` ditolak
    bila masih dikirim.
  type: object
  properties:
    kelompok_harta_fiskal_id:
      description: Referensi aturan fiskal berversi milik tenant yang dipakai group ini.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    property_type:
      description: |
        Apakah perolehan disajikan di neraca. `inventory_item` tetap diinventarisasi
        tetapi tidak dikapitalisasi; padanan `Continuing property` di F&O dan barang
        ekstrakomptabel pada penatausahaan barang di Indonesia.
      type:
      - string
      - 'null'
      enum:
      - fixed_asset
      - inventory_item
      - other
      - null
    asset_location_id:
      description: |
        Lokasi bawaan saat aset diterima. Hanya nilai awal; lokasi yang berlaku tetap
        hidup pada aset dan penempatannya, dan tidak pernah dibaca ulang dari group.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    capitalization_threshold:
      description: |
        Perolehan di bawah nilai ini tetap dicatat sebagai aset, tetapi bukunya tidak
        menyusut. Ambang ini tidak membatalkan pencatatan aset.
      type:
      - string
      - 'null'
      format: decimal
GroupAset:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/GroupAsetFields'
GroupAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/GroupAsetFields'
GroupAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
