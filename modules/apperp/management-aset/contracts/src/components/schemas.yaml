  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/TipeLokasiAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
LokasiAsetFields:
  type: object
  properties:
    parent_id:
      description: Lokasi induk pada tenant yang sama dan belum diarsipkan. Kosong berarti lokasi akar; perpindahan yang membentuk siklus ditolak.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    tipe_lokasi_id:
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
    org_unit_id:
      description: |
        Unit organisasi Core yang menjadi dimensi keuangan aset di lokasi ini; padanan
        toggle "Update asset dimension" di F&O. Disimpan sebagai ID opaque tanpa foreign
        key, karena unit organisasi dimiliki Core.
      oneOf:
      - $ref: '#/components/schemas/Ulid'
      - type: 'null'
LokasiAset:
  description: |
    Pohon lokasi fisik aset; padanan "Functional location" di Dynamics 365 F&O. Ia
    mereferensikan dirinya sendiri lewat `parent_id`, jadi kedalamannya ditentukan data
    tenant dan bukan skema. Sengaja terpisah dari struktur organisasi Core: "di mana
    benda ini" dan "siapa yang bertanggung jawab" berubah karena sebab yang berbeda.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/LokasiAsetFields'
  - type: object
    required:
    - parent
    - tipe_lokasi
    properties:
      parent:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
      tipe_lokasi:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
LokasiAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/LokasiAsetFields'
LokasiAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - $ref: '#/components/schemas/LokasiAsetFields'
LokasiAsetResponse:
  type: object
