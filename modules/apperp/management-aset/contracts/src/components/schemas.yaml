PabrikanAsetDetail:
  description: |
    Jumlah model dan aset pada satu pabrikan untuk panel detail. `null` berarti pemanggil
    tidak berhak membaca resource tersebut, dan dibedakan dari 0 yang berarti benar-benar
    tidak ada.
  type: object
  required: [data]
  properties:
    data:
      type: object
      required: [model_count, asset_count]
      properties:
        model_count:
          description: Model yang belum diarsipkan pada pabrikan ini.
          type: integer
          minimum: 0
          nullable: true
        asset_count:
          description: Aset yang memakai pabrikan ini, dibatasi tanggung jawab organisasi pemanggil.
          type: integer
          minimum: 0
          nullable: true
