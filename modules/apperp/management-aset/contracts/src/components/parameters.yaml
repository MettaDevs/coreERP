# Parameter query, path, dan header yang dipakai lintas endpoint.
RecordId:
  name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Ulid'
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Kunci stabil per percobaan pembuatan; retry dengan kunci sama tidak menerbitkan nomor baru.
    Batas 133 karakter: Core membatasi idempotency_key pada 160 dan kunci yang diteruskan ke sana
    diawali slug resource, sehingga slug master terpanjang (`item-checklist-maintenance`, 26) plus
    `:` menyisakan 133.
  schema:
    type: string
    maxLength: 133
    pattern: ^[A-Za-z0-9._:-]+$
IdempotencyKeyMonitoring:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Sama seperti `IdempotencyKey`, untuk monitoring aset: kunci diteruskan ke Core diawali
    `monitoring-aset:`, sehingga batasnya 143 karakter.
  schema:
    type: string
    maxLength: 143
    pattern: ^[A-Za-z0-9._:-]+$
IdempotencyKeyPenyesuaianNilai:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Sama seperti `IdempotencyKey`, untuk penyesuaian nilai aset: kunci diteruskan ke Core diawali
    `penyesuaian-nilai-aset:`, sehingga batasnya 135 karakter.
  schema:
    type: string
    maxLength: 135
    pattern: ^[A-Za-z0-9._:-]+$
DisposalDocument:
  name: disposalDocument
  in: path
  required: true
  schema:
    type: string
    enum:
    - penjualan-aset
    - pemusnahan-aset
IdempotencyKeyTransaksi:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Sama seperti `IdempotencyKey`, tetapi untuk endpoint transaksi yang slug resource-nya lebih
    pendek sehingga menyisakan 154 karakter.
  schema:
    type: string
    maxLength: 154
    pattern: ^[A-Za-z0-9._:-]+$
Search:
  name: q
  in: query
  description: Mencari pada kode atau nama.
  schema:
    type: string
    maxLength: 100
ActiveFilter:
  name: aktif
  in: query
  schema:
    type: boolean
Page:
  name: page
  in: query
  schema:
    type: integer
    minimum: 1
PerPage:
  name: per_page
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
PabrikanAsetFilter:
  name: pabrikan_aset_id
  in: query
  description: Membatasi daftar pada satu pabrikan aset.
  schema:
    $ref: '#/components/schemas/Ulid'
JenisAsetFilter:
  name: jenis_aset_id
  in: query
  description: Membatasi daftar pada satu jenis aset.
  schema:
    $ref: '#/components/schemas/Ulid'
ParentLokasiAsetFilter:
  name: parent_id
  in: query
  description: Membatasi daftar pada anak langsung satu lokasi aset.
  schema:
    $ref: '#/components/schemas/Ulid'
TipeLokasiAsetFilter:
  name: tipe_lokasi_id
  in: query
  description: Membatasi daftar pada satu tipe lokasi aset.
  schema:
    $ref: '#/components/schemas/Ulid'
KodeLaporan:
  name: kode
  in: path
  required: true
  description: Kode laporan seperti pada katalog `GET /laporan`, misalnya `work-order`.
  schema:
    type: string
    pattern: ^[a-z0-9-]+$
IfMatch:
  name: If-Match
  in: header
  required: false
  description: |
    Versi data yang sedang diubah, dalam bentuk ETag lemah seperti yang dikirim `ETag` pada
    jawaban baca, misalnya `W/"12"`. Wajib pada setiap PATCH, PUT, dan DELETE atas data yang
    sudah ada, serta pada aksi atas dokumen yang sudah ada (`/selesaikan`, `/batal`, `/status`,
    `/checklist/dari-template`). Nilainya boleh dikirim lewat body sebagai field `version`
    (integer) sebagai gantinya; bila keduanya ada, header yang dipakai. Tanpa keduanya
    permintaan ditolak 428, dan bila versinya sudah tertinggal ditolak 409.
  schema:
    type: string
    pattern: ^\s*(W/)?"\d+"\s*$
    examples:
    - W/"12"
