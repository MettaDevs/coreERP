# Sesi Core. Cookie mengikuti konfigurasi runtime, bukan nama cookie yang ditulis mati.
CoreERPContext:
  type: apiKey
  in: header
  name: Cookie
  description: Sesi pengguna Core; browser mengirim cookie login pada permintaan same-origin.
ModuleCsrf:
  type: apiKey
  in: header
  name: X-XSRF-TOKEN
  description: Nilai cookie XSRF-TOKEN yang sudah di-URL-decode untuk permintaan yang mengubah data.
