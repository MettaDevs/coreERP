asyncapi: 3.0.0
info:
  title: Management Aset events
  version: 0.4.0
  description: |
    Event yang **diterima** app ini. Sisi penerbitnya dikontrakkan pada
    `CoreERP/apps/core/contracts/asyncapi.yaml`; kedua file wajib
    berubah bersama-sama.

    Sejak `v2`, `correlation_id` wajib dan berisi id dokumen dekomisioning yang
    dikirim app saat mengajukan workflow, sehingga keputusan yang datang berhari-hari
    kemudian dapat ditelusuri balik ke dokumen asalnya. `v1` tidak lagi diterima.

    Kedua event diterima **di dalam proses** sebagai event Laravel yang didaftarkan
    `src/ModuleServiceProvider.php`, di dalam transaksi Core yang menerbitkannya. Tidak ada
    endpoint penerima, header, atau tanda tangan di sisi module ini. Header webhook di
    kontrak Core hanya berlaku bagi penerima yang berjalan di luar proses.
channels:
  core.tenant.provisioned.v1:
    address: core.tenant.provisioned.v1
    description: |
      Tenant baru siap; module menyiapkan data awalnya.

      Diterima di dalam proses sebagai event Laravel `TenantProvisioned` yang didengarkan
      `SiapkanDataAwalTenant`, di dalam transaksi pendaftaran usaha.
    messages:
      tenantProvisioned:
        contentType: application/json
        payload:
          type: object
          required: [id, type, occurred_at, tenant_id, correlation_id, data]
          properties:
            id: { type: string }
            type: { const: core.tenant.provisioned.v1 }
            occurred_at: { type: string, format: date-time }
            tenant_id: { type: string }
            correlation_id: { type: string }
            legal_entity_id: { type: [string, 'null'] }
            data:
              type: object
              additionalProperties: false
              required: [app_ids]
              properties:
                app_ids:
                  type: array
                  uniqueItems: true
                  items: { type: string }
  core.workflow.decision.v2:
    address: core.workflow.decision.v2
    description: |
      Keputusan workflow dekomisioning aset yang diputuskan Core.

      Sejak F3-09 module ini menerimanya **di dalam proses**, sebagai event Laravel
      `WorkflowDecisionTaken` yang didengarkan `TerapkanKeputusanDekomisioning`.
      Tidak ada lagi permintaan HTTP, tidak ada tanda tangan HMAC, dan tidak ada
      endpoint penerima.

      Bentuk `data` di bawah tetap dikontrakkan karena ia tetap satu isi untuk dua
      jalur: amplop yang sama masih ditulis ke outbox Core untuk penerima yang berada
      di luar proses. Sejak F3-23 berkas ini dokumentasi, bukan kontrak yang dijaga CI;
      lihat `contracts/README.md`.
    messages:
      workflowDecision:
        contentType: application/json
        payload:
          type: object
          required: [id, type, occurred_at, tenant_id, correlation_id, data]
          properties:
            id: { type: string }
            type: { const: core.workflow.decision.v2 }
            occurred_at: { type: string, format: date-time }
            tenant_id: { type: string }
            correlation_id:
              type: string
              description: Id dokumen dekomisioning yang memulai rantai ini.
            legal_entity_id:
              type: [string, 'null']
              description: Legal entity pemilik keputusan; null untuk workflow ber-scope tenant.
            data:
              type: object
              required: [workflow_instance_id, workflow_type, decision, source_document_type, source_document_id, decision_context]
              properties:
                workflow_instance_id: { type: string }
                workflow_type: { const: management-aset.dekomisioning-aset-verification }
                decision: { enum: [approved, rejected] }
                source_document_type: { const: dekomisioning-aset }
                source_document_id: { type: string }
                decision_context: { type: object }
operations:
  receiveTenantProvisioned:
    action: receive
    channel:
      $ref: '#/channels/core.tenant.provisioned.v1'
  receiveWorkflowDecision:
    action: receive
    channel:
      $ref: '#/channels/core.workflow.decision.v2'
