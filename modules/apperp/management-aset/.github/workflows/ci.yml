name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Pemeriksaan yang ingin dijalankan
        required: true
        default: full
        type: choice
        options: [quick, ui, api, full]

permissions:
  contents: read

jobs:
  checks:
    uses: MettaDevs/app-erp-ci-workflows/.github/workflows/app-checks.yml@1a1085e1257fada0e8c9c1f731368360a3fd4d6e
    with:
      profile: ${{ inputs.profile || 'auto' }}
