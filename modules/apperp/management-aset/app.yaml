    # Menerima aset dari ujung ke ujung: menyusun berkasnya sekaligus menyelesaikannya.
    #
    # Izin dokumen ikut di sini sejak `POST /aset` dipensiunkan 18 September 2026. Tanpa
    # itu privilege bernama "Terima aset" tidak cukup untuk menerima aset apa pun, karena
    # tidak ada lagi jalan masuk ke register selain lewat dokumen penerimaan.
    - code: management-aset.aset.receive
      name: Terima aset
      permissions:
        - management-aset.aset.read
        - management-aset.aset.create
        - management-aset.aset.update
        - management-aset.penerimaan-aset.read
        - management-aset.penerimaan-aset.create
        - management-aset.penerimaan-aset.update
    # Menyelesaikan serah terima: yang benar-benar memindahkan penempatan aset.
    - code: management-aset.aset.transfer
      name: Mutasi aset
      permissions:
        - management-aset.aset.mutate
        - management-aset.mutasi-aset.read
    # Menyusun berita acaranya. Sengaja terpisah dari privilege di atas: juru tulis boleh
    # menyiapkan dokumennya tanpa berwenang memindahkan barangnya.
    - code: management-aset.mutasi-aset.maintain
      name: Kelola dokumen mutasi aset
      permissions:
        - management-aset.mutasi-aset.read
        - management-aset.mutasi-aset.create
        - management-aset.mutasi-aset.update
    - code: management-aset.mutasi-aset.retire
      name: Arsipkan dokumen mutasi aset
      permissions:
        - management-aset.mutasi-aset.archive
    # Menyusun berkas penerimaannya. Terpisah dari `management-aset.aset.receive` dengan
    # alasan yang sama seperti pada mutasi: juru tulis boleh menyiapkan dokumennya, yang
    # berwenang menambah aset ke register yang menyelesaikannya.
    - code: management-aset.penerimaan-aset.maintain
      name: Kelola dokumen penerimaan aset
      permissions:
        - management-aset.penerimaan-aset.read
        - management-aset.penerimaan-aset.create
        - management-aset.penerimaan-aset.update
    - code: management-aset.penerimaan-aset.retire
      name: Arsipkan dokumen penerimaan aset
      permissions:
        - management-aset.penerimaan-aset.archive
    - code: management-aset.perencanaan-aset.maintain
      name: Kelola perencanaan aset
      permissions: [management-aset.perencanaan-aset.read, management-aset.perencanaan-aset.create, management-aset.perencanaan-aset.update]
    - code: management-aset.perencanaan-aset.retire
      name: Arsipkan perencanaan aset
      permissions: [management-aset.perencanaan-aset.archive]
    - code: management-aset.permintaan-pembelian-aset.maintain
      name: Kelola permintaan pembelian aset
      permissions: [management-aset.permintaan-pembelian-aset.read, management-aset.permintaan-pembelian-aset.create]
    - code: management-aset.pemeliharaan-aset.maintain
      name: Susun work order pemeliharaan
      permissions: [management-aset.pemeliharaan-aset.read, management-aset.pemeliharaan-aset.create, management-aset.pemeliharaan-aset.update]
    - code: management-aset.pemeliharaan-aset.retire
      name: Arsipkan work order pemeliharaan
      permissions: [management-aset.pemeliharaan-aset.read, management-aset.pemeliharaan-aset.archive]
    # Dipisahkan supaya penjadwalan, pengerjaan, dan penutupan dapat diberikan kepada
    # orang yang berbeda. Teknisi harus dapat mengerjakan tanpa dapat membuat atau
    # menutup work order; penyelia menutup tanpa perlu ikut mengerjakan.
    - code: management-aset.pemeliharaan-aset.dispatch
      name: Jadwalkan dan tugaskan work order pemeliharaan
