# Laporan cetak/ekspor gaya Business Central. Dataset tetap milik app ini (kelas di
# api/app/Reporting/Definitions); layout unggahan tenant, antrean ekspor, render, dan
# halamannya milik Core. Kode diawali ID app; `permission` adalah hak membaca datanya.
# Lihat docs/dev/23-document-rendering.md di repository CoreERP.
reports:
  - code: management-aset.work-order
    name: Work order
    description: Satu work order lengkap dengan baris pekerjaan dan checklist-nya.
    permission: management-aset.pemeliharaan-aset.read
    parameters: [id]
    builtin_layouts:
      - key: standar
        name: Work order standar (Word)
        description: Header, tabel baris pekerjaan, dan checklist per baris.
        format: docx
  - code: management-aset.daftar-work-order
    name: Daftar work order
    description: Seluruh work order dalam jangkauan Anda, satu baris per work order, untuk diolah di Excel.
    permission: management-aset.pemeliharaan-aset.read
    parameters: [status, dari, sampai]
    builtin_layouts:
      - key: standar
        name: Daftar work order standar (Excel)
        description: Satu lembar dengan kolom identitas, jadwal, dan ringkasan jam.
        format: xlsx
  - code: management-aset.berita-acara-serah-terima
    name: Berita acara serah terima aset
    description: Satu berita acara serah terima beserta seluruh aset yang berpindah di dalamnya.
    permission: management-aset.mutasi-aset.read
    parameters: [id]
    builtin_layouts:
      - key: standar
        name: Berita acara standar (Word)
        description: Kop, identitas kedua pihak, tabel aset, dan blok tanda tangan.
        format: docx
  - code: management-aset.daftar-mutasi-aset
    name: Daftar mutasi aset
    description: Seluruh perpindahan aset dalam jangkauan Anda, satu baris per aset, untuk diolah di Excel.
    permission: management-aset.mutasi-aset.read
    parameters: [status, dari, sampai]
    builtin_layouts:
      - key: standar
        name: Daftar mutasi standar (Excel)
        description: Satu lembar dengan kolom bukti, aset, asal, tujuan, dan kondisi.
        format: xlsx
