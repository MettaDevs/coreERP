id: management-aset
name: Management Aset
description: Kelola klasifikasi, penyusutan, dan maintenance aset perusahaan.
publisher: apperp
version: 0.1.0
kind: business-app

# Seluruh tabel module ini berawalan `aset_`. Awalan inilah yang memisahkan datanya dari
# data Core dan module lain di dalam satu database yang sama, dan penjaga batas menolak
# tabel module yang tidak memakainya.
table_prefix: aset_
requires:
  core: ^0.1
# Peta id module ke rentang versi, bukan daftar. Bentuknya sama dengan yang dibaca
# katalog provider; dua bentuk untuk satu jawaban pasti menyimpang.
dependsOn: {}
api:
  image: registry.apperp.local/apps/management-aset-api:0.1.0
  openapi: contracts/openapi.yaml
ui:
  image: registry.apperp.local/apps/management-aset-ui:0.1.0
  navigation:
    rail:
      - id: master
        label: Master data
      - id: maintenance
        label: Maintenance
      - id: transaksi
        label: Transaksi
    sidebar:
      master:
        # Dua sumbu klasifikasi yang ditunjuk aset secara langsung didahulukan,
        # baru katalog dan master pendukungnya.
        - id: group-aset
          label: Group aset
          permission: management-aset.group-aset.read
        - id: jenis-aset
          label: Jenis aset
          permission: management-aset.jenis-aset.read
        - id: pabrikan-aset
          label: Pabrikan dan model
          permission: management-aset.pabrikan-aset.read
        - id: kondisi-aset
          label: Kondisi aset
          permission: management-aset.kondisi-aset.read
        - id: tipe-lokasi-aset
          label: Tipe lokasi aset
          permission: management-aset.tipe-lokasi-aset.read
        - id: lokasi-aset
          label: Lokasi aset
          permission: management-aset.lokasi-aset.read
        - id: tipe-atribut
          label: Tipe atribut
          permission: management-aset.tipe-atribut.read
        - id: buku-penyusutan
          label: Buku penyusutan
          permission: management-aset.buku-penyusutan.read
        - id: profil-penyusutan
          label: Profil penyusutan
          permission: management-aset.profil-penyusutan.read
        - id: fixed-aset-parameters
          label: Parameter aset tetap
          permission: management-aset.fixed-aset-parameters.read
        - id: fixed-aset-posting-profiles
          label: Profil posting aset
          permission: management-aset.fixed-aset-posting-profiles.read
      maintenance:
        # Urutan ini adalah alur setup awal: dasar pekerjaan, checklist dan
        # bawaan pekerjaan, lalu aturan work order. Dua master legacy tetap
        # ditampilkan paling bawah sebagai referensi, di luar alur setup utama.
        - id: trade
          label: Bidang keahlian
          permission: management-aset.trade.read
        - id: maintenance-job-types
          label: Jenis pekerjaan
          permission: management-aset.maintenance-job-types.read
        - id: maintenance-checklist-variables
          label: Pilihan jawaban checklist
          permission: management-aset.maintenance-checklist-variables.read
        - id: maintenance-checklist-templates
          label: Template checklist
          permission: management-aset.maintenance-checklist-templates.read
        - id: maintenance-job-type-defaults
          label: Bawaan pekerjaan
          permission: management-aset.maintenance-job-type-defaults.read
        - id: tipe-work-order
          label: Tipe work order
          permission: management-aset.tipe-work-order.read
        - id: tingkat-layanan
          label: Tingkat layanan
          permission: management-aset.tingkat-layanan.read
        - id: sebab-kerusakan
          label: Sebab kerusakan
          permission: management-aset.sebab-kerusakan.read
        - id: tindakan-perbaikan
          label: Tindakan perbaikan
          permission: management-aset.tindakan-perbaikan.read
        - id: validasi-status-work-order
          label: Syarat penyelesaian
          permission: management-aset.validasi-status-work-order.read
        - id: item-checklist-maintenance
          label: Item checklist maintenance
          permission: management-aset.item-checklist-maintenance.read
        - id: analisa-maintenance
          label: Analisa maintenance
          permission: management-aset.analisa-maintenance.read
      transaksi:
        - id: perencanaan-aset
          label: Perencanaan aset
          permission: management-aset.perencanaan-aset.read
        - id: permintaan-pembelian-aset
          label: Permintaan pembelian
          permission: management-aset.permintaan-pembelian-aset.read
        # Id view berpindah ke nama prosesnya; permission dan endpoint tetap `aset`
        # karena keduanya kontrak, bukan label navigasi.
        - id: inventarisasi-aset
          label: Inventarisasi aset
          permission: management-aset.aset.read
        - id: mutasi-aset
          label: Mutasi aset
          permission: management-aset.mutasi-aset.read
        - id: pemeliharaan-aset
          label: Pemeliharaan aset
          permission: management-aset.pemeliharaan-aset.read
        - id: dekomisioning-aset
          label: Dekomisioning aset
          permission: management-aset.dekomisioning-aset.read
        - id: penjualan-aset
          label: Penjualan aset
          permission: management-aset.penjualan-aset.read
        - id: pemusnahan-aset
          label: Pemusnahan aset
          permission: management-aset.pemusnahan-aset.read
        - id: monitoring-aset
          label: Monitoring aset
          permission: management-aset.monitoring-aset.read
        - id: penyusutan
          label: Penyusutan aset
          permission: management-aset.penyusutan.read
database:
  logical_name: app_erp_management_aset
  migrations: database/migrations
events:
  asyncapi: contracts/asyncapi.yaml
workflow_types:
  - code: management-aset.dekomisioning-aset-verification
    name: Verifikasi usulan dekomisioning aset
    decision_context_schema:
      required: [document_id, aset_id]
  - code: management-aset.pemusnahan-aset-verification
    name: Verifikasi usulan pemusnahan aset
    decision_context_schema:
      required: [document_id, aset_id]
security:
  data_policies:
    - code: management-aset.aset-responsibility
      name: Akses aset menurut unit penanggung jawab
      protected_permissions:
        - management-aset.aset.read
        - management-aset.aset.create
        - management-aset.aset.update
        - management-aset.aset.mutate
        - management-aset.mutasi-aset.read
        - management-aset.mutasi-aset.create
        - management-aset.mutasi-aset.update
        - management-aset.mutasi-aset.archive
        - management-aset.penerimaan-aset.read
        - management-aset.penerimaan-aset.create
        - management-aset.penerimaan-aset.update
        - management-aset.penerimaan-aset.archive
        - management-aset.perencanaan-aset.read
        - management-aset.perencanaan-aset.create
        - management-aset.perencanaan-aset.update
        - management-aset.perencanaan-aset.archive
        - management-aset.permintaan-pembelian-aset.read
        - management-aset.permintaan-pembelian-aset.create
        - management-aset.pemeliharaan-aset.read
        - management-aset.pemeliharaan-aset.create
        - management-aset.pemeliharaan-aset.update
        - management-aset.pemeliharaan-aset.archive
        - management-aset.pemeliharaan-aset.schedule
        - management-aset.pemeliharaan-aset.execute
        - management-aset.pemeliharaan-aset.close
        - management-aset.dekomisioning-aset.read
        - management-aset.dekomisioning-aset.create
        - management-aset.dekomisioning-aset.verify
        - management-aset.penjualan-aset.read
        - management-aset.penjualan-aset.create
        - management-aset.pemusnahan-aset.read
        - management-aset.pemusnahan-aset.create
        - management-aset.penyusutan.read
        - management-aset.penyusutan.create
        - management-aset.penyusutan.finalize
        - management-aset.penyusutan.correct
      requires_legal_entity: true
      requires_operating_unit: true
      allows_descendants: true
