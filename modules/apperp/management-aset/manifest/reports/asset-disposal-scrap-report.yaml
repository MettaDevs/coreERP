reports:
  - code: management-aset.laporan-pemusnahan-aset
    name: Laporan pemusnahan aset
    description: Aset yang dimusnahkan dalam rentang tanggal, beserta nilai perolehan dan nilai bukunya saat dimusnahkan.
    permission: management-aset.pemusnahan-aset.read
    parameters: [group_aset_id, kelompok_harta_fiskal_id, jenis_aset_id, asset_id, buku_id, dari, sampai]
    builtin_layouts:
      - key: standar
        name: Laporan pemusnahan aset standar (Excel)
        description: 'Satu baris per aset yang dimusnahkan: bukti, tanggal, kondisi, nilai perolehan, dan nilai buku.'
        format: xlsx
