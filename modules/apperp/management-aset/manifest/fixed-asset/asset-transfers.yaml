security:
  entry_points:
    - code: management-aset.mutasi-aset.form
      name: Layar mutasi aset
      type: form
    - code: management-aset.mutasi-aset.api
      name: API mutasi aset
      type: api
  permissions:
    - code: management-aset.mutasi-aset.read
      name: Lihat mutasi aset
      entry_point: management-aset.mutasi-aset.form
      access: read
    - code: management-aset.mutasi-aset.create
      name: Buat mutasi aset
      entry_point: management-aset.mutasi-aset.api
      access: create
    - code: management-aset.mutasi-aset.update
      name: Ubah mutasi aset
      entry_point: management-aset.mutasi-aset.api
      access: update
    - code: management-aset.mutasi-aset.archive
      name: Arsipkan mutasi aset
      entry_point: management-aset.mutasi-aset.api
      access: delete
  privileges:
    # Menyusun berita acaranya. Sengaja terpisah dari privilege di atas: juru tulis boleh
    # menyiapkan dokumennya tanpa berwenang memindahkan barangnya.
    - code: management-aset.mutasi-aset.maintain
      name: Kelola dokumen mutasi aset
      permissions:
        - management-aset.mutasi-aset.read
        - management-aset.mutasi-aset.create
        - management-aset.mutasi-aset.update
    - code: management-aset.mutasi-aset.retire
      name: Arsipkan dokumen mutasi aset
      permissions:
        - management-aset.mutasi-aset.archive
number_sequences:
  references:
    - code: management-aset.mutasi-aset
      name: Nomor berita acara serah terima aset
      default_prefix: MUTA
      allowed_scopes:
        - legal_entity
