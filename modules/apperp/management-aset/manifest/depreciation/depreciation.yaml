security:
  entry_points:
    - code: management-aset.penyusutan.api
      name: API penyusutan aset
      type: api
    - code: management-aset.penyusutan.form
      name: Layar penyusutan aset
      type: form
  permissions:
    - code: management-aset.penyusutan.create
      name: Buat proposal penyusutan
      entry_point: management-aset.penyusutan.api
      access: create
    - code: management-aset.penyusutan.read
      name: Lihat penyusutan aset
      entry_point: management-aset.penyusutan.api
      access: read
    - code: management-aset.penyusutan.finalize
      name: Finalisasi penyusutan
      entry_point: management-aset.penyusutan.api
      access: invoke
    - code: management-aset.penyusutan.correct
      name: Koreksi penyusutan
      entry_point: management-aset.penyusutan.api
      access: correct
    - code: management-aset.penyusutan.post
      name: Post penyusutan ke aplikasi finance
      entry_point: management-aset.penyusutan.api
      access: invoke
  privileges:
    - code: management-aset.penyusutan.maintain
      name: Kelola penyusutan aset
      permissions: [management-aset.penyusutan.read, management-aset.penyusutan.create, management-aset.penyusutan.finalize]
    - code: management-aset.penyusutan.correct-period
      name: Koreksi penyusutan aset
      permissions: [management-aset.penyusutan.correct]
    - code: management-aset.penyusutan.post-to-finance
      name: Post jurnal penyusutan
      permissions: [management-aset.penyusutan.read, management-aset.penyusutan.post]
  duties:
    - code: management-aset.penyusutan.manage
      name: Kelola penyusutan aset
      privileges: [management-aset.penyusutan.maintain, management-aset.penyusutan.correct-period]
    # Duty tersendiri: role yang sudah memegang "Kelola penyusutan aset" tidak boleh diam-diam dapat
    # mengirim jurnal ke aplikasi finance (keputusan pemilik produk, 22 September 2026).
    - code: management-aset.penyusutan.finance-posting
      name: Post penyusutan ke aplikasi finance
      privileges: [management-aset.penyusutan.post-to-finance]
