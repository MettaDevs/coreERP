security:
  entry_points:
    - code: management-aset.group-aset.form
      name: Layar group aset
      type: form
    - code: management-aset.group-aset.api
      name: API group aset
      type: api
  permissions:
    - code: management-aset.group-aset.read
      name: Lihat group aset
      entry_point: management-aset.group-aset.form
      access: read
    - code: management-aset.group-aset.create
      name: Tambah group aset
      entry_point: management-aset.group-aset.api
      access: create
    - code: management-aset.group-aset.update
      name: Ubah group aset
      entry_point: management-aset.group-aset.api
      access: update
    - code: management-aset.group-aset.archive
      name: Arsipkan group aset
      entry_point: management-aset.group-aset.api
      access: delete
  privileges:
    - code: management-aset.group-aset.maintain
      name: Pelihara group aset
      permissions:
        - management-aset.group-aset.read
        - management-aset.group-aset.create
        - management-aset.group-aset.update
    - code: management-aset.group-aset.retire
      name: Arsipkan group aset
      permissions:
        - management-aset.group-aset.archive
  duties:
    - code: management-aset.group-aset.manage
      name: Kelola group aset
      privileges:
        - management-aset.group-aset.maintain
        - management-aset.group-aset.retire
number_sequences:
  references:
    # Tidak lagi dipakai untuk kode baru: kodenya diketik (K-24 feed posting finance). Dibiarkan
    # terdaftar supaya urutan nomor tenant yang sudah menyetelnya tidak rusak (N-1).
    - code: management-aset.group-aset
      name: Kode group aset
      default_prefix: GRPA
      allowed_scopes:
        - tenant
