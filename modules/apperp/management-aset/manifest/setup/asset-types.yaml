security:
  entry_points:
    - code: management-aset.jenis-aset.form
      name: Layar jenis aset
      type: form
    - code: management-aset.jenis-aset.api
      name: API jenis aset
      type: api
  permissions:
    - code: management-aset.jenis-aset.read
      name: Lihat jenis aset
      entry_point: management-aset.jenis-aset.form
      access: read
    - code: management-aset.jenis-aset.create
      name: Tambah jenis aset
      entry_point: management-aset.jenis-aset.api
      access: create
    - code: management-aset.jenis-aset.update
      name: Ubah jenis aset
      entry_point: management-aset.jenis-aset.api
      access: update
    - code: management-aset.jenis-aset.archive
      name: Arsipkan jenis aset
      entry_point: management-aset.jenis-aset.api
      access: delete
  privileges:
    - code: management-aset.jenis-aset.maintain
      name: Pelihara jenis aset
      permissions:
        - management-aset.jenis-aset.read
        - management-aset.jenis-aset.create
        - management-aset.jenis-aset.update
    - code: management-aset.jenis-aset.retire
      name: Arsipkan jenis aset
      permissions:
        - management-aset.jenis-aset.archive
  duties:
    - code: management-aset.jenis-aset.manage
      name: Kelola jenis aset
      privileges:
        - management-aset.jenis-aset.maintain
        - management-aset.jenis-aset.retire
number_sequences:
  references:
    - code: management-aset.jenis-aset
      name: Kode jenis aset
      default_prefix: JNSA
      allowed_scopes:
        - tenant
