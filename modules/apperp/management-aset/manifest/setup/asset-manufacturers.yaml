security:
  entry_points:
    - code: management-aset.pabrikan-aset.form
      name: Layar pabrikan dan model
      type: form
    - code: management-aset.pabrikan-aset.api
      name: API pabrikan aset
      type: api
  permissions:
    - code: management-aset.pabrikan-aset.read
      name: Lihat pabrikan aset
      entry_point: management-aset.pabrikan-aset.form
      access: read
    - code: management-aset.pabrikan-aset.create
      name: Tambah pabrikan aset
      entry_point: management-aset.pabrikan-aset.api
      access: create
    - code: management-aset.pabrikan-aset.update
      name: Ubah pabrikan aset
      entry_point: management-aset.pabrikan-aset.api
      access: update
    - code: management-aset.pabrikan-aset.archive
      name: Arsipkan pabrikan aset
      entry_point: management-aset.pabrikan-aset.api
      access: delete
  privileges:
    - code: management-aset.pabrikan-aset.maintain
      name: Pelihara pabrikan aset
      permissions:
        - management-aset.pabrikan-aset.read
        - management-aset.pabrikan-aset.create
        - management-aset.pabrikan-aset.update
    - code: management-aset.pabrikan-aset.retire
      name: Arsipkan pabrikan aset
      permissions:
        - management-aset.pabrikan-aset.archive
  duties:
    - code: management-aset.pabrikan-aset.manage
      name: Kelola pabrikan aset
      privileges:
        - management-aset.pabrikan-aset.maintain
        - management-aset.pabrikan-aset.retire
number_sequences:
  references:
    - code: management-aset.pabrikan-aset
      name: Kode pabrikan aset
      default_prefix: PBRA
      allowed_scopes:
        - tenant
