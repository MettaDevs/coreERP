security:
  entry_points:
    - code: management-aset.tipe-lokasi-aset.form
      name: Layar tipe lokasi aset
      type: form
    - code: management-aset.tipe-lokasi-aset.api
      name: API tipe lokasi aset
      type: api
  permissions:
    - code: management-aset.tipe-lokasi-aset.read
      name: Lihat tipe lokasi aset
      entry_point: management-aset.tipe-lokasi-aset.form
      access: read
    - code: management-aset.tipe-lokasi-aset.create
      name: Tambah tipe lokasi aset
      entry_point: management-aset.tipe-lokasi-aset.api
      access: create
    - code: management-aset.tipe-lokasi-aset.update
      name: Ubah tipe lokasi aset
      entry_point: management-aset.tipe-lokasi-aset.api
      access: update
    - code: management-aset.tipe-lokasi-aset.archive
      name: Arsipkan tipe lokasi aset
      entry_point: management-aset.tipe-lokasi-aset.api
      access: delete
  privileges:
    - code: management-aset.tipe-lokasi-aset.maintain
      name: Pelihara tipe lokasi aset
      permissions:
        - management-aset.tipe-lokasi-aset.read
        - management-aset.tipe-lokasi-aset.create
        - management-aset.tipe-lokasi-aset.update
    - code: management-aset.tipe-lokasi-aset.retire
      name: Arsipkan tipe lokasi aset
      permissions:
        - management-aset.tipe-lokasi-aset.archive
  duties:
    - code: management-aset.tipe-lokasi-aset.manage
      name: Kelola tipe lokasi aset
      privileges:
        - management-aset.tipe-lokasi-aset.maintain
        - management-aset.tipe-lokasi-aset.retire
number_sequences:
  references:
    - code: management-aset.tipe-lokasi-aset
      name: Kode tipe lokasi aset
      default_prefix: TLKA
      allowed_scopes:
        - tenant
