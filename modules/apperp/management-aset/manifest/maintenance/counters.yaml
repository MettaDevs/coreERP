security:
  entry_points:
    - code: management-aset.jenis-counter.form
      name: Layar jenis counter aset
      type: form
    - code: management-aset.jenis-counter.api
      name: API jenis counter aset
      type: api
  permissions:
    - code: management-aset.jenis-counter.read
      name: Lihat jenis counter aset
      entry_point: management-aset.jenis-counter.form
      access: read
    - code: management-aset.jenis-counter.create
      name: Tambah jenis counter aset
      entry_point: management-aset.jenis-counter.api
      access: create
    - code: management-aset.jenis-counter.update
      name: Ubah jenis counter aset
      entry_point: management-aset.jenis-counter.api
      access: update
    - code: management-aset.jenis-counter.archive
      name: Arsipkan jenis counter aset
      entry_point: management-aset.jenis-counter.api
      access: delete
  privileges:
    - code: management-aset.jenis-counter.maintain
      name: Pelihara jenis counter aset
      permissions:
        - management-aset.jenis-counter.read
        - management-aset.jenis-counter.create
        - management-aset.jenis-counter.update
    - code: management-aset.jenis-counter.retire
      name: Arsipkan jenis counter aset
      permissions:
        - management-aset.jenis-counter.archive
  duties:
    - code: management-aset.jenis-counter.manage
      name: Kelola jenis counter aset
      privileges:
        - management-aset.jenis-counter.maintain
        - management-aset.jenis-counter.retire
number_sequences:
  references:
    - code: management-aset.jenis-counter
      name: Kode jenis counter aset
      default_prefix: JCTR
      allowed_scopes:
        - tenant
