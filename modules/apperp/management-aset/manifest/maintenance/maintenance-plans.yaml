security:
  entry_points:
    - code: management-aset.rencana-pemeliharaan.form
      name: Layar rencana pemeliharaan
      type: form
    - code: management-aset.rencana-pemeliharaan.api
      name: API rencana pemeliharaan
      type: api
  permissions:
    - code: management-aset.rencana-pemeliharaan.read
      name: Lihat rencana pemeliharaan
      entry_point: management-aset.rencana-pemeliharaan.form
      access: read
    - code: management-aset.rencana-pemeliharaan.create
      name: Tambah rencana pemeliharaan
      entry_point: management-aset.rencana-pemeliharaan.api
      access: create
    - code: management-aset.rencana-pemeliharaan.update
      name: Ubah rencana pemeliharaan
      entry_point: management-aset.rencana-pemeliharaan.api
      access: update
    - code: management-aset.rencana-pemeliharaan.archive
      name: Arsipkan rencana pemeliharaan
      entry_point: management-aset.rencana-pemeliharaan.api
      access: delete
  privileges:
    - code: management-aset.rencana-pemeliharaan.maintain
      name: Pelihara rencana pemeliharaan
      permissions:
        - management-aset.rencana-pemeliharaan.read
        - management-aset.rencana-pemeliharaan.create
        - management-aset.rencana-pemeliharaan.update
    - code: management-aset.rencana-pemeliharaan.retire
      name: Arsipkan rencana pemeliharaan
      permissions:
        - management-aset.rencana-pemeliharaan.archive
  duties:
    - code: management-aset.rencana-pemeliharaan.manage
      name: Kelola rencana pemeliharaan
      privileges:
        - management-aset.rencana-pemeliharaan.maintain
        - management-aset.rencana-pemeliharaan.retire
number_sequences:
  references:
    - code: management-aset.rencana-pemeliharaan
      name: Kode rencana pemeliharaan
      default_prefix: RPMA
      allowed_scopes:
        - tenant
