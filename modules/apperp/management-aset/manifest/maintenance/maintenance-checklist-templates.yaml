security:
  entry_points:
    - code: management-aset.maintenance-checklist-templates.form
      name: Layar template checklist maintenance
      type: form
    - code: management-aset.maintenance-checklist-templates.api
      name: API template checklist maintenance
      type: api
  permissions:
    - code: management-aset.maintenance-checklist-templates.read
      name: Lihat template checklist maintenance
      entry_point: management-aset.maintenance-checklist-templates.form
      access: read
    - code: management-aset.maintenance-checklist-templates.create
      name: Tambah template checklist maintenance
      entry_point: management-aset.maintenance-checklist-templates.api
      access: create
    - code: management-aset.maintenance-checklist-templates.update
      name: Ubah template checklist maintenance
      entry_point: management-aset.maintenance-checklist-templates.api
      access: update
    - code: management-aset.maintenance-checklist-templates.archive
      name: Arsipkan template checklist maintenance
      entry_point: management-aset.maintenance-checklist-templates.api
      access: delete
  privileges:
    - code: management-aset.maintenance-checklist-templates.maintain
      name: Pelihara template checklist maintenance
      permissions:
        - management-aset.maintenance-checklist-templates.read
        - management-aset.maintenance-checklist-templates.create
        - management-aset.maintenance-checklist-templates.update
    - code: management-aset.maintenance-checklist-templates.retire
      name: Arsipkan template checklist maintenance
      permissions:
        - management-aset.maintenance-checklist-templates.archive
  duties:
    - code: management-aset.maintenance-checklist-templates.manage
      name: Kelola template checklist maintenance
      privileges:
        - management-aset.maintenance-checklist-templates.maintain
        - management-aset.maintenance-checklist-templates.retire
number_sequences:
  references:
    - code: management-aset.maintenance-checklist-templates
      name: Kode template checklist maintenance
      default_prefix: TCMA
      allowed_scopes:
        - tenant
