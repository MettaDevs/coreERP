security:
  entry_points:
    - code: management-aset.permintaan-pemeliharaan.form
      name: Layar permintaan pemeliharaan
      type: form
    - code: management-aset.permintaan-pemeliharaan.api
      name: API permintaan pemeliharaan
      type: api
  permissions:
    - code: management-aset.permintaan-pemeliharaan.read
      name: Lihat permintaan pemeliharaan
      entry_point: management-aset.permintaan-pemeliharaan.form
      access: read
    - code: management-aset.permintaan-pemeliharaan.create
      name: Buat permintaan pemeliharaan
      entry_point: management-aset.permintaan-pemeliharaan.api
      access: create
    - code: management-aset.permintaan-pemeliharaan.update
      name: Ubah permintaan pemeliharaan draf
      entry_point: management-aset.permintaan-pemeliharaan.api
      access: update
    - code: management-aset.permintaan-pemeliharaan.archive
      name: Arsipkan permintaan pemeliharaan
      entry_point: management-aset.permintaan-pemeliharaan.api
      access: delete
    - code: management-aset.permintaan-pemeliharaan.submit
      name: Ajukan permintaan pemeliharaan
      entry_point: management-aset.permintaan-pemeliharaan.api
      access: invoke
    - code: management-aset.permintaan-pemeliharaan.review
      name: Terima, tolak, dan buatkan work order permintaan pemeliharaan
      entry_point: management-aset.permintaan-pemeliharaan.api
      access: invoke
  privileges:
    - code: management-aset.permintaan-pemeliharaan.compose
      name: Susun dan ajukan permintaan pemeliharaan
      permissions:
        - management-aset.permintaan-pemeliharaan.read
        - management-aset.permintaan-pemeliharaan.create
        - management-aset.permintaan-pemeliharaan.update
        - management-aset.permintaan-pemeliharaan.archive
        - management-aset.permintaan-pemeliharaan.submit
    - code: management-aset.permintaan-pemeliharaan.decide
      name: Putuskan permintaan pemeliharaan
      permissions:
        - management-aset.permintaan-pemeliharaan.read
        - management-aset.permintaan-pemeliharaan.review
  duties:
    # Dua duty, padanan peran *Maintenance requester* dan perencana di F&O. Pelapor tidak memegang
    # permission membuat work order; membuat work order dari permintaan menuntut `review` di sini
    # sekaligus `management-aset.pemeliharaan-aset.create` dari duty kelola work order.
    - code: management-aset.permintaan-pemeliharaan.request
      name: Ajukan permintaan pemeliharaan
      privileges:
        - management-aset.permintaan-pemeliharaan.compose
    - code: management-aset.permintaan-pemeliharaan.review-requests
      name: Tinjau permintaan pemeliharaan
      privileges:
        - management-aset.permintaan-pemeliharaan.decide
number_sequences:
  references:
    - code: management-aset.permintaan-pemeliharaan
      name: Nomor permintaan pemeliharaan
      default_prefix: PPMA
      allowed_scopes: [legal_entity]
