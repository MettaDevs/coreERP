id: procurement
name: Procurement
description: Dokumentasi dan sistem pengadaan barang dan jasa, rekanan, dan manajemen pengadaan.
publisher: apperp
version: 0.1.0
kind: business-app
requires:
  core: ^0.1
dependsOn: {}
table_prefix: procurement_
ui:
  navigation:
    rail:
      - id: dashboard
        label: Dashboard
      - id: master
        label: Master data
      - id: manajemen-pengadaan
        label: Manajemen pengadaan
      - id: laporan
        label: Laporan
    sidebar:
      dashboard:
        - id: ringkasan-pengadaan
          label: Ringkasan pengadaan
          permission: procurement.dashboard.read
      master:
        - id: vendor
          label: Vendor/Supplier
          permission: procurement.vendor.read
        - id: prakualifikasi
          label: Prakualifikasi
          permission: procurement.prakualifikasi.read
        - id: kualifikasi
          label: Kualifikasi
          permission: procurement.kualifikasi.read
        - id: harga-perkiraan
          label: Harga Perkiraan
          permission: procurement.harga-perkiraan.read
        - id: kategori-pengadaan
          label: Kategori Pengadaan
          permission: procurement.kategori-pengadaan.read
        - id: jenis-vendor
          label: Jenis Vendor/Supplier
          permission: procurement.jenis-vendor.read
        - id: metode-pembayaran
          label: Metode Pembayaran
          permission: procurement.metode-pembayaran.read
        - id: termin-pembayaran
          label: Termin Pembayaran
          permission: procurement.termin-pembayaran.read
        - id: item-jasa
          label: Item Jasa
          permission: procurement.item-jasa.read
        - id: item-subkont
          label: Item Subkont
          permission: procurement.item-subkont.read
      manajemen-pengadaan:
        - id: permintaan-pembelian
          label: Permintaan pembelian
          permission: procurement.permintaan-pembelian.read
        - id: permintaan-penawaran
          label: Permintaan penawaran
          permission: procurement.permintaan-penawaran.read
        - id: pesanan-pembelian
          label: Pesanan pembelian
          permission: procurement.pesanan-pembelian.read
        - id: penerimaan-barang
          label: Penerimaan barang
          permission: procurement.penerimaan-barang.read
      laporan:
        - id: laporan-pengadaan
          label: Laporan pengadaan
          permission: procurement.laporan-pengadaan.read

security:
  entry_points:
    - { code: procurement.dashboard.form, name: Layar dashboard pengadaan, type: form }
    - { code: procurement.vendor.form, name: Layar vendor/supplier, type: form }
    - { code: procurement.prakualifikasi.form, name: Layar prakualifikasi vendor, type: form }
    - { code: procurement.kualifikasi.form, name: Layar kualifikasi vendor, type: form }
    - { code: procurement.harga-perkiraan.form, name: Layar harga perkiraan, type: form }
    - { code: procurement.kategori-pengadaan.form, name: Layar kategori pengadaan, type: form }
    - { code: procurement.jenis-vendor.form, name: Layar jenis vendor/supplier, type: form }
    - { code: procurement.metode-pembayaran.form, name: Layar metode pembayaran, type: form }
    - { code: procurement.termin-pembayaran.form, name: Layar termin pembayaran, type: form }
    - { code: procurement.item-jasa.form, name: Layar item jasa, type: form }
    - { code: procurement.item-subkont.form, name: Layar item subkont, type: form }
    - { code: procurement.permintaan-pembelian.form, name: Layar permintaan pembelian, type: form }
    - { code: procurement.permintaan-penawaran.form, name: Layar permintaan penawaran, type: form }
    - { code: procurement.pesanan-pembelian.form, name: Layar pesanan pembelian, type: form }
    - { code: procurement.penerimaan-barang.form, name: Layar penerimaan barang, type: form }
    - { code: procurement.laporan-pengadaan.form, name: Layar laporan pengadaan, type: form }

  permissions:
    - { code: procurement.dashboard.read, name: Lihat dashboard pengadaan, entry_point: procurement.dashboard.form, access: read }
    - { code: procurement.vendor.read, name: Lihat vendor/supplier, entry_point: procurement.vendor.form, access: read }
    - { code: procurement.prakualifikasi.read, name: Lihat prakualifikasi, entry_point: procurement.prakualifikasi.form, access: read }
    - { code: procurement.kualifikasi.read, name: Lihat kualifikasi, entry_point: procurement.kualifikasi.form, access: read }
    - { code: procurement.harga-perkiraan.read, name: Lihat harga perkiraan, entry_point: procurement.harga-perkiraan.form, access: read }
    - { code: procurement.kategori-pengadaan.read, name: Lihat kategori pengadaan, entry_point: procurement.kategori-pengadaan.form, access: read }
    - { code: procurement.jenis-vendor.read, name: Lihat jenis vendor/supplier, entry_point: procurement.jenis-vendor.form, access: read }
    - { code: procurement.metode-pembayaran.read, name: Lihat metode pembayaran, entry_point: procurement.metode-pembayaran.form, access: read }
    - { code: procurement.termin-pembayaran.read, name: Lihat termin pembayaran, entry_point: procurement.termin-pembayaran.form, access: read }
    - { code: procurement.item-jasa.read, name: Lihat item jasa, entry_point: procurement.item-jasa.form, access: read }
    - { code: procurement.item-subkont.read, name: Lihat item subkont, entry_point: procurement.item-subkont.form, access: read }
    - { code: procurement.permintaan-pembelian.read, name: Lihat permintaan pembelian, entry_point: procurement.permintaan-pembelian.form, access: read }
    - { code: procurement.permintaan-penawaran.read, name: Lihat permintaan penawaran, entry_point: procurement.permintaan-penawaran.form, access: read }
    - { code: procurement.pesanan-pembelian.read, name: Lihat pesanan pembelian, entry_point: procurement.pesanan-pembelian.form, access: read }
    - { code: procurement.penerimaan-barang.read, name: Lihat penerimaan barang, entry_point: procurement.penerimaan-barang.form, access: read }
    - { code: procurement.laporan-pengadaan.read, name: Lihat laporan pengadaan, entry_point: procurement.laporan-pengadaan.form, access: read }

  privileges:
    - code: procurement.dashboard.view
      name: Buka dashboard pengadaan
      permissions:
        - procurement.dashboard.read
    - code: procurement.master.view
      name: Buka master data pengadaan
      permissions:
        - procurement.vendor.read
        - procurement.prakualifikasi.read
        - procurement.kualifikasi.read
        - procurement.harga-perkiraan.read
        - procurement.kategori-pengadaan.read
        - procurement.jenis-vendor.read
        - procurement.metode-pembayaran.read
        - procurement.termin-pembayaran.read
        - procurement.item-jasa.read
        - procurement.item-subkont.read
    - code: procurement.transaksi.view
      name: Buka transaksi pengadaan
      permissions:
        - procurement.permintaan-pembelian.read
        - procurement.permintaan-penawaran.read
        - procurement.pesanan-pembelian.read
        - procurement.penerimaan-barang.read
    - code: procurement.laporan.view
      name: Buka laporan pengadaan
      permissions:
        - procurement.laporan-pengadaan.read

  duties:
    - code: procurement.dashboard.manage
      name: Kelola dashboard pengadaan
      privileges:
        - procurement.dashboard.view
    - code: procurement.master.manage
      name: Kelola master data pengadaan
      privileges:
        - procurement.master.view
    - code: procurement.transaksi.manage
      name: Kelola transaksi pengadaan
      privileges:
        - procurement.transaksi.view
    - code: procurement.laporan.manage
      name: Kelola laporan pengadaan
      privileges:
        - procurement.laporan.view
