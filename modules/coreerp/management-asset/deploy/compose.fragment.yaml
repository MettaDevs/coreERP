services:
  management-asset-api:
    image: registry.coreerp.local/modules/management-asset-api:0.1.0
    depends_on:
      management-asset-db:
        condition: service_healthy
    ports:
      - "${MANAGEMENT_ASSET_API_PORT:-18091}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(json_decode(file_get_contents('http://127.0.0.1:8080/health'), true)['data']['status'] === 'ok' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10

  management-asset-ui:
    image: registry.coreerp.local/modules/management-asset-ui:0.1.0
    ports:
      - "${MANAGEMENT_ASSET_UI_PORT:-18092}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  management-asset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_module_management_asset
      POSTGRES_USER: core_module_management_asset
      POSTGRES_PASSWORD: ${MANAGEMENT_ASSET_DB_PASSWORD:?Set MANAGEMENT_ASSET_DB_PASSWORD in .env}
    volumes:
      - management-asset-db-data:/var/lib/postgresql/data
      - ../database/migrations:/coreerp/migrations:ro
      - ./migrate.sh:/coreerp/migrate.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_module_management_asset -d core_module_management_asset"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  management-asset-db-data:
