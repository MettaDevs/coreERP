services:
  procurement-api:
    image: registry.coreerp.local/modules/procurement-api:0.1.0
    depends_on:
      procurement-db:
        condition: service_healthy
    ports:
      - "${PROCUREMENT_API_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(json_decode(file_get_contents('http://127.0.0.1:8080/health'), true)['data']['status'] === 'ok' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10

  procurement-ui:
    image: registry.coreerp.local/modules/procurement-ui:0.1.0
    ports:
      - "${PROCUREMENT_UI_PORT:-18082}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  procurement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_module_procurement
      POSTGRES_USER: core_module_procurement
      POSTGRES_PASSWORD: ${PROCUREMENT_DB_PASSWORD:?Set PROCUREMENT_DB_PASSWORD in .env}
    volumes:
      - procurement-db-data:/var/lib/postgresql/data
      - ../database/migrations:/coreerp/migrations:ro
      - ./migrate.sh:/coreerp/migrate.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_module_procurement -d core_module_procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  procurement-db-data:
