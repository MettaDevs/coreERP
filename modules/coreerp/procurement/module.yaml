id: procurement
publisher: coreerp
version: 0.1.0
kind: business-module
requires:
  core: ^0.1
dependsOn: []
api:
  image: registry.coreerp.local/modules/procurement-api:0.1.0
  openapi: contracts/openapi.yaml
ui:
  image: registry.coreerp.local/modules/procurement-ui:0.1.0
  entry: /modules/procurement/
database:
  logicalName: core_module_procurement
  migrations: database/migrations
events:
  asyncapi: contracts/asyncapi.yaml
permissions:
  - procurement.requisition.read
  - procurement.requisition.create
  - procurement.requisition.update
  - procurement.requisition.approve
  - procurement.settings.manage
