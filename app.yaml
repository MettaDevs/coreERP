id: management-aset
name: Management Aset
description: Kelola entitas, kategori, dan maintenance aset perusahaan.
publisher: apperp
version: 0.1.0
kind: business-app
requires:
  core: ^0.1
depends_on: []
api:
  image: registry.apperp.local/apps/management-aset-api:0.1.0
  openapi: contracts/openapi.yaml
ui:
  image: registry.apperp.local/apps/management-aset-ui:0.1.0
  entry: /apps-content/management-aset/
  navigation:
    rail:
      - id: master
        label: Master data
      - id: transaksi
        label: Transaksi
    sidebar:
      master:
        - id: entitas-aset
          label: Entitas aset
          permission: management-aset.entitas-aset.read
        - id: group-aset
          label: Group aset
          permission: management-aset.group-aset.read
        - id: kategori-aset
          label: Kategori aset
          permission: management-aset.kategori-aset.read
        - id: jenis-aset
          label: Jenis aset
          permission: management-aset.jenis-aset.read
        - id: kondisi-aset
          label: Kondisi aset
          permission: management-aset.kondisi-aset.read
        - id: pabrikan-aset
          label: Pabrikan aset
          permission: management-aset.pabrikan-aset.read
