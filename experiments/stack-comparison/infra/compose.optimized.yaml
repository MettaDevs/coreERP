# Varian teroptimasi (optimized.md): Valkey untuk sesi, sumber PHP dengan overlay cache konteks.
# Dipakai sebagai -f tambahan sesudah compose.yaml bila COMPARE_VARIANT=optimized.
services:
  valkey:
    image: ${VALKEY_IMAGE:?Set VALKEY_IMAGE to an inspected local image}
    cpus: 1
    mem_limit: 256m
    # AOF everysec: sesi bertahan sampai satu detik terakhir bila Valkey mati; tanpa snapshot RDB (fork).
    command: [valkey-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, 200mb, --maxmemory-policy, noeviction]
    volumes:
      - valkey:/data
    ports:
      - 127.0.0.1:18646:6379
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  php:
    # Rincian tiap variabel di php/optimized/README.md. SESSION_STORE dan SESSION_CONNECTION sengaja tidak disetel.
    environment:
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: "false"
      SESSION_CACHE_PREFIX: "coreerp-session:"
      REDIS_CLIENT: phpredis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PREFIX: ""
      VALKEY_SESSION_DB: "0"
      CONTEXT_CACHE: "on"
      CONTEXT_CACHE_TTL_SECONDS: "300"
    volumes:
      - source-optimized:/repo

volumes:
  valkey:
    name: coreerp-stack-comparison-valkey
  source-optimized:
    name: coreerp-stack-comparison-source-optimized
