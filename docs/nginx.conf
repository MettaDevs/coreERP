server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `cleanUrls: true` menghasilkan berkas .html tanpa ekstensi pada URL,
    # jadi /apps/membangun-app-baru harus dipetakan ke .../membangun-app-baru.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Halaman 404 VitePress tetap ditampilkan, tetapi dengan status 404 —
    # bukan 200 — supaya pemeriksa tautan tidak menganggap URL salah itu sah.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Aset ber-hash aman di-cache lama; halaman tidak.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
