<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>NativeSelect</title>
<style>
  .ns { position: relative; width: 208px; padding-top: var(--space-1\.5); }
  .ns-box { display: flex; align-items: center; justify-content: space-between; height: var(--control-height); padding: 0 var(--space-3); border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); box-shadow: var(--shadow-xs); font-size: 14px; }
  .ns-box .ce-ico { opacity: 0.5; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="ce-pad ce-row" style="gap:var(--space-4)">
  <div class="ns ce-field"><div class="ns-box">Semua status<svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><span class="ce-float" style="top:6px">Status</span></div>
  <div class="ns ce-field"><div class="ns-box">Draft<svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><span class="ce-float" style="top:6px">Tahap dokumen</span></div>
</div>
</body>
</html>
