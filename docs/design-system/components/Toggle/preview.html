<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Toggle</title></head>
<body>
<div class="ce-pad ce-row" style="gap:var(--space-2)">
  <button class="ce-toggle" type="button" aria-pressed="false" aria-label="Tebal"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></button>
  <button class="ce-toggle is-on" type="button" aria-pressed="true" aria-label="Miring"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg></button>
  <button class="ce-toggle is-outline" type="button" aria-pressed="false" aria-label="Garis bawah"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" x2="20" y1="20" y2="20"/></svg></button>
  <button class="ce-toggle is-outline is-on" type="button" aria-pressed="true">Ringkas</button>
</div>
</body>
</html>
