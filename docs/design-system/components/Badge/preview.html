<!-- @dsCard group="Umpan balik" height=130 subtitle="Status dengan kata, bukan warna saja" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Badge</title></head>
<body>
<div class="ce-pad ce-col">
  <div class="ce-row" style="gap:var(--space-2)">
    <span class="ce-badge ce-badge-default">Aktif</span>
    <span class="ce-badge ce-badge-secondary">Nonaktif</span>
    <span class="ce-badge ce-badge-outline">Draft</span>
    <span class="ce-badge ce-badge-destructive">Ditolak</span>
    <span class="ce-badge ce-badge-outline">2</span>
  </div>
  <div class="ce-row" style="gap:var(--space-4)">
    <span class="ce-row ce-tone-success"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Terkirim ke finance</span>
    <span class="ce-row ce-tone-warning"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Menunggu akun</span>
    <span class="ce-row ce-tone-destructive"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Gagal dikirim</span>
  </div>
</div>
</body>
</html>
