<!-- @dsCard group="Perintah" height=220 subtitle="Klik kanan pada area pemicu" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>ContextMenu</title></head>
<body>
<div class="ce-pad ce-row" style="align-items:flex-start;gap:var(--space-4)">
  <div style="width:220px;height:120px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:var(--radius-md);color:var(--muted-foreground)">Klik kanan di sini</div>
  <div class="ce-menu" role="menu" style="width:200px">
    <div class="ce-menu-item is-inset is-focus" role="menuitemcheckbox" aria-checked="true"><span class="ce-menu-mark"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Tampilkan nomor baris</div>
    <div class="ce-menu-item is-inset" role="menuitemcheckbox" aria-checked="false">Bekukan kolom</div>
    <div class="ce-menu-sep" role="separator"></div>
    <div class="ce-menu-item" role="menuitem">Atur ulang kolom</div>
  </div>
</div>
</body>
</html>
