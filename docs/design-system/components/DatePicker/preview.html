<!-- @dsCard group="Form" height=150 subtitle="Ketik dd/mm/yyyy, simpan ISO" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>DatePicker</title></head>
<body>
<div class="ce-pad">
  <div class="ce-grid">
    <div class="ce-fc">
      <div class="ce-field"><div class="ce-input is-focus" style="justify-content:space-between"><span class="ce-placeholder">dd/mm/yyyy</span><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></div><span class="ce-float">Tanggal perolehan <span class="ce-req">*</span></span></div>
      <div class="ce-help"></div>
    </div>
    <div class="ce-fc">
      <div class="ce-field"><div class="ce-input" style="justify-content:space-between"><span>03/11/2026</span><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></div><span class="ce-float">Tanggal siap pakai</span></div>
      <div class="ce-help"></div>
    </div>
  </div>
  <p class="ce-note" style="margin-top:var(--space-3)">Kiri: kosong dan difokuskan, petunjuk format tampil. Kanan: terisi; nilai yang dikirim ke server <code>2026-11-03</code>.</p>
</div>
</body>
</html>
