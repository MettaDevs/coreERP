<!-- @dsCard group="Kartu" height=300 subtitle="Rincian dokumen: kontrol per sel, Enter pindah field" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>DocumentLines</title>
<style>
  .dl .ce-table td { padding: var(--space-1) var(--space-2); height: auto; }
  .dl .ce-table th { padding: var(--space-2); }
  .dl .ce-input { height: var(--control-height-document); padding: 2px var(--space-2); box-shadow: none; }
  .dl-err td { padding-top: 0 !important; }
  .dl-foot { display: flex; justify-content: flex-end; gap: var(--space-6); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="ce-pad dl">
  <div class="ce-table-wrap">
    <div class="ce-row" style="padding:var(--space-1) var(--space-2)">
      <button class="ce-cmd" type="button"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Tambah</button>
      <button class="ce-cmd ce-cmd-delete" type="button"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Delete</button>
      <button class="ce-icon-btn" type="button" style="margin-left:auto" aria-label="Buka mode fokus Rincian" title="Mode fokus"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg></button>
    </div>
    <table class="ce-table">
      <thead><tr><th class="ce-sel"><span class="ce-check"></span></th><th class="ce-num">#</th><th>Nama barang <span class="ce-req">*</span></th><th style="width:90px">Jumlah <span class="ce-req">*</span></th><th style="width:140px" class="ce-right">Nilai per unit</th></tr></thead>
      <tbody>
        <tr class="is-selected"><td class="ce-sel"><span class="ce-check is-on"><svg class="ce-ico ce-ico-12" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></td><td class="ce-num">1</td><td><div class="ce-input">Laptop 14 inci</div></td><td><div class="ce-input" style="justify-content:flex-end">2</div></td><td><div class="ce-input" style="justify-content:flex-end">9.250.000</div></td></tr>
        <tr><td class="ce-sel"><span class="ce-check"></span></td><td class="ce-num">2</td><td><div class="ce-input">Monitor 24 inci</div></td><td><div class="ce-input is-invalid" style="justify-content:flex-end">0</div></td><td><div class="ce-input" style="justify-content:flex-end">2.100.000</div></td></tr>
        <tr class="dl-err"><td></td><td></td><td></td><td colspan="2" style="color:var(--destructive);white-space:normal">Isi jumlah minimal 1.</td></tr>
        <tr><td class="ce-sel"><span class="ce-check"></span></td><td class="ce-num">3</td><td><div class="ce-input is-focus"></div></td><td><div class="ce-input"></div></td><td><div class="ce-input"></div></td></tr>
      </tbody>
    </table>
    <div class="dl-foot"><span class="ce-muted">Total</span><strong style="font-variant-numeric:tabular-nums">18.500.000</strong></div>
  </div>
  <p class="ce-note" style="margin-top:var(--space-2)">Baris 3 dibuat oleh Enter pada kontrol terakhir; fokus pindah ke kolom pertama baris baru.</p>
</div>
</body>
</html>
