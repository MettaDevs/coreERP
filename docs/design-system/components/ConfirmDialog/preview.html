<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>ConfirmDialog</title></head>
<body>
<div class="ce-dialog-stage" style="min-height:250px">
  <div class="ce-dialog" role="alertdialog" aria-labelledby="t" aria-describedby="d">
    <div>
      <h2 class="ce-dialog-title" id="t">Buang perubahan yang belum disimpan?</h2>
      <p class="ce-dialog-desc" id="d">Perubahan pada kartu ini belum disimpan. Pilih Batal untuk melanjutkan mengisi kartu.</p>
    </div>
    <div class="ce-dialog-footer">
      <button class="ce-btn ce-btn-outline" type="button">Batal</button>
      <button class="ce-btn ce-btn-destructive" type="button">Buang perubahan</button>
    </div>
  </div>
</div>
</body>
</html>
