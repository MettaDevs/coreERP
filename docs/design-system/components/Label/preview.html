<!-- @dsCard group="Form" height=90 subtitle="Label untuk kontrol tanpa label di dalam field" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Label</title></head>
<body>
<div class="ce-pad ce-row" style="gap:var(--space-6)">
  <label class="ce-row" style="gap:var(--space-2)"><span class="ce-switch is-on" role="switch" aria-checked="true"></span><span class="ce-label">Aktif</span></label>
  <label class="ce-row" style="gap:var(--space-2);opacity:0.5"><span class="ce-check" role="checkbox" aria-checked="false" aria-disabled="true"></span><span class="ce-label">Label ikut pudar saat nonaktif</span></label>
</div>
</body>
</html>
