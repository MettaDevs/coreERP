<!-- @dsCard group="Perintah" height=150 subtitle="Enam varian, fokus, dan nonaktif" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ce-pad ce-col">
  <div class="ce-row" style="gap:var(--space-2)">
    <button class="ce-btn ce-btn-default" type="button">Masuk</button>
    <button class="ce-btn ce-btn-destructive" type="button">Buang perubahan</button>
    <button class="ce-btn ce-btn-outline" type="button">Batal</button>
    <button class="ce-btn ce-btn-secondary" type="button">Sekunder</button>
    <button class="ce-btn ce-btn-ghost" type="button"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Daftar</button>
    <button class="ce-btn ce-btn-link" type="button">Lihat pengaturan</button>
  </div>
  <div class="ce-row" style="gap:var(--space-2)">
    <button class="ce-btn ce-btn-outline ce-focus" type="button">Fokus keyboard</button>
    <button class="ce-btn ce-btn-default" type="button" disabled>Nonaktif</button>
    <button class="ce-icon-btn" type="button" aria-label="Bantuan field"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
    <button class="ce-icon-btn" type="button" aria-label="Tutup halaman"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
</body>
</html>
