<!-- @dsCard group="Tampilan data" height=190 subtitle="Slide selebar wadah, tombol di luar tepi" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Carousel</title>
<style>
  .cr { position: relative; width: 360px; margin: 0 48px; }
  .cr-slide { height: 140px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); font-size: 24px; font-weight: 600; }
  .cr-btn { position: absolute; top: 50%; width: 32px; height: 32px; border-radius: var(--radius-full); transform: translateY(-50%); padding: 0; }
</style>
</head>
<body>
<div class="ce-pad">
  <div class="cr" role="region" aria-roledescription="carousel">
    <div class="cr-slide" role="group" aria-roledescription="slide">2 / 5</div>
    <button class="ce-btn ce-btn-outline cr-btn" type="button" style="left:-48px" aria-label="Slide sebelumnya"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <button class="ce-btn ce-btn-outline cr-btn" type="button" style="right:-48px" aria-label="Slide berikutnya"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>
</div>
</body>
</html>
