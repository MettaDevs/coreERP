<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Slider</title></head>
<body>
<div class="ce-pad" style="max-width:420px">
  <div class="ce-row" style="justify-content:space-between;margin-bottom:var(--space-2)"><span class="ce-label">Ambang peringatan</span><span class="ce-muted">60%</span></div>
  <div class="ce-slider" role="slider" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" aria-label="Ambang peringatan">
    <div class="ce-slider-track" style="margin-top:5px"><div class="ce-slider-range" style="width:60%"></div></div>
    <div class="ce-slider-thumb" style="left:60%"></div>
  </div>
</div>
</body>
</html>
