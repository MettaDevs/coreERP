<!-- @dsCard group="Form" height=290 subtitle="Sorot dulu, pindahkan dengan tombol" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>TransferList</title>
<style>
  .tl { display: flex; gap: var(--space-3); align-items: stretch; }
  .tl-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .tl-title { margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase; color: var(--muted-foreground); }
  .tl-list { border: 1px solid var(--border); border-radius: var(--radius-md); min-height: 150px; }
  .tl-item { display: flex; flex-direction: column; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
  .tl-item:last-child { border-bottom: 0; }
  .tl-item.is-sel { background: color-mix(in oklab, var(--accent) 60%, transparent); }
  .tl-name { font-weight: 500; }
  .tl-mid { display: flex; flex-direction: column; justify-content: center; gap: var(--space-2); }
</style>
</head>
<body>
<div class="ce-pad">
  <div class="tl">
    <div class="tl-pane">
      <p class="tl-title">Tersedia</p>
      <div class="ce-field"><div class="ce-input"><span class="ce-placeholder">Cari tersedia</span></div></div>
      <div class="tl-list">
        <div class="tl-item is-sel"><span class="tl-name">Perawatan berkala</span><span class="ce-caption">Pekerjaan rutin</span></div>
        <div class="tl-item"><span class="tl-name">Kalibrasi</span><span class="ce-caption">Pekerjaan teknis</span></div>
      </div>
    </div>
    <div class="tl-mid">
      <button class="ce-btn ce-btn-outline" type="button" style="width:36px;padding:0" aria-label="Pindahkan yang dipilih ke sisi kanan"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="ce-btn ce-btn-outline" type="button" style="width:36px;padding:0" aria-label="Pindahkan yang dipilih ke sisi kiri" disabled><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ce-btn ce-btn-outline" type="button" style="width:36px;padding:0" aria-label="Pindahkan semua ke sisi kanan"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
      <button class="ce-btn ce-btn-outline" type="button" style="width:36px;padding:0" aria-label="Pindahkan semua ke sisi kiri"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
    </div>
    <div class="tl-pane">
      <p class="tl-title">Dipilih</p>
      <div class="ce-field"><div class="ce-input"><span class="ce-placeholder">Cari dipilih</span></div></div>
      <div class="tl-list">
        <div class="tl-item"><span class="tl-name">Perbaikan</span><span class="ce-caption">Pekerjaan korektif</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
