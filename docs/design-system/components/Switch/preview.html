<!-- @dsCard group="Form" height=110 subtitle="Menyala, padam, dan ukuran kecil" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div class="ce-pad ce-col">
  <label class="ce-row" style="gap:var(--space-2)"><span class="ce-switch is-on" role="switch" aria-checked="true"></span><span class="ce-label">Aktif</span></label>
  <label class="ce-row" style="gap:var(--space-2)"><span class="ce-switch" role="switch" aria-checked="false"></span><span class="ce-label">Wajib persetujuan</span></label>
  <label class="ce-row" style="gap:var(--space-2)"><span class="ce-switch is-sm is-on" role="switch" aria-checked="true"></span><span class="ce-label">Ukuran kecil</span></label>
</div>
</body>
</html>
