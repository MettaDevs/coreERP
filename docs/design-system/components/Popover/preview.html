<!-- @dsCard group="Overlay" height=220 subtitle="Panel kecil di dekat pemicu" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Popover</title></head>
<body>
<div class="ce-pad">
  <button class="ce-btn ce-btn-outline" type="button" aria-expanded="true"><svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>Filter kolom</button>
  <div class="ce-surface" role="dialog" aria-labelledby="pt" style="width:260px;margin-top:var(--space-1);padding:var(--space-4);box-shadow:var(--shadow-md)">
    <div style="display:flex;flex-direction:column;gap:var(--space-1);font-size:14px"><span style="font-weight:500" id="pt">Status</span><span class="ce-muted">Tampilkan baris dengan status terpilih.</span></div>
    <div class="ce-col" style="gap:var(--space-2);margin-top:var(--space-3)">
      <label class="ce-row" style="gap:var(--space-2)"><span class="ce-check is-on"><svg class="ce-ico ce-ico-12" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ce-label">Aktif</span></label>
      <label class="ce-row" style="gap:var(--space-2)"><span class="ce-check"></span><span class="ce-label">Nonaktif</span></label>
    </div>
  </div>
</div>
</body>
</html>
