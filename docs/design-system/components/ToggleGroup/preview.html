<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>ToggleGroup</title></head>
<body>
<div class="ce-pad">
  <div class="ce-toggle-group" role="radiogroup" aria-label="Periode">
    <button class="ce-toggle is-outline" type="button" role="radio" aria-checked="false">Bulan</button>
    <button class="ce-toggle is-outline is-on" type="button" role="radio" aria-checked="true">Kuartal</button>
    <button class="ce-toggle is-outline" type="button" role="radio" aria-checked="false">Tahun</button>
  </div>
</div>
</body>
</html>
