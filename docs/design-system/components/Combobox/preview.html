<!-- @dsCard group="Form" height=250 subtitle="Popup pilihan dan chip pilihan banyak" -->
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Combobox</title>
<style>
  .cb-chips { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); min-height: var(--control-height); padding: var(--space-1) 6px; border: 1px solid var(--input); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); }
  .cb-chip { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--muted); font-size: 12px; font-weight: 500; }
  .cb-chip .ce-ico { opacity: 0.5; }
  .cb-item { padding-right: 32px; }
  .cb-mark { position: absolute; right: var(--space-2); display: flex; }
</style>
</head>
<body>
<div class="ce-pad ce-grid" style="max-width:720px">
  <div>
    <div class="ce-fc" style="grid-template-columns:minmax(0,1fr)"><div class="ce-field"><div class="ce-input is-focus ce-select">Garis lurus<svg class="ce-ico ce-ico-14" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><span class="ce-float">Metode <span class="ce-req">*</span></span></div></div>
    <div class="ce-menu" role="listbox" style="margin-top:var(--space-1)">
      <div class="ce-menu-item cb-item is-focus" role="option" aria-selected="true">Garis lurus<span class="cb-mark"><svg class="ce-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></div>
      <div class="ce-menu-item cb-item" role="option">Saldo menurun</div>
      <div class="ce-menu-item cb-item is-disabled" role="option" aria-disabled="true">Unit produksi</div>
    </div>
  </div>
  <div style="padding-top:var(--space-1\.5)">
    <div class="cb-chips" role="combobox" aria-expanded="false"><span class="cb-chip">Gedung utama <svg class="ce-ico ce-ico-12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span><span class="cb-chip">Gudang barat <svg class="ce-ico ce-ico-12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span><span class="ce-placeholder" style="font-size:14px">Tambah lokasi</span></div>
  </div>
</div>
</body>
</html>
