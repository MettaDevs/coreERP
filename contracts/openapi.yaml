components:
  securitySchemes:
    CoreERPContext:
      type: http
      scheme: bearer
      bearerFormat: CoreERP context token
      description: Token singkat bertanda tangan yang diterbitkan Web Shell untuk aplikasi ini.
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kunci stabil per percobaan pembuatan; retry dengan kunci sama tidak menerbitkan nomor baru.
        Batas 133 karakter: Core membatasi idempotency_key pada 160 dan kunci yang diteruskan ke sana
        diawali slug resource, sehingga slug master terpanjang (`item-checklist-maintenance`, 26) plus
        `:` menyisakan 133.
      schema:
        type: string
        maxLength: 133
        pattern: ^[A-Za-z0-9._:-]+$
    IdempotencyKeyTransaksi:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Sama seperti `IdempotencyKey`, tetapi untuk endpoint transaksi yang slug resource-nya lebih
        pendek sehingga menyisakan 154 karakter.
      schema:
        type: string
        maxLength: 154
        pattern: ^[A-Za-z0-9._:-]+$
    Search:
      name: q
      in: query
      description: Mencari pada kode atau nama.
      schema:
        type: string
        maxLength: 100
    ActiveFilter:
      name: aktif
      in: query
      schema:
        type: boolean
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PabrikanAsetFilter:
      name: pabrikan_aset_id
      in: query
      description: Membatasi daftar pada satu pabrikan aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    JenisAsetFilter:
      name: jenis_aset_id
      in: query
      description: Membatasi daftar pada satu jenis aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    ParentLokasiAsetFilter:
      name: parent_id
      in: query
      description: Membatasi daftar pada anak langsung satu lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
    TipeLokasiAsetFilter:
      name: tipe_lokasi_id
      in: query
      description: Membatasi daftar pada satu tipe lokasi aset.
      schema:
        $ref: '#/components/schemas/Ulid'
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    AssetPlanningDetailWrite:
      type: object
      required:
      - jenis_aset_id
      - satuan_id
      - quantity
      - requested_specification
      properties:
        jenis_aset_id:
          $ref: '#/components/schemas/Ulid'
        satuan_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
        quantity:
          type: number
          exclusiveMinimum: 0
        requested_specification:
          type: string
          maxLength: 2000
          example: RAM 16 GB, SSD 512 GB
        estimated_unit_price:
          type: number
          minimum: 0
    AssetPlanningWrite:
      type: object
      required:
      - legal_entity_id
      - planning_org_unit_id
      - planned_on
      - planning_year
      - planning_type
      - details
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Ulid'
        planning_org_unit_id:
          $ref: '#/components/schemas/Ulid'
        planned_on:
          type: string
          format: date
        planning_year:
          type: integer
          minimum: 2000
          maximum: 2100
        planning_type:
          type: string
          enum:
          - regular
          - additional
        funding_source:
          type: string
          maxLength: 250
          nullable: true
        description:
          type: string
          maxLength: 2000
          nullable: true
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssetPlanningDetailWrite'
    HealthResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              const: ready
    PaginationMeta:
      type: object
      required:
      - current_page
      - last_page
      - per_page
      - total
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    MasterSummary:
      description: Ringkasan induk untuk ditampilkan tanpa permintaan tambahan. Induk yang sudah diarsipkan tetap disertakan.
      type: object
      required:
      - id
      - kode
      - nama
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kode:
          type: string
        nama:
          type: string
    MasterRecord:
      description: Bentuk dasar seluruh master. `kode` selalu diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
      type: object
      required:
      - id
      - kode
      - nama
      - keterangan
      - aktif
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kode:
          type: string
          maxLength: 50
        nama:
          type: string
          maxLength: 150
        keterangan:
          type:
          - string
          - 'null'
          maxLength: 2000
        aktif:
          type: boolean
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    MasterCreate:
      type: object
      required:
      - nama
      properties:
        nama:
          type: string
          minLength: 1
          maxLength: 150
        keterangan:
          type:
          - string
          - 'null'
          maxLength: 2000
        aktif:
          type: boolean
          default: true
    MasterPatch:
      type: object
      properties:
        nama:
          type: string
          minLength: 1
          maxLength: 150
        keterangan:
          type:
          - string
          - 'null'
          maxLength: 2000
        aktif:
          type: boolean
    ModelAset:
      description: |
        Katalog model barang milik satu pabrikan; padanan "Manufacturers and models" di
        Dynamics 365 F&O. Pabrikan dan jenis adalah induk yang saling lepas: memilih salah
        satu tidak menyaring pilihan yang lain, dan keduanya dapat disaring bersamaan pada
        endpoint daftar.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - type: object
        required:
        - pabrikan_aset_id
        - pabrikan_aset
        - jenis_aset_id
        - jenis_aset
        - model_number
        properties:
          pabrikan_aset_id:
            $ref: '#/components/schemas/Ulid'
          pabrikan_aset:
            oneOf:
            - $ref: '#/components/schemas/MasterSummary'
            - type: 'null'
          jenis_aset_id:
            oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          jenis_aset:
            oneOf:
            - $ref: '#/components/schemas/MasterSummary'
            - type: 'null'
          model_number:
            type:
            - string
            - 'null'
            maxLength: 150
      examples:
      - id: 01JZ0000000000000000000000
        kode: MDLA-000001
        nama: Kompresor Angin PK-100
        keterangan: Kompresor 100 liter untuk lini produksi.
        model_number: PK-100
        aktif: true
        created_at: '2026-07-26T02:00:00.000000Z'
        updated_at: '2026-07-26T02:00:00.000000Z'
    ModelAsetCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - type: object
        required:
        - pabrikan_aset_id
        properties:
          pabrikan_aset_id:
            allOf:
            - $ref: '#/components/schemas/Ulid'
            description: Pabrikan pada tenant yang sama dan belum diarsipkan. Wajib, karena sebuah model selalu milik satu
              pabrikan.
          jenis_aset_id:
            oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
            description: Opsional, supaya katalog dapat mulai diisi sebelum klasifikasi teknis ditetapkan.
          model_number:
            type:
            - string
            - 'null'
            maxLength: 150
    ModelAsetPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - type: object
        properties:
          pabrikan_aset_id:
            $ref: '#/components/schemas/Ulid'
          jenis_aset_id:
            oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          model_number:
            type:
            - string
            - 'null'
            maxLength: 150
    ModelAsetResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ModelAset'
    ModelAsetList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelAset'
        meta:
