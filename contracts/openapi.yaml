    ProfilPenyusutanFields:
      description: |
        Aturan penyusutan yang dapat dipakai ulang lintas aset; padanan "Depreciation profile"
        di Dynamics 365 F&O. Field mana yang wajib bergantung pada `method`:
        `useful_life_periods` untuk garis lurus dan saldo menurun, `rate_percent` untuk
        saldo menurun, `manual_schedule` untuk metode manual.
      type: object
      properties:
        method:
          type: string
          enum:
          - straight_line
          - reducing_balance
          - manual
          - consumption
        frequency:
          type: string
          enum:
          - monthly
          - quarterly
          - half_yearly
          - yearly
        year_basis:
          type: string
          enum:
          - calendar
          - fiscal
        convention:
          description: Belum dibaca mesin penyusutan; diaktifkan bersama buku penyusutan.
          type:
          - string
          - 'null'
          maxLength: 40
        useful_life_periods:
          type:
          - integer
          - 'null'
          minimum: 1
        rate_percent:
          type:
          - string
          - 'null'
          format: decimal
        manual_schedule:
          oneOf:
          - type: array
            items:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  minimum: 0
          - type: 'null'
    ProfilPenyusutan:
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
      - type: object
        required:
        - method
        - frequency
        - year_basis
    ProfilPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/ProfilPenyusutanFields'
    ProfilPenyusutanResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ProfilPenyusutan'
    ProfilPenyusutanList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfilPenyusutan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BukuPenyusutanFields:
      type: object
      properties:
        posting_layer:
          description: Lapisan pembukuan buku ini. `tax` lazim dipakai buku fiskal.
          type: string
          enum:
          - current
          - operations
          - tax
          - none
          default: current
        export_to_backoffice:
          description: |
            App ini tidak menjurnal; ia mengekspor periode final ke backoffice. Buku fiskal
            umumnya dimatikan agar backoffice tidak menjurnal dua kali untuk aset yang sama.
          type: boolean
          default: true
        round_off_depreciation:
          description: Kelipatan nominal pembulatan penyusutan. Nol berarti tanpa pembulatan.
          type:
          - number
          - 'null'
          minimum: 0
          format: decimal
        depreciation_profile_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alternative_profile_id:
          description: Profil pengganti saat saldo menurun sudah kalah dari garis lurus sisa umur.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
    BukuPenyusutan:
      description: |
        Buku penyusutan; padanan "Book" di Dynamics 365 F&O. Satu aset dapat memiliki
        beberapa buku sekaligus, lazimnya satu komersial dan satu fiskal, dan tiap buku
        melacak nilai aset secara mandiri dengan aturannya sendiri.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/BukuPenyusutanFields'
    BukuPenyusutanResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/BukuPenyusutan'
    BukuPenyusutanList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BukuPenyusutan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    GroupBukuPenyusutanRow:
      description: |
        Satu baris matriks group x buku; padanan "Fixed asset group/book" di F&O. Nilainya
        menjadi default yang disalin ke buku aset saat aset diterima, bukan acuan hidup:
        mengubah matriks tidak menulis ulang aset yang sudah berjalan.
      type: object
      required:
      - buku_id
      properties:
        buku_id:
          $ref: '#/components/schemas/Ulid'
        depreciation_profile_id:
          description: Mengalahkan profil bawaan buku untuk group ini. Kosong berarti memakai profil buku.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        alternative_profile_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        useful_life_periods:
          type:
          - integer
          - 'null'
          minimum: 1
        convention:
          description: Perlakuan periode pertama, dihitung dari tanggal aset mulai digunakan.
          type:
          - string
          - 'null'
          enum:
          - none
          - full_month
          - half_year
          - mid_quarter
          - mid_month_1st
          - mid_month_15th
          - half_year_start_of_year
          - half_year_next_year
          - null
        depreciate:
          description: Aset dari group ini mendapat buku tersebut tetapi tidak disusutkan bila `false`.
          type: boolean
          default: true
        round_off_depreciation:
          description: |
            Kelipatan nominal pembulatan untuk group dan book ini. Null berarti mengikuti
            nilai pada Book; periode terakhir tetap memakai sisa nilai tanpa pembulatan.
          type:
          - number
          - 'null'
          minimum: 0
          format: decimal
    GroupBukuPenyusutanReplace:
      description: Daftar penuh baris matriks; baris yang tidak disertakan diarsipkan.
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GroupBukuPenyusutanRow'
    GroupBukuPenyusutanList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            allOf:
            - type: object
              required:
              - id
              properties:
                id:
                  $ref: '#/components/schemas/Ulid'
            - $ref: '#/components/schemas/GroupBukuPenyusutanRow'
    TipeAtributFields:
      type: object
      properties:
        data_type:
          description: |
            Menentukan kolom mana yang dipakai menyimpan nilainya pada aset dan bagaimana
            field-nya dirender. `fixed_list` mengambil pilihan dari daftar nilai atribut,
            `value_range` dibatasi `min_value` dan `max_value`.
          type: string
          enum:
          - text
          - number
          - boolean
          - date
          - fixed_list
          - value_range
        satuan:
          type:
          - string
          - 'null'
          maxLength: 50
        min_value:
          type:
          - string
          - 'null'
          format: decimal
        max_value:
          type:
          - string
          - 'null'
          format: decimal
    TipeAtribut:
      description: |
        Padanan "Attribute type" di Dynamics 365 F&O. Inilah cara menambah pembeda aset
        tanpa menambah tingkat klasifikasi baru: tenant membuat atributnya sendiri,
        menempelkannya ke jenis aset, dan aset mewarisinya.
      allOf:
      - $ref: '#/components/schemas/MasterRecord'
      - $ref: '#/components/schemas/TipeAtributFields'
    TipeAtributCreate:
      allOf:
      - $ref: '#/components/schemas/MasterCreate'
      - $ref: '#/components/schemas/TipeAtributFields'
    TipeAtributPatch:
      allOf:
      - $ref: '#/components/schemas/MasterPatch'
      - $ref: '#/components/schemas/TipeAtributFields'
    TipeAtributResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/TipeAtribut'
    TipeAtributList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TipeAtribut'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    TipeAtributNilaiReplace:
      description: Daftar penuh pilihan nilai; pilihan yang tidak disertakan diarsipkan.
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            type: object
            required:
            - nilai
            properties:
              nilai:
                type: string
                maxLength: 150
              urutan:
                type: integer
                minimum: 0
                default: 0
    TipeAtributNilaiList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - id
            - nilai
            - urutan
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              nilai:
                type: string
              urutan:
                type: integer
    JenisAsetAtributReplace:
      description: Daftar penuh atribut yang menempel pada jenis aset ini.
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            type: object
            required:
            - tipe_atribut_id
            properties:
              tipe_atribut_id:
                $ref: '#/components/schemas/Ulid'
              wajib:
                type: boolean
                default: false
              urutan:
                type: integer
                minimum: 0
                default: 0
    JenisAsetAtributList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - id
            - tipe_atribut_id
            - wajib
            - urutan
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              tipe_atribut_id:
                $ref: '#/components/schemas/Ulid'
              wajib:
                type: boolean
              urutan:
                type: integer
    JenisAsetAtributDefinisi:
      description: |
        Definisi atribut satu jenis aset, siap dipakai form penerimaan aset untuk merender
        field dinamisnya tanpa perlu menggabungkan sendiri dari beberapa endpoint.
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/TipeAtributFields'
            - type: object
              required:
              - tipe_atribut_id
              - kode
              - nama
              - wajib
              - urutan
              - nilai_pilihan
              properties:
                tipe_atribut_id:
                  $ref: '#/components/schemas/Ulid'
                kode:
                  type: string
                nama:
                  type: string
                wajib:
                  type: boolean
                urutan:
                  type: integer
                nilai_pilihan:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - nilai
                    properties:
                      id:
                        $ref: '#/components/schemas/Ulid'
                      nilai:
                        type: string
  responses:
    Unauthenticated:
      description: Sesi aplikasi tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Pengguna tidak memiliki hak untuk tindakan ini pada resource ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data tidak ditemukan pada tenant aktif
    ValidationError:
      description: Data tidak valid, termasuk induk yang tidak ada, sudah diarsipkan, atau milik tenant lain
    IdempotencyConflict:
      description: Idempotency-Key sudah dipakai untuk data yang berbeda
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReferencedByChildren:
      description: Data masih dipakai master turunan yang aktif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NumberSequenceUnavailable:
      description: Number Sequence belum aktif atau tidak tersedia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
