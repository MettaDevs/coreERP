# DIBANGKITKAN OLEH contracts/bundle.py - JANGAN DISUNTING LANGSUNG.
# Sunting contracts/src/ lalu jalankan: python contracts/bundle.py
openapi: 3.1.0
info:
  title: Management Aset API
  version: 0.1.0
  description: |
    Master data aset. Seluruh endpoint dibatasi tenant dan policy
    `management-aset.asset-responsibility` pada token konteks yang ditandatangani
    Core; `tenant_id` tidak pernah diterima dari request browser. Claim policy
    berisi pasangan legal entity dan operating unit (`scope_grants`), sehingga
    dua grant tidak dapat membentuk kombinasi organisasi baru.

    Kode setiap master diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
    Arsip memakai soft delete agar record yang direferensikan data turunan tidak hilang.

    Klasifikasi aset mengikuti model Dynamics 365 F&O: seluruh master klasifikasi datar
    dan saling lepas, dan aset menunjuk masing-masing secara langsung. `group aset`
    membawa perlakuan finansial (penyusutan, GL, penomoran), `jenis aset` membawa
    perlakuan teknis (maintenance, atribut), dan `model aset` adalah katalog barang per
    pabrikan. Tidak ada rantai berjenjang yang wajib diisi, sehingga tenant dengan
    kedalaman klasifikasi berbeda tidak dipaksa mengisi tingkat yang tidak mereka punya.

    Yang hierarkis hanya data, bukan skema: lokasi aset dan komposisi aset (`parent_asset_id`)
    menunjuk dirinya sendiri sedalam yang dibutuhkan tenant. Keduanya struktur domain milik
    app ini, bukan organization hierarchy CoreERP.
servers:
- url: /
security:
- CoreERPContext: []
tags:
- name: Master data
  description: Master aset dan master maintenance.
- name: Lifecycle aset
  description: Dokumen lifecycle aset, register, mutasi, dan pelepasan tanpa jurnal GL.
- name: Penyusutan
  description: Proposal dan finalisasi penyusutan beserta export bridge backoffice.
paths:
  /api/v1/health:
    get:
      security: []
      operationId: health
      summary: Memeriksa kesiapan API
      responses:
        '200':
          description: API siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/context:
    get:
      operationId: currentContext
      summary: Membaca hak akses pengguna pada aplikasi
      responses:
        '200':
          description: Konteks sudah diverifikasi gateway
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - permissions
                    properties:
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/reference-data/units-of-measure:
    get:
      tags:
      - Reference data
      operationId: listCoreUnitsOfMeasure
      summary: Menampilkan satuan aktif dari Core untuk dipilih dalam transaksi aset
      responses:
        '200':
          description: Daftar satuan aktif
        '503':
