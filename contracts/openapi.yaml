openapi: 3.1.0
info:
  title: Management Aset API
  version: 0.1.0
  description: |
    Master data aset. Seluruh endpoint dibatasi tenant dan policy
    `management-aset.asset-responsibility` pada token konteks yang ditandatangani
    Core; `tenant_id` tidak pernah diterima dari request browser. Claim policy
    berisi pasangan legal entity dan operating unit (`scope_grants`), sehingga
    dua grant tidak dapat membentuk kombinasi organisasi baru.

    Kode setiap master diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
    Arsip memakai soft delete agar record yang direferensikan data turunan tidak hilang.

    Rantai klasifikasi `entitas aset -> group aset -> kategori aset -> jenis aset`
    adalah struktur domain milik app ini, bukan organization hierarchy CoreERP.
servers:
  - url: /
security:
  - CoreERPContext: []
tags:
  - name: Master data
    description: Master aset dan master maintenance.
  - name: Lifecycle aset
    description: Dokumen lifecycle aset, register, mutasi, dan pelepasan tanpa jurnal GL.
  - name: Penyusutan
    description: Proposal dan finalisasi penyusutan beserta export bridge backoffice.
paths:
  /api/v1/health:
    get:
      security: []
      operationId: health
      summary: Memeriksa kesiapan API
      responses:
        '200':
          description: API siap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/context:
    get:
      operationId: currentContext
      summary: Membaca hak akses pengguna pada aplikasi
      responses:
        '200':
          description: Konteks sudah diverifikasi gateway
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [permissions]
                    properties:
                      permissions:
                        type: array
                        items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/aset:
    get:
      tags: [Lifecycle aset]
      operationId: listAset
      summary: Menampilkan register aset tenant aktif
      responses: { '200': { description: Register aset } }
    post:
      tags: [Lifecycle aset]
      operationId: receiveAset
      summary: Mencatat penerimaan aset dan penempatan awal; plan atau permintaan bersifat opsional
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Aset diterima }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/NumberSequenceUnavailable' } }

  /api/v1/aset/{id}/history:
    get:
      tags: [Lifecycle aset]
      operationId: assetHistory
      summary: Membaca histori penempatan efektif aset tanpa mengubah histori lama
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses: { '200': { description: Aset dan histori penempatan }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v1/aset/{id}/penempatan:
    post:
      tags: [Lifecycle aset]
      operationId: placeAsset
      summary: Menambah mutasi penggunaan, PIC, atau lokasi aset
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses: { '200': { description: Mutasi dicatat }, '409': { description: Aset yang dilepas tidak dapat dimutasi } }

  /api/v1/perencanaan-aset:
    get:
      tags: [Perencanaan aset]
      operationId: listAssetPlans
      summary: Menampilkan rencana aset tenant aktif
      responses: { '200': { description: Daftar rencana aset }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Perencanaan aset]
      operationId: createAssetPlan
      summary: Membuat header dan rincian perencanaan aset; spesifikasi adalah snapshot pada rincian transaksi
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetPlanningWrite' } } } }
      responses: { '200': { description: Permintaan yang sama diulang }, '201': { description: Rencana dibuat }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { description: Number Sequence Core belum tersedia } }

  /api/v1/perencanaan-aset/{id}:
    get:
      tags: [Perencanaan aset]
      operationId: showAssetPlan
      summary: Menampilkan satu rencana aset beserta rinciannya
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses: { '200': { description: Rencana aset }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Rencana tidak ditemukan } }
    patch:
      tags: [Perencanaan aset]
      operationId: updateAssetPlan
      summary: Mengubah rencana draf dengan version saat ini
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/AssetPlanningWrite' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }] } } } }
      responses: { '200': { description: Rencana diperbarui }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Version sudah berubah }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      tags: [Perencanaan aset]
      operationId: archiveAssetPlan
      summary: Mengarsipkan rencana draf tanpa menghapus data fisik
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses: { '204': { description: Rencana diarsipkan }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Version sudah berubah }, '422': { $ref: '#/components/responses/ValidationError' } }

  /api/v1/{lifecycleDocument}:
    get:
      tags: [Lifecycle aset]
      operationId: listLifecycleDocument
      summary: Menampilkan permintaan pembelian, pemeliharaan, dekomisioning, penjualan, atau pemusnahan
      parameters: [{ name: lifecycleDocument, in: path, required: true, schema: { type: string, enum: [permintaan-pembelian-aset, pemeliharaan-aset, dekomisioning-aset, penjualan-aset, pemusnahan-aset] } }]
      responses: { '200': { description: Daftar dokumen lifecycle } }
    post:
      tags: [Lifecycle aset]
      operationId: createLifecycleDocument
      summary: Membuat dokumen lifecycle; dekomisioning yang disetujui menghentikan pemakaian aset sebelum penjualan atau pemusnahan
      parameters: [{ name: lifecycleDocument, in: path, required: true, schema: { type: string, enum: [permintaan-pembelian-aset, pemeliharaan-aset, dekomisioning-aset, penjualan-aset, pemusnahan-aset] } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Dokumen dibuat } }

  /api/v1/penyusutan/proposal:
    post:
      tags: [Penyusutan]
      operationId: proposeDepreciation
      summary: Membuat proposal penyusutan satu Asset Book tanpa jurnal GL
      responses: { '201': { description: Proposal dibuat } }

  /api/v1/penyusutan:
    get:
      tags: [Penyusutan]
      operationId: listDepreciationPeriods
      summary: Menampilkan periode penyusutan tenant aktif
      responses: { '200': { description: Daftar periode } }

  /api/v1/penyusutan/buku:
    get:
      tags: [Penyusutan]
      operationId: listAssetBooksForDepreciation
      summary: Menampilkan Asset Book aktif yang dapat dihitung penyusutannya
      responses: { '200': { description: Daftar Asset Book } }

  /api/v1/penyusutan/{id}/finalisasi:
    post:
      tags: [Penyusutan]
      operationId: finalizeDepreciation
      summary: Mengunci periode dan membuat export bridge dengan posting_id stabil
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses: { '200': { description: Periode final dan export dibuat }, '409': { description: Periode sudah final } }

  /api/v1/penyusutan/{id}/reversal:
    post:
      tags: [Penyusutan]
      operationId: reverseDepreciation
      summary: Membuat pembalikan baru untuk periode final tanpa mengubah periode asal
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses: { '201': { description: Pembalikan dan export bridge dibuat }, '409': { description: Periode tidak dapat dibalik } }

  /api/v1/entitas-aset:
    get:
      tags: [Master data]
      operationId: listEntitasAset
      summary: Menampilkan entitas aset
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/JenisAsetFilter'
      responses:
        '200':
          description: Daftar entitas aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitasAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Master data]
      operationId: createEntitasAset
      summary: Membuat entitas aset dengan kode dari Number Sequence Core
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitasAsetCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitasAsetResponse'
        '201':
          description: Entitas aset dibuat
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitasAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/reference-data/units-of-measure:
    get:
      tags: [Reference data]
      operationId: listCoreUnitsOfMeasure
      summary: Menampilkan satuan aktif dari Core untuk dipilih dalam transaksi aset
      responses:
        '200':
          description: Daftar satuan aktif
        '503':
          description: Layanan satuan Core belum dapat dihubungi
  /api/v1/entitas-aset/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Master data]
      operationId: getEntitasAset
      summary: Membaca satu entitas aset
      responses:
        '200':
          description: Entitas aset ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitasAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Master data]
      operationId: updateEntitasAset
      summary: Mengubah nama, keterangan, atau status entitas aset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitasAsetPatch'
      responses:
        '200':
          description: Entitas aset diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitasAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Master data]
      operationId: archiveEntitasAset
      summary: Mengarsipkan entitas aset
      responses:
        '204':
          description: Entitas aset diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferencedByChildren'

  /api/v1/group-aset:
    get:
      tags: [Master data]
      operationId: listGroupAset
      summary: Menampilkan group aset
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar group aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Master data]
      operationId: createGroupAset
      summary: Membuat group aset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAsetCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '201':
          description: Group aset dibuat
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/group-aset/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Master data]
      operationId: getGroupAset
      summary: Membaca satu group aset
      responses:
        '200':
          description: Group aset ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Master data]
      operationId: updateGroupAset
      summary: Mengubah group aset, termasuk memindahkannya ke entitas aset lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAsetPatch'
      responses:
        '200':
          description: Group aset diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Master data]
      operationId: archiveGroupAset
      summary: Mengarsipkan group aset
      responses:
        '204':
          description: Group aset diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferencedByChildren'

  /api/v1/kategori-aset:
    get:
      tags: [Master data]
      operationId: listKategoriAset
      summary: Menampilkan kategori aset
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/GroupAsetFilter'
      responses:
        '200':
          description: Daftar kategori aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Master data]
      operationId: createKategoriAset
      summary: Membuat kategori aset di bawah satu group aset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KategoriAsetCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriAsetResponse'
        '201':
          description: Kategori aset dibuat
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/kategori-aset/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Master data]
      operationId: getKategoriAset
      summary: Membaca satu kategori aset
      responses:
        '200':
          description: Kategori aset ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Master data]
      operationId: updateKategoriAset
      summary: Mengubah kategori aset, termasuk memindahkannya ke group aset lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KategoriAsetPatch'
      responses:
        '200':
          description: Kategori aset diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Master data]
      operationId: archiveKategoriAset
      summary: Mengarsipkan kategori aset
      responses:
        '204':
          description: Kategori aset diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferencedByChildren'

  /api/v1/jenis-aset:
    get:
      tags: [Master data]
      operationId: listJenisAset
      summary: Menampilkan jenis aset
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/KategoriAsetFilter'
      responses:
        '200':
          description: Daftar jenis aset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Master data]
      operationId: createJenisAset
      summary: Membuat jenis aset di bawah satu kategori aset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JenisAsetCreate'
      responses:
        '200':
          description: Permintaan sebelumnya diulang; data yang sama dikembalikan tanpa menerbitkan nomor baru
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetResponse'
        '201':
          description: Jenis aset dibuat
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/NumberSequenceUnavailable'
  /api/v1/jenis-aset/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Master data]
      operationId: getJenisAset
      summary: Membaca satu jenis aset
      responses:
        '200':
          description: Jenis aset ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Master data]
      operationId: updateJenisAset
      summary: Mengubah jenis aset, termasuk memindahkannya ke kategori aset lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JenisAsetPatch'
      responses:
        '200':
          description: Jenis aset diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JenisAsetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Master data]
      operationId: archiveJenisAset
      summary: Mengarsipkan jenis aset
      responses:
        '204':
          description: Jenis aset diarsipkan
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/kondisi-aset:
    get:
