components:
  securitySchemes:
    CoreERPContext:
      type: http
      scheme: bearer
      bearerFormat: CoreERP context token
      description: Token singkat bertanda tangan yang diterbitkan Web Shell untuk aplikasi ini.

  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Kunci stabil per percobaan pembuatan; retry dengan kunci sama tidak menerbitkan nomor baru.
      schema:
        type: string
        maxLength: 140
        pattern: '^[A-Za-z0-9._:-]+$'
    Search:
      name: q
      in: query
      description: Mencari pada kode atau nama.
      schema: { type: string, maxLength: 100 }
    ActiveFilter:
      name: aktif
      in: query
      schema: { type: boolean }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EntitasAsetFilter:
      name: entitas_aset_id
      in: query
      description: Membatasi daftar pada satu entitas aset.
      schema: { $ref: '#/components/schemas/Ulid' }
    GroupAsetFilter:
      name: group_aset_id
      in: query
      description: Membatasi daftar pada satu group aset.
      schema: { $ref: '#/components/schemas/Ulid' }
    KategoriAsetFilter:
      name: kategori_aset_id
      in: query
      description: Membatasi daftar pada satu kategori aset.
      schema: { $ref: '#/components/schemas/Ulid' }
    JenisAsetFilter:
      name: jenis_aset_id
      in: query
      description: Membatasi daftar pada satu jenis aset.
      schema: { $ref: '#/components/schemas/Ulid' }

  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    AssetPlanningDetailWrite:
      type: object
      required: [jenis_aset_id, satuan_id, quantity, requested_specification]
      properties:
        jenis_aset_id: { $ref: '#/components/schemas/Ulid' }
        satuan_id:
          allOf:
            - $ref: '#/components/schemas/Ulid'
          description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
        quantity: { type: number, exclusiveMinimum: 0 }
        requested_specification: { type: string, maxLength: 2000, example: 'RAM 16 GB, SSD 512 GB' }
        estimated_unit_price: { type: number, minimum: 0 }
    AssetPlanningWrite:
      type: object
      required: [legal_entity_id, planning_org_unit_id, planned_on, planning_year, planning_type, details]
      properties:
        legal_entity_id: { $ref: '#/components/schemas/Ulid' }
        planning_org_unit_id: { $ref: '#/components/schemas/Ulid' }
        planned_on: { type: string, format: date }
        planning_year: { type: integer, minimum: 2000, maximum: 2100 }
        planning_type: { type: string, enum: [regular, additional] }
        funding_source: { type: string, maxLength: 250, nullable: true }
        description: { type: string, maxLength: 2000, nullable: true }
        details:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssetPlanningDetailWrite' }
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: ready }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    MasterSummary:
      description: Ringkasan induk untuk ditampilkan tanpa permintaan tambahan. Induk yang sudah diarsipkan tetap disertakan.
      type: object
      required: [id, kode, nama]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        kode: { type: string }
        nama: { type: string }
    MasterRecord:
      description: Bentuk dasar seluruh master. `kode` selalu diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
      type: object
      required: [id, kode, nama, keterangan, aktif, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 150 }
        keterangan: { type: [string, 'null'], maxLength: 2000 }
        aktif: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    MasterCreate:
      type: object
      required: [nama]
      properties:
        nama: { type: string, minLength: 1, maxLength: 150 }
        keterangan: { type: [string, 'null'], maxLength: 2000 }
        aktif: { type: boolean, default: true }
    MasterPatch:
      type: object
      properties:
        nama: { type: string, minLength: 1, maxLength: 150 }
        keterangan: { type: [string, 'null'], maxLength: 2000 }
        aktif: { type: boolean }

    EntitasAset:
      allOf:
        - $ref: '#/components/schemas/MasterRecord'
        - type: object
          required: [jenis_aset_id, jenis_aset]
          properties:
            jenis_aset_id: { $ref: '#/components/schemas/Ulid' }
            jenis_aset:
              oneOf:
                - $ref: '#/components/schemas/MasterSummary'
                - type: 'null'
      examples:
        - id: 01JZ0000000000000000000000
          kode: EA-000001
          nama: Laptop MSI
          keterangan: Aset yang dapat direncanakan atau diminta pembeliannya.
          aktif: true
          created_at: '2026-07-26T02:00:00.000000Z'
          updated_at: '2026-07-26T02:00:00.000000Z'
    EntitasAsetCreate:
      allOf:
        - $ref: '#/components/schemas/MasterCreate'
        - type: object
          required: [jenis_aset_id]
          properties:
            jenis_aset_id:
              allOf:
                - $ref: '#/components/schemas/Ulid'
              description: Jenis aset pada tenant yang sama dan belum diarsipkan.
    EntitasAsetPatch:
      allOf:
        - $ref: '#/components/schemas/MasterPatch'
        - type: object
          properties:
            jenis_aset_id: { $ref: '#/components/schemas/Ulid' }
    EntitasAsetResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EntitasAset'
    EntitasAsetList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntitasAset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    GroupAset:
      allOf:
        - $ref: '#/components/schemas/MasterRecord'
    GroupAsetCreate:
      allOf:
        - $ref: '#/components/schemas/MasterCreate'
    GroupAsetPatch:
      allOf:
        - $ref: '#/components/schemas/MasterPatch'
    GroupAsetResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GroupAset'
    GroupAsetList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GroupAset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    KategoriAset:
      allOf:
        - $ref: '#/components/schemas/MasterRecord'
        - type: object
          required: [group_aset_id, group_aset]
          properties:
            group_aset_id: { $ref: '#/components/schemas/Ulid' }
            group_aset:
              oneOf:
                - $ref: '#/components/schemas/MasterSummary'
                - type: 'null'
    KategoriAsetCreate:
      allOf:
        - $ref: '#/components/schemas/MasterCreate'
        - type: object
          required: [group_aset_id]
          properties:
            group_aset_id:
              allOf:
                - $ref: '#/components/schemas/Ulid'
              description: Group aset pada tenant yang sama dan belum diarsipkan.
    KategoriAsetPatch:
      allOf:
        - $ref: '#/components/schemas/MasterPatch'
        - type: object
          properties:
            group_aset_id: { $ref: '#/components/schemas/Ulid' }
    KategoriAsetResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KategoriAset'
    KategoriAsetList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KategoriAset'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    JenisAset:
      allOf:
        - $ref: '#/components/schemas/MasterRecord'
        - type: object
          required: [kategori_aset_id, kategori_aset]
          properties:
            kategori_aset_id: { $ref: '#/components/schemas/Ulid' }
            kategori_aset:
              oneOf:
                - $ref: '#/components/schemas/MasterSummary'
                - type: 'null'
    JenisAsetCreate:
      allOf:
        - $ref: '#/components/schemas/MasterCreate'
        - type: object
          required: [kategori_aset_id]
          properties:
