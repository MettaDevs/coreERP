  properties:
    data:
      $ref: '#/components/schemas/KondisiAset'
KondisiAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/KondisiAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
PabrikanAset:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
PabrikanAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
PabrikanAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
PabrikanAsetResponse:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/PabrikanAset'
PabrikanAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/PabrikanAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
ItemChecklistMaintenance:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
ItemChecklistMaintenanceCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
ItemChecklistMaintenancePatch:
