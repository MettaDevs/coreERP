  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/ItemChecklistMaintenance'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
AnalisaMaintenance:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
AnalisaMaintenanceCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
AnalisaMaintenancePatch:
