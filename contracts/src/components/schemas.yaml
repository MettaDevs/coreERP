      $ref: '#/components/schemas/JenisAset'
JenisAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/JenisAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
KondisiAset:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
KondisiAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
KondisiAsetPatch:
  allOf:
