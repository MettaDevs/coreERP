# Skema request dan response.
Ulid:
  type: string
  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
AssetPlanningDetailWrite:
  type: object
  required:
  - jenis_aset_id
  - satuan_id
  - quantity
  - requested_specification
  properties:
    jenis_aset_id:
      $ref: '#/components/schemas/Ulid'
    satuan_id:
      allOf:
      - $ref: '#/components/schemas/Ulid'
      description: Referensi opaque ke satuan aktif milik Core. Konversi khusus produk akan dimiliki PIM/Inventory.
    quantity:
      type: number
      exclusiveMinimum: 0
    requested_specification:
      type: string
      maxLength: 2000
      example: RAM 16 GB, SSD 512 GB
    estimated_unit_price:
      type: number
      minimum: 0
AssetPlanningWrite:
  type: object
  required:
  - legal_entity_id
  - planning_org_unit_id
  - planned_on
  - planning_year
  - planning_type
  - details
  properties:
    legal_entity_id:
      $ref: '#/components/schemas/Ulid'
    planning_org_unit_id:
      $ref: '#/components/schemas/Ulid'
    planned_on:
      type: string
      format: date
    planning_year:
      type: integer
      minimum: 2000
      maximum: 2100
    planning_type:
      type: string
      enum:
      - regular
      - additional
    funding_source:
      type: string
      maxLength: 250
      nullable: true
    description:
      type: string
      maxLength: 2000
      nullable: true
    details:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/AssetPlanningDetailWrite'
HealthResponse:
  type: object
  required:
  - data
  properties:
    data:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ready
PaginationMeta:
  type: object
  required:
  - current_page
  - last_page
  - per_page
  - total
  properties:
    current_page:
      type: integer
    last_page:
      type: integer
    per_page:
      type: integer
    total:
      type: integer
ErrorResponse:
  type: object
  required:
  - error
  properties:
    error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
MasterSummary:
  description: Ringkasan induk untuk ditampilkan tanpa permintaan tambahan. Induk yang sudah diarsipkan tetap disertakan.
  type: object
  required:
  - id
  - kode
  - nama
  properties:
    id:
      $ref: '#/components/schemas/Ulid'
    kode:
      type: string
    nama:
      type: string
MasterRecord:
  description: Bentuk dasar seluruh master. `kode` selalu diterbitkan Number Sequence Core dan tidak dapat dikirim klien.
  type: object
  required:
  - id
  - kode
  - nama
  - keterangan
  - aktif
  - created_at
  - updated_at
  properties:
    id:
      $ref: '#/components/schemas/Ulid'
    kode:
      type: string
      maxLength: 50
    nama:
      type: string
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
    created_at:
      type:
      - string
      - 'null'
      format: date-time
    updated_at:
      type:
      - string
      - 'null'
      format: date-time
MasterCreate:
  type: object
  required:
  - nama
  properties:
    nama:
      type: string
      minLength: 1
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
      default: true
MasterPatch:
  type: object
  properties:
    nama:
      type: string
      minLength: 1
      maxLength: 150
    keterangan:
      type:
      - string
      - 'null'
      maxLength: 2000
    aktif:
      type: boolean
ModelAset:
  description: |
    Katalog model barang milik satu pabrikan; padanan "Manufacturers and models" di
    Dynamics 365 F&O. Pabrikan dan jenis adalah induk yang saling lepas: memilih salah
    satu tidak menyaring pilihan yang lain, dan keduanya dapat disaring bersamaan pada
    endpoint daftar.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - type: object
    required:
    - pabrikan_aset_id
    - pabrikan_aset
    - jenis_aset_id
    - jenis_aset
    - model_number
    properties:
      pabrikan_aset_id:
        $ref: '#/components/schemas/Ulid'
      pabrikan_aset:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
      jenis_aset:
        oneOf:
        - $ref: '#/components/schemas/MasterSummary'
        - type: 'null'
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
  examples:
  - id: 01JZ0000000000000000000000
    kode: MDLA-000001
    nama: Kompresor Angin PK-100
    keterangan: Kompresor 100 liter untuk lini produksi.
    model_number: PK-100
    aktif: true
    created_at: '2026-07-26T02:00:00.000000Z'
    updated_at: '2026-07-26T02:00:00.000000Z'
ModelAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - type: object
    required:
    - pabrikan_aset_id
    properties:
      pabrikan_aset_id:
        allOf:
        - $ref: '#/components/schemas/Ulid'
        description: Pabrikan pada tenant yang sama dan belum diarsipkan. Wajib, karena sebuah model selalu milik satu pabrikan.
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
        description: Opsional, supaya katalog dapat mulai diisi sebelum klasifikasi teknis ditetapkan.
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
ModelAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - type: object
    properties:
      pabrikan_aset_id:
        $ref: '#/components/schemas/Ulid'
      jenis_aset_id:
        oneOf:
        - $ref: '#/components/schemas/Ulid'
        - type: 'null'
      model_number:
        type:
        - string
        - 'null'
        maxLength: 150
ModelAsetResponse:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/ModelAset'
ModelAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/ModelAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
GroupAsetFields:
  description: |
    Perlakuan finansial yang melekat pada group; padanan field pada "Fixed asset group"
    di Dynamics 365 F&O. Seluruhnya opsional supaya tenant yang belum memetakan
    perlakuan pajaknya tetap dapat membuat group.
  type: object
  properties:
    tipe_harta:
      description: Kelompok harta berwujud menurut PMK; menentukan masa manfaat dan tarif fiskal.
      type:
      - string
      - 'null'
      enum:
      - kelompok_1
      - kelompok_2
      - kelompok_3
      - kelompok_4
      - bangunan_permanen
      - bangunan_non_permanen
      - bukan_objek_penyusutan
      - null
    major_type:
      type:
      - string
      - 'null'
      enum:
      - tangible
      - intangible
      - right_of_use
      - low_value
      - null
    capitalization_threshold:
      description: Perolehan di bawah nilai ini dibebankan, tidak dikapitalisasi sebagai aset.
      type:
      - string
      - 'null'
      format: decimal
    posting_layers:
      description: Lapisan pembukuan yang boleh dipakai group ini.
      type: array
      items:
        type: string
        enum:
        - current
        - operations
        - tax
        - none
GroupAset:
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
  - $ref: '#/components/schemas/GroupAsetFields'
GroupAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
  - $ref: '#/components/schemas/GroupAsetFields'
GroupAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
  - $ref: '#/components/schemas/GroupAsetFields'
GroupAsetResponse:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/GroupAset'
GroupAsetList:
  type: object
  required:
  - data
  - meta
  properties:
    data:
      type: array
      items:
        $ref: '#/components/schemas/GroupAset'
    meta:
      $ref: '#/components/schemas/PaginationMeta'
JenisAset:
  description: |
    Sumbu klasifikasi teknis aset; padanan "Asset type" pada modul Asset management
    Dynamics 365 F&O. Datar dan tanpa induk, sehingga tenant yang hanya mengenal satu
    tingkat klasifikasi tetap terlayani tanpa mengisi tingkat yang tidak mereka punya.
  allOf:
  - $ref: '#/components/schemas/MasterRecord'
JenisAsetCreate:
  allOf:
  - $ref: '#/components/schemas/MasterCreate'
JenisAsetPatch:
  allOf:
  - $ref: '#/components/schemas/MasterPatch'
JenisAsetResponse:
  type: object
  required:
